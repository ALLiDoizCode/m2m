# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TOON faucet box nginx config.
# Serves: faucet.DOMAIN (the faucet app) — nothing else. NO connector, NO
# proxy.DOMAIN, NO /admin or /rust/ guards: those exist on the other two boxes
# because they front a connector, and this box has none (toon-meta
# `docs/two-node-architecture.md` §4.5 — that doc lives in toon-meta, not this
# repo; connector#898 tracks the faucet box here).
#
# UPSTREAMS ARE NAMED THROUGH A VARIABLE (issue #993/#999, carried to this box
# by #1013). `proxy_pass http://faucet:3500;` — a LITERAL hostname — is
# resolved once, at config-parse time, and cached for the worker's life. Two
# consequences, and only the first needs a Watchtower:
#
#   1. Recreating the `faucet` container puts it on a new Docker address and
#      this edge answers `502` until someone runs `nginx -s reload`. This box
#      runs no Watchtower, but its image is BUILT ON THE BOX — a
#      `docker compose up -d --build` recreates the container just the same.
#   2. If `faucet` is not running when nginx parses this file, it is
#      `[emerg] host not found in upstream` and the nginx MASTER exits. That
#      takes the port-80 ACME block down with it, so a certbot renewal can
#      fail on a box whose only app happens to be down. No Watchtower is
#      involved in that one at all.
#
# `set $upstream <container>;` defers resolution to request time, where this
# file's own `resolver 127.0.0.11 valid=10s` applies. Both `proxy_pass` lines
# below carry NO URI part, deliberately: a variable upstream does not do the
# literal form's prefix substitution, so a URI part here would be a STATIC
# path — nginx honours it and it replaces the WHOLE request URI, dropping the
# path past the location and the query string with it. (Issue #987 filed this
# as "nginx ignores the URI part and forwards `$request_uri`". It does not;
# issue #1023 measured it on nginx 1.18 through 1.31 and the URI part is
# honoured. The rule that survives is the static one above — see
# `no_variable_upstream_carries_a_static_uri_part` in
# crates/connector-bin/tests/devnet_configs_load.rs.) With no URI part the
# request `$uri` and its args are forwarded unchanged, which is what both
# locations here already wanted (`= /health` proxied to `/health`), so no
# `rewrite` is needed. Add one — `rewrite ^.*$ /<target> break;` — if a
# location ever needs to rewrite the path; it keeps the args, a static URI
# part does not.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

limit_req_zone $binary_remote_addr zone=faucet:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name faucet.devnet.toonprotocol.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name faucet.devnet.toonprotocol.dev;

    ssl_certificate     /etc/letsencrypt/live/faucet.devnet.toonprotocol.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faucet.devnet.toonprotocol.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        set $upstream faucet;
        proxy_pass http://$upstream:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        limit_req zone=faucet burst=60 nodelay;

        set $upstream faucet;
        proxy_pass http://$upstream:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        client_max_body_size 1m;
    }
}
