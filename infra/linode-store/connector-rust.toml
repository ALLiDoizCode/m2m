# ═══════════════════════════════════════════════════════════════════════════
# TOON devnet — Rust connector, store side (issue #490, ADR 0013's parallel
# fleet)
# ═══════════════════════════════════════════════════════════════════════════
# Mirrors infra/linode-node/connector-rust.toml's own header for the prefix
# reasoning (`g.rust`, chosen there — NOT `g.proxy`, which is stale-comment
# drift; the live TypeScript apex is `g.toon`). Runs ALONGSIDE
# ./connector.yaml's TypeScript node on this box — see
# docker-compose.store.rust.yml, an ADDITIVE overlay that never edits
# docker-compose.store.yml.
#
# Terminates `g.rust.store` at the SAME running store (Arweave DVM) app this
# box's TypeScript connector already fronts (store:3300) — payment-
# oblivious per ADR 0013, and NOT modified by this file. Accepts the
# node-side Rust connector's peer-wire connection (peer_wire_addr below); it
# never dials out itself, so there is no [[peers]] section here.
# ═══════════════════════════════════════════════════════════════════════════

# Distinct from the TypeScript node's 3000/8080/8081, matching the node-side
# connector-rust.toml's own port choice.
client_edge_addr = "0.0.0.0:4000"

# The accepting side of the peer wire — the node-side apex dials this. Port
# matches that apex's [[peers]] entry for id = "store".
#
# `0.0.0.0` here is every interface *inside this container's own network
# namespace*, which is not the same thing as every interface on the box. The
# question of which host interface the port is reachable on is settled one
# layer up, by docker-compose.store.rust.yml's `${STORE_PEER_WIRE_BIND}:4001`
# publish — see that file's header for why the answer must be a VPC address
# and never the public one (#492). Binding narrower than `0.0.0.0` here would
# not help: the container cannot see the host's VPC interface, so the only
# address it could bind is its own, which is what this already is.
peer_wire_addr = "0.0.0.0:4001"

[signer]
# Real key material, generated per-box, never committed — see
# infra/linode-node/connector-rust.toml's own [signer] comment.
key_file = "/app/data/signer.key"

[[routes]]
prefix = "g.rust.store"
# `/store`, not the bare origin — the same defect the node-side
# connector-rust.toml's `g.rust.relay` route carried, for the same reason:
# `HttpAppClient::deliver` POSTs to this URL exactly and takes no path from
# the packet, and the store app serves only `POST /store` and `GET /health`.
#
# UNVERIFIED against a running box. #492 deployed the apex only — the store
# box did not exist at the time — so the relay side of this pair was proven
# live (404 → 400 once the path was added) and this side was corrected by
# reading the store app's routes, not by driving a packet at it. Confirm it
# when the store box comes back.
handler_url = "http://store:3300/store"
# Priced at parity with the TypeScript fleet's own g.toon.ario/
# g.toon.relay.ario routes to this same store (infra/linode-node/
# connector.yaml -- `price: '1000'`): see infra/linode-node/
# connector-rust.toml's own comment on `price` (issue #557) for why the
# same integer is the same real-world charge -- both fleets settle in
# base units of 6-decimal USDC (ADR 0010). This route was still a free
# gateway with #552's x402 greeting landed but nothing here priced above
# zero to trigger it (issue #557).
price = 1000

# ── Operator surface (optional) ─────────────────────────────────────────
# See infra/linode-node/connector-rust.toml's own note — omitted for the
# same reason.

# ── Settlement (issue #542) — DELIBERATELY NOT CONFIGURED ───────────────
# See infra/linode-node/connector-rust.toml's own note for the full
# reasoning. In short: an ABSENT `[settlement]` section is the supported way
# to run without settlement (channel operations answer
# `NoSettlementBackend`, the node starts and serves), while a section that
# is PRESENT but names an address with no contract at it is a hard startup
# failure by design (ADR 0009, fail-closed) — `EvmSettlementBackend::connect`
# reads `token()` off that address, gets `0x` back, and the process exits 1.
# So the zero address is not a harmless placeholder here.
#
# ⚠️ DO NOT DEPLOY `SettlementChannel.sol` ⚠️ (issue #568) — this is not
# only "no address yet". The contract itself is unsafe to deploy anywhere
# real value could reach it: `redeem` never verifies its signature, `close`
# has no access control, and there is no refund path. Its constructor now
# reverts without a test-only acknowledgement, so a normal deployment fails
# outright — see the `DO NOT DEPLOY` block at the top of
# `crates/connector-settlement-evm/contracts/SettlementChannel.sol`. Issue
# #566 replaces it with a real, signature-verifying `TokenNetwork`; only
# that replacement is ever meant to be named by a real `contract_address`.
#
# The template below is the shape to fill in once issue #566's replacement
# is deployed for real — do NOT uncomment it against a `SettlementChannel.sol`
# deployment. Same real USDC (`./connector.yaml`'s `tokenAddress`), same
# known-good RPC, same key file reused for settlement signing. It is
# uncommented and booted against a local anvil (the explicit test-only
# escape hatch) by
# `crates/connector-bin/tests/devnet_configs_load.rs`, so it stays a
# template that actually works.
#
# --- BEGIN settlement template (uncomment when a contract is deployed) ---
# [settlement]
# chain = "evm"
# rpc_url = "https://base-sepolia-rpc.publicnode.com"
# # REPLACE the zero address with the deployed `SettlementChannel` address.
# contract_address = "0x0000000000000000000000000000000000000000"
# token_address = "0x49beE1Bca5d15Fb0963117923403F9498119a9Ce"
# decimals = 6
#
# [settlement.key]
# key_file = "/app/data/signer.key"
# --- END settlement template ---
