# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ADDITIVE overlay (connector#600): publish the payment-oblivious store app on
# the WireGuard private segment, so the apex box's Rust connector can terminate
# g.toon.ario / g.toon.store at it directly (handler_url over the tunnel).
#
# 10.83.0.1 is THIS box's wg0 address (apex is 10.83.0.0/31 peer). Binding to
# the wg address — never 0.0.0.0 — is what keeps this off the public internet:
# a docker `ports:` publish bypasses ufw (Docker's DNAT runs ahead of it), so
# the bind address is the only real containment.
#
# Run alongside the main file:
#   docker compose -f docker-compose.store.yml -f docker-compose.store.wg.yml up -d
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
services:
  store:
    ports:
      - "10.83.0.1:3300:3300"
