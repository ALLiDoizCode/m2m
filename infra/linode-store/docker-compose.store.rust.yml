# ═══════════════════════════════════════════════════════════════════════════
# TOON devnet — Rust connector overlay, STORE side
# ═══════════════════════════════════════════════════════════════════════════
# ADDITIVE: adds a Rust connector to docker-compose.store.yml's stack on this
# SAME box, WITHOUT editing that file and WITHOUT taking anything down. It is
# the store-box mirror of the apex's own Rust overlay, which ran beside the
# g.toon proxy's TypeScript connector from #601 until issue #872 removed that
# box; infra/linode-relay/docker-compose.relay.rust.yml is the surviving twin.
# Since issue #901 this is the box's ONLY connector: the base file's own
# retired TypeScript service is deleted.
#
# Run alongside the existing stack (never on its own — it has no store service
# of its own to front):
#
#   docker compose -f infra/linode-store/docker-compose.store.yml \
#                  -f infra/linode-store/docker-compose.store.rust.yml up -d
#
# Joining the same compose project puts `connector-rust` on the default
# network beside `store` and `nginx`, so ./connector-rust.toml's
# `handler_url = "http://store:3300/store"` and nginx's
# `http://connector-rust:4000` both resolve by the container-name DNS the
# TypeScript node relied on.
#
# ── STATUS ────────────────────────────────────────────────────────────────
# NOT YET DEPLOYED, but now deployable — which is the change. The previous
# revision of this file carried a "NOT DEPLOYED, and cannot be" banner resting
# on two findings: that a peer-forwarded store route would serve this app for
# free (#620), and that ADR 0003's raw-TCP transport cannot carry the public
# inter-node link the devnet topology needs (#623). Both are still true, and
# neither applies any more, because this overlay no longer stands up a peer
# wire or a forwarded route at all. It stands up a CLIENT EDGE that terminates
# and PRICES its own routes — the same shape as the g.toon proxy's Rust node.
#
# The free-write hazard the old banner warned about is therefore gone by
# construction: ./connector-rust.toml prices every route it terminates at
# `1000`, the price the retired TypeScript connector charged on the same
# prefixes for as long as the two edges coexisted — so neither door into
# `store:3300` ever undercut the other, and since #901 deleted that service
# this is the only door there is.
#
# ── Why 4000 is bound to loopback ─────────────────────────────────────────
# A Docker `ports:` publish is reachable from the internet regardless of what
# ufw says — Docker's iptables chain runs ahead of it. Binding the publish to
# 127.0.0.1 means the only public path to this connector is through this box's
# nginx, under the /rust/ilp and /rust/ilp/btp locations that
# ./nginx/conf.d/node.conf defines and rate-limits. Identical to the
# g.toon proxy overlay's own `127.0.0.1:4000:4000` (#492/#517), and for the
# same reason: every route into the process should be one nginx can see, log
# and throttle. Widen it only if something needs to reach this edge without
# TLS, which nothing does.
#
# There is no `4001` publish because there is no peer semantics to publish — see
# ./connector-rust.toml's header. That also retires the `STORE_PEER_WIRE_BIND`
# variable this file used to require: it was a `:?` hard failure pointing at a
# Linode VPC address that was never provisioned, which is the single reason
# this overlay could not be brought up even for a smoke test.
# ═══════════════════════════════════════════════════════════════════════════

services:
  connector-rust:
    # PACKAGE: the Rust image publishes to the `connector` package under
    # `rust-*` tags, NOT to `connector-rust` — that package was retired when
    # #645 moved publishing, and is frozen at `sha-b908454`.
    #
    # Pinned to an exact `rust-sha-` tag, never the floating `rust-main`,
    # matching every other fleet overlay. All of them carried the SAME tag as
    # of #735: rust-sha-54a967d, the first published tag
    # whose connector-client-edge/src/lib.rs registers POST /ilp/claim-state
    # (connector#693) -- the tag this file was originally authored against
    # (rust-sha-380ffd1) predates that route, and #735 found the two overlays
    # pinning different stale tags, neither of which had it either.
    #
    # ORDERING (#605/#614): ./connector-rust.toml sets `state_dir` and
    # `RawConfig` is `deny_unknown_fields`, so any image predating #605 exits 1
    # on config load, and any image predating #614 (63b8188a) cannot write the
    # FRESH named volume below. Both are ancestors of this tag. It is a
    # constraint on rolling BACK — do not roll this service to a tag older than
    # `rust-sha-63b8188`.
    #
    # ── PIN OF RECORD: a watched GHCR tag, no longer a literal here ─────────
    # (toon-meta#403's fleet-wide Watchtower rollout, applied to this box by
    # issue #992; reconciles what the box has actually run since 2026-08-16)
    #
    # This named an immutable `rust-sha-*` tag until toon-meta#403 gave each
    # box a label-scoped Watchtower. The doctrine that pin enforced -- no
    # connector image reaches a box unreviewed -- has NOT been dropped, it has
    # MOVED: the reviewed decision is now which build
    # `ghcr.io/toon-protocol/connector:rust-release` points at, and this
    # service's `com.centurylinklabs.watchtower.enable` label below is what
    # subscribes this container to it.
    #
    # A `rust-sha-*` literal here cannot coexist with that: it would make
    # Watchtower's poll a permanent no-op, since an immutable tag's digest
    # never moves. The state before this change was the worst of both -- this
    # file said `rust-sha-415531a` while the box had been following
    # `:rust-release` for a day, so the repo described a fleet that did not
    # exist and a `fleet-ops` reconcile would have rolled the box backwards.
    #
    # The full reasoning, and what IS still asserted (all four fleet overlays
    # name the SAME reference; a floating reference only ever on a
    # Watchtower-labelled service), is on `EXPECTED_CONNECTOR_TAG` in
    # crates/connector-bin/tests/devnet_configs_load.rs.
    image: ghcr.io/toon-protocol/connector:rust-release
    # Label-scoped Watchtower watch target: ./docker-compose.store.watchtower.yml's `--label-enable` Watchtower only ever
    # touches a container carrying this exact label. See that file's header
    # and the note above.
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    volumes:
      - ./connector-rust.toml:/app/config/connector.toml:ro
      # Three raw key files, provisioned two different ways — see
      # ./connector-rust.toml's header for the decision and the paths.
      # In short: the signer is FRESH RANDOM (`openssl rand -hex 32`) and must
      # not collide with the TypeScript node's identity, while the settlement
      # pair is DERIVED from this box's TOON_MNEMONIC at account index 0 and
      # must reproduce the addresses the TypeScript node already uses —
      # matching there is the goal, so the Rust node inherits already-funded
      # identities instead of needing new channels opened against it.
      # All three must exist and be readable by uid 10001 before the first
      # `up -d` (`chown 10001:10001`); a missing key file is a refuse-to-start,
      # and so is an unreachable settlement chain (ADR 0009).
      - ./signer-rust.key:/app/data/signer.key:ro
      - ./settlement-rust.key:/app/data/settlement.key:ro
      - ./settlement-solana-rust.key:/app/data/settlement-solana.key:ro
      # The operator surface's two settings, as files (issue #1003) — see
      # ./connector-rust.toml's `[operator]` header for what each holds and
      # how to generate it. Neither is in git: the token is a credential
      # (`infra/linode-store/*.secret`), the allowlist is public key material
      # kept off a public repo because it is per-box authorization state that
      # an operator edits to revoke (`infra/linode-store/*.allow`).
      #
      # Same pre-`up -d` requirement as the three key files above, and the
      # same failure mode if it is missed — but with one Docker-specific
      # trap: bind-mounting a path that does not exist on the host makes
      # Docker CREATE IT AS A DIRECTORY, so a forgotten file presents as
      # "not a file" rather than "not found". Config load refuses either
      # way, by name, at startup.
      - ./operator-bearer-token.secret:/app/data/operator-bearer-token:ro
      - ./operator-write-keys.allow:/app/data/operator-write-keys:ro
      # Durable claim watermarks (#605). Named, not bind-mounted: the replay
      # of this journal is what stops a restart from re-accepting a spent
      # claim, so it must outlive the container.
      - connector_rust_state:/app/state
    ports:
      # Loopback-only, deliberately — see the header. Not '4000:4000'.
      - '127.0.0.1:4000:4000'
    restart: unless-stopped

volumes:
  connector_rust_state:
