# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STATUS (#600, 2026-07-30; amended #679, 2026-08-03): NOT DEPLOYED. The devnet store leg shipped
# WITHOUT this overlay: the apex terminates g.toon.ario / g.toon.store at
# the store app over this box's own PUBLIC TLS front
# (https://proxy.store.devnet.toonprotocol.dev/store — nginx's `location
# /store` in ./nginx/conf.d/node.conf; see
# infra/linode-node/connector-rust.toml's header). Two findings closed
# that door for this overlay:
#   * the PAID forwarded path is structurally unwired (#620) — a peer
#     route is neither priced nor charged at the client edge, a peer
#     arrival is never charged the terminating route's price, and ADR
#     0024's peer claims cannot be configured from any connector.toml, so
#     deploying this today would stand up a free-write path beside a paid
#     one; and
#   * the raw-TCP peer wire could not carry the public inter-node link
#     devnet topology calls for (#623) — framing nginx cannot
#     TLS-terminate, no TLS of its own (ADR 0003), SocketAddr-only
#     addressing. The VPC these files' comments were written for was
#     never provisioned, and #600 settled that no private segment is
#     wanted: node↔node links are public, like the TS fleet's BTP-over-wss.
#
# ADR 0027 settled it and issue #679 DELETED the raw-TCP peer wire. There
# is no second listener to publish, so `4001` and STORE_PEER_WIRE_BIND are
# gone from this file: peers ride the carriages the client edge already
# serves, behind this box's existing nginx TLS front, and are told apart
# from clients by authentication rather than by port. That leaves ONE
# publish here, and it is still loopback-only for the #492 reason below.
# The first real Rust peer link on devnet is #678; #620 remains the hard
# gate on standing this overlay up at all.
#
# Re-confirmed on the box during #648 (2026-07-31): `root@45.79.173.113`
# has neither this file nor ./connector-rust.toml on it and runs no
# `connector-rust` container -- only the TypeScript fleet
# (`connector:3.36.3-solchan.0`, `store`, `nginx`, `certbot`). So the image
# tag below is a REPO-ONLY pin: nothing consumes it until #620 and #623
# close, and re-pinning it deploys nothing. Standing this overlay up today
# would open a second, unpriced write path onto the same store app beside
# the apex's paid one -- which is why #648 re-pinned the tag and left the
# overlay down.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════════════════════════════════════════════════════════
# TOON devnet — Rust connector overlay, store side (issue #490, ADR 0013's
# parallel fleet)
# ═══════════════════════════════════════════════════════════════════════════
# Mirrors infra/linode-node/docker-compose.node.rust.yml's own header.
# ADDITIVE: adds the Rust connector alongside docker-compose.store.yml's
# existing TypeScript fleet on this SAME box, WITHOUT editing that file.
# Joins the same default network as `store`, so
# `handler_url = "http://store:3300"` in ./connector-rust.toml resolves by
# the same container-name DNS the TypeScript node already relies on. Neither
# `store` nor any other existing service is touched here.
#
# Run alongside the existing stack (never on its own — it has no store
# service of its own to front):
#   docker compose -f infra/linode-store/docker-compose.store.yml \
#                   -f infra/linode-store/docker-compose.store.rust.yml up -d
#
# Same distinctions as the node-side overlay: its own pinned image tag, its
# own port (4000, not the TypeScript node's 3000/8080/8081), its own
# data path (./signer-rust.key, no named volume) -- including that overlay's
# note on `chown 10001:10001 signer-rust.key`, which applies identically
# here.
#
# ── Why 4000 is bound to loopback (issue #517) ────────────────────────────
# This client edge implements only §1.1 of docs/protocol/client-edge-spec.md.
# Its own module doc says so: identity (§1.2), payment claims (§1.3) and the
# x402 greeting (§1.4) are unimplemented, so "every request today is treated
# as an unauthenticated, unpriced delivery attempt". §1.5 request-request
# binding is absent entirely.
#
# An unpriced connector in front of a payment-oblivious app (here, the store)
# is a free-write gateway, and a Docker `ports:` publish is reachable from
# the internet regardless of what ufw says -- Docker's iptables chain runs
# ahead of it. Issue #492 made the identical call for the apex overlay's
# client edge, for exactly this reason, and that fix lands alongside this
# one -- infra/linode-node/docker-compose.node.rust.yml is bound in the same
# commit. This store-side overlay was never covered by it either, and the
# day a store box actually exists it would open the identical hole.
# Binding the publish to 127.0.0.1 closes it here:
# reach it with an SSH tunnel or from the box. Widen this ONLY once
# §1.2-§1.5 are implemented and the fleet charges for a write.
#
# ═══════════════════════════════════════════════════════════════════════════

services:
  connector-rust:
    # PACKAGE (issue #648): the Rust image is published to the `connector`
    # package under `rust-*` tags, NOT to `connector-rust`. That package was
    # retired when #645 moved publishing (`.github/workflows/
    # publish-connector-rust-image.yml`'s `IMAGE`), so the old
    # `ghcr.io/toon-protocol/connector-rust:sha-16887ba` this line used to
    # carry can never receive another build -- that package is frozen at
    # `sha-b908454`, the last commit before the cutover. Pinned to an exact
    # `rust-sha-` tag, never the floating `rust-main`, matching
    # infra/linode-node/docker-compose.node.rust.yml.
    #
    # ORDERING (issue #605): ./connector-rust.toml sets `state_dir`, and
    # `RawConfig` is `deny_unknown_fields` -- so the tag below MUST be
    # re-pinned to an image built from #605 or later BEFORE (or in the same
    # `up -d` as) that file reaches a box. An older image reads `state_dir`
    # as an unknown top-level key and exits 1 on config load. Every
    # `rust-sha-` tag is well past #605, so this is a constraint on rolling
    # BACK, not on rolling forward.
    image: ghcr.io/toon-protocol/connector:rust-sha-54a967d
    volumes:
      - ./connector-rust.toml:/app/config/connector.toml:ro
      - ./signer-rust.key:/app/data/signer.key:ro
      # Durable claim watermarks (issue #605) -- see the header.
      - connector_rust_state:/app/state
    ports:
      # Loopback-only, deliberately — see the header. Not '4000:4000'.
      - '127.0.0.1:4000:4000'
    restart: unless-stopped

volumes:
  connector_rust_state:
