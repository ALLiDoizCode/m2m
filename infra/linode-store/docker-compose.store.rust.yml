# ═══════════════════════════════════════════════════════════════════════════
# TOON devnet — Rust connector overlay, STORE side
# ═══════════════════════════════════════════════════════════════════════════
# ADDITIVE: adds a Rust connector alongside docker-compose.store.yml's
# TypeScript fleet on this SAME box, WITHOUT editing that file and WITHOUT
# taking anything down. It is the store-box mirror of
# infra/linode-node/docker-compose.node.rust.yml, which has run beside the
# apex's TypeScript connector since #601.
#
# Run alongside the existing stack (never on its own — it has no store service
# of its own to front):
#
#   docker compose -f infra/linode-store/docker-compose.store.yml \
#                  -f infra/linode-store/docker-compose.store.rust.yml up -d
#
# Joining the same compose project puts `connector-rust` on the default
# network beside `store` and `nginx`, so ./connector-rust.toml's
# `handler_url = "http://store:3300/store"` and nginx's
# `http://connector-rust:4000` both resolve by the container-name DNS the
# TypeScript node already relies on.
#
# ── STATUS ────────────────────────────────────────────────────────────────
# NOT YET DEPLOYED, but now deployable — which is the change. The previous
# revision of this file carried a "NOT DEPLOYED, and cannot be" banner resting
# on two findings: that a peer-forwarded store route would serve this app for
# free (#620), and that ADR 0003's raw-TCP peer wire cannot carry the public
# inter-node link the devnet topology needs (#623). Both are still true, and
# neither applies any more, because this overlay no longer stands up a peer
# wire or a forwarded route at all. It stands up a CLIENT EDGE that terminates
# and PRICES its own routes — the same shape as the apex's Rust node.
#
# The free-write hazard the old banner warned about is therefore gone by
# construction: ./connector-rust.toml prices every route it terminates at
# `1000`, exactly matching the TypeScript connector.yaml's price on the same
# prefixes, so the two doors into `store:3300` cost the same and neither
# undercuts the other.
#
# ── Why 4000 is bound to loopback ─────────────────────────────────────────
# A Docker `ports:` publish is reachable from the internet regardless of what
# ufw says — Docker's iptables chain runs ahead of it. Binding the publish to
# 127.0.0.1 means the only public path to this connector is through this box's
# nginx, under the /rust/ilp and /rust/ilp/btp locations that
# ./nginx/conf.d/node.conf defines and rate-limits. Identical to the apex
# overlay's own `127.0.0.1:4000:4000` (#492/#517), and for the same reason:
# every route into the process should be one nginx can see, log and throttle.
# Widen it only if something needs to reach this edge without TLS, which
# nothing does.
#
# There is no `4001` publish because there is no peer wire to publish — see
# ./connector-rust.toml's header. That also retires the `STORE_PEER_WIRE_BIND`
# variable this file used to require: it was a `:?` hard failure pointing at a
# Linode VPC address that was never provisioned, which is the single reason
# this overlay could not be brought up even for a smoke test.
# ═══════════════════════════════════════════════════════════════════════════

services:
  connector-rust:
    # PACKAGE: the Rust image publishes to the `connector` package under
    # `rust-*` tags, NOT to `connector-rust` — that package was retired when
    # #645 moved publishing, and is frozen at `sha-b908454`.
    #
    # Pinned to an exact `rust-sha-` tag, never the floating `rust-main`,
    # matching infra/linode-node/docker-compose.node.rust.yml. Both overlays
    # carry the SAME tag as of #735: rust-sha-54a967d, the first published tag
    # whose connector-client-edge/src/lib.rs registers POST /ilp/claim-state
    # (connector#693) -- the tag this file was originally authored against
    # (rust-sha-380ffd1) predates that route, and #735 found the two overlays
    # pinning different stale tags, neither of which had it either.
    #
    # ORDERING (#605/#614): ./connector-rust.toml sets `state_dir` and
    # `RawConfig` is `deny_unknown_fields`, so any image predating #605 exits 1
    # on config load, and any image predating #614 (63b8188a) cannot write the
    # FRESH named volume below. Both are ancestors of this tag. It is a
    # constraint on rolling BACK — do not roll this service to a tag older than
    # `rust-sha-63b8188`.
    image: ghcr.io/toon-protocol/connector:rust-sha-54a967d
    volumes:
      - ./connector-rust.toml:/app/config/connector.toml:ro
      # Three distinct raw key files, all this box's own. The settlement pair
      # must be derived from STORE_TOON_MNEMONIC so they land on the already
      # funded identities this box advertises — see ./connector-rust.toml.
      # They must exist and be readable by uid 10001 before the first `up -d`
      # (`chown 10001:10001`); a missing key file is a refuse-to-start.
      - ./signer-rust.key:/app/data/signer.key:ro
      - ./settlement-rust.key:/app/data/settlement.key:ro
      - ./settlement-solana-rust.key:/app/data/settlement-solana.key:ro
      # Durable claim watermarks (#605). Named, not bind-mounted: the replay
      # of this journal is what stops a restart from re-accepting a spent
      # claim, so it must outlive the container.
      - connector_rust_state:/app/state
    ports:
      # Loopback-only, deliberately — see the header. Not '4000:4000'.
      - '127.0.0.1:4000:4000'
    restart: unless-stopped

volumes:
  connector_rust_state:
