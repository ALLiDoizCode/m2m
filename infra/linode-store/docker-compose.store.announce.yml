# =============================================================================
# TOON devnet — STORE box's own kind:10032 publisher (issue #833)
# =============================================================================
# Gives `g.toon.ario` a publisher that advertises THIS box's own identity --
# the `[signer]` key `./connector-rust.toml`'s `[announce]` section names,
# which is the exact key `GET /ilp/identity` answers with and every gift wrap
# this node opens is sealed to (ADR 0018). Before this overlay, the only
# publisher of `g.toon.ario` was the apex's announcer sidecar
# (docker-compose.node.announcer.yml, removed along with the rest of
# infra/linode-node/ by issue #872), advertising the PROXY's identity for a
# prefix the proxy FORWARDS rather than terminates. A stock client sealing
# to that advertised identity is refused `F01 gift wrap could not be
# opened` at THIS box, after paying at the client edge -- issue #833. The
# proxy's stopgap announce of this same prefix was retired in the same
# change; that file is gone now.
#
# Issue #871: the through-URL below names the RELAY BOX, not the apex. The
# apex is retired (toon-meta#310 / toon-meta#313, issue #872); the relay box
# is the fleet's only public write ingress now, so this box buys relay
# writes directly, like any other client.
#
# ── Why a shell loop, not `restart: unless-stopped` on the bare subcommand ──
# `connector announce` (crates/connector-cli/src/announce.rs, issue #784) is
# a ONE-SHOT operator action, not a daemon: it negotiates, signs and PAYS for
# one write, then exits. Wrapping the bare subcommand in `restart:
# unless-stopped` would re-run it the instant it exits -- a tight restart
# loop that pays for a fresh announce as fast as the container can restart,
# draining `[announce] pay_channel` for no benefit (a NIP-40 `expiration` of
# `ttl_secs` already keeps one publish valid for a while; nothing needs a
# faster cadence than that). This overlay instead runs the SAME pinned image
# under a `/bin/sh` loop (alpine's base image, `deploy/connector-rust/
# Dockerfile`, ships busybox sh) that pays once, sleeps, and repeats --
# mirroring the announcer sidecar's own `ANNOUNCER_REFRESH_INTERVAL_SECS`
# shape (`packages/announcer/src/config.ts`), just driven by this node's own
# key instead of a separate process holding a separate identity.
#
# `REFRESH_SECS` is comfortably inside `[announce] ttl_secs` (600 s, the
# config's default -- see `connector-config/src/announce.rs`'s
# `DEFAULT_TTL_SECS`), so an announce a client already has cached does not
# expire before this republishes it -- the same safety margin the sidecar
# keeps between its own `refreshIntervalSecs` and `ttlSeconds` (a factor of
# ~2).
#
# A failed run (channel not yet funded, the g.toon proxy briefly
# unreachable, ...) must not kill the loop -- the NEXT scheduled attempt is
# the retry, and a container that exits on the first failure needs an
# operator to notice and restart it by hand, which is exactly the silent-gap
# failure mode issue #833 is about in the first place. But surviving a
# failure and HIDING it are different things: this loop was first written
# with a bare `|| true`, which discards the reason and the exit status and
# leaves `docker logs` showing nothing but a cheerful "publishing..." every
# four minutes forever. This epic's whole history is defects that looked
# green, so the failure branch prints an explicit, greppable
# `[announce] FAILED rc=<n> -- g.toon.ario NOT published`, and the success
# branch says so too -- "publishing..." alone never meant "published".
#
# ── Wait for the edge; retry fast when it still fails (issue #996) ─────────
# The defect this shape was fixed for was observed on the RELAY box, whose
# announce publishes through its OWN co-located edge and therefore raced it
# when Watchtower recreated both containers in one sweep: the first publish
# hit a `502` from an nginx that had not re-resolved the new container, and
# the loop then sat out a full 240 s. That gap is an availability defect,
# because client-side discovery is fail-closed and only snapshotted at client
# startup -- a client that boots into it refuses every paid write with
# `TERMINATOR_UNRESOLVED` until it is restarted.
#
# This box's loop did NOT hit it (its through-URL is the relay box, a
# different machine, so nothing recreates underneath it at the same moment),
# but it carried the identical shape, so it is fixed identically -- see
# ../linode-relay/docker-compose.relay.announce.yml's header for the full
# argument, including the local reproduction showing that Watchtower ignores
# compose `depends_on` entirely and recreates in whatever order it likes.
# Keeping the two loops the same is the point: the next loop copied from one
# of these must not reintroduce the sit-out.
#
#   * `wait_for_edge` polls the through-URL's own `/ilp/identity` -- the
#     exact URL `fetch_identity` (crates/connector-cli/src/announce.rs)
#     reads, built the same way -- before spending an attempt. Free,
#     unauthenticated, and through the public hostname so it also sees an
#     nginx holding a stale upstream IP (issue #993). It FAILS OPEN after
#     `READY_TIMEOUT_SECS`: the gate is an optimization, the backoff below is
#     the guarantee, and a probe that can never succeed must not be able to
#     stop this loop publishing forever.
#   * a failed publish sleeps `BACKOFF_SECS` (5 s, doubling, capped at
#     `REFRESH_SECS`, reset on success) instead of the full refresh
#     interval -- five attempts inside the first ~75 s where the old shape
#     made one and went quiet. It costs nothing extra: only a SUCCESSFUL
#     announce is a paid write, and success resets the backoff.
#
# ── What this needs before it can do anything (live/operator, issue #833's
#    own scope boundary -- NOT provided by this file) ──────────────────────
# `./connector-rust.toml`'s `[announce] pay_channel` is a clearly-marked
# `0xdead...` placeholder (issues #853/#871, the same convention this repo
# already uses for `[[peer_channels]]` channel ids): opening and funding a
# channel this box pays THE RELAY BOX from is a live, human step
# (docs/operators/announcing-a-node.md, "What the node needs before this can
# work"), so the repo commits the field's shape and the box's own copy
# carries the real id. Until it does, every run here fails loudly -- the
# placeholder names no channel the far side can settle against, so the
# failure branch below prints the reason and the loop simply waits for the
# next attempt. It does not mask the gap, it just does not crash-loop the
# container over it.
#
# Bring up alongside the store's Rust edge (never on its own -- there is
# nothing here for it to announce without `docker-compose.store.rust.yml`'s
# `connector-rust` service already serving `/ilp/identity`):
#
#   docker compose -f infra/linode-store/docker-compose.store.yml \
#                  -f infra/linode-store/docker-compose.store.rust.yml \
#                  -f infra/linode-store/docker-compose.store.announce.yml \
#                  up -d announce
#
# ── ORDER MATTERS ACROSS THE TWO BOXES ─────────────────────────────────────
# The apex sidecar's stopgap announce of this same prefix retires in the same
# change as this file, but they are separate deployments on separate
# machines, so "same change" is not "same moment": fund the channel, bring
# THIS up, VERIFY a real kind:10032 under the store's own pubkey carrying
# `g.toon.ario` is on the relay, and only then redeploy and restart the
# apex's announcer without it. Retiring the apex's first leaves the prefix
# announced by NOBODY. The full ordered runbook, with the verification step
# spelled out, is docs/operators/announcing-a-node.md, "Cutting a prefix over
# from one publisher to another".
#
# ── Its OWN state volume, deliberately not `connector_rust_state` ──────────
# `connector announce` loads the SAME `./connector-rust.toml` the serving
# `connector-rust` service does, and `Config::load` requires every key file
# the file names -- the signer and both settlement legs -- regardless of
# which subcommand reads it, so this service mounts all three exactly as
# `docker-compose.store.rust.yml` does. `state_dir`, though, gets a SEPARATE
# named volume: building a runtime
# replays the peer- and client-claim journals under `state_dir` into memory
# at startup, and docs/operators/announcing-a-node.md documents a real hazard
# from two processes sharing one journal. That hazard is scoped to
# `--via-own-routing` (which this loop never passes -- the client path
# never journals a claim locally), but there is no reason to depend on that
# argument being read correctly by whoever brings this up: a dedicated,
# empty volume makes the question moot rather than merely answered.
# =============================================================================

services:
  announce:
    # PIN: the SAME tag `docker-compose.store.rust.yml` pins, and that is a
    # requirement rather than tidiness. Both services bind-mount the SAME
    # `./connector-rust.toml`, and `RawConfig` is `deny_unknown_fields`
    # (connector-config/src/config.rs, issue #542): a tag whose binary
    # predates the `[announce]` section below cannot merely ignore it, it
    # exits 1 with `unknown field 'announce'`. So a stale pin here does not
    # just break THIS service -- `docker compose up` recreating the SERVING
    # `connector-rust` from a repo where the two disagree takes the store's
    # client edge down with it.
    #
    # `rust-sha-33f10e2` is the FLOOR this pin may never go below -- and is
    # still what both devnet boxes run by hand, though the pin below has now
    # moved ahead of them (see PIN OF RECORD). `[announce]` and the
    # `connector announce` verb itself (`ANNOUNCE_VERB`,
    # connector-cli/src/lib.rs) both arrived in 09bc2299 (#784, 2026-08-05
    # 16:54); 33f10e2 (18:26) is its descendant. Anything older -- notably
    # `rust-sha-b31a7c9` (13:04), which this file was first authored against
    # -- has neither: the config refuses to load, and the command line below
    # is misparsed as `connector <config-file>` against a file literally
    # named `announce`.
    #
    # `devnet_configs_load.rs`'s
    # `store_overlays_sharing_one_config_pin_one_image` asserts the agreement
    # between the two overlays, so they cannot drift apart again unnoticed --
    # nothing in that suite had any notion of an image tag before, which is
    # why `rust-sha-b31a7c9` sailed through a green gate.
    #
    # ── PIN OF RECORD: a watched GHCR tag, no longer a literal here ─────────
    # (toon-meta#403's fleet-wide Watchtower rollout, applied to this box by
    # issue #992; reconciles what the box has actually run since 2026-08-16)
    #
    # This named an immutable `rust-sha-*` tag until toon-meta#403 gave each
    # box a label-scoped Watchtower. The doctrine that pin enforced -- no
    # connector image reaches a box unreviewed -- has NOT been dropped, it has
    # MOVED: the reviewed decision is now which build
    # `ghcr.io/toon-protocol/connector:rust-release` points at, and this
    # service's `com.centurylinklabs.watchtower.enable` label below is what
    # subscribes this container to it.
    #
    # A `rust-sha-*` literal here cannot coexist with that: it would make
    # Watchtower's poll a permanent no-op, since an immutable tag's digest
    # never moves. The state before this change was the worst of both -- this
    # file said `rust-sha-415531a` while the box had been following
    # `:rust-release` for a day, so the repo described a fleet that did not
    # exist and a `fleet-ops` reconcile would have rolled the box backwards.
    #
    # The full reasoning, and what IS still asserted (all four fleet overlays
    # name the SAME reference; a floating reference only ever on a
    # Watchtower-labelled service), is on `EXPECTED_CONNECTOR_TAG` in
    # crates/connector-bin/tests/devnet_configs_load.rs.
    image: ghcr.io/toon-protocol/connector:rust-release
    # Label-scoped Watchtower watch target: ./docker-compose.store.watchtower.yml's `--label-enable` Watchtower only ever
    # touches a container carrying this exact label. See that file's header
    # and the note above.
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    # `$$` throughout: compose interpolates a bare `$VAR`/`${VAR}` in this
    # file's own text against the HOST's environment at `up` time, same as
    # the nginx/certbot reload loops elsewhere in this fleet
    # (docker-compose.store.yml's `wait $${!}`) -- `$$` is what survives that
    # pass as a literal `$`, so the shell below sees it, not compose.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        THROUGH_URL="https://proxy.relay.devnet.toonprotocol.dev/ilp"
        REFRESH_SECS="$${STORE_ANNOUNCE_REFRESH_SECS:-240}"
        READY_POLL_SECS="$${ANNOUNCE_READY_POLL_SECS:-5}"
        READY_TIMEOUT_SECS="$${ANNOUNCE_READY_TIMEOUT_SECS:-90}"
        FIRST_BACKOFF_SECS="$${ANNOUNCE_FIRST_BACKOFF_SECS:-5}"
        wait_for_edge() {
          waited=0
          while ! wget -q -T 5 -O /dev/null "$$THROUGH_URL/identity"; do
            if [ "$$waited" -ge "$$READY_TIMEOUT_SECS" ]; then
              echo "[announce] edge $$THROUGH_URL still not serving after $${waited}s -- publishing anyway"
              return 1
            fi
            echo "[announce] edge $$THROUGH_URL not serving yet ($${waited}s) -- re-probing in $${READY_POLL_SECS}s"
            sleep "$$READY_POLL_SECS"
            waited=$$((waited + READY_POLL_SECS))
          done
          return 0
        }
        BACKOFF_SECS="$$FIRST_BACKOFF_SECS"
        while true; do
          wait_for_edge || true
          echo "[announce] publishing g.toon.ario via g.toon.relay..."
          if /usr/local/bin/connector announce \
            --config /app/config/connector.toml \
            "$$THROUGH_URL"; then
            echo "[announce] OK -- g.toon.ario published; next refresh in $${REFRESH_SECS}s"
            BACKOFF_SECS="$$FIRST_BACKOFF_SECS"
            SLEEP_SECS="$$REFRESH_SECS"
          else
            RC=$$?
            echo "[announce] FAILED rc=$$RC -- g.toon.ario NOT published; retrying in $${BACKOFF_SECS}s"
            SLEEP_SECS="$$BACKOFF_SECS"
            BACKOFF_SECS=$$((BACKOFF_SECS * 2))
            if [ "$$BACKOFF_SECS" -gt "$$REFRESH_SECS" ]; then
              BACKOFF_SECS="$$REFRESH_SECS"
            fi
          fi
          sleep "$$SLEEP_SECS"
        done
    environment:
      STORE_ANNOUNCE_REFRESH_SECS: '240'
    volumes:
      - ./connector-rust.toml:/app/config/connector.toml:ro
      - ./signer-rust.key:/app/data/signer.key:ro
      - ./settlement-rust.key:/app/data/settlement.key:ro
      - ./settlement-solana-rust.key:/app/data/settlement-solana.key:ro
      - store_announce_state:/app/state
    restart: unless-stopped

volumes:
  store_announce_state:
