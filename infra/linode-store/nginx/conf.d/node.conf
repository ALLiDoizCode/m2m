# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TOON store (Arweave DVM) box nginx config.
# Serves: proxy.store.DOMAIN (connector ILP edge)  dvm.DOMAIN (DVM health)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

limit_req_zone $binary_remote_addr zone=store:10m rate=30r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $host $backend {
    default                   "";
    proxy.store.devnet.toonprotocol.dev     "http://connector:3000";
    dvm.devnet.toonprotocol.dev             "http://store:3400";
}

server {
    listen 80;
    listen [::]:80;
    server_name proxy.store.devnet.toonprotocol.dev dvm.devnet.toonprotocol.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name proxy.store.devnet.toonprotocol.dev dvm.devnet.toonprotocol.dev;

    ssl_certificate     /etc/letsencrypt/live/proxy.store.devnet.toonprotocol.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.store.devnet.toonprotocol.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── read-only connector telemetry for the public demo dashboard ──
    # Exposes ONLY /admin/metrics.json (GET) from the connector admin API
    # (:8081). EVERYTHING ELSE under /admin is refused by the block below.
    #
    # This used to proxy five endpoints — metrics.json, earnings.json, routes,
    # peers, channels — anonymously, to anyone. That was never a decision: the
    # block was hand-added on the box and only later committed verbatim as
    # drift reconciliation (#626), which is why its own comment claimed two
    # endpoints while its regex listed five. ADR 0008 sanctions no part of it:
    # it puts every operator READ behind a bearer token and every WRITE behind
    # an RFC 9421 signature, so "readable by an operator" never meant
    # "readable by the internet". Issue #665.
    #
    # Each of the four now closed carried an identifier that is not otherwise
    # public:
    #   earnings.json  recentClaims[].peerId is `http:0x<counterparty EVM
    #                  address>` wherever a client pays this box directly,
    #                  joined to that claim's amount and timestamp — the join
    #                  between an address and a node's activity, which someone
    #                  watching the settlement contract cannot otherwise make.
    #   channels       on-chain channel ids bound to their counterparty.
    #   peers          peer topology, and the same `http:0x…` identifiers for
    #                  client peers.
    #   routes         per-chain settlement addresses, the internal upstream
    #                  URL behind each route, and per-route prices.
    #
    # metrics.json stays open on purpose. It is the only one of the five whose
    # body is pure aggregate counters (packetsForwarded/Rejected, bytesSent,
    # uptime) keyed by CONFIGURED peer names — verified live on all three boxes:
    # a paying client shows up in earnings.json's claims but never in this
    # endpoint's peer list, which mirrors the static peer registry. It is also
    # what the demo dashboard's live flow strip polls, i.e. the thing the page
    # exists to show. Re-check that property before adding a route whose
    # counterparty is a client rather than a configured peer.
    location = /admin/metrics.json {
        limit_except GET { deny all; }
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "https://faucet.devnet.toonprotocol.dev" always;
        add_header Cache-Control "no-store" always;
        set $conn_admin http://connector:8081;
        proxy_pass $conn_admin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Everything else under /admin — including the connector's mutating half —
    # is refused here rather than proxied. 404 rather than 401/403 so the
    # refusal does not advertise that an admin surface exists at all. `^~`
    # outranks any regex location, and the exact-match block above outranks
    # this, so the one open endpoint stays open and nothing else can be added
    # to the surface by accident.
    location ^~ /admin { return 404; }

    # DVM job routes (kind:5095 arns-buy / kind:5096 gas-station): the
    # payment-oblivious store backend on :3300. dvm.<domain>/health stays on
    # the health port via the default $backend map.
    location /store {
        limit_req zone=store burst=60 nodelay;
        proxy_pass http://store:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        client_max_body_size 4m;
    }

    location / {
        if ($backend = "") { return 404; }
        limit_req zone=store burst=60 nodelay;

        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;

        # DVM blob uploads (kind:5094) can be large; allow up to the connector's
        # 1 MB ILP body limit plus headroom.
        client_max_body_size 4m;
    }
}
