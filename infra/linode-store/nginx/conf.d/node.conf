# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TOON store (Arweave DVM) box nginx config.
# Serves: proxy.store.DOMAIN (connector ILP edge)  dvm.DOMAIN (DVM health)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

limit_req_zone $binary_remote_addr zone=store:10m rate=200r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $host $backend {
    default                   "";
    # CUT OVER 2026-08-04: was "http://connector:3000" (the TypeScript
    # connector). Moved first, ahead of the g.toon proxy, as the smaller blast
    # radius. NOTE what this broke and what fixing it took: the g.toon proxy's
    # TypeScript connector dialled THIS location as its BTP peer, and this
    # box's own kind:10032 announce advertised `wss://...:443` -- the bare
    # root, which reached the TypeScript BTP server here. The Rust connector
    # serves BTP at /ilp/btp, not at /, so the advertised endpoint 404'd until
    # ./connector.yaml's `selfAnnounce.btpEndpoint` was repointed. A default
    # edge move is not just a proxy_pass change when something advertises the
    # old path.
    # RENAMED 2026-08-05 (owner decision): `proxy.ario` is the canonical name
    # for this box's paid edge, matching the `g.toon.ario` prefix it serves.
    #
    # `proxy.store.devnet.toonprotocol.dev` was kept as a deprecated alias for
    # a few hours and is now RETIRED -- name, certificate SAN and DNS record.
    # What made that safe was removing what pointed at it rather than assuming
    # nothing did: the g.toon proxy's peering endpoint moved to `proxy.ario`,
    # the repo callers were repointed, and the two EXPIRED kind:10032
    # announces that still named it were deleted from the relay's own
    # database. The relay never enforces NIP-40, so those two would have gone
    # on being served to every subscriber forever -- an expired announce is not
    # a self-solving problem here.
    proxy.ario.devnet.toonprotocol.dev      "http://connector-rust:4000";
    dvm.devnet.toonprotocol.dev             "http://store:3400";
}

server {
    listen 80;
    listen [::]:80;
    server_name proxy.ario.devnet.toonprotocol.dev dvm.devnet.toonprotocol.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name proxy.ario.devnet.toonprotocol.dev dvm.devnet.toonprotocol.dev;

    # The DIRECTORY name is certbot's `--cert-name` -- the certificate's
    # LINEAGE identifier, not a hostname -- so it still reads `proxy.store`
    # even though that name is retired. Renaming it would orphan the renewal
    # config for no gain; the path is an internal label and nothing resolves
    # it. The certificate itself was reissued on 2026-08-05 covering
    # `proxy.ario` ONLY.
    #
    # Ordering, which is the one thing to get right if this is ever redone:
    # the SAN must be dropped BEFORE the DNS record. Renewal proves each name
    # in the lineage over HTTP-01, so a lineage still listing a name that no
    # longer resolves fails renewal for EVERY name on it -- taking the live
    # edge down at the 60-day mark, long after anyone connects the two events.
    ssl_certificate     /etc/letsencrypt/live/proxy.store.devnet.toonprotocol.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.store.devnet.toonprotocol.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── there is no anonymous connector telemetry, and that is decided ──
    # A `location = /admin/metrics.json` used to live here, proxying to
    # `connector:8081` — the TypeScript connector's admin API.
    #
    # Before that it proxied five endpoints — metrics.json, earnings.json,
    # routes, peers, channels — anonymously, to anyone. That was never a
    # decision: the block was hand-added on the box and only later committed
    # verbatim as drift reconciliation (#626), which is why its own comment
    # claimed two endpoints while its regex listed five. ADR 0008 sanctions no
    # part of it: it puts every operator READ behind a bearer token and every
    # WRITE behind an RFC 9421 signature, so "readable by an operator" never
    # meant "readable by the internet". Issue #665 closed four of the five:
    #   earnings.json  recentClaims[].peerId is `http:0x<counterparty EVM
    #                  address>` wherever a client pays this box directly,
    #                  joined to that claim's amount and timestamp — the join
    #                  between an address and a node's activity, which someone
    #                  watching the settlement contract cannot otherwise make.
    #   channels       on-chain channel ids bound to their counterparty.
    #   peers          peer topology, and the same `http:0x…` identifiers for
    #                  client peers.
    #   routes         per-chain settlement addresses, the internal upstream
    #                  URL behind each route, and per-route prices.
    # metrics.json survived that pass because its body is aggregate counters
    # (packetsForwarded/Rejected, bytesSent, uptime) keyed by CONFIGURED peer
    # names — verified live at the time: a paying client showed up in
    # earnings.json's claims but never in this endpoint's peer list — and
    # because it was what the public /dash flow strip polled.
    #
    # The 2026-08-04 Rust cutover stopped the `connector` container, so this
    # block has been answering 502 ever since — nginx up, upstream gone. Issue
    # #753. The rust-cutover-runbook §2.3 named exactly this and chose option
    # (1), "accept the loss": this is that edit, landing late.
    #
    # It is deleted rather than repointed because there is nothing to repoint
    # it AT, and the reasons are decisions rather than gaps:
    #
    #   * ADR 0014 fixes the Rust metrics surface at five names, in Prometheus
    #     text, on the operator surface, behind the same bearer token as every
    #     other read — explicitly "avoids introducing a second, differently-
    #     authenticated (or unauthenticated) HTTP surface". A node with no
    #     `[operator]` section, which is both boxes, exposes no metrics at all.
    #   * ADR 0014 also states there is "no per-peer or per-destination label
    #     anywhere", so the per-peer strip metrics.json fed cannot be rebuilt
    #     faithfully at any authentication level.
    #   * ADR 0022's line between answering and announcing is what makes
    #     /ilp/identity and /ilp/routes/price unauthenticated: they tell a
    #     caller what this node's own CONFIGURATION says, which "decides
    #     nothing, and reaches nobody who did not ask". A packet counter is
    #     operational history, not configuration, so it does not sit on the
    #     free side of that line by inheritance — it would need its own
    #     decision, and this is it: no.
    #   * Enabling `[operator]` to open a bearer-gated path here is not a small
    #     move on this box. The operator router merges onto the SAME port the
    #     client edge serves (crates/connector-cli/src/runtime.rs), `location /`
    #     below proxies everything to that port, and the operator write half is
    #     deliberately not behind the bearer token (ADR 0008 — writes are RFC
    #     9421 signatures). Turning the section on without also adding deny
    #     blocks here would publish POST /channels/:id/close and POST /packets
    #     to the anonymous internet. Note the `^~ /admin` block below does NOT
    #     cover them: the Rust operator paths are /peers, /routes, /channels,
    #     /claims, /exposure, /identity, /audit-log, /metrics — no /admin prefix.
    #
    # What replaces it, for the two questions the strip actually answered:
    #   "is the node up?"    GET /ilp/identity — unauthenticated, and a 200
    #                        proves the signer key loaded as well as the
    #                        process running.
    #   "are packets moving?" the claims journals on the state volume, which is
    #                        what the cutover itself was verified with:
    #                        wc -l /var/lib/docker/volumes/linode-store_connector_rust_state/_data/{client-edge,peer}-claims.log
    #                        Per #690 per-packet logs are `debug`, so a quiet
    #                        container log is not evidence of an idle node.
    #
    # An authenticated telemetry path for the dashboard — a same-origin proxy
    # holding the token server-side, so no credential reaches a browser — is
    # #669, and is still the right shape if the panels are wanted back. It is
    # not this block, and it is not anonymous.
    #
    # Mirrored the g.toon proxy box's own nginx config, which went with the
    # apex (issue #872); infra/linode-relay/nginx/conf.d/node.conf is the
    # surviving twin.

    # The whole /admin prefix is refused here rather than proxied — nothing is
    # carved out of it any more. 404 rather than 401/403 so the refusal does not
    # advertise that an admin surface exists at all. `^~` outranks any regex
    # location, and with the exact-match block above gone there is nothing left
    # that outranks this, so no path under /admin can reach an upstream by
    # accident.
    location ^~ /admin { return 404; }

    # ── The retired /rust/ prefix (ADR 0013; mirrors the g.toon proxy) ────────
    # /rust/ilp and /rust/ilp/btp were this box's half of the PARALLEL fleet:
    # a second door to the Rust connector while the TypeScript one still held
    # `/`. The 2026-08-04 cutover made them redundant -- $backend above now
    # points `/` at the same `connector-rust:4000` -- and this retires them.
    #
    # This box's evidence is even thinner than the g.toon proxy's: 19
    # access-log hits on the prefix in its entire life, all on 2026-08-04, all
    # from the g.toon proxy box (104.237.150.177) or the operator
    # (153.66.109.187), and none since.
    # Nothing external has ever addressed it.
    #
    # 410, not 404 and not a redirect. Deleting the blocks outright would let
    # /rust/ilp fall through to `location /` and reach the connector at the
    # literal path /rust/ilp, which answers 404 and reads like the connector is
    # broken rather than like the alias is gone. A redirect to /ilp would
    # silently re-point a payer's POST at a priced endpoint it did not address.
    # 410 says permanently gone and keeps any straggler visible in the log.
    #
    # `^~` so this wins over any regex location and covers the whole prefix --
    # unlike the two blocks it replaces, there is no surface behind it to scope
    # narrowly any more.
    # The `location = /rust/ilp/btp` exception that stood here is GONE.
    # It existed for exactly one caller: the g.toon proxy's `[[peers]]` entry
    # dialed `wss://proxy.store.devnet.toonprotocol.dev/rust/ilp/btp`. That
    # endpoint is now `/ilp/btp`, the canonical path `location /` already
    # serves (with the Upgrade headers and the 1h read timeout a BTP session
    # needs), and the peering re-established there before this block was removed.
    #
    location ^~ /rust/ { return 410; }

    # DVM job routes (kind:5095 arns-buy / kind:5096 gas-station): the
    # payment-oblivious store backend on :3300. dvm.<domain>/health stays on
    # the health port via the default $backend map.
    # ── `location /store` is REMOVED (2026-08-05) — it was a FREE DOOR ──────
    # It proxied straight to `store:3300`, the payment-oblivious Arweave store
    # app, bypassing this box's connector entirely. `POST /store` with a
    # signed kind:5094 event uploaded a blob to Arweave, paid for out of this
    # box's own funded Arweave wallet, for NOTHING -- beside a `g.toon.ario`
    # route that charges 1000 for the identical handler. Anyone who knew the
    # URL had no reason to pay. Demonstrated with a real upload
    # (`ko6XqRyxcOgwLb3I-d_gCpdxAQKOvFXSHDflkaFIQ7Y`) while proving the paid
    # leg in #777.
    #
    # It was not always wrong. Until 2026-08-04 the g.toon PROXY terminated
    # `g.toon.ario` at `handler_url =
    # "https://proxy.store.devnet.toonprotocol.dev/store"`, so this path WAS
    # the inter-node hop -- the proxy charged the client and reached the app
    # through here. That is the topology #772 replaced with a real BTP
    # peering, and the access log shows it exactly: every `200` on this path
    # is from 104.237.150.177 (the g.toon proxy) on 30-31 July, and there has
    # not been one since. The peering made this vestigial and left it public.
    #
    # Nothing legitimate needs it now. This box's own connector reaches the
    # app over the container network as `http://store:3300/store` (its
    # route's `handler_url`), which never traversed nginx; the proxy reaches
    # it across the peering; and an external client is supposed to pay at
    # `/ilp`. A request here now falls through to `location /` below and
    # reaches the connector at the literal path `/store`, which is not one of
    # its routes (`/ilp`, `/ilp/btp`, `/ilp/probe`, `/ilp/identity`,
    # `/ilp/routes/price`, `/ilp/claim-state`) -- so it answers **404**.
    # Verified live: `POST /store` returns 404 on both this box's names, where
    # before the reload it reached the store app and got as far as signature
    # verification. Not an x402 greeting, deliberately: the greeting belongs
    # to a priced ILP route, and `/store` never was one.

    # ── CORS for the liveness read, and ONLY the liveness read ─────────────
    # The public dashboard is served from the g.toon PROXY's origin
    # (https://proxy.devnet.toonprotocol.dev/dash/) and derives each node's
    # up/down dot from `GET /ilp/identity`. That is a cross-origin fetch for
    # this box, and without an `Access-Control-Allow-Origin` the browser
    # rejects it with a bare `TypeError: Failed to fetch` -- indistinguishable
    # from a dead box. So the dashboard had to fall back to an opaque
    # `mode:'no-cors'` probe and label this node "reachable" rather than "up",
    # because it genuinely could not tell a 200 from a 502
    # (toon-meta#267). This header is what lets it read the answer.
    #
    # Scoped to an EXACT-match location, and to ONE origin, deliberately.
    # `/ilp/identity` is already public and unauthenticated and returns only
    # this connector's public signing key -- nothing a reader could not get by
    # asking for it directly. Every other path here stays same-origin-only:
    # `/ilp` takes payment and `/ilp/claim-state` reports on channels, and
    # neither should become script-readable from an arbitrary page. A wildcard
    # `*` would have been one character shorter and would have handed both to
    # any origin on the internet.
    location = /ilp/identity {
        add_header Access-Control-Allow-Origin "https://proxy.devnet.toonprotocol.dev" always;
        add_header Vary "Origin" always;
        limit_req zone=store burst=400 nodelay;
        proxy_pass http://connector-rust:4000/ilp/identity;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        if ($backend = "") { return 404; }
        limit_req zone=store burst=400 nodelay;

        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;

        # DVM blob uploads (kind:5094) can be large; allow up to the connector's
        # 1 MB ILP body limit plus headroom.
        client_max_body_size 4m;
    }
}
