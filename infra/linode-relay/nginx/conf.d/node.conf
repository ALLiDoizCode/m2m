# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TOON relay box nginx config.
# Serves: proxy.relay.DOMAIN (connector ILP edge)  relay-ws.DOMAIN (relay app)
# NOT the faucet: it gets its own box, with no connector on it
# (docs/two-node-architecture.md §4).
#
# Written to point directly at connector-rust:4000 — NOT at a TypeScript
# connector. infra/linode-store/nginx/node.conf.template still names
# "http://connector:3000" (the retired TypeScript node) because it predates
# that box's own cutover and was never updated; its rendered
# nginx/conf.d/node.conf is what actually reflects the live box. This box has
# no TypeScript connector at all, so there is no stale value to carry over.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

limit_req_zone $binary_remote_addr zone=relay:10m rate=30r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 3100 (the relay app's payment-oblivious write backend) is deliberately
# absent from this map and from every location below. It must never be
# publicly reachable — infra/linode-store/nginx/conf.d/node.conf:198-228
# records what happened the one time a payment-oblivious app's path was left
# open on this fleet: it was a free door (#778).
map $host $backend {
    default                  "";
    proxy.relay.devnet.toonprotocol.dev    "http://connector-rust:4000";
    relay-ws.devnet.toonprotocol.dev       "http://relay:7100";
}

server {
    listen 80;
    listen [::]:80;
    server_name proxy.relay.devnet.toonprotocol.dev relay-ws.devnet.toonprotocol.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name proxy.relay.devnet.toonprotocol.dev;

    ssl_certificate     /etc/letsencrypt/live/proxy.relay.devnet.toonprotocol.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.relay.devnet.toonprotocol.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # The whole /admin prefix is refused here rather than proxied — mirrors
    # both other boxes (infra/linode-store/nginx/conf.d/node.conf,
    # infra/linode-node/nginx/conf.d/node.conf). 404 rather than 401/403 so
    # the refusal does not advertise that an admin surface exists at all.
    # `^~` outranks any regex location.
    location ^~ /admin { return 404; }

    # The retired /rust/ prefix (ADR 0013) — this box never ran a parallel
    # fleet of its own, but the guard costs nothing and keeps this file's
    # shape identical to the other two boxes' if that prefix is ever probed
    # here by habit.
    location ^~ /rust/ { return 410; }

    # ── CORS for the liveness read, and ONLY the liveness read ─────────────
    # Mirrors infra/linode-store/nginx/conf.d/node.conf's identical block:
    # the public dashboard is served from the apex origin and derives each
    # node's up/down dot from `GET /ilp/identity`, a cross-origin fetch for
    # this box without this header (toon-meta#267). Scoped to an
    # EXACT-match location and to ONE origin, deliberately — `/ilp/identity`
    # is already public and unauthenticated and returns only this
    # connector's public signing key, but every other path here stays
    # same-origin-only.
    location = /ilp/identity {
        add_header Access-Control-Allow-Origin "https://proxy.devnet.toonprotocol.dev" always;
        add_header Vary "Origin" always;
        limit_req zone=relay burst=400 nodelay;
        proxy_pass http://connector-rust:4000/ilp/identity;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Internal write path for the apex's own announcer sidecar (issue #820) ──
    # `ANNOUNCER_RELAY_URLS` (infra/linode-node/docker-compose.node.
    # announcer.yml) used to reach this same payment-oblivious write ingress
    # over the docker container network (`http://relay:3100`) when the relay
    # app and the apex's announcer sidecar shared one box. Now that the relay
    # app has its own box, that path has to be a public URL instead -- and
    # per issue #778 (see infra/linode-store/nginx/conf.d/node.conf's own
    # `/store` removal, the one time a payment-oblivious write path was left
    # open on this fleet), a bare `proxy_pass` to :3100 would be a free door:
    # anyone who found this URL could publish a Nostr event through the
    # relay's trusted-local write ingress for nothing, same as POSTing
    # straight to `relay:3100/write`.
    #
    # Restricted to the apex box's own IP rather than opened to the world --
    # the announcer sidecar is the ONLY caller (packages/announcer/src/
    # publisher.ts's documented "trusted-local free path", extended one
    # network hop). `allow`/`deny`, not a signature or a token, because
    # nothing at this ingress authenticates a caller either way (the relay's
    # `launcher/handlers/write-handler.ts` takes any `{ event }` body) -- an
    # IP check is the whole of what makes this narrower than the free-for-all
    # #778 closed elsewhere. 104.237.150.177 is the g.toon proxy box (see
    # infra/linode-store/nginx/conf.d/node.conf's own citations of the same
    # address).
    #
    # `/relay-write/write`, not `/relay-write`: `publishToRelay`
    # (packages/announcer/src/publisher.ts) appends `/write` to an
    # `http(s)://` relay URL that does not already end with it, and
    # `ANNOUNCER_RELAY_URLS` below is set to the `.../relay-write` origin, so
    # the request that actually arrives here carries both segments.
    location = /relay-write/write {
        allow 104.237.150.177;
        deny all;
        proxy_pass http://relay:3100/write;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        if ($backend = "") { return 404; }
        limit_req zone=relay burst=60 nodelay;

        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # What TLS-terminates `wss://…/ilp/btp` for the future peering, and
        # what relay-ws.DOMAIN needs for the relay app's own websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;

        client_max_body_size 4m;
    }
}

# ── relay-ws.DOMAIN — the relay app's own public websocket edge ──────────────
# A SEPARATE `server` block from proxy.relay above, for one reason: it presents
# a SEPARATE certificate lineage. Per #830 the two names are issued as two
# independent certbot requests (see init-letsencrypt.sh's CERT_NAMES), never as
# one multi-SAN request -- a SAN request is all-or-nothing, so bundling them
# means either name failing validation takes the other's certificate down with
# it. That is exactly how the relay box ended up unable to obtain any
# certificate at all before #830. Two lineages, two blind spots that cannot
# reach each other.
#
# This is also the far end of the DNS move in infra/devnet-manage.sh: post-#820
# `relay-ws.devnet` resolves HERE, and the apex no longer names it in any
# server_name or cert lineage (infra/linode-node/nginx/conf.d/node.conf).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay-ws.devnet.toonprotocol.dev;

    ssl_certificate     /etc/letsencrypt/live/relay-ws.devnet.toonprotocol.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay-ws.devnet.toonprotocol.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same two guards as the proxy.relay block above, for the same reasons and
    # to keep the two blocks' shape identical.
    location ^~ /admin { return 404; }
    location ^~ /rust/ { return 410; }

    location / {
        # `$backend` is the same `map $host` table at the top of this file, so
        # this name's upstream (relay:7100 -- the relay app's PUBLIC websocket
        # port, never the payment-oblivious :3100) stays declared in exactly
        # one place. The guard keeps an unmapped Host a 404 rather than a
        # proxy_pass to the empty string.
        if ($backend = "") { return 404; }
        limit_req zone=relay burst=60 nodelay;

        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The relay speaks NIP-01 over a websocket: without these two the
        # upgrade never completes and every client sees a plain HTTP 400.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;

        client_max_body_size 4m;
    }
}

