# =============================================================================
# TOON devnet — RELAY box's own kind:10032 publisher (issue #843, repo half
# of #815)
# =============================================================================
# Gives `g.toon.relay` a publisher that advertises this box's OWN endpoints --
# where clients pay it and (via `relay_url`) where they read it for free --
# under an identity a client already trusts. Originally that was this box's
# own `[signer]` key; as of issue #870 (toon-meta#310, the apex retirement)
# it is the apex's CARRIED-OVER announce identity instead --
# `./connector-rust.toml`'s `[announce] identity_key_file`, which overrides
# what this command signs with (crates/connector-cli/src/announce.rs). Either
# way this node still opens every gift wrap sealed to its own `[signer]` --
# `identity_key_file` only changes which key SIGNS the announce event, never
# which key clients pay against (ADR 0018). Mirrors
# infra/linode-store/docker-compose.store.announce.yml (issue #833), which did
# the same shape for the store box's `g.toon.ario` (still signed under the
# store's own `[signer]` -- it never had a prior identity to carry over).
#
# ── Paying itself, not the apex ──────────────────────────────────────────
# The store's announce loop pays the g.toon proxy's client edge to reach a
# prefix it does NOT terminate. This box terminates `g.toon.relay` itself
# (./connector-rust.toml's `[[routes]]`), so its command below passes
# `--via-own-routing` instead: the packet is delivered through this node's
# OWN routing table, never leaves the process, and needs no `pay_channel` --
# see ./connector-rust.toml's `[announce]` section comment for the fuller
# argument, and docs/operators/announcing-a-node.md's "Routing it yourself"
# for why `--via-own-routing` is unblocked for a route this node terminates
# (the ledger-fork guard only ever refuses a `peer_id` forward).
# `--to g.toon.relay` is passed explicitly on the command line rather than
# left to `[announce] publish_to`, because that field is one of the three
# this box's `[announce]` section deliberately omits (see its own comment).
# The through-URL argument is this box's OWN public HTTP endpoint -- the same
# literal as `[announce] http_endpoint` -- since that is where this node's
# own x402 greeting and `/ilp/identity` are polled from.
#
# ── Why a shell loop, not `restart: unless-stopped` on the bare subcommand ──
# Same rationale as the store's overlay: `connector announce`
# (crates/connector-cli/src/announce.rs, issue #784) is a ONE-SHOT operator
# action, not a daemon. A bare `restart: unless-stopped` on the subcommand
# would re-run it the instant it exits -- a tight restart loop republishing
# as fast as the container can restart. This overlay instead runs the SAME
# pinned image under a `/bin/sh` loop that publishes once, sleeps, and
# repeats, comfortably inside `[announce] ttl_secs` (600s default) the same
# way the store's loop and the announcer sidecar's own refresh/TTL pair are.
#
# A failed run must not kill the loop -- the NEXT scheduled attempt is the
# retry -- but must not hide the failure either: the loop prints an explicit,
# greppable `[announce] OK` or `[announce] FAILED rc=<n> -- g.toon.relay NOT
# published`, never a bare `|| true` that leaves `docker logs` showing
# nothing but a cheerful "publishing..." whether or not anything published.
#
# ── The startup race, and why "the next scheduled attempt" was not enough ──
# (issue #996.) "The next scheduled attempt is the retry" is a fine answer for
# a steady-state failure and the WRONG one for a startup failure. Observed
# live 2026-08-16: the box's label-scoped Watchtower (issue #988) recreated
# `connector-rust` and this `announce` container in the SAME sweep -- both
# follow `ghcr.io/toon-protocol/connector:rust-release` on the live box -- and
# this loop fired its first publish while the edge was still booting behind an
# nginx that had not re-resolved it. It got `502 Bad Gateway` where an x402
# greeting should have been, logged `FAILED`, and then sat out a FULL 240 s.
#
# That sit-out is an availability defect, not a cosmetic one. This kind:10032
# announce is how a client learns who terminates `g.toon.relay`; client-side
# discovery is FAIL-CLOSED (no announce -> every paid write refused
# `TERMINATOR_UNRESOLVED`) and it is snapshotted at CLIENT STARTUP, so a
# client that boots inside the gap does not recover when the announce
# eventually lands -- it has to be restarted. A four-minute unpublished
# window is therefore an unbounded outage for whoever started up inside it.
# On 2026-08-16 it took a manual `docker restart` of this container to clear.
#
# Two changes below, in the order they matter:
#
#   1. DON'T RACE. `wait_for_edge` polls the through-URL's own
#      `/ilp/identity` -- the same URL `fetch_identity`
#      (crates/connector-cli/src/announce.rs) reads, built the same way, by
#      appending `/identity` -- and only publishes once it answers. It is a
#      free, unauthenticated GET, and it is deliberately probed through the
#      PUBLIC hostname rather than the container directly, so it also catches
#      the nginx-has-a-stale-container-IP half of the failure (issue #993)
#      rather than only "the connector process is not up yet".
#
#      Compose `depends_on` cannot do this job, and that was VERIFIED rather
#      than assumed: Watchtower does not read compose's ordering at all. In a
#      local reproduction (watchtower 1.7.1, `--label-enable`, two labelled
#      services where the dependent declared `depends_on: {edge: {condition:
#      service_healthy}}`) compose brought them up in order and waited for
#      health, then Watchtower recreated them on a moved tag in the REVERSE
#      order -- `Creating /probe` at :46, `Creating /edge` at :47 -- and the
#      dependent's first request failed with `bad address` before the edge
#      container even started. Compose records the dependency as a container
#      label (`com.docker.compose.depends_on=edge:service_healthy:false`);
#      Watchtower ignores it. It honours only its OWN
#      `com.centurylinklabs.watchtower.depends-on` label, and even that just
#      orders the restarts -- it never waits for readiness. So the wait has
#      to live here, in the process that needs the edge.
#
#   2. WHEN IT STILL FAILS, RETRY FAST AND BOUNDED. A failed publish now
#      sleeps `BACKOFF_SECS` (5 s, doubling: 5, 10, 20, 40, 80, 160) rather
#      than the full refresh interval, capped AT `REFRESH_SECS` so a
#      genuinely broken edge settles into the steady-state cadence instead of
#      hammering, and reset to 5 s on the first success. Five attempts inside
#      the first ~75 s, where the old shape made one and then went quiet.
#
# The readiness gate FAILS OPEN on purpose -- after `READY_TIMEOUT_SECS` it
# logs and publishes anyway. The gate is an optimization; the backoff is the
# guarantee. A probe that can never succeed (no `wget` in some future base
# image, an nginx that stops serving `/ilp/identity`) must not be able to
# stop this loop from ever publishing again.
#
# ── Bring up alongside the relay's Rust edge (never on its own) ────────────
#   docker compose -f infra/linode-relay/docker-compose.relay.yml \
#                  -f infra/linode-relay/docker-compose.relay.rust.yml \
#                  -f infra/linode-relay/docker-compose.relay.announce.yml \
#                  up -d announce
#
# ── ORDER MATTERS ACROSS THE TWO BOXES (this box and the apex) ────────────
# HISTORICAL as of issue #872: the apex has been destroyed (toon-meta#310 /
# toon-meta#313's live cutover), this loop has long since taken over signing
# under the adopted pubkey, and there is no longer an apex announcer to
# coordinate with. Left as the record of the cutover this box already went
# through, and as the template for the next time a publisher identity needs
# to move between boxes (docs/operators/announcing-a-node.md, "Cutting over
# under an adopted key").
#
# STOP THE APEX'S ANNOUNCER SIDECAR FIRST, confirm it stopped, and only THEN
# bring this loop up. That is the REVERSE of the cutover order in
# docs/operators/announcing-a-node.md, and the reason is `[announce]
# identity_key_file` below: this box ADOPTS the apex's announce identity
# (pubkey `30fdd01d...`, issue #870), so the two publishers sign under ONE
# pubkey. kind:10032 is regular-replaceable by `(pubkey, kind)` with no `d`
# tag (crates/connector-signer/src/nostr.rs), and both publish into THIS
# box's relay -- the sidecar's `ANNOUNCER_RELAY_URLS` is
# `https://proxy.relay.devnet.toonprotocol.dev/relay-write`, and
# `relay-ws.devnet.toonprotocol.dev` resolves here. One slot, last writer
# wins, on 300s and 240s cadences: overlapping the two IS the outage this
# ordering exists to prevent.
#
# STOP THIS LOOP BEFORE EDITING `./connector-rust.toml`. The loop below
# re-execs `connector announce --config` every cycle and re-reads the file
# each time, so setting `[announce] identity_key_file` on a box whose loop
# is already running flips its identity on the next tick with no restart --
# the box opens the concurrent window by itself while the operator believes
# nothing has started yet.
#
# VERIFY BY CONTENT, NOT BY AUTHOR. Once the pubkey is shared, "a kind:10032
# under the relay's own pubkey" can no longer tell the two publishers apart.
# This box announces `ilpAddress g.toon.relay` + `httpEndpoint
# https://proxy.relay.devnet.toonprotocol.dev/ilp`; the apex announces
# `g.toon` + `proxy.devnet.toonprotocol.dev`. Confirm the content, and a
# `created_at` that advances on the ~240s cadence and never reverts.
#
# There is NO announced-by-nobody gap in this order: the relay neither
# deletes nor filters expired events and the seeded bootstrap path ignores
# NIP-40, so the apex's last announce keeps serving until this loop replaces
# it. The 600s `ttl_secs` binds only the kind:10036 seed-relay path -- keep
# the handoff brisk, but it is not a correctness deadline.
#
# `g.toon.relay` was already dropped from `ANNOUNCER_ILP_ADDRESSES` in the
# apex's own docker-compose.node.announcer.yml (that file, and the rest of
# infra/linode-node/, is gone as of issue #872) -- but that was a different
# machine, so "same repo change" was not "same deployment moment". Runbook
# of record: toon-meta#311. See also
# docs/operators/announcing-a-node.md, "Cutting over under an adopted key".
#
# ── Its OWN state volume, deliberately not `connector_rust_state` ──────────
# `connector announce` loads the SAME `./connector-rust.toml` the serving
# `connector-rust` service does, and `Config::load` requires every key file
# it names regardless of which subcommand reads it, so this service mounts
# the same FOUR key files `docker-compose.relay.rust.yml` does -- the
# `[signer]` key, the two `[settlement]` keys and `./announce.key` (issue
# #870). Compose merge cannot supply any of them because the serving
# service's mount lives under a different service name, so omitting one
# here makes this service exit before it publishes anything -- the failure
# #870's reviewer caught, where the adopted identity would have announced
# nothing while the loop logged `[announce] FAILED rc=...` every cycle.
# (Issue #820 added a fifth mount here, the `[[peers]]` credential
# `./apex-relay.secret`; issue #872 removed it along with the peering it
# was for.)
# `state_dir` gets a SEPARATE named volume: two processes sharing one
# journal is a documented hazard (docs/operators/announcing-a-node.md,
# "When it refuses to run beside a serving node"), and while that guard is
# scoped to a `peer_id` destination this announce never resolves to, a
# dedicated empty volume makes the question moot rather than merely answered.
# =============================================================================

services:
  announce:
    # PIN: the SAME tag docker-compose.relay.rust.yml pins -- both services
    # bind-mount the SAME `./connector-rust.toml`, and `RawConfig` is
    # `deny_unknown_fields` (connector-config/src/config.rs, issue #542): a
    # binary older than the `[announce]` section below does not ignore it,
    # it exits 1. A stale pin here does not just break THIS service --
    # `docker compose up` recreating the SERVING `connector-rust` from a repo
    # where the two disagree takes the relay's client edge down with it. See
    # `relay_overlays_sharing_one_config_pin_one_image` in
    # crates/connector-bin/tests/devnet_configs_load.rs, which asserts this
    # agreement so the two cannot drift apart unnoticed (the store's own
    # equivalent guard is what caught a three-hours-too-old pin sailing
    # through a green gate the first time this shape was written, issue
    # #833's review).
    #
    # ── PIN OF RECORD: a watched GHCR tag, no longer a literal here ─────────
    # (toon-meta#403's fleet-wide Watchtower rollout, applied to this box by
    # issue #988; reconciles what the box has actually run since 2026-08-16)
    #
    # This named an immutable `rust-sha-*` tag until toon-meta#403 gave each
    # box a label-scoped Watchtower. The doctrine that pin enforced -- no
    # connector image reaches a box unreviewed -- has NOT been dropped, it has
    # MOVED: the reviewed decision is now which build
    # `ghcr.io/toon-protocol/connector:rust-release` points at, and this
    # service's `com.centurylinklabs.watchtower.enable` label below is what
    # subscribes this container to it.
    #
    # A `rust-sha-*` literal here cannot coexist with that: it would make
    # Watchtower's poll a permanent no-op, since an immutable tag's digest
    # never moves. The state before this change was the worst of both -- this
    # file said `rust-sha-415531a` while the box had been following
    # `:rust-release` for a day, so the repo described a fleet that did not
    # exist and a `fleet-ops` reconcile would have rolled the box backwards.
    #
    # The full reasoning, and what IS still asserted (all four fleet overlays
    # name the SAME reference; a floating reference only ever on a
    # Watchtower-labelled service), is on `EXPECTED_CONNECTOR_TAG` in
    # crates/connector-bin/tests/devnet_configs_load.rs.
    image: ghcr.io/toon-protocol/connector:rust-release
    # Label-scoped Watchtower watch target: ./docker-compose.relay.watchtower.yml's `--label-enable` Watchtower only ever
    # touches a container carrying this exact label. See that file's header
    # and the note above.
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    # `$$` throughout: compose interpolates a bare `$VAR`/`${VAR}` in this
    # file's own text against the HOST's environment at `up` time -- `$$` is
    # what survives that pass as a literal `$`, so the shell below sees it,
    # not compose. Same precedent as the store's overlay.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        THROUGH_URL="https://proxy.relay.devnet.toonprotocol.dev/ilp"
        REFRESH_SECS="$${RELAY_ANNOUNCE_REFRESH_SECS:-240}"
        READY_POLL_SECS="$${ANNOUNCE_READY_POLL_SECS:-5}"
        READY_TIMEOUT_SECS="$${ANNOUNCE_READY_TIMEOUT_SECS:-90}"
        FIRST_BACKOFF_SECS="$${ANNOUNCE_FIRST_BACKOFF_SECS:-5}"
        wait_for_edge() {
          waited=0
          while ! wget -q -T 5 -O /dev/null "$$THROUGH_URL/identity"; do
            if [ "$$waited" -ge "$$READY_TIMEOUT_SECS" ]; then
              echo "[announce] edge $$THROUGH_URL still not serving after $${waited}s -- publishing anyway"
              return 1
            fi
            echo "[announce] edge $$THROUGH_URL not serving yet ($${waited}s) -- re-probing in $${READY_POLL_SECS}s"
            sleep "$$READY_POLL_SECS"
            waited=$$((waited + READY_POLL_SECS))
          done
          return 0
        }
        BACKOFF_SECS="$$FIRST_BACKOFF_SECS"
        while true; do
          wait_for_edge || true
          echo "[announce] publishing g.toon.relay via its own routing..."
          if /usr/local/bin/connector announce \
            --config /app/config/connector.toml \
            --via-own-routing \
            --to g.toon.relay \
            "$$THROUGH_URL"; then
            echo "[announce] OK -- g.toon.relay published; next refresh in $${REFRESH_SECS}s"
            BACKOFF_SECS="$$FIRST_BACKOFF_SECS"
            SLEEP_SECS="$$REFRESH_SECS"
          else
            RC=$$?
            echo "[announce] FAILED rc=$$RC -- g.toon.relay NOT published; retrying in $${BACKOFF_SECS}s"
            SLEEP_SECS="$$BACKOFF_SECS"
            BACKOFF_SECS=$$((BACKOFF_SECS * 2))
            if [ "$$BACKOFF_SECS" -gt "$$REFRESH_SECS" ]; then
              BACKOFF_SECS="$$REFRESH_SECS"
            fi
          fi
          sleep "$$SLEEP_SECS"
        done
    environment:
      RELAY_ANNOUNCE_REFRESH_SECS: '240'
    volumes:
      - ./connector-rust.toml:/app/config/connector.toml:ro
      - ./signer-rust.key:/app/data/signer.key:ro
      - ./settlement-rust.key:/app/data/settlement.key:ro
      - ./settlement-solana-rust.key:/app/data/settlement-solana.key:ro
      # The retired apex's announce identity (issue #870), same file
      # docker-compose.relay.rust.yml mounts for the serving connector --
      # this is the process that actually SIGNS under it. See
      # ./connector-rust.toml's `[announce] identity_key_file` comment.
      - ./announce.key:/app/data/announce.key:ro
      - relay_announce_state:/app/state
    restart: unless-stopped

volumes:
  relay_announce_state:
