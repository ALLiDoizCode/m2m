# ═══════════════════════════════════════════════════════════════════════════
# TOON devnet — Rust connector, RELAY box (issue #816, Shape A: one connector
# per box, each fronting its own app — decided on #714, tracked as #815)
# ═══════════════════════════════════════════════════════════════════════════
#
# ── What this file is ───────────────────────────────────────────────────────
# The relay app (`relay:3100`) used to sit on the apex box, fronted by the
# apex's own connector as a LOCAL app route. It now runs on THIS box
# (docker-compose.relay.yml), and this connector terminates `g.toon.relay`
# against it — co-located, instead of reached across the apex's container
# network.
#
# **No `[[peers]]`/`[[peer_channels]]` any more, as of issue #872.** Issue
# #820 gave this box a BTP peering to the apex (peer id `apex-relay`, backed
# by a real on-chain payment channel issue #821 opened and funded), so the
# apex could dial in and forward `g.toon.relay` here rather than terminating
# it itself. The apex is gone (toon-meta#310 / toon-meta#313's live cutover),
# and with it the only counterparty that ever dialed this peering, so
# `peer_expose` and both tables are removed rather than left pointing at
# nothing. With no hop, there is no fee and no peer arrival, so the F03
# peer-arrival case this table used to make possible cannot arise on this box
# any more. `transport = "btp"` stays on this file's own terminating route
# below (issue #701's rationale, unaffected by the peering's removal).
#
# ── Settlement ─────────────────────────────────────────────────────────────
# Deliberately identical to the store box's (infra/linode-store/) -- and,
# while it still ran, the apex's (infra/linode-node/, removed by issue #872):
# the same Base Sepolia `TokenNetworkRegistry` and USDC, the same Solana
# payment-channel program and mint, both at 6 decimals. A claim resolves
# against one deployment, so every node that might ever accept one has to
# agree on which. This box's client edge already accepts unaffiliated
# buyers' own on-chain channels (issue #556/#611), and those buyers pick the
# deployment by what the fleet advertises, not by which box answers.
#
# `decimals = 6` is checked against the token's own on-chain `decimals()` at
# startup and a disagreement refuses the boot (#564), so a stale value here is
# a loud failure rather than a mispriced route.
#
# ── Key provisioning ────────────────────────────────────────────────────────
# Three key files, all this box's own, mounted read-only by the overlay
# (docker-compose.relay.rust.yml). Unlike the store box, this is a genuinely
# NEW box with no pre-existing TypeScript settlement identity to reproduce —
# there is no legacy `connector.yaml` on this box to match addresses with —
# so all three are FRESH material, provisioned per
# deploy/connector-rust/README.md step 1 (`openssl rand -hex 32`) from this
# box's own TOON_MNEMONIC, and funded once generated (#821, human: SSH, new
# identity, funds, DNS, certs).
# ═══════════════════════════════════════════════════════════════════════════

client_edge_addr = "0.0.0.0:4000"

# Durable claim watermarks (#605): the journals whose replay is what makes a
# claim watermark survive a restart. Backed by the `connector_rust_state`
# named volume in docker-compose.relay.rust.yml.
state_dir = "/app/state"

[signer]
key_file = "/app/data/signer.key"

# ── Announce (issue #843, repo half of #815) ────────────────────────────────
# This box's own kind:10032 publisher, so `g.toon.relay` is discoverable
# under THIS node's identity -- the same `[signer]` key that answers `GET
# /ilp/identity` and opens every gift wrap this node terminates (ADR 0018).
# Mirrors the store's own publisher (issue #833,
# infra/linode-store/connector-rust.toml's [announce] section), which fixed
# the identical defect for `g.toon.ario`: a stock client that reads an
# announce published under a FORWARDER's identity seals its gift wrap to a
# key the TERMINATING node does not hold, pays at the client edge, and is
# refused `F01 gift wrap could not be opened` -- after the money is spent.
#
# `identity_key_file` (issue #870, toon-meta#310's apex-retirement spec)
# CARRIES OVER the retired apex's announce identity, reversing the reasoning
# this comment used to give for leaving the field absent: the genesis peer
# seed baked into published `@toon-protocol/core` pins the apex announcer
# sidecar's pubkey (`30fdd01d…` -- the key that sidecar read via
# `ANNOUNCER_IDENTITY_SECRET_KEY_FILE`, whose in-container path
# `/app/data/announce.key` was bind-mounted from the apex host's
# `/root/keys/announce.key` -- that box, and the compose file that mounted
# it, are gone as of issue #872), not this box's `[signer]`. Now that the
# apex is retired, this box is the fleet's public front, so it must sign
# `g.toon.relay`'s announce under that SAME pubkey --
# docs/operators/announcing-a-node.md's "carry over a durable Nostr
# identity" case exactly, and the reason every already-deployed client can
# repair itself without an update: it already trusts this author, and only
# needs to learn the new endpoints.
#
# `/app/data/announce.key` is a box-local file this line names but does not
# supply -- like every other key_file in this section, real key material is
# never committed (`infra/linode-relay/*.key` in .gitignore). It must hold
# the EXACT bytes of the retired apex's `/root/keys/announce.key`, extracted
# and copied verbatim before the apex was destroyed (toon-meta#310 Wave B,
# issue #311): the Rust reader accepts either 64-hex or 32 raw bytes, so no
# reformatting is needed. Until that copy lands, this box has no file at
# that path and refuses to boot (`AnnounceIdentityKeyFileNotFound`), which
# is why the compose overlays that mount it (docker-compose.relay.rust.yml,
# docker-compose.relay.announce.yml) are part of this same change: the
# mount and the config line must land together or neither does anything.
# The key itself is set below, inside the `[announce]` table proper -- a
# bare `key = value` up here, under the `[signer]` header this comment
# block sits below, would be read as a `[signer]` key instead and refused.
#
# Unlike the store, `relay_url` IS set here: this box fronts the relay app
# (docker-compose.relay.yml's `relay` service, port 7100 behind this box's
# own nginx) and genuinely serves free reads, so the announce says so.
# `relay-ws.devnet.toonprotocol.dev` is this box's OWN nginx's name for that
# service (./nginx/conf.d/node.conf) -- the same public name the apex's
# announcer sidecar used to advertise (`ANNOUNCER_RELAY_PUBLIC_URL`) before
# the DNS move (#815 constraint 4, #820/#821) repointed it here and the apex
# was destroyed (issue #872).
#
# `publish_to`, `publish_btp_url` and `pay_channel` are all deliberately
# ABSENT -- and unlike the store's omissions above, this is not "not yet
# provisioned", it is "does not apply". Those three fields describe PAYING
# THROUGH somebody else's client edge to reach a prefix this node does not
# terminate (the store's shape: it announces `g.toon.ario` by paying the
# relay box). This node terminates `g.toon.relay` itself (see `[[routes]]`
# below), so its scheduled announce (docker-compose.relay.announce.yml)
# runs `--via-own-routing --to g.toon.relay` against its OWN client edge
# instead of the default pay-the-URL path -- the packet is handed straight
# to this node's own `handle_prepare` rather than to `pay_the_through_url`
# (`crates/connector-cli/src/announce.rs`'s `via_own_routing` branch), so it
# never leaves this process: there is nobody to pay and no through-address to
# name. Per docs/operators/announcing-a-node.md's "Routing it yourself",
# `--via-own-routing` replaces the funded-channel requirement with "a
# [[routes]] entry reaching the destination", which this file already has.
#
# `notice_id`/`notice_severity`/`notice_summary`/`notice_url` (issue #948,
# re-homed from toon-meta#335) put the two-box-cutover operator notice on the
# wire via the schema'd `notice` field (toon#183, issue #912) -- the
# permanent mechanism, not toon-meta#335's retired content ride-along. The
# durable text lives at `notice_url`, in toon-meta's own
# `docs/operators/2026-08-13-two-box-cutover.md`; this box's announce carries
# only the pointer, per that doc's own convention
# (`docs/operators/README.md` in toon-meta). `severity` is
# `action-required`: a client that only ever uploads to the store has
# something it must do once the cutover runs (get an updated client), so
# doing nothing is not always safe.
#
# `route_publish`/`route_store` are PINNED, not left to derive -- issue #845,
# the same class of defect #841 pinned shut on the TypeScript sidecar's
# ANNOUNCER_ROUTE_STORE. `derive_route_hints` (crates/connector-config/src/
# announce.rs) first looks for a `.store`/`.ario` address in `addresses`
# above; this box's list is just `["g.toon.relay"]`, so it falls through to
# suffix surgery -- strip `.relay` off the one address it has and append
# `.store` -- inventing `g.toon.store`, a prefix NOTHING on this fleet
# routes (the store prefix is `g.toon.ario`). A client that takes that
# unpinned `routes.store` hint at face value has nowhere to upload. Pinning
# both here the way the store box's own address already does implicitly
# (`g.toon.ario` matches the `.ario` branch directly, so it never reaches
# the fallback) is load-bearing: do not remove either key without also
# removing the reason `derive_route_hints` would misfire without it.
[announce]
addresses         = ["g.toon.relay"]
http_endpoint     = "https://proxy.relay.devnet.toonprotocol.dev/ilp"
btp_endpoint      = "wss://proxy.relay.devnet.toonprotocol.dev/ilp/btp"
relay_url         = "wss://relay-ws.devnet.toonprotocol.dev"
identity_key_file = "/app/data/announce.key"
route_publish     = "g.toon.relay"
route_store       = "g.toon.ario"
notice_id         = "2026-08-13-two-box-cutover"
notice_severity   = "action-required"
notice_summary    = "The devnet apex is being retired; reads and relay publishing repair themselves, but store uploads need a client released after the cutover."
notice_url        = "https://github.com/toon-protocol/toon-meta/blob/main/docs/operators/2026-08-13-two-box-cutover.md"

# ── Routes ─────────────────────────────────────────────────────────────────

[[routes]]
prefix = "g.toon.relay"
# `/write`, not the bare origin: `HttpAppClient::deliver` POSTs here, and the
# relay app serves only `POST /write` and `GET /health`. A bare
# `http://relay:3100` -- the same gap the apex's own route hit on first
# deploy (#492) -- does NOT come back as an F99 reject. Under ADR 0020 a
# non-2xx from the app is a real answer that consumed real work, so it rides
# home on a FULFILL with `status: 404` and the payer is charged in full for
# nothing (`crates/connector-runtime/src/connector.rs`'s `AppOutcome::Answered`
# arm; `crates/connector-bin/tests/local_stack_rehearsal.rs` spells this out).
# There is no reject and no alarm -- misconfiguring this path silently
# charges payers, it does not fail loudly.
handler_url = "http://relay:3100/write"
# 1 micro-USDC per relay write -- while the apex still forwarded this prefix
# it charged the same price for it (owner decision 2026-08-04, now history:
# infra/linode-node/ was removed by issue #872). The relay carries the buzz
# huddles workload — per-audio-frame at 49 fps —
# and 1 micro-USDC is the coherent per-frame price; a general-write price is
# the wrong frame for this route. `docs/devnet-pricing.md` is the committed
# source of truth for every route's price and rationale.
price = 1
# Issue #701 (toon-meta#262 decision 11): the relay is high-frequency and
# latency-sensitive with an always-connected client — huddles already run
# 49 fps over BTP, and a persistent session amortizes the handshake and claim
# round trip an HTTP one-shot would pay on every write.
transport = "btp"

