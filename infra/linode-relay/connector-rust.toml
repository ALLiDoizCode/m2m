# ═══════════════════════════════════════════════════════════════════════════
# TOON devnet — Rust connector, RELAY box (issue #816, Shape A: one connector
# per box, each fronting its own app — decided on #714, tracked as #815)
# ═══════════════════════════════════════════════════════════════════════════
#
# ── What this file is ───────────────────────────────────────────────────────
# The relay app (`relay:3100`) used to sit on the apex box, fronted by the
# apex's own connector as a LOCAL app route. It now runs on THIS box
# (docker-compose.relay.yml), and this connector terminates `g.toon.relay`
# against it — co-located, instead of reached across the apex's container
# network — while the apex forwards that prefix here over the peering below.
#
# **`[[peers]]` and `[[peer_channels]]` below, as of issue #820.** Peering
# this box to the apex needs a live on-chain payment channel between the two
# boxes' settlement identities -- issue #821 opened and funded one -- and the
# `[[peer_channels]]` row below carries the same clearly-marked PLACEHOLDER
# `channel_id`/`counterparty_key` convention `infra/linode-node/
# connector-rust.toml`'s `apex-store` row uses: this repo never commits a
# peering's live facts (see that row's own comment for why), so the real
# values #821 already produced are applied directly to both boxes' untracked
# files as part of #820's live cutover, not committed here.
#
# The apex's `g.toon.relay` route is now a `peer_id` forward to this box
# (issue #820), and `transport = "btp"` has moved down to this file's own
# terminating route below -- a `peer_id` route cannot carry `transport`
# (`ConfigError::PeerRouteHasTransport`); a persistent BTP session actually
# terminates here now, which is why issue #701's rationale lives on this
# route rather than the apex's any more.
#
# ── Settlement ─────────────────────────────────────────────────────────────
# Deliberately identical to both other boxes' (infra/linode-node/,
# infra/linode-store/): the same Base Sepolia `TokenNetworkRegistry` and USDC,
# the same Solana payment-channel program and mint, both at 6 decimals. A
# claim resolves against one deployment, so every node that might ever accept
# one has to agree on which. That holds independently of the apex<->relay
# `[[peer_channels]]` row above: this box's client edge already accepts
# unaffiliated buyers' own on-chain channels (issue #556/#611), and those
# buyers pick the deployment by what the fleet advertises, not by which box
# answers — so this section was live from day one, before the peering existed.
#
# `decimals = 6` is checked against the token's own on-chain `decimals()` at
# startup and a disagreement refuses the boot (#564), so a stale value here is
# a loud failure rather than a mispriced route.
#
# ── Key provisioning ────────────────────────────────────────────────────────
# Three key files, all this box's own, mounted read-only by the overlay
# (docker-compose.relay.rust.yml). Unlike the store box, this is a genuinely
# NEW box with no pre-existing TypeScript settlement identity to reproduce —
# there is no legacy `connector.yaml` on this box to match addresses with —
# so all three are FRESH material, provisioned per
# deploy/connector-rust/README.md step 1 (`openssl rand -hex 32`) from this
# box's own TOON_MNEMONIC, and funded once generated (#821, human: SSH, new
# identity, funds, DNS, certs).
# ═══════════════════════════════════════════════════════════════════════════

client_edge_addr = "0.0.0.0:4000"

# Durable claim watermarks (#605): the journals whose replay is what makes a
# claim watermark survive a restart. Backed by the `connector_rust_state`
# named volume in docker-compose.relay.rust.yml.
state_dir = "/app/state"

# ── The g.toon proxy<->relay peering (issue #820, Shape A -- #815) ────────
# This box is the ACCEPTING half: it exposes a BTP listener and never dials.
# The g.toon proxy is the dialing half and carries the `endpoint`
# (infra/linode-node/connector-rust.toml).
#
# `peer_expose` is a bare top-level key, so it lives up here with
# `client_edge_addr` and `state_dir` rather than next to the `[[peers]]`
# table it configures -- written after any table header it would be read as
# a key OF that table and refused. Mirrors
# infra/linode-store/connector-rust.toml's identical placement.
peer_expose = "btp"

# The peering's shared secret is a FILE, same handling as the store peering:
# `infra/linode-relay/*.secret` is gitignored, so the peering is tracked and
# only the bytes stay on the box.
[[peers]]
id = "apex-relay"
credential = { secret_file = "/app/data/apex-relay.secret" }
# No `endpoint`: this node accepts and never dials -- exactly why `ceiling`
# is REQUIRED rather than optional here (`AcceptOnlyPeerWithoutCeiling`, an
# accept-only peering cannot flush on its own initiative). 1 USDC, matching
# the store box's own accept-only peering.
ceiling = 1000000

# Role is decided by authentication AND a channel binding (peer-carriage-spec
# 1.2, ADR 0024). Without this row the g.toon proxy authenticates fine, is
# admitted only as an ordinary client, and every claim it sends is refused
# `unknown_channel`.
[[peer_channels]]
peer_id = "apex-relay"
# PLACEHOLDER (issue #820) -- see infra/linode-node/connector-rust.toml's
# matching row for the full explanation. Issue #821 already opened and
# funded the real channel (channel_id 0x62c81d83bf0bda1af54233fa92cae0c287e
# 34838fb3434e6911d289dba6fa3fa); its real facts are applied directly to
# both boxes' untracked files as part of #820's live cutover, not committed
# here.
channel_id = "0xdeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeadbeef"
counterparty_key = "0xdeaddeaddeaddeaddeaddeaddeaddeaddeadbeef"
chain_id = 84532
token_network = "0xa79C3b1dbcEA00a6d84735a134395D8eF6D6a478"

[signer]
key_file = "/app/data/signer.key"

# ── Announce (issue #843, repo half of #815) ────────────────────────────────
# This box's own kind:10032 publisher, so `g.toon.relay` is discoverable
# under THIS node's identity -- the same `[signer]` key that answers `GET
# /ilp/identity` and opens every gift wrap this node terminates (ADR 0018).
# Mirrors the store's own publisher (issue #833,
# infra/linode-store/connector-rust.toml's [announce] section), which fixed
# the identical defect for `g.toon.ario`: a stock client that reads an
# announce published under a FORWARDER's identity seals its gift wrap to a
# key the TERMINATING node does not hold, pays at the client edge, and is
# refused `F01 gift wrap could not be opened` -- after the money is spent.
#
# `identity_key_file` is deliberately ABSENT, for the same reason the store's
# is: this box has never had a kind:10032 publisher of its own (no sidecar,
# no prior `connector announce`), and the genesis peer seed pins the g.toon
# proxy's announcer pubkey, not this box's. Announcing under this node's own
# `[signer]` is correct from the start and strands nobody.
#
# Unlike the store, `relay_url` IS set here: this box fronts the relay app
# (docker-compose.relay.yml's `relay` service, port 7100 behind this box's
# own nginx) and genuinely serves free reads, so the announce says so.
# `relay-ws.devnet.toonprotocol.dev` is this box's OWN nginx's name for that
# service (./nginx/conf.d/node.conf) -- the same public name the apex's
# announcer sidecar advertises today (`ANNOUNCER_RELAY_PUBLIC_URL`,
# infra/linode-node/docker-compose.node.announcer.yml), which still resolves
# to the apex box until the DNS move (#815 constraint 4, #820/#821 --
# NOT this file's scope, and NOT done by committing this section).
#
# `publish_to`, `publish_btp_url` and `pay_channel` are all deliberately
# ABSENT -- and unlike the store's omissions above, this is not "not yet
# provisioned", it is "does not apply". Those three fields describe PAYING
# THROUGH somebody else's client edge to reach a prefix this node does not
# terminate (the store's shape: it announces `g.toon.ario` by paying the
# g.toon proxy, which does not terminate that prefix either). This node
# terminates `g.toon.relay` itself (see `[[routes]]` below), so its
# scheduled announce (docker-compose.relay.announce.yml) runs
# `--via-own-routing --to g.toon.relay` against its OWN client edge instead
# of the default pay-the-URL path -- the packet is handed straight to this
# node's own `handle_prepare` rather than to `pay_the_through_url`
# (`crates/connector-cli/src/announce.rs`'s `via_own_routing` branch), so it
# never leaves this process: there is nobody to pay and no through-address to
# name. Per docs/operators/announcing-a-node.md's "Routing it yourself",
# `--via-own-routing` replaces the funded-channel requirement with "a
# [[routes]] entry reaching the destination", which this file already has.
#
# This announce does not depend on the `[[peer_channels]]` row below either,
# even though this file has one as of issue #820: that table funds the
# apex<->relay PEERING, which is a separate fact from this announce's own
# `--via-own-routing` path -- there is nobody to pay here regardless of
# whether the peering is funded. Do not add a placeholder channel id to make
# this section "complete" -- there is nothing for one to pay.
#
# `route_publish`/`route_store` are PINNED, not left to derive -- issue #845,
# the same class of defect #841 pinned shut on the TypeScript sidecar's
# ANNOUNCER_ROUTE_STORE. `derive_route_hints` (crates/connector-config/src/
# announce.rs) first looks for a `.store`/`.ario` address in `addresses`
# above; this box's list is just `["g.toon.relay"]`, so it falls through to
# suffix surgery -- strip `.relay` off the one address it has and append
# `.store` -- inventing `g.toon.store`, a prefix NOTHING on this fleet
# routes (the store prefix is `g.toon.ario`). A client that takes that
# unpinned `routes.store` hint at face value has nowhere to upload. Pinning
# both here the way the store box's own address already does implicitly
# (`g.toon.ario` matches the `.ario` branch directly, so it never reaches
# the fallback) is load-bearing: do not remove either key without also
# removing the reason `derive_route_hints` would misfire without it.
[announce]
addresses     = ["g.toon.relay"]
http_endpoint = "https://proxy.relay.devnet.toonprotocol.dev/ilp"
btp_endpoint  = "wss://proxy.relay.devnet.toonprotocol.dev/ilp/btp"
relay_url     = "wss://relay-ws.devnet.toonprotocol.dev"
route_publish = "g.toon.relay"
route_store   = "g.toon.ario"

# ── Routes ─────────────────────────────────────────────────────────────────

[[routes]]
prefix = "g.toon.relay"
# `/write`, not the bare origin: `HttpAppClient::deliver` POSTs here, and the
# relay app serves only `POST /write` and `GET /health`. A bare
# `http://relay:3100` comes back F99 "app declined the delivery with HTTP
# 404" — the same gap the apex's own route hit on first deploy (#492).
handler_url = "http://relay:3100/write"
# 1 micro-USDC per relay write, matching the apex's live price for this
# prefix (infra/linode-node/connector-rust.toml, owner decision 2026-08-04).
# The relay carries the buzz huddles workload — per-audio-frame at 49 fps —
# and 1 micro-USDC is the coherent per-frame price; a general-write price is
# the wrong frame for this route. `docs/devnet-pricing.md` is the committed
# source of truth for every route's price and rationale.
price = 1
# Issue #701 (toon-meta#262 decision 11): the relay is high-frequency and
# latency-sensitive with an always-connected client — huddles already run
# 49 fps over BTP, and a persistent session amortizes the handshake and claim
# round trip an HTTP one-shot would pay on every write.
transport = "btp"

# ── Settlement ─────────────────────────────────────────────────────────────

[settlement.evm]
