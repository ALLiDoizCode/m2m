# ═══════════════════════════════════════════════════════════════════════════
# TOON devnet — rolling-swap MAKER sidecar, RELAY box (issue #983, connector-
# infra half of toon-meta#402; the runtime image itself is
# toon-protocol/swap#124)
# ═══════════════════════════════════════════════════════════════════════════
# This is committed infra only. Bringing it up on the live box (generating
# the on-box identity, funding gas, opening the leg-B channel, running
# `docker compose ... up -d swap-node`) is a HUMAN step —
# docs/operators/swap-node-bringup.md. Nothing here makes a live-box change
# by itself.
#
# ── Why this box, and why a sidecar rather than a peering ──────────────────
# toon-meta#402's routing-feasibility finding: the maker is TypeScript, the
# fleet's connector is Rust, and the maker's TS peer validator rejects the
# relay's path-ful BTP URL — so the maker cannot dial the relay as a BTP
# child, and the relay cannot push to a maker it can't hold a session to.
# The proven model instead (swap#105) is DIRECT DIAL: a client reaches this
# maker by dialing its own public `wss://…/ilp/btp` from its kind:10032
# announce, never through the relay's routing table. Co-located on the relay
# box because that is the box this maker announces THROUGH (see
# ./docker-compose.relay.swap-announce.yml) — not because the relay's own
# connector-rust routes anything to it. No `[[peers]]`/`[[routes]]` entry on
# infra/linode-relay/connector-rust.toml names this service, and none should.
#
# ── Run alongside the relay's Rust edge (never on its own) ─────────────────
#   docker compose -f infra/linode-relay/docker-compose.relay.yml \
#                  -f infra/linode-relay/docker-compose.relay.rust.yml \
#                  -f infra/linode-relay/docker-compose.relay.swap.yml \
#                  up -d swap-node
#
# ── The image tag is pinned by immutable sha ────────────────────────────────
# `sha-785b117` is the maker runtime image `publish-swap-image.yml` pushed on
# the merge of toon-protocol/swap#126 (as PR swap#127) — the release that
# added SWAP_AUTOGEN_IDENTITY (below). The publish tags
# `ghcr.io/toon-protocol/swap` as `sha-<short-sha>` (immutable) and `main`
# (floating, default-branch only); we pin the immutable `sha-` tag, mirroring
# how this box's own `connector-rust` image is pinned by sha
# (docker-compose.relay.rust.yml's own comment on `EXPECTED_CONNECTOR_TAG`).
# Bump this line to a newer `sha-` tag when adopting a newer maker build.
#
# ── Identity + key material — self-generated on-box, never committed ────────
# No mounted key file any more. `SWAP_AUTOGEN_IDENTITY=1` (set in
# `environment:` below; toon-protocol/swap#126, merged as swap#127) makes the
# maker generate a FRESH BIP-39 mnemonic on first boot and persist it to an
# identity file on the `swap_node_state` volume — idempotent, so a restart
# reuses the SAME identity (funds are tied to it). Nothing is generated by
# hand, copied onto the box, or committed: the node makes its own keys (owner
# directive, toon-meta#402 — these are devnet test funds). The command below
# invokes `node /app/dist/cli.js --config` directly (not the `toon-swap` bin):
# swap#126's runtime Dockerfile has its ENTRYPOINT do the same from WORKDIR
# `/app` and never puts `node_modules/.bin` on PATH, so `toon-swap` is not
# guaranteed to resolve as a bare command — matching the Dockerfile's own
# invocation is the one assumption this file makes about the image.
#
# The SAME self-generated mnemonic derives BOTH identities this maker needs
# (toon-meta#402):
#   * index 0 (NIP-06) — the Nostr/node identity `ilpAddress`'s pubkey and
#     the kind:10032 announce are signed under (see
#     ./docker-compose.relay.swap-announce.yml's `[signer]`);
#   * index 2 (BIP-44, D12-011) — the EVM settlement key that signs leg-B
#     RollingSwapChannel claims and pays for the maker's own announce writes.
#     swap#126 auto-derives this index-2 key into `swap.config.json`'s
#     `settlementPrivateKey` at boot (replacing that file's `0xdead…`
#     placeholder), and console.logs the index-0 pubkey + index-2 EVM address
#     once so an operator can fund the settlement address and open its leg-B
#     channel.
#
# NOTE (toon-meta#402, unresolved): the sibling paid-announce overlay
# ./docker-compose.relay.swap-announce.yml still reads the maker identity from
# standalone key FILES (`./swap-signer.key`, `./swap-settlement.key`) that the
# autogen model does NOT produce — the mnemonic lives only inside this
# container's state volume. Announcing an autogen'd maker needs a follow-up
# design decision (either have the maker also write those raw scalar files to
# the shared state volume, or self-announce via the embedded ILP connector).
# This file changes only the maker sidecar; the announce overlay is untouched.
#
# ── Loopback-only BTP port, same reasoning as every other box service ──────
# A Docker `ports:` publish is reachable from the internet regardless of
# ufw (Docker's iptables chain runs ahead of it) — binding to 127.0.0.1
# means the only public path in is through this box's nginx
# (./nginx/conf.d/node.conf's `/swap/ilp/btp` and `/swap/ilp` locations),
# which can log and rate-limit it. `3400` matches the SDK's own
# `btpServerPort` default and toon-meta#402's proven rig. `8080` is the
# `/health` port (`blsPort` in swap.config.json) — loopback only, for
# on-box diagnostics; nothing public proxies it (out of this issue's scope).
# ═══════════════════════════════════════════════════════════════════════════

services:
  swap-node:
    image: ghcr.io/toon-protocol/swap:sha-785b117
    # SWAP_AUTOGEN_IDENTITY (toon-protocol/swap#126, merged as swap#127): the
    # maker self-generates a fresh BIP-39 mnemonic on FIRST boot, persists it
    # to an identity file on the `swap_node_state` volume below (idempotent —
    # every later boot reuses the SAME identity, since funds are tied to it),
    # derives its BIP-44 account-index-2 EVM key into `settlementPrivateKey`
    # (replacing swap.config.json's `0xdead…` placeholder), and console.logs
    # its index-0 Nostr pubkey + index-2 EVM settlement address once on boot
    # so an operator can fund the settlement address and open its leg-B
    # channel. This replaces the previous mounted-mnemonic-file model: no
    # human key handling — the node makes its own keys on-box (owner directive,
    # toon-meta#402: devnet test funds). No `./swap-mnemonic.secret` mount any
    # more; a restart keeps the same identity via the state volume.
    environment:
      SWAP_AUTOGEN_IDENTITY: '1'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        exec node /app/dist/cli.js --config /app/config/swap.config.json
    volumes:
      - ./swap.config.json:/app/config/swap.config.json:ro
      # A fresh named volume is root-owned by default; the container runs as
      # uid 10001 (`swap`, per toon-protocol/swap#125's merged Dockerfile)
      # and needs to write its boot snapshot to `statePath`
      # (swap.config.json's `/app/state/swap-node-state.json`, matching this
      # mount point exactly). Resolved image-side, not here: that Dockerfile
      # creates and chowns `/app/state` before its `USER swap` line, so a
      # fresh volume inherits the right ownership on first mount. If that
      # ever regresses,
      # the belt-and-braces fallback is a host bind mount pre-chowned the
      # same `chown 10001:10001` way docs/operators/swap-node-bringup.md
      # already has a human do for the key files, in place of this named
      # volume.
      - swap_node_state:/app/state
    ports:
      - '127.0.0.1:3400:3400'
      - '127.0.0.1:8080:8080'
    restart: unless-stopped

volumes:
  swap_node_state:
