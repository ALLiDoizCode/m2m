# ═══════════════════════════════════════════════════════════════════════════
# TOON devnet — rolling-swap MAKER sidecar, RELAY box (issue #983, connector-
# infra half of toon-meta#402; the runtime image itself is
# toon-protocol/swap#124)
# ═══════════════════════════════════════════════════════════════════════════
# This is committed infra only. Bringing it up on the live box (generating
# the on-box identity, funding gas, opening the leg-B channel, running
# `docker compose ... up -d swap-node`) is a HUMAN step —
# docs/operators/swap-node-bringup.md. Nothing here makes a live-box change
# by itself.
#
# ── Why this box, and why a sidecar rather than a peering ──────────────────
# toon-meta#402's routing-feasibility finding: the maker is TypeScript, the
# fleet's connector is Rust, and the maker's TS peer validator rejects the
# relay's path-ful BTP URL — so the maker cannot dial the relay as a BTP
# child, and the relay cannot push to a maker it can't hold a session to.
# The proven model instead (swap#105) is DIRECT DIAL: a client reaches this
# maker by dialing its own public `wss://…/ilp/btp` from its kind:10032
# announce, never through the relay's routing table. Co-located on the relay
# box because that is the box this maker announces THROUGH (see
# ./docker-compose.relay.swap-announce.yml) — not because the relay's own
# connector-rust routes anything to it. No `[[peers]]`/`[[routes]]` entry on
# infra/linode-relay/connector-rust.toml names this service, and none should.
#
# ── Run alongside the relay's Rust edge (never on its own) ─────────────────
#   docker compose -f infra/linode-relay/docker-compose.relay.yml \
#                  -f infra/linode-relay/docker-compose.relay.rust.yml \
#                  -f infra/linode-relay/docker-compose.relay.swap.yml \
#                  up -d swap-node
#
# ── The image tag is a PENDING placeholder ──────────────────────────────────
# `PENDING-swap-124` names no real image. toon-protocol/swap#124 (GHCR
# publish workflow for the maker runtime) had not landed a pushed tag as of
# this change — see that issue for the moving/sha tag convention this line
# must be repointed to once it does, mirroring how this box's own
# `connector-rust` image is pinned by sha
# (docker-compose.relay.rust.yml's own comment on `EXPECTED_CONNECTOR_TAG`).
# `docker compose config` validates this file's shape without resolving the
# tag — Compose does not need the image to exist to parse the file — but
# `up -d swap-node` will fail to pull until this is repointed.
#
# ── Identity + key material — generated on-box, never committed ────────────
# `./swap-mnemonic.secret` is a BIP-39 mnemonic, the SAME convention
# `infra/linode-relay/.env.example`'s `TOON_MNEMONIC` already documents for
# this box's own connector identity: fresh material, generated ON this box,
# never copied from anywhere else and never committed (`.gitignore` covers
# `infra/linode-relay/*.secret`). The entrypoint below reads it into
# `SWAP_MNEMONIC` rather than relying on an image-side `_FILE` convention
# this container's own entrypoint may or may not support — swap#124's own
# text only commits to "a mounted file or SWAP_MNEMONIC", so this file does
# the file-to-env bridge itself and calls `toon-swap --config` directly,
# which is guaranteed correct regardless of what the image's default
# ENTRYPOINT ends up being.
#
# The SAME mnemonic derives BOTH identities this maker needs (toon-meta#402):
#   * index 0 (NIP-06) — the Nostr/node identity `ilpAddress`'s pubkey and
#     the kind:10032 announce are signed under (see
#     ./docker-compose.relay.swap-announce.yml's `[signer]`);
#   * index 2 (BIP-44, D12-011) — the EVM settlement key that signs leg-B
#     RollingSwapChannel claims and pays for the maker's own announce
#     writes. `swap.config.json`'s `settlementPrivateKey` is a committed
#     PLACEHOLDER (see that file's own comment) — a human must derive this
#     key from the on-box mnemonic and set it in a box-local, uncommitted
#     copy of the config before this maker can issue a redeemable claim.
#
# ── Loopback-only BTP port, same reasoning as every other box service ──────
# A Docker `ports:` publish is reachable from the internet regardless of
# ufw (Docker's iptables chain runs ahead of it) — binding to 127.0.0.1
# means the only public path in is through this box's nginx
# (./nginx/conf.d/node.conf's `/swap/ilp/btp` and `/swap/ilp` locations),
# which can log and rate-limit it. `3400` matches the SDK's own
# `btpServerPort` default and toon-meta#402's proven rig. `8080` is the
# `/health` port (`blsPort` in swap.config.json) — loopback only, for
# on-box diagnostics; nothing public proxies it (out of this issue's scope).
# ═══════════════════════════════════════════════════════════════════════════

services:
  swap-node:
    image: ghcr.io/toon-protocol/swap:PENDING-swap-124
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        export SWAP_MNEMONIC="$$(cat /app/keys/swap-mnemonic)"
        exec toon-swap --config /app/config/swap.config.json
    volumes:
      - ./swap.config.json:/app/config/swap.config.json:ro
      # Raw BIP-39 mnemonic, FRESH on-box material (see header) — never
      # committed. `deploy/connector-rust/README.md` step 1's
      # `openssl rand -hex 32` convention does not apply here: this needs a
      # MNEMONIC (SWAP_MNEMONIC), not a raw scalar, because the SDK derives
      # both the Nostr identity and the index-2 settlement key from one
      # phrase (D12-011). Generate with any BIP-39 tool that supports
      # account-index derivation and never let the phrase leave this box.
      - ./swap-mnemonic.secret:/app/keys/swap-mnemonic:ro
      - swap_node_state:/app/state
    ports:
      - '127.0.0.1:3400:3400'
      - '127.0.0.1:8080:8080'
    restart: unless-stopped

volumes:
  swap_node_state:
