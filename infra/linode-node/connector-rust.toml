# ═══════════════════════════════════════════════════════════════════════════
# TOON devnet — Rust connector, apex/relay side (issue #490, ADR 0013's
# parallel fleet)
# ═══════════════════════════════════════════════════════════════════════════
# Runs ALONGSIDE ./connector.yaml's TypeScript node on this SAME box, under
# its own prefix and its own ports/paths — see docker-compose.node.rust.yml,
# an ADDITIVE overlay that never edits docker-compose.node.yml. Neither the
# relay app nor the store app is modified anywhere in this change: both are
# payment-oblivious (ADR 0013) and are fronted here exactly as they already
# are by the TypeScript node.
#
# ── Why `g.rust` ─────────────────────────────────────────────────────────
# The live TypeScript apex is `g.toon` — see ./connector.yaml's own `routes`
# (`g.toon.relay`, `g.toon.ario`) — NOT `g.proxy`. `g.proxy` is a name this
# fleet used to carry: it survives only in stale comments (devnet-manage.sh's
# header/route-guard, infra/linode-store/bootstrap.sh's echo line) that were
# never updated when the deployed route table moved to `g.toon`. `g.rust`
# shares no segment with either name, so no typo or stale-doc distance of one
# character turns one into the other — unambiguous in a log line at 3am,
# which is what the issue asked for.
#
# Children mirror the TypeScript fleet's own two-app shape without importing
# its Arweave-specific `.ario` naming:
#   g.rust.relay  — terminates locally at the SAME running relay app
#                   (relay:3100) this box's TypeScript connector already
#                   fronts.
#   g.rust.store  — forwarded to the store-side Rust connector (peer
#                   "store", below), which terminates it at the SAME running
#                   store app (store:3300) on the store box.
# ═══════════════════════════════════════════════════════════════════════════

# Distinct from the TypeScript node's 3000/8080/8081 (see
# docker-compose.node.rust.yml) — each connector runs in its own container
# network namespace, but the HOST ports both publish must not collide. One
# port serves everything here (client edge, /metrics, the operator surface),
# unlike the TypeScript node's three.
client_edge_addr = "0.0.0.0:4000"

# ── Durable claim state (issue #605) ──────────────────────────────────────
# Where this node writes the claim journals whose replay is what makes a
# replay watermark survive a restart. Without it, `ClientClaimGate` (and
# `ClaimBook`) keep every channel's watermark in process memory only, so a
# `docker compose up -d`, a crash or an OOM kill resets every channel to "no
# claim ever seen" -- and a gate with no watermark accepts any nonce, which
# makes every claim a client already spent free service again.
#
# This MUST be a mounted volume, not a path inside the container's writable
# layer: a path that dies with the container is a watermark that dies with
# the container, which is the same defect one indirection down. See
# ./docker-compose.node.rust.yml's `connector_rust_state` volume, and note
# the container runs as uid 10001 -- a named volume inherits that owner
# from the image's own /app/state, a bind mount of a host directory does
# not (`chown 10001:10001` it first).
#
# Config load refuses `[[client_channels]]` without this, and startup
# refuses to boot at all if the directory cannot be written -- loudly, with
# the path, rather than at the first claim hours later.
state_dir = "/app/state"

[signer]
# Real key material, generated per-box exactly like
# deploy/connector-rust/README.md's own step 1 (openssl rand -hex 32) —
# never committed (see .gitignore). Mounted read-only by
# docker-compose.node.rust.yml from ./signer-rust.key, a path distinct from
# the TypeScript node's `connector_data` volume.
key_file = "/app/data/signer.key"

# ── Peering with the store-side Rust connector ─────────────────────────────
# This apex only DIALS OUT to the store connector below — it never accepts
# an inbound peer connection itself, so no peer_wire_addr is set in this
# file.
#
# REPLACE 203.0.113.20 with the store box's **VPC** address once
# devnet-manage.sh has provisioned it — NOT its public IP. The peer wire is
# plaintext and unauthenticated (ADR 0003) and carries signed balance proofs
# (ADR 0004, #423), so #492 settled that it runs on a private segment only;
# docker-compose.store.rust.yml's header has the full reasoning and the
# store box publishes 4001 on that address alone. Dialing the store's public
# IP from here would work and would defeat the point.
#
# It is a documentation-only placeholder (RFC 5737 TEST-NET-3), chosen so
# this file is already a syntactically valid TOML file with a real
# SocketAddr (ADR 0009: a malformed peer addr is a refuse-to-start error),
# not so it is reachable. An unreachable peer is not a startup error —
# `NetworkPeerTransport` dials lazily on the first packet — so the apex
# serves `g.rust.relay` with this placeholder still in place, which is how
# it was deployed apex-first in #492. Port 4001 matches the store box's own
# connector-rust.toml peer_wire_addr.
[[peers]]
id = "store"
addr = "203.0.113.20:4001"

[[routes]]
prefix = "g.rust.relay"
# `/write`, not the bare origin: `HttpAppClient::deliver` POSTs here, and the
# relay app serves only `POST /write` and `GET /health`. A bare
# `http://relay:3100` comes back F99 "app declined the delivery with HTTP
# 404", which is what this route did when first deployed (#492).
#
# An envelope's own `target` cannot override this path (issue #596, ADR
# 0025): it is resolved strictly beneath `/write`, never in place of it, so
# a sender cannot address `/health` (or anywhere else) through this route at
# this route's price by naming it as the target.
#
# The path is only the half of the app-delivery gap that config can close.
# docs/operators/parallel-fleet-comparison.md has the rest.
handler_url = "http://relay:3100/write"
# Priced at parity with the TypeScript fleet's own g.toon.relay route on
# this same box (infra/linode-node/connector.yaml -- `price: '1000'`):
# both fleets settle claims in base units of 6-decimal USDC (ADR 0010;
# docs/usdc-cross-chain-settlement.md's "6 decimals everywhere" is the
# canonical unit across EVM/Solana/Mina, not a TypeScript-only asset
# config), so `1000` here is the identical real-world charge -- 0.001
# USDC -- as the TypeScript node already makes for the same relay write.
# #552 wired the x402 greeting behind this figure being non-zero; a
# devnet box started from this file was still a free gateway until this
# was set (issue #557).
price = 1000

[[routes]]
prefix = "g.rust.store"
peer_id = "store"
fee = 0

# ── Operator surface (optional) ─────────────────────────────────────────
# Omitted here deliberately: enabling it means committing (or securely
# injecting) a real bearer_token + write_keys, which this devnet overlay
# does not attempt to solve. Add an [operator] section per
# deploy/connector-rust/README.md steps 2-3 before relying on GET /metrics
# or the write surface on this node.

# ── Settlement (issue #542) — DELIBERATELY NOT CONFIGURED ───────────────
# There is no `[settlement]` section in this file, and there must not be one.
#
# `EvmSettlementBackend` drives `packages/contracts/src/TokenNetwork.sol` --
# the real, signature-verifying payment channel contract the live
# TypeScript fleet already settles through on Base Sepolia -- reached
# through a `TokenNetworkRegistry` factory (issue #566, issue #576).
# `crates/connector-settlement-evm/contracts/SettlementChannel.sol`, this
# crate's own throwaway, signature-unverified channel contract (issue #459,
# quarantined against accidental deployment by issue #568), is gone: there
# is nothing left to warn against deploying.
#
# The two states below are not symmetric, and that asymmetry is by design:
#
#   * ABSENT is a supported, deliberate configuration. The node starts and
#     serves; channel operations answer
#     `ChannelOperationError::NoSettlementBackend`, exactly the "not started
#     at all" shape an absent `[operator]` section already has. This devnet
#     fleet forwards packets for behavioural comparison against the
#     TypeScript fleet (see `price = 0` above); it settles nothing.
#
#   * PRESENT BUT WRONG is a hard startup failure, on purpose (ADR 0009,
#     fail-closed). `connector-cli::runtime::build` calls
#     `EvmSettlementBackend::connect`, which resolves `token_address`
#     through `contract_address`'s `TokenNetworkRegistry.getTokenNetwork`.
#     Against a registry with no `TokenNetwork` registered for that token
#     that resolves to the zero address, `connect` errors naming both
#     addresses, and the process exits 1 — it does NOT start with
#     settlement quietly disabled. A placeholder address is therefore not a
#     harmless "syntactically valid" filler here: it is the difference
#     between a node that boots and a node that does not.
#
#
# One further consequence, since issue #556: an absent `[settlement]`
# section is also the absence of a client-edge channel *source*. With no
# chain to ask, the only channels this node can accept a claim on are the
# ones a `[[client_channels]]` section declares -- so an unaffiliated buyer
# who opens a channel on chain cannot pay here until #577 fills the section
# below in. The mechanism is landed; this box is not yet pointed at a
# chain.
# The block below is the shape an operator will eventually fill in, once
# this box is meant to settle for real: `contract_address` names the
# `TokenNetworkRegistry`, not a channel contract directly (issue #576).
# `token_address` is already the real mock USDC `./connector.yaml` names,
# and `rpc_url` is that config's own known-good EVM RPC. That shape is not
# decoration — `crates/connector-bin/tests/devnet_configs_load.rs` uncomments
# this very block and boots it against a freshly deployed registry and
# `TokenNetwork` on a local anvil (the explicit test-only escape hatch), so
# it stays a template that actually works. #577 tracks actually shipping
# this section filled in against the live Base Sepolia deployment.
#
# --- BEGIN settlement template (uncomment when a contract is deployed) ---
# [settlement]
# chain = "evm"
# rpc_url = "https://base-sepolia-rpc.publicnode.com"
# # REPLACE the zero address with the deployed `TokenNetworkRegistry` address.
# contract_address = "0x0000000000000000000000000000000000000000"
# token_address = "0x49beE1Bca5d15Fb0963117923403F9498119a9Ce"
# # The scale the deployed token itself reports. Nothing scales by it --
# # claims are already in the token's base units -- but startup reads the
# # token's own `decimals()` and refuses to boot if the two disagree (issue
# # #564), so a stale value here is a refusal to start, not a silent no-op.
# decimals = 6
#
# [settlement.key]
# # Same key material as [signer] above -- this devnet overlay does not
# # separate "connector identity" from "settlement signer" (a real
# # deployment with different risk profiles for each might).
# key_file = "/app/data/signer.key"
# --- END settlement template ---
