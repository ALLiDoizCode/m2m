# ═══════════════════════════════════════════════════════════════════════════
# TOON devnet — Rust connector, g.toon proxy/relay side (issue #490, ADR 0013's
# parallel fleet)
# ═══════════════════════════════════════════════════════════════════════════
# Runs ALONGSIDE ./connector.yaml's TypeScript node on this SAME box, under
# its own prefix and its own ports/paths — see docker-compose.node.rust.yml,
# an ADDITIVE overlay that never edits docker-compose.node.yml. Neither the
# relay app nor the store app is modified anywhere in this change: both are
# payment-oblivious (ADR 0013) and are fronted here exactly as they already
# are by the TypeScript node.
#
# ── Why `g.toon` ─────────────────────────────────────────────────────────
# This fleet originally carried `g.rust`, ADR 0013's parallel prefix, chosen
# to be unmistakable next to the TypeScript fleet's `g.toon` while the two
# ran side by side for comparison. That comparison concluded 2026-07-30: the
# Rust connector carried a real paid write end to end on devnet (sealed
# wire, chain-resolved channel, durable claim journal), and the decision was
# taken that THIS is the official TOON relay implementation — so it now
# serves the protocol's own `g.toon` namespace. The TypeScript node on this
# box still terminates `g.toon.relay` on its own edge (:3000); the two route
# tables are per-edge, so the shared name is a statement of succession, not
# a wire conflict. `docs/operators/parallel-fleet-comparison.md` records the
# period when the prefixes differed — read `g.rust` there as historical.
#
# Children mirror the TypeScript fleet's own two-app shape:
#   g.toon.relay  — FORWARDED across the g.toon proxy<->relay peering (issue
#                   #820, Shape A -- #815) to the relay app's own box
#                   (infra/linode-relay/), which now terminates it. Until
#                   2026-08-07 this route terminated locally at the
#                   co-located relay app (relay:3100); that app has since
#                   moved to its own box and this box no longer runs one.
#   g.toon.ario   — terminates at the store box's running store app over
#                   that box's public TLS front (see below) under the name
#                   the TS fleet's kind:10032 announce advertises as its
#                   `routes.store` — which is the destination rig and the
#                   other announce-driven clients actually dial (#600).
#   g.toon.store  — the same store app under this fleet's own non-Arweave
#                   name, kept as an alias at the same price.
#
# ── The store leg is a TERMINATED route over a PUBLIC TLS link (#600) ─────
# The store box is another TOON node on the network, reached the way any
# peer on the open internet would be — so the inter-node link is public,
# carried over https and TLS-terminated by the store box's own nginx
# (proxy.ario.devnet.toonprotocol.dev — renamed from proxy.store on
# 2026-08-05, #774 — certbot-managed like this box's
# hosts), the same shape as the TypeScript fleet's connector↔connector
# links (BTP over wss://…:443). Both store routes below terminate at that
# public https URL; no private segment exists between the boxes and none
# is required.
#
# What this deliberately is NOT: the ADR 0003 peer wire with a store-side
# Rust connector behind it — twice over.
#
#   * The peer wire cannot carry a public link (issue #623): raw-TCP
#     custom framing (nothing nginx can TLS-terminate), no TLS of its own
#     by ADR 0003's design, and SocketAddr-only [[peers]] addressing with
#     nothing to hang a handshake on. It carries signed balance proofs
#     (ADR 0004), so exposing it plaintext on a public IP is not an
#     acceptable interim.
#   * The PAID forwarded path was structurally unwired when this leg was
#     terminated here (issue #620): the client edge priced only
#     locally-terminated routes, so a peer route greeted nothing and
#     charged nothing, and a peer-forwarded g.toon.store would have served
#     the store app FOR FREE end to end while this node paid the store box
#     out of its own channel. #678 wired ADR 0024's peer claims to config
#     and ADR 0028 gave a `peer_id` route a client-edge `price`, so the
#     client leg is now payable; what is still unwired is the far side --
#     a terminating connector does not charge its `price` for a peer-wire
#     arrival (issue #620's second gap).
#
# Terminating here instead puts the store leg on the same claim-gated
# client-edge path the proven g.toon.relay route uses (x402 greeting, F03
# underpayment, journaled watermark — issue #520's charging, #605's
# durability).
# ═══════════════════════════════════════════════════════════════════════════

# Distinct from the TypeScript node's 3000/8080/8081 (see
# docker-compose.node.rust.yml) — each connector runs in its own container
# network namespace, but the HOST ports both publish must not collide. One
# port serves everything here (client edge, /metrics, the operator surface),
# unlike the TypeScript node's three.
client_edge_addr = "0.0.0.0:4000"

# ── Durable claim state (issue #605) ──────────────────────────────────────
# Where this node writes the claim journals whose replay is what makes a
# replay watermark survive a restart. Without it, `ClientClaimGate` (and
# `ClaimBook`) keep every channel's watermark in process memory only, so a
# `docker compose up -d`, a crash or an OOM kill resets every channel to "no
# claim ever seen" -- and a gate with no watermark accepts any nonce, which
# makes every claim a client already spent free service again.
#
# This MUST be a mounted volume, not a path inside the container's writable
# layer: a path that dies with the container is a watermark that dies with
# the container, which is the same defect one indirection down. See
# ./docker-compose.node.rust.yml's `connector_rust_state` volume, and note
# the container runs as uid 10001 -- a named volume inherits that owner
# from the image's own /app/state, a bind mount of a host directory does
# not (`chown 10001:10001` it first).
#
# Config load refuses `[[client_channels]]` without this, and startup
# refuses to boot at all if the directory cannot be written -- loudly, with
# the path, rather than at the first claim hours later.
state_dir = "/app/state"

[signer]
# Real key material, generated per-box exactly like
# deploy/connector-rust/README.md's own step 1 (openssl rand -hex 32) —
# never committed (see .gitignore). Mounted read-only by
# docker-compose.node.rust.yml from ./signer-rust.key, a path distinct from
# the TypeScript node's `connector_data` volume.
key_file = "/app/data/signer.key"

[[routes]]
prefix = "g.toon.relay"
# ── FORWARDED ACROSS THE g.toon proxy<->relay PEERING (issue #820, Shape A,
# #815) ──────────────────────────────────────────────────────────────────
# Was `handler_url = "http://relay:3100/write"`, a route terminating
# locally at the relay app co-located on this box (#492's `/write`-not-
# bare-origin fix, and ADR 0025's target-cannot-override-the-path rule,
# both still apply -- just one hop further out now, on
# infra/linode-relay/connector-rust.toml's own copy of this same route).
# The relay app has moved to its own box (issues #816/#821); this box runs
# no relay app of its own any more, so there is nothing left here to point
# a `handler_url` at.
peer_id = "apex-relay"
# ADR 0028's arithmetic is `amount == price`: this hop collects `price` from
# the client, forwards `price - fee`, and so earns exactly `fee`.
#
# 1/0, OWNER DECISION 2026-08-06 (docs/devnet-pricing.md's "The g.toon.relay
# forward: price/fee split" section has the full argument, kept there
# rather than duplicated here per that file's own role as the committed
# source of truth for every route's price). Client cost is unchanged at 1
# micro-USDC/write -- this route carries the buzz huddles workload,
# per-audio-frame at 49 fps over BTP (toon-meta#262), and any non-zero fee
# here would force `price` above the relay's own terminating price of `1`,
# at minimum doubling the per-frame cost for a workload billed 49 times a
# second. The apex earns nothing for carriage on this leg, deliberately.
price = 1
fee = 0
# A `transport` pin is now ILLEGAL on this route: it forwards to a peer,
# and a `peer_id` route cannot also carry a transport policy
# (`ConfigError::PeerRouteHasTransport`,
# crates/connector-config/src/error.rs:125). Issue #701's BTP pin moves
# with the terminating side, to infra/linode-relay/connector-rust.toml's own
# `g.toon.relay` route, where the persistent-session rationale actually
# applies now. This apex therefore loses client-edge BTP enforcement on
# this prefix, and nothing downstream restores it: transport policy is a
# CLIENT-EDGE gate only (`connector-client-edge`'s `handle_ilp`/`handle_btp`),
# never re-checked on a peer-wire arrival (`Connector::handle_peer_prepare`
# gates on ceiling and price alone), and the apex's own carriage to the relay
# box is BTP regardless. So an HTTP client paying THIS box for
# `g.toon.relay` is served -- the relay box's own pin refuses only clients
# arriving directly at ITS client edge over HTTP. #701's pin is now a
# statement about the relay's direct edge, not about the prefix fleet-wide.

[[routes]]
prefix = "g.toon.ario"
# ── FORWARDED ACROSS THE g.toon proxy<->store PEERING (ADR 0028, #620/#678) ──
# Was `handler_url = "https://proxy.store.devnet.toonprotocol.dev/store"`.
# That reached the store box's nginx `location /store` and went STRAIGHT to
# store:3300, bypassing the store box's own connector entirely: this node
# charged, the store node earned nothing, and no claim was written. Retiring
# the TypeScript fleet on that topology would have moved the store leg from
# "paid and settled between two nodes" to "one node keeps the money".
#
# Now the packet crosses the peering below and the store box is paid for it
# with a real signed peer claim against the Base Sepolia channel in
# [[peer_channels]].
#
# This is the prefix that matters: buzz pins `storeDestination:
# "g.toon.ario"` in COMPILED code (desktop/src/shared/api/toonTransportConfig.ts),
# so it is the name a real client actually addresses.
peer_id = "apex-store"
# ADR 0028's arithmetic is `amount == price`: this hop collects `price` from
# the client, forwards `price - fee`, and so earns exactly `fee`.
#
# 1002, not 1000, DELIBERATELY. The store box terminates this prefix at its
# own committed `price = 1000`, so it must RECEIVE 1000; at 1000/fee 2 it
# would receive 998 -- under its own price. That was survivable only while
# issue #752 was open; #754 landed it, so a terminating connector now DOES
# charge its price for a peer-wire arrival and 998 would be refused. 1002 is
# correct now and stays correct. It raises the client's cost for this prefix
# from 1000 to 1002.
price = 1002
# What this hop retains for carriage (ADR 0010), matching the TypeScript
# fleet's own inter-node fee of 2 (visible live as 2000 -> 1998).
fee = 2

# ── `g.toon.store` is GONE (owner decision, 2026-08-05) ──────────────────
# This fleet used to carry a second prefix for the same store app, aliased at
# the same price so `insert_consistent_handler_price` would accept it. One
# name for one app is the decision; `g.toon.ario` is the survivor because it
# is the one compiled into a shipped client.
#
# A client that still addresses `g.toon.store` now gets F02 "no route to
# destination". Nothing advertised it: this box's announcer sidecar has never
# named it in `ANNOUNCER_ILP_ADDRESSES` (`g.toon` alone today, after #833 and
# #843), so this removes a name no discovery path hands out.

# ── The g.toon proxy<->store peering (ADR 0027, issues #678/#750) ─────────
# The fleet's first inter-node link (the apex<->relay peering below, issue
# #820, is its second), and what every g.toon.ario packet above rides. It
# lived on the boxes only until #750 gave `credential` a
# `secret_file`: this file is committed to a PUBLIC repository, so a peering
# written with a literal could not be committed at all.
#
# No `peer_expose` on this node, deliberately: the g.toon proxy DIALS and never
# accepts. The store box is the accepting half (`peer_expose = "btp"` in
# infra/linode-store/connector-rust.toml) and has no `endpoint` of its own.
[[peers]]
id = "apex-store"
# ONE string both operators write -- it is the `peerId` the dialing side puts
# in its credential, and the accepting side proves P1 by looking it up in its
# OWN [[peers]] table. A peering only establishes when both files carry the
# same literal.
#
# `proxy.ario`, not `proxy.store` -- the box's paid edge was renamed on
# 2026-08-05 to match the `g.toon.ario` prefix it serves. The old name still
# resolves, is on the same certificate and reaches the same upstream, so this
# is a rename of the canonical name rather than a cutover with a gap.
#
# `/ilp/btp`, the canonical client-edge path, NOT the `/rust/ilp/btp` this
# dialed until 2026-08-05. That prefix was the parallel-fleet alias; it is
# retired everywhere else on both boxes and this was the last thing keeping
# an exception alive for it in the store box's nginx.
endpoint = "wss://proxy.ario.devnet.toonprotocol.dev/ilp/btp"
# The shared secret, as a FILE. `infra/linode-*/*.secret` is gitignored, so
# the peering itself is tracked and only the bytes stay on the box. Both
# operators must end up with the same bytes; they are shared out of band.
# Missing, unreadable or empty is a refuse-to-start by name
# (PeerSecretFileNotFound / -Unreadable / -Empty), never a peering that
# silently never establishes.
credential = { secret_file = "/app/data/apex-store.secret" }
# `ceiling`/`flush_interval_ms` used to be set here -- retired along with
# the credit window they bounded (ADR 0031, ADR 0033, issue #882): every
# peer PREPARE now carries its own covering claim.

# Role is decided by authentication AND a channel binding -- a peering with a
# credential but no channel can only ever admit its counterparty as an
# ordinary client (peer-carriage-spec.md 1.2, ADR 0024). This row is what
# makes ClaimBook able to sign for this peer at all: before #678 wired it,
# every peer claim was refused `unknown_channel` and none was ever signed.
[[peer_channels]]
peer_id = "apex-store"
# PLACEHOLDER (issue #822) -- these two values are NOT a real channel and
# must not be used as one. The retired channel (the real values this
# replaced) still lives, unclosed, on the OLD TokenNetwork
# (0x1E95493fEF46707E034b4a1945f25a8C76A1823D) until the live migration
# proves a replacement against the new TokenNetwork below works end to
# end; only then is the retired channel closed and settled, per
# docs/operators/peer-channel-migration.md. That runbook opens the
# replacement channel and overwrites both placeholders with its real
# channel_id and the store box's settlement address, on BOTH boxes
# together.
channel_id = "0xdeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddead"
counterparty_key = "0xdeaddeaddeaddeaddeaddeaddeaddeaddeaddead"
# The EIP-712 domain a claim on this channel is signed over
# (EIP712("TokenNetwork","1"), ADR 0024). Not a global default: a claim
# signed under the wrong domain recovers to a different address and is
# refused. Repointed to the new ERC-2771 TokenNetwork (issue #822, #695/#811)
# -- both boxes must agree, or a claim one accepts is unresolvable by the
# other.
chain_id = 84532
token_network = "0xa79C3b1dbcEA00a6d84735a134395D8eF6D6a478"

# ── The g.toon proxy<->relay peering (issue #820, Shape A -- #815) ────────
# The fleet's second inter-node link, carrying every `g.toon.relay` packet
# above. Dialing, exactly like the store peering above: the g.toon proxy
# DIALS and never accepts (no `peer_expose` on this node -- the relay box is
# the accepting half, `peer_expose = "btp"` in
# infra/linode-relay/connector-rust.toml, which has no `endpoint` of its
# own).
[[peers]]
id = "apex-relay"
# ONE string both operators write, same rule as `apex-store` above.
endpoint = "wss://proxy.relay.devnet.toonprotocol.dev/ilp/btp"
# The shared secret, as a FILE, same handling as `apex-store.secret` above
# -- gitignored, generated once and copied byte-identical to both boxes
# (issue #820's live human step), never a literal in this public repo.
credential = { secret_file = "/app/data/apex-relay.secret" }
# `ceiling`/`flush_interval_ms` used to be set here too, same removal as
# the apex-store peering above (ADR 0031, ADR 0033, issue #882).

[[peer_channels]]
peer_id = "apex-relay"
# PLACEHOLDER (issue #820) -- these two values are NOT a real channel and
# must not be used as one, same convention as the apex-store row above.
# Unlike that row this is not a migration off a still-open old channel:
# issue #821 already opened and funded a real apex<->relay channel against
# the TokenNetwork below (on-chain channel_id 0x62c81d83bf0bda1af54233fa92
# cae0c287e34838fb3434e6911d289dba6fa3fa, verified live). But this repo
# never carries a peering's live facts on either side -- see the
# apex-store row's own comment -- so the real values are applied directly
# to both boxes' untracked connector-rust.toml files as part of #820's
# live cutover window, not committed here.
channel_id = "0xdeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeadbeef"
counterparty_key = "0xdeaddeaddeaddeaddeaddeaddeaddeaddeadbeef"
# Same EIP-712 domain as the apex-store row: both boxes must agree, or a
# claim one accepts is unresolvable by the other.
chain_id = 84532
token_network = "0xa79C3b1dbcEA00a6d84735a134395D8eF6D6a478"

# ── Operator surface (optional) ─────────────────────────────────────────
# Omitted here deliberately: enabling it means committing (or securely
# injecting) a real bearer_token + write_keys, which this devnet overlay
# does not attempt to solve. Add an [operator] section per
# deploy/connector-rust/README.md steps 2-3 before relying on GET /metrics
# or the write surface on this node.

# ── Settlement (issues #542, #577) — LIVE against Base Sepolia ──────────
# `EvmSettlementBackend` drives `packages/contracts/src/TokenNetwork.sol`,
# the same signature-verifying payment-channel contract the TypeScript
# fleet settles through, reached via the `TokenNetworkRegistry` named
# below (issue #576). Startup calls `EvmSettlementBackend::connect`, which
# resolves `token_address` through the registry and reads the token's own
# `decimals()`; any disagreement is a refusal to start, not a silent no-op
# (ADR 0009, issues #564/#566). A node that boots with this section has
# therefore already proven the registry resolves this token.
#
# Since issue #556 this section is also the client edge's channel SOURCE:
# with it, an unaffiliated buyer who opens a channel on chain pays this
# node with no config edit (issue #611), and the accepted claim's
# watermark is journaled under `state_dir` like a declared channel's
# (issue #605).
#
# Custody, an operator should not have to discover later (issue #577):
# `TokenNetwork` is both `Ownable` and `Pausable` -- it has an owner that
# CAN call `pause()` (TokenNetwork.sol:446) and `emergencyWithdraw()`
# (TokenNetwork.sol:430-442), which would freeze new operations or pull a
# channel's funds out from under its participants. On THIS deployment
# `TokenNetwork.owner()` reads back the `TokenNetworkRegistry` contract
# below (`contract_address`), not an EOA -- verified on chain, not assumed
# from source -- and `TokenNetworkRegistry` exposes no function that
# forwards a call into a `TokenNetwork` it created, and never calls
# `transferOwnership` on one. So `pause`/`emergencyWithdraw` are
# unreachable on this deployment: nothing holds a key that could call
# them. That is a property of THIS deployment, not a guarantee of the
# source -- a `TokenNetwork` created by a future registry, or transferred
# to a different owner, would not inherit it.

[settlement.evm]
# The same known-good public endpoint ./connector.yaml already uses.
rpc_url = "https://base-sepolia-rpc.publicnode.com"
# The deployed `TokenNetworkRegistry` (issue #566) — a factory, not a
# channel contract. On this deployment `getTokenNetwork(token_address)`
# resolves to 0xa79C3b1dbcEA00a6d84735a134395D8eF6D6a478, the ERC-2771
# TokenNetwork the fleet's CLIENT settlement uses since the #695/#811
# cutover. The apex<->store [[peer_channels]] row above names the SAME
# TokenNetwork as of issue #822, but only in this repo copy: the box's
# live bind-mounted file still settles that peering on the OLD contract
# (0x1E95493fEF46707E034b4a1945f25a8C76A1823D) until the migration in
# docs/operators/peer-channel-migration.md actually runs against it.
contract_address = "0x8263BdD4eB4862395Cb4ef5dA5d637F4b047Eea1"
# 6-decimal devnet USDC — the fleet-wide settlement asset (ADR 0010).
token_address = "0x49beE1Bca5d15Fb0963117923403F9498119a9Ce"
# The scale the deployed token itself reports. Startup reads the token's
# own `decimals()` and refuses to boot on disagreement (issue #564).
decimals = 6

[settlement.evm.key]
# Deliberately NOT the [signer] key above: the signer key is per-box
# random material with no funds, while settlement signs transactions that
# spend real testnet value. This file holds the fleet's funded settlement
# account (the mnemonic-derived devnet key the TypeScript fleet also
# settles with), provisioned on the box as ./settlement-rust.key and
# mounted read-only exactly like ./signer-rust.key — including its
# `chown 10001:10001`.
key_file = "/app/data/settlement.key"

[settlement.solana]
# Solana devnet public RPC -- the cluster the deployed payment-channel
# program below lives on.
rpc_url = "https://api.devnet.solana.com"
# The deployed `payment-channel` program (`packages/solana-program`) on
# solana:devnet -- the same instance the TS fleet already drives.
program_id = "2aEVJ8koKD8LTZrLRSGtAtU7LBt4e7QjjCgf1kzQ7Rip"
# 6-decimal devnet USDC mint (ADR 0010) -- the fleet-wide settlement asset.
token_address = "xyc5J8MgKFiEN13PnfftdXxUzYH34FEvw1LCrFwN7in"
decimals = 6

[settlement.solana.key]
# The fleet's funded Solana settlement account: the TS fleet's
# mnemonic-index-0 account HgNmgJYrZFrx9DZgMopKa9971zGXW3hPL32Wsc6KzF6,
# provisioned on the box as ./settlement-solana-rust.key (a 32-byte ed25519
# seed as 64 hex chars, same shape as ./settlement-rust.key) and mounted
# read-only. Solana settlement wired end to end in connector#633.
key_file = "/app/data/settlement-solana.key"
