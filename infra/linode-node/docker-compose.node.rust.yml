# ═══════════════════════════════════════════════════════════════════════════
# TOON devnet — Rust connector overlay (issue #490, ADR 0013's parallel fleet)
# ═══════════════════════════════════════════════════════════════════════════
# ADDITIVE: adds the Rust connector alongside docker-compose.node.yml's
# existing TypeScript fleet on this SAME box, WITHOUT editing that file.
# Compose merges multiple `-f` files into one project, so this service joins
# the SAME default network as `relay` (and the TypeScript `connector`) —
# `handler_url = "http://relay:3100"` in ./connector-rust.toml resolves by
# the same container-name DNS the TypeScript node already relies on. Neither
# `relay` nor any other existing service is touched here.
#
# Run alongside the existing stack (never on its own — it has no relay
# service of its own to front):
#   docker compose -f infra/linode-node/docker-compose.node.yml \
#                   -f infra/linode-node/docker-compose.node.rust.yml up -d
#
# Distinct from the TypeScript node in every way ADR 0013 requires:
#   - image:  connector-rust (issue #487), pinned to an exact sha- tag, never
#             `connector` or a floating tag
#   - ports:  4000 only (client edge + operator + /metrics — one port, unlike
#             the TypeScript node's three), no collision with the TypeScript
#             node's 3000/8080/8081. No 4001 published: ./connector-rust.toml
#             sets no peer_wire_addr on this box (the apex only dials out to
#             the store side; a container needs no published port to make an
#             outbound connection) — see that file's own [[peers]] comment.
#   - data:   ./signer-rust.key, a path distinct from the TypeScript node's
#             `connector_data` volume; this service gets no named volume at
#             all (connector-runtime holds no state beyond the signer key)
#
# Generate ./signer-rust.key per deploy/connector-rust/README.md step 1 --
# including its `chown 10001:10001`, without which this service restart-loops
# on "failed to read signer key_file ... Permission denied" (#492).
#
# ── Why 4000 is bound to loopback (#492) ──────────────────────────────────
# This client edge implements only §1.1 of docs/protocol/client-edge-spec.md.
# Its own module doc says so: identity (§1.2), payment claims (§1.3) and the
# x402 greeting (§1.4) are unimplemented, so "every request today is treated
# as an unauthenticated, unpriced delivery attempt". §1.5 request-request
# binding is absent entirely.
#
# An unpriced connector in front of the relay is a free-write gateway. The
# relay's POST /write trusts the injected X-TOON-Payer/-Amount/-Chain headers
# without re-validating them and stores any signature-valid event whether or
# not they are present -- it enforces no payment itself, by design, because
# the connector is supposed to have done it upstream. This one does not.
#
# Publishing on 0.0.0.0 therefore put an anonymous free write into the devnet
# relay on the public internet, and a ufw rule would not have contained it
# (Docker's iptables chain runs ahead of ufw -- see
# docs/operators/parallel-fleet-comparison.md). Binding the publish to
# 127.0.0.1 is what actually closes it: reach it with an SSH tunnel or from
# the box. Widen this ONLY once §1.2-§1.5 are implemented and the fleet
# charges for a write.
# ═══════════════════════════════════════════════════════════════════════════

services:
  connector-rust:
    # Pinned per the issue's own AC ("not a moving one") to the exact commit
    # this overlay was authored against — see
    # deploy/connector-rust/README.md's tag table for what sha- means.
    # Re-pin this alongside any future update to connector-rust.toml.
    image: ghcr.io/toon-protocol/connector-rust:sha-0e45cef
    volumes:
      - ./connector-rust.toml:/app/config/connector.toml:ro
      - ./signer-rust.key:/app/data/signer.key:ro
    ports:
      # Loopback-only, deliberately — see the header. Not '4000:4000'.
      - '127.0.0.1:4000:4000'
    restart: unless-stopped
