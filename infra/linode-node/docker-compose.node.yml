# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TOON connector node — proxy + faucet + TLS. (The relay app moved to its own
# box in issue #820; see the note where its service used to be, below.)
# Run from the CONNECTOR REPO ROOT:
#   docker compose -f infra/linode-node/docker-compose.node.yml up -d
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:
  connector:
    image: ghcr.io/toon-protocol/connector:3.36.3-solchan.0
    environment:
      CONFIG_FILE: /app/config/connector.yaml
      TOON_MNEMONIC: ${TOON_MNEMONIC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    volumes:
      - ./connector.yaml:/app/config/connector.yaml:ro
      - connector_data:/app/data
    ports:
      - '3000:3000'
      - '8080:8080'
    restart: unless-stopped
    healthcheck:
      # wget (not curl): the connector slim image has no curl, so a curl-based
      # check always reports "unhealthy" even when /health is up. Mirrors the
      # faucet wget check below.
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8080/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # The `relay` service that used to run here (`ghcr.io/toon-protocol/
  # relay:sha-d80f279`, TOON_BLS_PORT 3100 / TOON_RELAY_PORT 7100) has moved
  # to its own box, infra/linode-relay/ (issues #816/#821). This box's
  # `g.toon.relay` route now FORWARDS to that box over the apex<->relay
  # peering (issue #820) instead of terminating against a co-located
  # container -- see infra/linode-node/connector-rust.toml's own route
  # comment. Nothing here proxies to a `relay` container any more; the
  # `relay_data` volume that used to back it is gone with it (issue #831's
  # named volume moved with the app -- see infra/linode-relay/
  # docker-compose.relay.yml's own `relay_data`, a same-named but distinct
  # volume scoped to that box's own compose project).

  faucet:
    # Build context is the REPO ROOT (not packages/faucet): the multi-stage
    # Dockerfile builds the mina-zkapp ESM bundle (dist-esm/) the USDC mint path
    # imports, so it needs packages/mina-zkapp/ in context. See the Dockerfile head.
    build:
      context: ../..
      dockerfile: packages/faucet/Dockerfile
    environment:
      PORT: 3500
      # EVM — points at the dedicated EVM box over HTTPS
      RPC_URL: https://evm-rpc.${DOMAIN:-devnet.toonprotocol.dev}
      ETH_PRIVATE_KEY: '0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d'
      TOKEN_PRIVATE_KEY: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
      TOKEN_ADDRESS: '0x5FbDB2315678afecb367f032d93F642f64180aa3'
      ETH_AMOUNT: '100'
      TOKEN_AMOUNT: '10000'
      # Solana — points at the dedicated Solana box over HTTPS
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      SOLANA_USDC_MINT: ${SOLANA_USDC_MINT:-xyc5J8MgKFiEN13PnfftdXxUzYH34FEvw1LCrFwN7in}
      SOLANA_FAUCET_KEYPAIR: /keys/usdc-authority.json
      # SOL per drip (toon-meta#258): the committed treasury has run as low as
      # ~0.45 SOL and is NOT self-replenishing (the public devnet airdrop that
      # funds it is the same rate-limited endpoint this leg exists to work
      # around), so this must stay conservative. Backed by a 24h per-address
      # cooldown (SOLANA_DRIP_COOLDOWN_MS, default below) — raise the amount
      # only alongside a treasury top-up.
      SOLANA_SOL_AMOUNT: ${SOLANA_SOL_AMOUNT:-0.03}
      SOLANA_DRIP_COOLDOWN_MS: ${SOLANA_DRIP_COOLDOWN_MS:-86400000}
      # Mina — points at the dedicated Mina lightnet box over HTTPS
      MINA_FAUCET_KEY: ${MINA_FAUCET_KEY:-}
      MINA_GRAPHQL_URL: ${MINA_GRAPHQL_URL:-https://mina.${DOMAIN:-devnet.toonprotocol.dev}/graphql}
      MINA_DRIP_AMOUNT: ${MINA_DRIP_AMOUNT:-5}
      # Mina USDC admin-mint (o1js proving) — set by provision-mina-lightnet.sh
      # after the lightnet zkApp deploy (the admin key can mint unlimited USDC, so
      # it is injected from the box .env, never committed). Unset → native MINA only.
      MINA_USDC_ADMIN_KEY: ${MINA_USDC_ADMIN_KEY:-}
      MINA_USDC_TREASURY_KEY: ${MINA_USDC_TREASURY_KEY:-}
      MINA_USDC_TOKEN: ${MINA_USDC_TOKEN:-}
      MINA_USDC_ADMIN_CONTRACT: ${MINA_USDC_ADMIN_CONTRACT:-}
      MINA_USDC_AMOUNT: ${MINA_USDC_AMOUNT:-1000}
      MINA_TX_FEE: ${MINA_TX_FEE:-0.2}
      # Base Sepolia — PUBLIC Base testnet (chainId 84532). Mints the ungated
      # mock USDC (mint() needs no faucet USDC balance); the faucet key only
      # needs Base Sepolia ETH for gas. Unset key → route 503s. Secret via .env.
      BASE_SEPOLIA_FAUCET_KEY: ${BASE_SEPOLIA_FAUCET_KEY:-}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
      BASE_SEPOLIA_USDC: ${BASE_SEPOLIA_USDC:-0x49beE1Bca5d15Fb0963117923403F9498119a9Ce}
      BASE_SEPOLIA_USDC_AMOUNT: ${BASE_SEPOLIA_USDC_AMOUNT:-1000}
      # Best-effort native-gas leg (toon-meta#258), same rationale as Solana
      # above: enabled by default at a conservative amount so a fresh identity
      # can pay its own Base Sepolia gas without a captcha-gated public faucet.
      # executeBaseSepoliaDrip() already skips this leg (never failing the
      # mint) when the faucet key's balance is below reserve+amount, and it
      # shares the leg's existing 24h BASE_SEPOLIA_COOLDOWN_MS.
      BASE_SEPOLIA_ETH_AMOUNT: ${BASE_SEPOLIA_ETH_AMOUNT:-0.001}
      BASE_SEPOLIA_ETH_RESERVE: ${BASE_SEPOLIA_ETH_RESERVE:-0.01}
    volumes:
      - /root/keys/solana-usdc-treasury.json:/keys/usdc-authority.json:ro
    ports:
      - '3500:3500'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3500/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      connector:
        condition: service_healthy
        required: false
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - node_certbot_conf:/etc/letsencrypt:ro
      - node_certbot_www:/var/www/certbot:ro
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - node_certbot_conf:/etc/letsencrypt
      - node_certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  connector_data:
  node_certbot_conf:
  node_certbot_www:
