# kind:10032 announcer sidecar for the Rust edge (connector#681 / #683).
# ADR-0022: the connector answers, it does not announce — this sidecar polls
# GET /ilp/identity on connector-rust and republishes the proven facts.
# Deployed 2026-08-01 (buzz epic toon-meta#256 orchestration).
#
# RECONCILED FROM THE LIVE g.toon PROXY BOX 2026-08-04, byte-for-byte, behaviour
# unchanged. It had been running for three days with **no source in this
# repo at all** — the announcer's *code* is versioned (packages/announcer/,
# which is what builds the image named below) but this deployment overlay,
# the file that says which endpoints this box announces, was not. Redeploying
# the g.toon proxy from a clean checkout would therefore have silently dropped
# the service that publishes every endpoint the network discovers.
#
# Bring it up alongside the other overlays:
#   docker compose -f infra/linode-node/docker-compose.node.yml \
#                  -f infra/linode-node/docker-compose.node.rust.yml \
#                  -f infra/linode-node/docker-compose.node.announcer.yml up -d announcer
#
# `image: linode-node-announcer` is a **locally built** image, not a registry
# pull — compose named it after the project when it was first built from
# packages/announcer/Dockerfile. There is no `build:` stanza here because
# this overlay is applied on a box whose checkout is the repo root, and
# adding one would rebuild the announcer on every unrelated `up -d`. If the
# image is ever lost from the box's local docker, rebuild it with:
#   docker build -t linode-node-announcer packages/announcer
services:
  announcer:
    image: linode-node-announcer
    restart: unless-stopped
    environment:
      ANNOUNCER_RUST_EDGE_URL: http://connector-rust:4000
      ANNOUNCER_RELAY_URLS: http://relay:3100
      ANNOUNCER_RELAY_PUBLIC_URL: wss://relay-ws.devnet.toonprotocol.dev
      # `g.toon.ario` RETIRED from this list 2026-08-07 (issue #833). It was
      # added 2026-08-05 as a STOPGAP for a live outage: the store box had no
      # kind:10032 publisher of its own, so this sidecar announced
      # `g.toon.ario` under the g.toon PROXY's identity instead, on the
      # (recorded, at the time judged acceptable) theory that nothing
      # discovers a node by an identity it never advertised.
      #
      # That theory was wrong. A stock client reads a kind:10032 announce and
      # seals its gift wrap to the SINGLE `edgeIdentity` it carries --
      # whichever node published it, not whichever node actually terminates
      # each address inside it. `g.toon.ario` is FORWARDED across the g.toon
      # proxy<->store peering (ADR 0028, #772), not terminated here, so a
      # client following this stopgap sealed to the proxy's key, paid at the
      # client edge, and was refused `F01 gift wrap could not be opened` at
      # the store -- the terminating connector, which actually holds the key
      # ADR 0018 requires the wrap be sealed to. The money was already spent.
      # See issue #833 for the full trace.
      #
      # The fix is not "keep the stopgap and hope nothing reads it" -- #833
      # also gives the store box its OWN publisher
      # (infra/linode-store/connector-rust.toml's `[announce]` section +
      # docker-compose.store.announce.yml), announcing `g.toon.ario` under
      # the store's own `[signer]` identity, the one gift wraps to that
      # prefix are actually sealed against. Two announces claiming one prefix
      # under two different identities is the SAME failure mode traded into a
      # different shape (which announce a client's cache keeps is then
      # ambiguous), so removing this stopgap has to land in the same change
      # as the store's own publisher landing, not stay a "later" cleanup.
      #
      # #784 is still the long-run answer for `g.toon`/`g.toon.relay` too: a
      # `connector announce` subcommand run FROM the node being announced.
      # This sidecar remains for those two -- both genuinely terminated here
      # -- until that retirement happens; see the RETIRING THIS SIDECAR note
      # below.
      #
      # RETIRING THIS SIDECAR (issue #799): the genesis peer seed pins the
      # pubkey ANNOUNCER_IDENTITY_SECRET_KEY_FILE below produces, so before
      # turning this service off, point the announcing node's own
      # `[announce] identity_key_file` at this exact file
      # (/root/keys/announce.key) and run `connector announce` from there.
      # Skipping that carries the announce over under a NEW pubkey instead,
      # the seed goes stale, and every client bootstrapping from it fails
      # with `EOSE, found 0 events` -- see docs/operators/announcing-a-node.md.
      ANNOUNCER_ILP_ADDRESSES: g.toon,g.toon.relay
      # `routes.store` in the kind:10032 announce is DERIVED when this is
      # unset (`deriveRouteHints`, packages/announcer/src/config.ts): it
      # falls back to whatever `.store`/`.ario` entry is in
      # ANNOUNCER_ILP_ADDRESSES above, and failing that, guesses
      # `<publish-prefix-minus-.relay>.store`. Removing `g.toon.ario` from
      # that list (issue #833) silently fired that guess -- `g.toon.relay`
      # -> `g.toon.store`, a prefix this node has no route for at all
      # (`g.toon.store` was retired 2026-08-05, see
      # infra/linode-node/connector-rust.toml) -- so every client reading
      # `routes.store` to find the store app got F02 no route. Pin it
      # explicitly instead of leaving it to the derivation: the next person
      # to edit ANNOUNCER_ILP_ADDRESSES must not be able to re-break this by
      # editing an unrelated-looking list. See issue #841.
      ANNOUNCER_ROUTE_STORE: g.toon.ario
      # NOTE: these two publish the `/rust/` path — the disposable artifact
      # ADR 0013 says "nothing durable should be published against". Phase 7
      # of the cutover plan repoints them at /ilp and /ilp/btp once the Rust
      # connector is the default edge. Pure env passthrough
      # (packages/announcer/src/config.ts → announce-builder.ts), so changing
      # them and running `up -d announcer` is the whole of that step.
      ANNOUNCER_HTTP_ENDPOINT: https://proxy.devnet.toonprotocol.dev/ilp
      ANNOUNCER_BTP_ENDPOINT: wss://proxy.devnet.toonprotocol.dev/ilp/btp
      ANNOUNCER_IDENTITY_SECRET_KEY_FILE: /app/data/announce.key
      ANNOUNCER_SOLANA_CHAIN_ID: solana:devnet
    volumes:
      - /root/keys/announce.key:/app/data/announce.key:ro
