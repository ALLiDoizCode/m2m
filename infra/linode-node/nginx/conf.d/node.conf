# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TOON connector node nginx config.
# Serves: relay-ws.DOMAIN  proxy.DOMAIN  faucet.DOMAIN
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

limit_req_zone $binary_remote_addr zone=node:10m rate=200r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $host $backend {
    default               "";
    relay-ws.devnet.toonprotocol.dev    "http://relay:7100";
    # CUT OVER 2026-08-04: was "http://connector:3000" (the TypeScript
    # connector), now the Rust one. This line IS the cutover -- the Rust
    # connector serves /ilp and /ilp/btp on 4000, exactly what TypeScript
    # served on 3000, so nothing above or below this map changed. Rollback is
    # restoring the old value and `nginx -s reload`: seconds, graceful, total.
    proxy.devnet.toonprotocol.dev       "http://connector-rust:4000";
    faucet.devnet.toonprotocol.dev      "http://faucet:3500";
}

# Full URL incl. path baked in so variable proxy_pass adds no URI. Other hosts
# fall back to their normal $backend via the empty-string default.
map $host $health_backend {
    default                              "";
    # The Rust connector has NO /health route -- its router is /ilp, /ilp/btp,
    # /ilp/probe, /ilp/identity, /ilp/routes/price, /ilp/claim-state, and
    # nothing else. This entry pointed at the TypeScript connector's dedicated
    # health port (connector:8080) and kept pointing there after the 2026-08-04
    # cutover stopped that container, so https://proxy.DOMAIN/health has been
    # answering 502 ever since: nginx up, upstream gone.
    #
    # /ilp/identity is the honest replacement. It is a GET that 200s only once
    # the process is serving AND has read its signer key file, which is a
    # stronger liveness signal than a static 200 would be, and it publishes
    # nothing new -- it is already reachable unauthenticated at its own path.
    # The body is the identity JSON rather than a health document; a probe that
    # reads the status code (every one of them) does not care.
    proxy.devnet.toonprotocol.dev       "http://connector-rust:4000/ilp/identity";
    faucet.devnet.toonprotocol.dev      "http://faucet:3500/health";
    relay-ws.devnet.toonprotocol.dev    "http://relay:3100/health";
}

server {
    listen 80;
    listen [::]:80;
    server_name relay-ws.devnet.toonprotocol.dev proxy.devnet.toonprotocol.dev faucet.devnet.toonprotocol.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay-ws.devnet.toonprotocol.dev proxy.devnet.toonprotocol.dev faucet.devnet.toonprotocol.dev;

    ssl_certificate     /etc/letsencrypt/live/relay-ws.devnet.toonprotocol.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay-ws.devnet.toonprotocol.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── there is no anonymous connector telemetry, and that is decided ──
    # A `location = /admin/metrics.json` used to live here, proxying to
    # `connector:8081` — the TypeScript connector's admin API. #665 had already
    # cut this block down from five endpoints to one: earnings.json, routes,
    # peers and channels each carry an identifier that is not otherwise public
    # (most sharply earnings.json, whose recentClaims[].peerId is a
    # counterparty's `http:0x…` EVM address joined to that claim's amount and
    # timestamp), and ADR 0008 puts every operator read behind a bearer token,
    # so none of it was ever sanctioned. metrics.json survived that pass on the
    # grounds that its body is aggregate counters keyed by CONFIGURED peer
    # names, and that it is what the public /dash flow strip polls.
    #
    # The 2026-08-04 Rust cutover stopped the `connector` container, so this
    # block has been answering 502 ever since — nginx up, upstream gone. Issue
    # #753. The rust-cutover-runbook §2.3 named exactly this and chose option
    # (1), "accept the loss": this is that edit, landing late.
    #
    # It is deleted rather than repointed because there is nothing to repoint
    # it AT, and the reasons are decisions rather than gaps:
    #
    #   * ADR 0014 fixes the Rust metrics surface at five names, in Prometheus
    #     text, on the operator surface, behind the same bearer token as every
    #     other read — explicitly "avoids introducing a second, differently-
    #     authenticated (or unauthenticated) HTTP surface". A node with no
    #     `[operator]` section, which is both boxes, exposes no metrics at all.
    #   * ADR 0014 also states there is "no per-peer or per-destination label
    #     anywhere", so the per-peer strip metrics.json fed cannot be rebuilt
    #     faithfully at any authentication level.
    #   * ADR 0022's line between answering and announcing is what makes
    #     /ilp/identity and /ilp/routes/price unauthenticated: they tell a
    #     caller what this node's own CONFIGURATION says, which "decides
    #     nothing, and reaches nobody who did not ask". A packet counter is
    #     operational history, not configuration, so it does not sit on the
    #     free side of that line by inheritance — it would need its own
    #     decision, and this is it: no.
    #   * Enabling `[operator]` to open a bearer-gated path here is not a small
    #     move on this box. The operator router merges onto the SAME port the
    #     client edge serves (crates/connector-cli/src/runtime.rs), `location /`
    #     below proxies everything to that port, and the operator write half is
    #     deliberately not behind the bearer token (ADR 0008 — writes are RFC
    #     9421 signatures). Turning the section on without also adding deny
    #     blocks here would publish POST /channels/:id/close and POST /packets
    #     to the anonymous internet. Note the `^~ /admin` block below does NOT
    #     cover them: the Rust operator paths are /peers, /routes, /channels,
    #     /claims, /exposure, /identity, /audit-log, /metrics — no /admin prefix.
    #
    # What replaces it, for the two questions the strip actually answered:
    #   "is the node up?"    GET /ilp/identity — unauthenticated, already the
    #                        $health_backend target above, and a 200 proves the
    #                        signer key loaded as well as the process running.
    #   "are packets moving?" the claims journals on the state volume, which is
    #                        what the cutover itself was verified with:
    #                        wc -l /var/lib/docker/volumes/linode-node_connector_rust_state/_data/{client-edge,peer}-claims.log
    #                        Per #690 per-packet logs are `debug`, so a quiet
    #                        container log is not evidence of an idle node.
    #
    # An authenticated telemetry path for the dashboard — a same-origin proxy
    # holding the token server-side, so no credential reaches a browser — is
    # #669, and is still the right shape if the panels are wanted back. It is
    # not this block, and it is not anonymous.
    #
    # Mirrors the store box's infra/linode-store/nginx/conf.d/node.conf.

    # The whole /admin prefix is refused here rather than proxied — nothing is
    # carved out of it any more. 404 rather than 401/403 so the refusal does not
    # advertise that an admin surface exists. `^~` outranks any regex location,
    # and with the exact-match block above gone there is nothing left that
    # outranks this, so no path under /admin can reach an upstream by accident.
    location ^~ /admin { return 404; }

    # ── public demo dashboard ────────────────────────────────────────────
    # Static SPA built from toon-meta `scripts/demo-dashboard`, served out of
    # the bind-mounted conf.d. It is NOT built from this repo and NOT tracked
    # here, so what is on the box is whatever was last rsync'd: as of
    # 2026-08-05 that is a 2026-07-21 build, three toon-meta commits stale
    # (#253 telemetry scoping, #254 store-box addresses, #255 sandbox
    # retirement) — it still polls a decommissioned third node and the store
    # box's pre-rename `dvm.` name.
    #
    # With the block above deleted, the parts of the page fed by
    # /admin/metrics.json are dead: the per-node forwarded/rejected/bytes/
    # uptime counters, the peer list, and the green/red up dot, which derives
    # from that fetch succeeding. That last one is the reason this needs a
    # toon-meta change and not just a rebuild — a red dot on a healthy node is
    # a page that lies, which is worse than a page with one fewer panel. The
    # dashboard should take liveness from GET /ilp/identity (unauthenticated,
    # same origin for this box) and drop the counters. Tracked on #753; the
    # claims panels are #669.
    location = /dash  { return 302 https://$host/dash/; }
    location /dash/ {
        alias /etc/nginx/conf.d/dashsite/;
        index index.html;
        try_files $uri $uri/ /dash/index.html;
    }

    # ── The retired /rust/ prefix (issue #601, ADR 0013) ──────────────────
    # /rust/ilp and /rust/ilp/btp were the PARALLEL edge: a second door to the
    # Rust connector while the TypeScript one still held `/`. The 2026-08-04
    # cutover made them redundant -- $backend above now points `/` at the same
    # `connector-rust:4000` -- and this retires them.
    #
    # Safe because nothing external ever used them. Every access-log hit on
    # this prefix, across its whole life, came from the operator's own IPs
    # (153.66.109.x) or from the box itself; the last one was 2026-08-04
    # 19:25, during the cutover. The only hit since is a single GoogleOther
    # crawl on 2026-08-05, which is also why this returns a status rather than
    # simply being deleted.
    #
    # 410, not 404 and not a redirect. Deleting the blocks outright would let
    # /rust/ilp fall through to `location /` and reach the connector at the
    # literal path /rust/ilp, which answers 404 from the connector and reads
    # like the connector is broken rather than like the alias is gone. A
    # redirect to /ilp would silently re-point a payer's POST at a priced
    # endpoint it did not address. 410 says permanently gone, keeps the hit in
    # the access log if some straggler does appear, and tells the crawler to
    # drop the URL.
    #
    # `^~` so this wins over any regex location and covers the whole prefix --
    # unlike the two blocks it replaces, there is no surface behind it to
    # scope narrowly any more.
    location ^~ /rust/ { return 410; }

    location = /health {
        if ($health_backend != "") {
            proxy_pass $health_backend;
        }
        if ($health_backend = "") {
            return 404;
        }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        if ($backend = "") { return 404; }
        limit_req zone=node burst=400 nodelay;

        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;

        client_max_body_size 4m;
    }
}
