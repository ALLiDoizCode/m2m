# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TOON connector node nginx config.
# Serves: relay-ws.DOMAIN  proxy.DOMAIN  faucet.DOMAIN
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

limit_req_zone $binary_remote_addr zone=node:10m rate=200r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $host $backend {
    default               "";
    relay-ws.devnet.toonprotocol.dev    "http://relay:7100";
    # CUT OVER 2026-08-04: was "http://connector:3000" (the TypeScript
    # connector), now the Rust one. This line IS the cutover -- the Rust
    # connector serves /ilp and /ilp/btp on 4000, exactly what TypeScript
    # served on 3000, so nothing above or below this map changed. Rollback is
    # restoring the old value and `nginx -s reload`: seconds, graceful, total.
    # The /rust/ilp locations below are now a redundant alias to the same
    # upstream and are kept only until the clients pinning them have shipped.
    proxy.devnet.toonprotocol.dev       "http://connector-rust:4000";
    faucet.devnet.toonprotocol.dev      "http://faucet:3500";
}

# proxy.DOMAIN health lives on the connector health port (8080), not the 3000
# ILP ingress. Full URL incl. path baked in so variable proxy_pass adds no URI.
# Other hosts fall back to their normal $backend via the empty-string default.
map $host $health_backend {
    default                              "";
    proxy.devnet.toonprotocol.dev       "http://connector:8080/health";
    faucet.devnet.toonprotocol.dev      "http://faucet:3500/health";
    relay-ws.devnet.toonprotocol.dev    "http://relay:3100/health";
}

server {
    listen 80;
    listen [::]:80;
    server_name relay-ws.devnet.toonprotocol.dev proxy.devnet.toonprotocol.dev faucet.devnet.toonprotocol.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay-ws.devnet.toonprotocol.dev proxy.devnet.toonprotocol.dev faucet.devnet.toonprotocol.dev;

    ssl_certificate     /etc/letsencrypt/live/relay-ws.devnet.toonprotocol.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay-ws.devnet.toonprotocol.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── read-only connector telemetry for the public demo dashboard ──
    # Exposes ONLY /admin/metrics.json (GET) from the connector admin API
    # (:8081). EVERYTHING ELSE under /admin is refused by the block below.
    # Scoped down for issue #665 — this block used to proxy earnings.json,
    # routes, peers and channels to the anonymous internet as well, and each
    # of those carries an identifier that is not otherwise public (most
    # sharply earnings.json, whose recentClaims[].peerId is a counterparty's
    # `http:0x…` EVM address joined to that claim's amount and timestamp).
    # ADR 0008 puts every operator read behind a bearer token, so none of it
    # was ever sanctioned. metrics.json stays open because it is pure
    # aggregate counters keyed by configured peer names, and it is what the
    # dashboard's live flow strip polls. Mirrors the store box's
    # infra/linode-store/nginx/conf.d/node.conf.
    location = /admin/metrics.json {
        limit_except GET { deny all; }
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "https://faucet.devnet.toonprotocol.dev" always;
        add_header Cache-Control "no-store" always;
        set $conn_admin http://connector:8081;
        proxy_pass $conn_admin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Everything else under /admin — including the connector's mutating half —
    # is refused here rather than proxied. 404 rather than 401/403 so the
    # refusal does not advertise that an admin surface exists. `^~` outranks
    # any regex location and the exact match above outranks this, so the one
    # open endpoint stays open and nothing else can reach the surface.
    location ^~ /admin { return 404; }

    # ── public demo dashboard: aggregated packet-flow view across all 3 nodes ──
    location = /dash  { return 302 https://$host/dash/; }
    location /dash/ {
        alias /etc/nginx/conf.d/dashsite/;
        index index.html;
        try_files $uri $uri/ /dash/index.html;
    }

    # ── Rust fleet client edge (issue #601; ADR 0013's parallel prefix) ──
    # Scoped to /rust/ilp* DELIBERATELY, not /rust/ wholesale:
    # client_edge_addr serves the client edge and (if one is ever
    # configured) the operator surface on the same port, so a wholesale
    # prefix proxy would publish /metrics and the operator API the day an
    # [operator] section lands on this node. Only the ILP paths are public.
    # `connector-rust` resolves here because docker-compose.node.rust.yml
    # is an additive overlay on this same compose project, so nginx and the
    # Rust connector share the default network -- the same container-name
    # DNS $backend already relies on.
    location /rust/ilp {
        limit_req zone=node burst=400 nodelay;
        # `set` MUST precede the rewrite: `break` ends the rewrite phase,
        # so a `set` written after it never runs and proxy_pass sees "".
        set $rust_edge http://connector-rust:4000;
        # Strip the /rust prefix; with a variable proxy_pass nginx does no
        # prefix substitution of its own, so the rewrite carries it.
        rewrite ^/rust(/ilp.*)$ $1 break;
        proxy_pass $rust_edge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 4m;
    }

    # ââ Rust client BTP websocket carriage (client-edge-spec.md Â§1.9, PR #680) ââ
    # Dedicated exact-match block so the /rust/ilp POST path above stays
    # byte-untouched. Upgrade headers + long read timeout: one persistent
    # ordered session per client is the whole point of the transport.
    location = /rust/ilp/btp {
        set $rust_btp http://connector-rust:4000/ilp/btp;
        proxy_pass $rust_btp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /health {
        if ($health_backend != "") {
            proxy_pass $health_backend;
        }
        if ($health_backend = "") {
            return 404;
        }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        if ($backend = "") { return 404; }
        limit_req zone=node burst=400 nodelay;

        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;

        client_max_body_size 4m;
    }
}
