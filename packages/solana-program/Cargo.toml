[package]
name = "payment-channel"
version = "0.1.0"
edition = "2021"
description = "Solana payment channel program for ILP settlement"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=2.1.0"
spl-token = { version = "=6.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
ed25519-dalek = "=1.0.1"
solana-program-test = "=2.1.0"
solana-sdk = "=2.1.0"
spl-token = "=6.0.0"
tokio = { version = "1", features = ["full"] }
