# Minimal bare standalone connector config for the `connector up` CLI E2E test.
# No hub, no peers, settlement omitted — proves AC1/AC4 (standalone boot, no hub
# dependency). The CLI test rewrites the port placeholders at runtime to avoid
# collisions, so the literal ports here are only defaults for manual runs.
nodeId: cli-standalone
btpServerPort: 39200
healthCheckPort: 39201
environment: development
deploymentMode: standalone
logLevel: warn

adminApi:
  enabled: true
  port: 39202
  host: 127.0.0.1

transport:
  type: direct

peers: []
routes: []
