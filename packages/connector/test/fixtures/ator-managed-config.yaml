# Sample managed ATOR transport configuration fixture (Story 36.4, AC 12).
#
# This fixture serves as the reference configuration for the managed-lifecycle
# test path. Values are overridden at runtime by the test harness -- the
# placeholders below document the expected shape only.
#
# Used by: transport-ator-hidden-service.test.ts (Story 36.4)

transport:
  type: socks5
  managed: true
  externalUrl: 'auto'
  socksProxy: 'socks5h://127.0.0.1:9050'
  managedOptions:
    # Absolute path to the hidden-service key directory.
    # The managed client creates this directory if absent and writes an
    # `anonrc` file into it on first boot.
    hiddenServiceDir: '/tmp/ator-hs-placeholder'
    # Port to expose on the hidden service (maps to HS config).
    hiddenServicePort: 8443
    # Overall deadline for SOCKS port readiness (ms).
    startupTimeoutMs: 60000
    # Overall deadline for sdk.stop() (ms).
    stopTimeoutMs: 10000
