<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multichain Faucet</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 600px;
        width: 100%;
      }

      h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
        color: #667eea;
        text-align: center;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 1.1em;
      }

      .info-box {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 30px;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 0.95em;
      }

      .info-row:last-child {
        margin-bottom: 0;
      }

      .info-label {
        color: #666;
        font-weight: 500;
      }

      .info-value {
        color: #333;
        font-weight: 600;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 500;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1em;
        transition: border-color 0.3s;
        font-family: 'Courier New', monospace;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
      }

      button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1.1em;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }

      .message {
        padding: 12px;
        border-radius: 8px;
        margin-top: 20px;
        display: none;
      }

      .message.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .message.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .message.show {
        display: block;
      }

      .tx-link {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
      }

      .tx-link:hover {
        text-decoration: underline;
      }

      .loading {
        display: none;
        text-align: center;
        margin-top: 20px;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .footer {
        text-align: center;
        margin-top: 30px;
        color: #999;
        font-size: 0.9em;
      }

      .not-ready {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeaa7;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚰 Multichain Faucet</h1>
      <p class="subtitle">Get free testnet funds for the TOON devnet (EVM · Solana · Mina)</p>

      <div id="notReady" class="not-ready" style="display: none">
        ⚠️ Waiting for token contract deployment...
      </div>

      <div class="form-group">
        <label for="chain">Chain</label>
        <select
          id="chain"
          style="
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
          "
        >
          <option value="evm">EVM (ETH + USDC)</option>
          <option value="solana">Solana (SOL + USDC)</option>
          <option value="mina">Mina (public devnet)</option>
        </select>
      </div>

      <div class="info-box" id="infoBox">
        <div class="info-row">
          <span class="info-label" id="amount1Label">ETH per request:</span>
          <span class="info-value" id="amount1">-</span>
        </div>
        <div class="info-row">
          <span class="info-label" id="amount2Label">Tokens per request:</span>
          <span class="info-value" id="amount2">-</span>
        </div>
        <div class="info-row">
          <span class="info-label" id="contractLabel">Token contract:</span>
          <span
            class="info-value"
            id="contractValue"
            style="font-size: 0.8em; font-family: monospace"
            >-</span
          >
        </div>
      </div>

      <form id="faucetForm">
        <div class="form-group">
          <label for="address" id="addressLabel">Your Ethereum Address</label>
          <input type="text" id="address" placeholder="0x..." required />
        </div>

        <button type="submit" id="submitBtn">Request Funds 💧</button>
      </form>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 10px">Processing your request...</p>
      </div>

      <div class="message" id="message"></div>

      <div class="footer">Local Development Faucet</div>
    </div>

    <script>
      const form = document.getElementById('faucetForm');
      const addressInput = document.getElementById('address');
      const addressLabel = document.getElementById('addressLabel');
      const chainSelect = document.getElementById('chain');
      const submitBtn = document.getElementById('submitBtn');
      const message = document.getElementById('message');
      const loading = document.getElementById('loading');
      const notReady = document.getElementById('notReady');

      // Per-chain UI config. `route` matches the server endpoints.
      const CHAINS = {
        evm: {
          route: '/api/request',
          addressLabel: 'Your Ethereum Address',
          placeholder: '0x...',
          validate: (a) => /^0x[a-fA-F0-9]{40}$/.test(a),
        },
        solana: {
          route: '/api/solana/request',
          addressLabel: 'Your Solana Address (base58)',
          placeholder: 'Base58 pubkey...',
          validate: (a) => /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a),
        },
        mina: {
          route: '/api/mina/request',
          addressLabel: 'Your Mina Address (B62…)',
          placeholder: 'B62q...',
          validate: (a) => /^B62q[1-9A-HJ-NP-Za-km-z]{48,55}$/.test(a),
        },
      };

      let info = null;

      function currentChain() {
        return chainSelect.value;
      }

      // Render the info-box + address field for the selected chain.
      function renderChain() {
        const chain = currentChain();
        const cfg = CHAINS[chain];
        addressLabel.textContent = cfg.addressLabel;
        addressInput.placeholder = cfg.placeholder;

        const a1L = document.getElementById('amount1Label');
        const a1 = document.getElementById('amount1');
        const a2L = document.getElementById('amount2Label');
        const a2 = document.getElementById('amount2');
        const cL = document.getElementById('contractLabel');
        const cV = document.getElementById('contractValue');

        notReady.style.display = 'none';
        submitBtn.disabled = false;

        if (!info) return;
        const c = info.chains?.[chain] || {};

        if (chain === 'evm') {
          a1L.textContent = 'ETH per request:';
          a1.textContent = `${info.ethAmount} ETH`;
          a2L.textContent = 'Tokens per request:';
          a2.textContent = `${info.tokenAmount} ${info.tokenSymbol}`;
          cL.textContent = 'Token contract:';
          cV.textContent = info.tokenAddress || 'Not deployed yet';
          if (!info.ready) {
            notReady.style.display = 'block';
            submitBtn.disabled = true;
          }
        } else if (chain === 'solana') {
          a1L.textContent = 'SOL per request:';
          a1.textContent = c.enabled ? `${c.drips.sol} SOL` : 'disabled';
          a2L.textContent = 'USDC per request:';
          a2.textContent = c.enabled ? `${c.drips.usdc} USDC` : '-';
          cL.textContent = 'USDC mint:';
          cV.textContent = c.usdcMint || 'not configured';
          if (!c.enabled) {
            notReady.textContent = '⚠️ Solana faucet not configured on this host.';
            notReady.style.display = 'block';
            submitBtn.disabled = true;
          }
        } else if (chain === 'mina') {
          a1L.textContent = 'Per request:';
          a1.textContent = c.enabled
            ? `${c.drips.mina} MINA${c.drips.usdc ? ` + ${c.drips.usdc} USDC` : ''}`
            : 'disabled';
          a2L.textContent = 'Network:';
          a2.textContent = `${c.network || 'devnet'} (public)`;
          cL.textContent = c.enabled ? 'Treasury:' : 'Public faucet:';
          cV.textContent = c.enabled ? c.treasury : c.faucetUrl || '-';
          if (!c.enabled) {
            notReady.textContent =
              '⚠️ Mina drip not configured on this host — use the public faucet link.';
            notReady.style.display = 'block';
            submitBtn.disabled = true;
          }
        }
      }

      // Load faucet info
      async function loadInfo() {
        try {
          const response = await fetch('/api/info');
          info = await response.json();
          renderChain();
        } catch (error) {
          console.error('Failed to load faucet info:', error);
        }
      }

      function showMessage(html, type) {
        message.innerHTML = html;
        message.className = `message ${type} show`;
      }

      function hideMessage() {
        message.className = 'message';
      }

      chainSelect.addEventListener('change', () => {
        hideMessage();
        renderChain();
      });

      // Handle form submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessage();

        const chain = currentChain();
        const cfg = CHAINS[chain];
        const address = addressInput.value.trim();

        if (!cfg.validate(address)) {
          showMessage(`Invalid ${chain} address format`, 'error');
          return;
        }

        submitBtn.disabled = true;
        loading.style.display = 'block';

        try {
          const response = await fetch(cfg.route, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ address }),
          });

          const data = await response.json();

          if (!response.ok) {
            showMessage(`❌ ${data.error}: ${data.message || ''}`, 'error');
            return;
          }

          if (chain === 'evm') {
            showMessage(
              `✅ Sent ${data.transactions.eth.amount} ETH and ${data.transactions.token.amount} ${data.transactions.token.symbol} to ${address}`,
              'success'
            );
            addressInput.value = '';
          } else if (chain === 'solana') {
            const t = data.transactions;
            showMessage(
              `✅ Airdropped ${t.sol.amount} SOL and ${t.usdc.amount} USDC to ${address}<br/>` +
                `<small>SOL sig: ${t.sol.signature}<br/>USDC sig: ${t.usdc.signature}</small>`,
              'success'
            );
            addressInput.value = '';
          } else if (chain === 'mina') {
            const p = data.payment;
            const u = data.usdc || {};
            // The USDC leg is a treasury TRANSFER (the rate-limited token has
            // no admin-mint); it may be pending (circuits warming), limited
            // (per-address cooldown), skipped, or failed — all alongside a
            // successful native drip.
            const usdcLine = u.amount
              ? `<br/>✅ Sent ${u.amount} USDC (treasury transfer)<br/><small>transfer hash: ${u.transferHash || '-'}</small>`
              : u.pending
                ? '<br/>⏳ USDC transfer queued (zk circuits still warming — it will land shortly).'
                : u.limited
                  ? '<br/>ℹ️ USDC skipped: this address is in its drip cooldown window.'
                  : u.error
                    ? `<br/>⚠️ USDC drip failed: ${u.message || u.error}`
                    : '';
            showMessage(
              `✅ Sent ${p.amount} MINA to ${address}<br/>` +
                `<small>payment hash: ${p.hash || p.id}</small>` +
                usdcLine,
              'success'
            );
            addressInput.value = '';
          }
        } catch (error) {
          showMessage(`❌ Request failed: ${error.message}`, 'error');
        } finally {
          loading.style.display = 'none';
          submitBtn.disabled = false;
        }
      });

      // Load info on page load
      loadInfo();

      // Refresh info every 10 seconds
      setInterval(loadInfo, 10000);
    </script>
  </body>
</html>
