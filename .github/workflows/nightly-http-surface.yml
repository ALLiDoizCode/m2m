# Nightly HTTP-surface E2E workflow -- AG3 stop-the-line policy
#
# Enforces the stop-the-line policy documented in CLAUDE.md:
#   - No merges to main while this suite is red
#   - Triage must begin within 24 hours of failure
#
# This workflow exercises all three HTTP-surface test suites against the
# real connector Docker image (standalone-e2e profile):
#   - admin-surface:  Every inventoried admin API endpoint (Story 38.2)
#   - cross-surface:  Peer-state consistency across HTTP surfaces (Epic 37)
#   - packet-flow:    Packet counter invariants across observability surfaces
#
# Prerequisite: docker compose --profile standalone-e2e build succeeds.
# The test suites manage their own container lifecycle (up/down) internally
# via docker compose --profile standalone-e2e.

name: nightly-http-surface

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC daily
  workflow_dispatch: {}

# Principle of least privilege (OWASP CI/CD-SEC-4): restrict GITHUB_TOKEN
# permissions to the minimum needed. This workflow only reads code and
# uploads artifacts -- no pushes, no deployments, no PR writes.
permissions:
  contents: read

jobs:
  http-surface:
    name: HTTP Surface E2E (admin + cross + packet-flow)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies with retry
        uses: nick-fields/retry@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          # Two-phase install (#156): the @anyone-protocol/anyone-client
          # postinstall makes an UNAUTHENTICATED api.github.com call as its
          # first action with no skip-if-exists guard, exhausting the 60/hr
          # per-IP limit and 403-ing runners. patch-package adds an auth
          # header, but a dependency's own postinstall runs before the root
          # postinstall on a plain `npm ci` -- so we ignore scripts first,
          # apply the patch, then `npm rebuild` to run all deps' (now patched)
          # install/postinstall scripts with GITHUB_TOKEN in env.
          command: |
            npm ci --ignore-scripts --verbose
            npx patch-package
            npm rebuild --foreground-scripts

      - name: Install libsql native module for Linux
        run: |
          # Force install the Linux x64 glibc native module for libsql
          # (package-lock.json may have been generated on macOS)
          npm install @libsql/linux-x64-gnu --no-save --ignore-scripts || true

      - name: Build shared and mina-zkapp packages
        run: |
          npm run build --workspace=packages/shared
          test -d packages/shared/dist || (echo "shared build failed" && exit 1)
          npm run build --workspace=packages/mina-zkapp
          test -d packages/mina-zkapp/dist || (echo "mina-zkapp build failed" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build connector image (standalone-e2e profile)
        run: docker compose --profile standalone-e2e build

      - name: Run admin-surface test suite
        run: npm run test:admin-surface --workspace=packages/connector
        env:
          CI: true
          NODE_ENV: test
          STANDALONE_DOCKER: 'true'

      - name: Run cross-surface invariant test suite
        run: npm run test:cross-surface --workspace=packages/connector
        env:
          CI: true
          NODE_ENV: test
          STANDALONE_DOCKER: 'true'

      - name: Run packet-flow invariant test suite
        run: npm run test:packet-flow --workspace=packages/connector
        env:
          CI: true
          NODE_ENV: test
          STANDALONE_DOCKER: 'true'

      - name: Write failure job summary (stop-the-line escalation)
        if: failure()
        run: |
          {
            echo "## Nightly HTTP Surface Failed -- Stop the Line"
            echo ""
            echo "> **No merges to main until this suite is green.**"
            echo ""
            echo "### Escalation Steps"
            echo ""
            echo "| Window | Action |"
            echo "| ------ | ------ |"
            echo "| Hour 0-4 | Engineer on-call investigates; check compose logs in Artifacts |"
            echo "| Hour 4-8 | If root cause not identified, escalate to team lead |"
            echo "| Hour 8-24 | If not resolved, emergency team sync + consider rollback |"
            echo ""
            echo "### Reproduce Locally"
            echo ""
            echo '```bash'
            echo 'docker compose --profile standalone-e2e build'
            echo 'npm run test:admin-surface --workspace=packages/connector'
            echo 'npm run test:cross-surface --workspace=packages/connector'
            echo 'npm run test:packet-flow --workspace=packages/connector'
            echo '```'
            echo ""
            echo "Run: \`${{ github.workflow }}\` #\`${{ github.run_number }}\`"
            echo "Triggered by: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture compose logs on failure
        if: failure()
        run: |
          docker compose --profile standalone-e2e logs --no-color > /tmp/http-surface-compose-logs.txt 2>&1 || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: http-surface-compose-logs-${{ github.run_number }}
          path: /tmp/http-surface-compose-logs.txt
          retention-days: 7

      - name: Tear down standalone-e2e stack
        if: always()
        run: docker compose --profile standalone-e2e down --volumes || true
