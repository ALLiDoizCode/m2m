# Nightly ATOR integration workflow -- Epic 36 Story 36.5
#
# Runs the real-binary ATOR suite (Stories 36.3 + 36.4) and a system-tor
# fallback smoke test nightly on Linux + macOS.
#
# T-36.5-01: Nightly cron fires at 04:00 UTC daily.
# T-36.5-02: workflow_dispatch allows manual runs from the Actions UI or
#             `gh workflow run nightly-ator --ref <branch>`.
#
# arm64 coverage gap (T-36.5-09):
#   GitHub-hosted macos-14 runners are Apple Silicon (arm64) running under
#   Rosetta emulation for x86_64 Docker images. Native arm64 Linux runners
#   are not yet available on the free tier. The `anon` Docker image is
#   built for amd64; on macos-14 it runs under Rosetta with ~20% latency
#   penalty. True native arm64 CI coverage is deferred to Epic 36 retro
#   follow-up. See: _bmad-output/planning-artifacts/epic-36-real-binary-ator-verification.md
#
# This workflow is NOT added to required PR status checks -- it is nightly
# only. Use workflow_dispatch for manual transport-touching PR verification.

name: nightly-ator

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC daily
  workflow_dispatch: {}

# Principle of least privilege (OWASP CI/CD-SEC-4): restrict GITHUB_TOKEN
# permissions to the minimum needed. This workflow only reads code and
# uploads artifacts -- no pushes, no deployments, no PR writes.
permissions:
  contents: read
  actions: write # required for actions/upload-artifact

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Real-binary ATOR integration suite (Stories 36.3 + 36.4)
  # T-36.5-05: Linux + macOS matrix
  # T-36.5-04: 30-minute timeout budget per leg
  # ---------------------------------------------------------------------------
  real-binary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci --verbose

      - name: Install libsql native module for Linux
        if: runner.os == 'Linux'
        run: |
          # Force install the Linux x64 glibc native module for libsql
          # (package-lock.json may have been generated on macOS)
          npm install @libsql/linux-x64-gnu --no-save --ignore-scripts || true

      - name: Build shared and mina-zkapp packages
        run: |
          echo "Building shared package..."
          npm run build --workspace=packages/shared
          test -d packages/shared/dist && echo "Shared package built successfully" || (echo "Shared package build failed" && exit 1)

          echo "Building mina-zkapp package..."
          npm run build --workspace=packages/mina-zkapp
          test -d packages/mina-zkapp/dist && echo "Mina zkApp package ready" || exit 1

      # T-36.5-06: macOS Docker availability check.
      # GitHub-hosted macos-14 runners include Docker Desktop (Apple Silicon).
      # If Docker is unavailable (future runner changes), skip gracefully.
      - name: Check Docker availability
        id: docker-check
        run: |
          if docker --version > /dev/null 2>&1; then
            echo "docker_available=true" >> "$GITHUB_OUTPUT"
            echo "Docker is available: $(docker --version)"
          else
            echo "docker_available=false" >> "$GITHUB_OUTPUT"
            echo "Docker is NOT available on this runner -- skipping Docker-dependent tests"
          fi

      - name: Start ATOR network
        if: steps.docker-check.outputs.docker_available == 'true'
        run: docker compose --profile ator up -d

      - name: Wait for hs1 container health
        if: steps.docker-check.outputs.docker_available == 'true'
        run: |
          echo "Waiting for hs1 SOCKS5 port to become reachable..."
          for i in $(seq 1 60); do
            if docker compose port hs1 9050 > /dev/null 2>&1; then
              HOST_PORT="$(docker compose port hs1 9050 | awk -F: '{print $2}')"
              if [ -n "$HOST_PORT" ]; then
                echo "hs1 SOCKS5 port ready on host port $HOST_PORT (attempt $i)"
                exit 0
              fi
            fi
            echo "Attempt $i/60 -- waiting..."
            sleep 2
          done
          echo "hs1 SOCKS5 port did not become reachable within 120s"
          docker compose --profile ator logs || true
          exit 1

      - name: Run real-binary ATOR test suite
        if: steps.docker-check.outputs.docker_available == 'true'
        run: make ator-test

      - name: Skip notice (Docker unavailable)
        if: steps.docker-check.outputs.docker_available != 'true'
        run: |
          echo "::warning::Docker is not available on this ${{ matrix.os }} runner. Skipping real-binary ATOR tests. System-tor fallback job still runs."

      # T-36.5-03: Record pinned ATOR .deb version in job summary
      - name: Record ATOR version in job summary
        if: always() && steps.docker-check.outputs.docker_available == 'true'
        run: |
          echo "## ATOR Binary Version" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Extract version from hs1 container
          ANON_VERSION="$(docker compose exec hs1 anon --version 2>/dev/null || echo 'unable to query')"
          echo "Pinned anon version: \`${ANON_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner: \`${{ matrix.os }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: \`${{ github.workflow }}\` run \`${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"

      # T-36.5-08: Upload compose logs on failure
      - name: Upload compose logs on failure
        if: failure() && steps.docker-check.outputs.docker_available == 'true'
        run: docker compose --profile ator logs > /tmp/ator-compose-logs.txt 2>&1 || true

      - name: Upload failure artifacts
        if: failure() && steps.docker-check.outputs.docker_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ator-compose-logs-${{ matrix.os }}-${{ github.run_number }}
          path: /tmp/ator-compose-logs.txt
          retention-days: 7

      # Teardown: always runs to avoid leaked containers
      - name: Tear down ATOR network
        if: always() && steps.docker-check.outputs.docker_available == 'true'
        run: docker compose --profile ator down -v

  # ---------------------------------------------------------------------------
  # Job 2: System-tor fallback smoke test (T-36.5-07)
  # Proves SocksTransportProvider works with `apt-get install tor` (Linux)
  # and `brew install tor` (macOS) -- Epic 35 R-005 system-tor fallback.
  # ---------------------------------------------------------------------------
  system-tor-fallback:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install: 'sudo apt-get update && sudo apt-get install -y tor'
            start: 'sudo systemctl start tor || (tor & echo $! > /tmp/tor.pid)'
            stop: 'sudo systemctl stop tor || { [ -f /tmp/tor.pid ] && kill "$(cat /tmp/tor.pid)" 2>/dev/null; } || true'
          - os: macos-14
            install: 'brew install tor'
            start: 'brew services start tor || (tor & echo $! > /tmp/tor.pid)'
            stop: 'brew services stop tor || { [ -f /tmp/tor.pid ] && kill "$(cat /tmp/tor.pid)" 2>/dev/null; } || true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci --verbose

      - name: Install libsql native module for Linux
        if: runner.os == 'Linux'
        run: |
          npm install @libsql/linux-x64-gnu --no-save --ignore-scripts || true

      - name: Build shared and mina-zkapp packages
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=packages/mina-zkapp

      # Install system tor via platform-specific package manager.
      # Version pinning (R-36-07): we install unpinned `tor` to avoid
      # package-manager resolution failures across runner image updates.
      # Version drift risk between apt and brew is accepted; the smoke test
      # validates SOCKS5 protocol compatibility, not version-specific behavior.
      - name: Install system tor
        run: ${{ matrix.install }}

      - name: Start system tor
        run: ${{ matrix.start }}

      # nc -z is supported on both ubuntu (GNU netcat) and macos-14 (BSD netcat).
      - name: Wait for SOCKS5 port 9050
        run: |
          echo "Waiting for system tor SOCKS5 port 9050..."
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 9050 2>/dev/null; then
              echo "System tor SOCKS5 port ready (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/30 -- waiting..."
            sleep 1
          done
          echo "System tor SOCKS5 port 9050 did not become ready within 30s"
          exit 1

      - name: Run system-tor fallback smoke test
        run: |
          npx jest test/integration/transport-system-tor-fallback.test.ts --ci --verbose
        working-directory: packages/connector
        env:
          CI: true
          NODE_ENV: test
          SYSTEM_TOR_SMOKE: '1'

      - name: Stop system tor
        if: always()
        run: ${{ matrix.stop }}

  # ---------------------------------------------------------------------------
  # Job 3: Standalone mode + public ATOR container E2E
  # Brings up the connector Docker image with deploymentMode=standalone and
  # transport=socks5 pointing at a live public Anyone proxy. Proves the image
  # boots and operates with that combination. Linux-only — docker-in-docker
  # on macos-14 runners is flaky for compose-profile builds.
  # ---------------------------------------------------------------------------
  standalone-ator-public:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build connector image
        run: docker compose --profile standalone-ator-public build

      - name: Run standalone + public ATOR container E2E
        run: npm run test:standalone-ator-public --workspace=packages/connector
        env:
          CI: true
          NODE_ENV: test
          STANDALONE_DOCKER: 'true'
          ATOR_PUBLIC: '1'

      - name: Capture compose logs on failure
        if: failure()
        run: docker compose --profile standalone-ator-public logs --no-color || true

      - name: Tear down stack
        if: always()
        run: docker compose --profile standalone-ator-public down --volumes || true

  # ---------------------------------------------------------------------------
  # Job 4: Standalone peer-to-peer ILP over public ATOR (full production
  # topology). Two standalone connector containers, each paired with an anon
  # sidecar hosting a hidden service; packets traverse the public Anyone
  # network via .anon rendezvous. Linux-only — public infra flakiness is
  # tolerable at nightly cadence but unsuitable for PR CI.
  # ---------------------------------------------------------------------------
  standalone-ator-p2p:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build connector + sidecar images
        run: docker compose --profile standalone-ator-p2p build

      - name: Run peer-to-peer standalone E2E over public ATOR
        run: npm run test:standalone-ator-p2p --workspace=packages/connector
        env:
          CI: true
          NODE_ENV: test
          STANDALONE_DOCKER: '1'
          ATOR_PUBLIC_P2P: '1'

      - name: Capture compose logs on failure
        if: failure()
        run: docker compose --profile standalone-ator-p2p logs --no-color || true

      - name: Tear down stack
        if: always()
        run: docker compose --profile standalone-ator-p2p down --volumes || true
