# Fleet operations — live devnet box work, run as a workflow rather than as an
# agent (toon-meta#335, toon-meta#309).
#
# ── SCOPE: THE FAUCET BOX ONLY ──────────────────────────────────────────────
# This file used to operate on all three devnet boxes. The relay and store
# (`ario`) boxes no longer run anything this repo deploys: both were
# re-pointed at their OWN repos' `deploy/` bundles (`toon-protocol/relay`,
# `toon-protocol/store`), each pinning the connector image by release handle
# in exactly one place in that repo. Issue #1213 found this file scp'ing
# `infra/linode-{relay,store}/connector-rust.toml` to `/root/connector` on
# those boxes — a checkout neither box's running container reads any more —
# and re-reading the same dead path back to "confirm" the write. It reported
# success while the box was unchanged. ADR 0066 records the retirement this
# file is now scoped to match: a node repo pins the connector; nothing here
# moves a tag onto a relay or store box, and this file no longer offers to.
#
# The faucet box is different and stays: it has no connector (toon-meta
# `two-node-architecture.md` §4) and still deploys from THIS repo's
# `infra/linode-faucet/`, so `box-status`/`restart`/`deploy` against it are
# real operations against a stack this repo owns.
#
# `config-read`/`pin-verify`/`config-apply` are gone with the relay/store
# legs — they existed to read and write a bind-mounted `connector-rust.toml`,
# and the faucet has no connector and no such file (its env comes from a
# `.env` on the box, generated by a human per `docs/operators/faucet-box-
# bringup.md`, not from a committed TOML this workflow could apply).
#
# ── WHY A WORKFLOW AND NOT AN AGENT ─────────────────────────────────────────
# A class of devnet tickets is blocked on nothing but reach: read what a live
# box is actually running, restart or redeploy the thing that's running it.
# Those are not design decisions — they are deterministic operations a human
# has been doing by hand at a terminal.
#
# It must not run inside the agent sandbox. `.sandcastle/sandbox-
# secrets.ts` forwards exactly two values into the container
# (CLAUDE_CODE_OAUTH_TOKEN, GH_TOKEN); an SSH key with root on the boxes is
# not going to be the third. The key reaches a GitHub-hosted runner executing
# THIS file — reviewed, committed, deterministic — and never reaches a
# container running agent-authored code. Same shape as `funded-ops.yml`.
#
# An agent DISPATCHES this (its App token carries `actions: write`) and reads
# the run's summary back. It never holds the credential.
#
# ── THE RULE THIS FILE EXISTS TO ENCODE ─────────────────────────────────────
# The box runs hand-tuned, BIND-MOUNTED compose config that LEADS the repo
# copy, and `docker compose up -d` DOES NOT RELOAD A BIND-MOUNTED FILE — it
# reports `Running` and changes nothing (ADR 0009). `restart` restarts the
# service that reads whatever is already on disk; it does not pull anything.
#
# `deploy` is the other half: a bumped `image:` pin reaches a box only by
# recreating the CONTAINER, which is exactly what `up -d` does and what
# `restart` does not. `deploy` pulls the pin the box's checkout names,
# recreates the service, and then proves the running container's image id IS
# that pin's — re-reading the box rather than trusting the write.
#
# ── SAFETY ──────────────────────────────────────────────────────────────────
#   * `apply` defaults to false. A dry run reads the box, prints what it
#     would do, and changes nothing.
#   * `box-status` never takes the write path and is safe at any time.
#   * Every write RE-READS the box afterwards and fails the job if the box
#     does not reflect the request. A successful ssh/scp exit code is not the
#     source of truth; the box is. (Same doctrine as funded-ops.yml, where a
#     transaction receipt is not trusted and the contract is re-read.)
#   * The SSH key is written 0600 to a job-local file and removed in an
#     `always()` step. Host keys are pinned per run via `accept-new`, so a
#     changed host key fails the run instead of being trusted silently.
#
# ── REQUIRED SECRET ─────────────────────────────────────────────────────────
#   DEVNET_SSH_KEY   Private half of a DEVNET-SCOPED key authorized as root on
#                    the faucet box. NOT the operator's personal key, and NOT
#                    E2E_DEV_MNEMONIC (which is mainnet-capable — see
#                    .sandcastle/sandbox-secrets.ts).
#   LINODE_CLI_TOKEN Existing org secret. Used only to resolve the box label
#                    to its current IP, so no IP is hardcoded here.

name: fleet-ops

run-name: "fleet-ops ${{ inputs.operation }} on faucet (apply=${{ inputs.apply }})"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "box-status (read) — restart | deploy (writes)"
        type: choice
        required: true
        default: box-status
        options: [box-status, restart, deploy]
      service:
        description: "restart/deploy: compose service name (faucet, nginx, certbot)."
        type: string
        required: false
        default: "faucet"
      apply:
        description: "Perform the write. false = dry run, reads and prints only."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # One fleet operation at a time. Two concurrent runs could restart the box
  # while another is mid-deploy against it.
  group: fleet-ops
  cancel-in-progress: false

jobs:
  fleet-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPERATION: ${{ inputs.operation }}
      SERVICE: ${{ inputs.service }}
      APPLY: ${{ inputs.apply }}
      LINODE_API: https://api.linode.com/v4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Fail closed, and fail EARLY, on a missing credential ──────────────
      # Without this the job would get as far as ssh and emit an unreadable
      # "Permission denied (publickey)" with no hint that the secret is simply
      # not set yet.
      - name: Preconditions
        env:
          DEVNET_SSH_KEY: ${{ secrets.DEVNET_SSH_KEY }}
          LINODE_CLI_TOKEN: ${{ secrets.LINODE_CLI_TOKEN }}
        run: |
          set -euo pipefail
          fail=0
          if [ -z "${DEVNET_SSH_KEY:-}" ]; then
            echo "::error::DEVNET_SSH_KEY is not set. This workflow cannot reach the box."
            echo "::error::It is a one-time human step: mint a devnet-scoped key, add it as an"
            echo "::error::org secret, and authorize it as root on the faucet box."
            fail=1
          fi
          if [ -z "${LINODE_CLI_TOKEN:-}" ]; then
            echo "::error::LINODE_CLI_TOKEN is not set — cannot resolve the box label to an IP."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "Preconditions OK."

      - name: Resolve box IP from its Linode label
        id: box
        env:
          LINODE_CLI_TOKEN: ${{ secrets.LINODE_CLI_TOKEN }}
        run: |
          set -euo pipefail
          ip=$(curl -sf -H "Authorization: Bearer $LINODE_CLI_TOKEN" \
                 "$LINODE_API/linode/instances" \
               | jq -r '.data[] | select(.label=="faucet") | .ipv4[0]' | head -1)
          if [ -z "$ip" ] || [ "$ip" = "null" ]; then
            echo "::error::No Linode labelled 'faucet'."
            exit 1
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "faucet is $ip"

      - name: Install SSH key
        env:
          DEVNET_SSH_KEY: ${{ secrets.DEVNET_SSH_KEY }}
          BOX_IP: ${{ steps.box.outputs.ip }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEVNET_SSH_KEY" > ~/.ssh/devnet
          chmod 600 ~/.ssh/devnet
          # accept-new: trust on first use for this ephemeral runner, but a
          # CHANGED host key still fails rather than being accepted silently.
          {
            echo "Host devnet-box"
            echo "  HostName $BOX_IP"
            echo "  User root"
            echo "  IdentityFile ~/.ssh/devnet"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ConnectTimeout 30"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh -F ~/.ssh/config -o LogLevel=ERROR devnet-box true \
            && echo "SSH reachable." \
            || { echo "::error::Cannot SSH to the faucet box. Is DEVNET_SSH_KEY authorized as root on it?"; exit 1; }

      - name: Run operation
        id: run
        env:
          BOX_IP: ${{ steps.box.outputs.ip }}
        run: |
          set -euo pipefail

          COMPOSE="docker compose -f infra/linode-faucet/docker-compose.faucet.yml"
          REMOTE_REPO=/root/connector

          sshbox() { ssh -F ~/.ssh/config -o LogLevel=ERROR devnet-box "$@"; }
          say() { echo "$@" >> "$GITHUB_STEP_SUMMARY"; }

          say "## fleet-ops — \`faucet\` · \`$OPERATION\`"
          say ""
          say "Box IP resolved from Linode label. Mode: **$([ "$APPLY" = "true" ] && echo APPLY || echo DRY-RUN)**."
          say ""

          case "$OPERATION" in

            box-status)
              say '```'
              sshbox 'uptime; echo; docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"' \
                | tee -a "$GITHUB_STEP_SUMMARY"
              say '```'
              ;;

            restart)
              if [ "$APPLY" != "true" ]; then
                say "**Dry run.** Would run: \`$COMPOSE restart $SERVICE\` on the faucet box."
                exit 0
              fi
              sshbox "cd $REMOTE_REPO && $COMPOSE restart '$SERVICE'"
              say "Restarted \`$SERVICE\`."
              say '```'
              sshbox "docker ps --format 'table {{.Names}}\t{{.Status}}'" | tee -a "$GITHUB_STEP_SUMMARY"
              say '```'
              ;;

            deploy)
              # `restart` only restarts the CONTAINER THAT IS ALREADY RUNNING —
              # it does not re-resolve the compose file's `image:` pin. `deploy`
              # pulls the pin this checkout's compose file currently names and
              # recreates the container from it.
              if [ "$APPLY" != "true" ]; then
                say "**Dry run.** Would run on the faucet box: \`git pull --ff-only\`, then \`$COMPOSE pull $SERVICE && $COMPOSE up -d --no-deps $SERVICE\`, then fail unless the running container's image id equals the id of the pin the refreshed checkout names."
                exit 0
              fi
              # The box's checkout IS the deploy input: compose reads
              # /root/connector, so a stale checkout silently redeploys the
              # OLD pin. Fail-closed, no `|| true`: a diverged or detached
              # checkout means the pin about to deploy is not the committed
              # one, which is this verb's whole job.
              sshbox "cd $REMOTE_REPO && git pull --ff-only"
              PINNED=$(sshbox "cd $REMOTE_REPO && $COMPOSE config --format json" | jq -r --arg s "$SERVICE" '.services[$s].image // empty')
              if [ -z "$PINNED" ]; then
                echo "::error::service '$SERVICE' names no image in the faucet box's compose file"
                exit 1
              fi
              # --no-deps: `up -d` CREATES a named service's declared
              # dependencies too. `nginx` depends on `faucet`
              # (`required: false`), and a deploy of one service should
              # never bring the other's dependency graph along with it.
              sshbox "cd $REMOTE_REPO && $COMPOSE pull '$SERVICE' && $COMPOSE up -d --no-deps '$SERVICE'"
              # Re-read OFF THE BOX (this file's own doctrine): the running
              # container's image id must be the id of the pin just pulled.
              # `docker ps` output alone cannot distinguish a no-op from a
              # rollout.
              RUNNING=$(sshbox "cd $REMOTE_REPO && docker inspect -f '{{.Image}}' \$($COMPOSE ps -q '$SERVICE')")
              PULLED=$(sshbox "docker image inspect -f '{{.Id}}' '$PINNED'")
              if [ -z "$RUNNING" ] || [ "$RUNNING" != "$PULLED" ]; then
                say ""
                say "**FAILED** — running image (\`${RUNNING:-none}\`) is not the pulled pin \`$PINNED\` (\`$PULLED\`)."
                echo "::error::post-deploy read-back: the running image does not match the pinned tag"
                exit 1
              fi
              say "Pulled and redeployed \`$SERVICE\` — running image verified as \`$PINNED\`."
              say '```'
              sshbox "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'" | tee -a "$GITHUB_STEP_SUMMARY"
              say '```'
              ;;
          esac

      # ── Health gate ─────────────────────────────────────────────────────────
      # Any write could have left the box serving nothing. Prove it still
      # serves before the job goes green. GET /health is the faucet's own
      # liveness check.
      - name: Verify the box still serves
        if: >-
          inputs.apply &&
          (inputs.operation == 'restart' || inputs.operation == 'deploy')
        env:
          BOX_IP: ${{ steps.box.outputs.ip }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if ssh -F ~/.ssh/config -o LogLevel=ERROR devnet-box \
                 'curl -sf http://127.0.0.1:3500/health >/dev/null'; then
              echo "Faucet healthy." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Faucet did not become healthy within 90s after the write."
          echo "**UNHEALTHY after the write — investigate before running anything else.**" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/devnet ~/.ssh/config
