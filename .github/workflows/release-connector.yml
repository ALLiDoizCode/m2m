# release-connector — one deliberate act, then everything after it.
#
# ── WHAT THIS IS, AND THE ONE THING IT MUST NEVER BECOME ────────────────────
# Cutting a connector release used to be six separate acts, each with its own
# way of being forgotten: wait for the green-main build, find its `rust-sha-`
# tag, decide what to call this state of the world, write it down somewhere,
# dispatch `promote-to-fleet`, then check the fleet came back. Every one of
# those is mechanical. Exactly one of them is a judgement: **which build
# should front the live devnet.**
#
# This workflow automates the mechanical five and leaves the judgement where
# it is. It is `workflow_dispatch` ONLY. It has no `push:` trigger, no
# `schedule:`, and no `workflow_run:` chaining off a green build, and adding
# one would be a reversal of ADR 0041 Decision 3 rather than a convenience:
#
#   "The connector image does not follow rule 1 by checking — it is not
#    auto-deployed at all."
#
# That decision is not a general taste for gates. `connector-rust` is the
# client edge on BOTH devnet boxes — every paid write enters through it — and
# `announce` is the same image, so one bad digest takes the whole devnet's
# paid-write path dark on two machines at once. Auto-on-green for this image
# shipped once (connector#990), reached both live boxes within ~60s of every
# merge, and was reverted. `the_release_workflow_is_dispatch_only` in
# crates/connector-bin/tests/fleet_release_gate.rs is the regression guard;
# it fails the build if a trigger is ever added here.
#
# The record for this workflow is ADR 0055. ADR 0041 remains the record for
# WHY the tag is supervised at all, and nothing here changes it.
#
# ── THE RELEASE HANDLE IS A DATE AND A COUNTER, NOT A VERSION ───────────────
# A release is named `2026.08.21.1`: UTC date, then the 1-based ordinal of
# that day's releases. Monotonic, sortable with `sort -V`, and it says exactly
# what it knows — when this state of the world was cut, and in what order.
#
# It is deliberately NOT semver, for the reason deploy/connector-rust/README.md
# already gives about the image tags: no crate under `crates/` has a release
# process, every one of them is `0.1.0`, and a `1.4.0` here "would claim a
# stability contract the binary hasn't earned". A MINOR/MAJOR series is a
# promise about compatibility; this project has not made that promise, and a
# version number that lies is worse than no version number — someone
# eventually pins against it.
#
# The deploy-ordering information a MAJOR bump is usually smuggled in to carry
# rides as DATA instead, in the release body:
#
#     config-change-required: true
#
# promote-to-fleet.yml reads that line and refuses to move `:rust-release`
# when it is `true` and the committed box configs have not been landed and
# applied first. That is ADR 0041 rule 2 turned from a sentence in a PR body
# into a check — swap#134 wrote that sentence, in its own PR body, and the
# relay's maker crash-looped anyway, because nothing read it at the moment the
# tag moved. An overloaded integer would have carried the same fact in a form
# no workflow could act on.
#
# (`package.json` still says `"version": "3.3.0"`. That is TypeScript-era
# residue for the npm packages under `packages/`, it is not this binary's
# version, and it is deliberately untouched.)
#
# ── THE SEQUENCE ────────────────────────────────────────────────────────────
#   version   compute the next handle, and refuse to reuse one
#   build     call publish-connector-rust-image.yml — ONE build definition,
#             shared with green main, stamped with the handle
#   release   create the GitHub Release, carrying the machine-readable
#             `config-change-required` line and the `rust-sha-` tag to promote
#   promote   call promote-to-fleet.yml — which runs every existing check
#             (immutable tag, on main, no silent rollback, boots both boxes'
#             committed configs) plus the ordering gate above, moves
#             `:rust-release`, and calls fleet-health.yml afterwards
#
# `promote` is a job, not a step, and it CALLS the promotion workflow rather
# than retagging here. There is exactly one thing in this repository that
# moves `:rust-release`, and a second copy of those checks — inevitably the
# less-exercised copy — is how they would come apart.
#
# ── WHEN IT STOPS HALFWAY ───────────────────────────────────────────────────
# If `promote` refuses, the release still exists. That is the intended
# outcome and not an incident; it is ADR 0041's "the fleet can be left behind
# deliberately", and it is also what `promote: false` asks for on purpose.
# The build is published, the handle is spent, and the boxes keep serving the
# previous build. Recover by landing/applying the config and then dispatching
# promote-to-fleet.yml directly with the `rust-sha-` tag the release names —
# not by re-running this workflow, which would cut a second handle for the
# same code.

name: release-connector

# DISPATCH ONLY. See the header. Do not add `push`, `schedule` or
# `workflow_run` — fleet_release_gate.rs fails the build if you do.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this build is being released. Recorded in the release notes and the summary.'
        type: string
        required: true
      config_change_required:
        description: >-
          Does this build REQUIRE a committed box config change to boot? `yes`
          only for a new required key, a renamed field or a narrowed type (ADR
          0041 rule 2) — a price or endpoint edit the old binary also accepts
          is `no`. There is no default: leaving the sentinel selected refuses
          the release.
        type: choice
        required: true
        default: '-- select --'
        options:
          - '-- select --'
          - 'no'
          - 'yes'
      config_applied_run:
        description: >-
          URL(s) or run id(s) of the fleet-ops.yml `config-apply` run that put
          the committed box configs on the boxes — one per box that changed,
          space- or comma-separated. Required when the answer above is `yes`.
          promote-to-fleet.yml VERIFIES these: workflow, conclusion, operation,
          apply=true, box coverage, and that the run started after the config
          commit.
        type: string
        required: false
        default: ''
      promote:
        description: 'Move :rust-release to this build. Untick to cut a release and leave the fleet where it is.'
        type: boolean
        required: false
        default: true
      skip_health_check:
        description: 'Skip the post-promotion fleet probe. Use only when the boxes are already known-down.'
        type: boolean
        required: false
        default: false
      notes:
        description: 'Extra release notes, appended verbatim under the generated body.'
        type: string
        required: false
        default: ''

permissions:
  # `gh release create` writes a tag and a release. This is also the widest
  # permission any called workflow below can hold — a called workflow is
  # capped by its caller, which is the trap connector#965 hit — so
  # `packages: write` (the build and the retag) and `issues: write`
  # (fleet-health's rolling alert, three levels down) must be declared here
  # or those jobs startup-fail rather than failing informatively.
  contents: write
  packages: write
  issues: write
  # promote-to-fleet.yml's ordering gate reads the fleet-ops run it is given --
  # its `display_title`, and its LOGS for runs cut before fleet-ops.yml carried
  # a `run-name:`. A called workflow is capped by its caller, so the scope has
  # to be granted here too.
  actions: read

concurrency:
  # Never two releases at once: the handle is computed from the tags that
  # exist, so two concurrent runs would race to `2026.08.21.1` and one would
  # fail at `gh release create` after having already built an image.
  group: release-connector
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/connector

jobs:
  # ── 1. The handle ─────────────────────────────────────────────────────────
  version:
    name: Cut the release handle
    runs-on: ubuntu-latest
    outputs:
      handle: ${{ steps.handle.outputs.handle }}
      sha: ${{ steps.handle.outputs.sha }}
      short: ${{ steps.handle.outputs.short }}
      config_change: ${{ steps.ordering.outputs.config_change }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags are how the handle series is discovered, and the ancestry
          # check below needs history rather than a shallow tip.
          fetch-depth: 0
          fetch-tags: true

      - name: The released commit must be on main
        run: |
          set -euo pipefail
          # A release fronts the live fleet. promote-to-fleet.yml enforces
          # this too, but failing here costs no build: an off-main dispatch
          # would otherwise burn ten minutes of runner and a handle before
          # being refused at the last job.
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::${{ github.sha }} is not an ancestor of origin/main."
            echo "::error::Only a build of main may front the live fleet (ADR 0041). Re-dispatch on main."
            exit 1
          fi
          echo "✓ ${{ github.sha }} is on main."

      - name: Compute the next handle
        id: handle
        run: |
          set -euo pipefail
          # UTC, always. A runner is UTC and a local date would make the
          # series non-monotonic for anyone west of Greenwich.
          DATE=$(date -u +%Y.%m.%d)

          # The existing git tags ARE the series. Not `gh release list`: a
          # release can be deleted while its tag survives, and reusing a
          # handle whose tag is still in the history would produce two
          # different commits answering to one name.
          N=0
          for T in $(git tag -l "${DATE}.*"); do
            ORD="${T##*.}"
            case "$ORD" in
              '' | *[!0-9]*) continue ;;
            esac
            # An `if`, not `[ … ] && N=…`: the latter leaves the whole loop
            # with exit status 1 whenever the last tag examined is not the
            # highest, which under `set -e` is a trap waiting for whoever
            # appends a command after it.
            if [ "$ORD" -gt "$N" ]; then N="$ORD"; fi
          done
          HANDLE="${DATE}.$((N + 1))"

          if git rev-parse -q --verify "refs/tags/${HANDLE}" >/dev/null; then
            echo "::error::tag ${HANDLE} already exists — refusing to reuse a handle."
            exit 1
          fi

          SHORT=$(echo '${{ github.sha }}' | cut -c1-7)
          {
            echo "handle=$HANDLE"
            echo "sha=${{ github.sha }}"
            echo "short=$SHORT"
          } >> "$GITHUB_OUTPUT"
          echo "Release handle: $HANDLE  (commit $SHORT)"

      # ── The ordering question must be ANSWERED, not defaulted ───────────
      # This was a `type: boolean` defaulting to false, and a forgetful
      # operator therefore got the old behaviour silently. Fail-open on the
      # ordering question is the exact shape of the 2026-08-16 outage: nobody
      # decided that the ordering did not matter, nobody was even asked.
      #
      # A checkbox cannot be tri-state, so the input is a `choice` whose FIRST
      # option is a sentinel. GitHub always preselects the first option, so
      # the dispatch form arrives pre-filled with an answer this step refuses
      # by name — an absent answer is now indistinguishable from a wrong one,
      # which is the point.
      #
      # It runs in `version`, before `build`, so a release that will be
      # refused costs no runner time.
      - name: The deploy-ordering question must be answered
        id: ordering
        env:
          # Through `env`, not interpolated into the script: an operator-typed
          # string reaching a `run:` body verbatim is a quoting break waiting
          # to happen, and a confusing one -- the run fails inside a step whose
          # whole job is to fail informatively.
          CONFIG_CHANGE: ${{ inputs.config_change_required }}
          APPLIED_RUN: ${{ inputs.config_applied_run }}
        run: |
          set -euo pipefail
          case "$CONFIG_CHANGE" in
            'yes') ANSWER=true ;;
            'no') ANSWER=false ;;
            *)
              echo "::error::config_change_required is still '$CONFIG_CHANGE' — the ordering question was not answered."
              echo "::error::"
              echo "::error::You are being asked ONE thing: does this build refuse to boot against the"
              echo "::error::box configs as they are committed today? A new required key, a renamed"
              echo "::error::field or a narrowed type means 'yes'. A price or endpoint edit that the"
              echo "::error::running binary also accepts means 'no'."
              echo "::error::"
              echo "::error::There is no default because there is no safe one. ADR 0041 rule 2: when a"
              echo "::error::build needs a config change, the committed box config is updated and"
              echo "::error::APPLIED first, and the tag moves after. Getting that order wrong is what"
              echo "::error::crash-looped the relay's maker on 2026-08-16 (swap#134)."
              exit 1
              ;;
          esac
          echo "config_change=$ANSWER" >> "$GITHUB_OUTPUT"

          if [ "$ANSWER" != 'true' ]; then
            echo "config-change-required: false — no ordering constraint on this release."
            exit 0
          fi
          if [ -z "$APPLIED_RUN" ]; then
            echo "::error::config_change_required is 'yes' but config_applied_run is empty."
            echo "::error::ADR 0041 rule 2: the committed box config is updated and APPLIED first,"
            echo "::error::and the tag moves after. Land the config, then:"
            echo "::error::  gh workflow run fleet-ops.yml -f box=relay -f operation=config-apply -f apply=true"
            echo "::error::  gh workflow run fleet-ops.yml -f box=ario  -f operation=config-apply -f apply=true"
            echo "::error::then re-dispatch naming that run (one per box that changed)."
            echo "::error::promote-to-fleet.yml verifies it: workflow, conclusion, operation,"
            echo "::error::apply=true, box coverage, and that it started after the config commit."
            exit 1
          fi
          echo "config-change-required: true; apply run(s) to verify at promotion: $APPLIED_RUN"

  # ── 2. The build ──────────────────────────────────────────────────────────
  # The SAME workflow a green merge runs. A release does not get its own
  # `docker build`: two build definitions would mean two things to keep in
  # step with the Dockerfile, the amd64-only decision and the ADR 0009
  # refusal check, and only one of them would run on most days.
  build:
    name: Build the release image
    needs: version
    uses: ./.github/workflows/publish-connector-rust-image.yml
    with:
      release_handle: ${{ needs.version.outputs.handle }}
    permissions:
      contents: read
      packages: write

  # ── 3. The release ────────────────────────────────────────────────────────
  release:
    name: Publish release ${{ needs.version.outputs.handle }}
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Alias the image under its release handle
        env:
          HANDLE: ${{ needs.version.outputs.handle }}
          BUILD_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          # A retag of the manifest just built, never a rebuild — the same
          # reasoning promote-to-fleet.yml gives for its own retag. This tag
          # is immutable by convention: nothing ever moves a handle, which is
          # what lets a GitHub Release and a digest mean each other.
          #
          # It is a convenience, not a promotion input: promote-to-fleet.yml
          # refuses a handle alias by shape and points at the `rust-sha-` tag
          # in the release body instead, because the handle carries no commit
          # for the ancestry check to parse.
          docker buildx imagetools create \
            -t "$IMAGE:rust-$HANDLE" "$IMAGE:$BUILD_TAG"
          echo "Aliased $IMAGE:rust-$HANDLE -> $BUILD_TAG"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          HANDLE: ${{ needs.version.outputs.handle }}
          SHA: ${{ needs.version.outputs.sha }}
          BUILD_TAG: ${{ needs.build.outputs.image_tag }}
          DIGEST: ${{ needs.build.outputs.digest }}
          CONFIG_CHANGE: ${{ needs.version.outputs.config_change }}
          APPLIED_RUN: ${{ inputs.config_applied_run }}
          REASON: ${{ inputs.reason }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail

          # The first block is MACHINE-READABLE and promote-to-fleet.yml greps
          # it. `config-change-required:` at the start of a line, one space,
          # `true` or `false`, nothing else on the line. Reformat this and the
          # ordering gate stops firing silently — which is why
          # `the_release_body_and_the_promotion_gate_agree_on_the_field` in
          # fleet_release_gate.rs asserts both files carry the same literal.
          BODY=$(cat <<BODY_EOF
          config-change-required: ${CONFIG_CHANGE}
          promotion-tag: ${BUILD_TAG}
          commit: ${SHA}
          digest: ${DIGEST}

          ---

          **Reason:** ${REASON}

          | | |
          |---|---|
          | Image | \`ghcr.io/${{ github.repository_owner }}/connector:${BUILD_TAG}\` |
          | Handle alias | \`ghcr.io/${{ github.repository_owner }}/connector:rust-${HANDLE}\` |
          | Commit | \`${SHA}\` |
          | Config change required | \`${CONFIG_CHANGE}\` |
          | Config applied by | ${APPLIED_RUN:-_n/a_} |

          To promote this build by hand (it is not semver — the handle is a date and
          an ordinal; see ADR 0055):

          \`\`\`sh
          gh workflow run promote-to-fleet.yml -f tag=${BUILD_TAG} -f reason="…"
          \`\`\`

          To roll **back** to it later, name the same tag with \`-f allow_rollback=true\`.

          ${NOTES}
          BODY_EOF
          )

          printf '%s\n' "$BODY" > /tmp/release-body.md
          gh release create "$HANDLE" \
            --target "$SHA" \
            --title "$HANDLE" \
            --notes-file /tmp/release-body.md

          echo "Created release $HANDLE"

      - name: Summary
        if: always()
        run: |
          {
            echo "## release-connector"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Handle | \`${{ needs.version.outputs.handle }}\` |"
            echo "| Image | \`$IMAGE:${{ needs.build.outputs.image_tag }}\` |"
            echo "| Handle alias | \`$IMAGE:rust-${{ needs.version.outputs.handle }}\` |"
            echo "| Digest | \`${{ needs.build.outputs.digest }}\` |"
            echo "| Config change required | \`${{ needs.version.outputs.config_change }}\` |"
            echo "| Config applied by | ${{ inputs.config_applied_run }} |"
            echo "| Promoting | \`${{ inputs.promote }}\` |"
            echo "| Reason | ${{ inputs.reason }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 4. The promotion ──────────────────────────────────────────────────────
  # Delegated, never reimplemented. promote-to-fleet.yml is the only thing in
  # this repository that moves `:rust-release`, and it runs the identical
  # checks whether a human dispatched it or a release did.
  #
  # `promote: false` cuts a release without moving the tag. That is not an
  # escape hatch bolted on: it is the ordinary shape for a build you want
  # named and published before the boxes take it — ADR 0041's "the fleet can
  # be left behind deliberately", made a first-class input instead of a
  # cancelled run.
  promote:
    name: Promote to the fleet
    needs: [version, build, release]
    if: inputs.promote
    uses: ./.github/workflows/promote-to-fleet.yml
    with:
      tag: ${{ needs.build.outputs.image_tag }}
      reason: 'release ${{ needs.version.outputs.handle }} — ${{ inputs.reason }}'
      # A release is always a forward move by construction: it is built from
      # the commit being dispatched, and `version` has already required that
      # commit to be on main. A rollback is not a release — it re-promotes a
      # build that already has one — so it is a direct promote-to-fleet.yml
      # dispatch and this input is never set true from here.
      allow_rollback: false
      skip_health_check: ${{ inputs.skip_health_check }}
      config_applied_run: ${{ inputs.config_applied_run }}
    permissions:
      contents: read
      packages: write
      issues: write
      actions: read
    secrets: inherit
