# Provision + deploy the TOON Linode devnet (manual trigger).
#
# linode-cli finds-or-creates a PERSISTENT Linode VM (idempotent by label), then
# SSHes in and runs infra/linode/bootstrap.sh — installs Docker, firewalls the
# box, brings up the EVM + Solana chains, mints the mock USDC, and issues
# Let's Encrypt TLS for the public RPC endpoints.
#
# ── Required secret ──────────────────────────────────────────────────────────
#   LINODE_CLI_TOKEN    Linode API token (Linodes + Domains R/W). linode-cli reads
#                       it from this env var; CI generates an EPHEMERAL SSH key per
#                       run (nothing stored).
# ── Optional secrets (cert preservation across rebuilds) ──────────────────────
#   LINODE_OBJ_ACCESS_KEY / LINODE_OBJ_SECRET_KEY
#                       Linode Object Storage keys. When set, the workflow backs up
#                       the /etc/letsencrypt volume to an Object Storage bucket
#                       after each deploy and RESTORES it before the next rebuild,
#                       so a redeploy re-uses the existing cert instead of asking
#                       Let's Encrypt for a fresh one. Without them a rebuild
#                       re-issues the cert as before.
# ── Optional secrets (Mina faucet — native MINA + USDC drips) ─────────────────
#   MINA_FAUCET_KEY     base58 private key of the native-MINA drip treasury (HD
#                       index 2). When set, the faucet drips native MINA. MUST be
#                       FUNDED on public devnet (top up at faucet.minaprotocol.com).
#   MINA_USDC_ADMIN_KEY base58 private key of the USDC mint AUTHORITY. When set,
#                       the faucet ALSO admin-mints USDC on every Mina drip
#                       (matching EVM ETH+USDC / Solana SOL+USDC). MUST be FUNDED
#                       (it pays each recipient's token-account creation fee). The
#                       USDC token + admin-contract ADDRESSES are public (pinned in
#                       infra/linode/endpoints.json), so only this key is a secret.
#                       Both unset → the Mina route 503s + links to the public
#                       faucet; EVM/Solana unaffected.
#
# ── Redeploy semantics ───────────────────────────────────────────────────────
#   Re-running on an existing VM (same `label`, same plan) REBUILDS it in place:
#   same Linode + IP preserved, disk wiped → fresh deterministic chains (anvil
#   0x5FbDB2…, Solana mint H8HSreUF… reproduce). That is the intended devnet
#   reset for chain state.
#
#   CERTS ARE NO LONGER RE-ISSUED ON EVERY REBUILD. A rebuild wipes the cert
#   volume, which previously made init-letsencrypt.sh request a NEW cert every
#   time — repeatedly hitting Let's Encrypt's "5 duplicate certs / 7 days" limit
#   and dropping the box to self-signed. Now:
#     • the cert volume is BACKED UP to Object Storage after each deploy and
#       RESTORED into the freshly-rebuilt box before bootstrap (when the OBJ_*
#       secrets are configured), and
#     • init-letsencrypt.sh SKIPS issuance whenever it finds a valid, non-self-
#       signed, non-expiring cert for the domain — so the restored cert is reused
#       and certbot only renews (no-op until <30 days to expiry).
#   Net: routine redeploys reuse the cert; Let's Encrypt is contacted only for the
#   FIRST issuance, a real renewal, a new domain/IP, or an explicit reset.
#
#   Pass `reset: true` to deliberately start CLEAN: the saved cert is NOT restored,
#   so a brand-new cert is issued (use sparingly — it spends a cert). A plan change
#   forces a recreate (delete + create; IP changes → new domain → new cert). Pass
#   `ssh_pubkey` to also authorize your own key for manual debugging.
#
# ── DNS ──────────────────────────────────────────────────────────────────────
#   A-records for evm-rpc / solana-rpc / solana-ws / faucet / mina under <domain>
#   → the VM IP. Set `manage_dns: true` to create them via the host given by
#   `dns_provider`: `linode` = Linode Domains (domain must be hosted in your Linode
#   account); `porkbun` = Porkbun API (e.g. devnet.toonprotocol.dev — needs the
#   PORKBUN_API_KEY / PORKBUN_SECRET secrets). Else create them yourself (IP is
#   printed). DNS must resolve before real (non-staging) TLS can be issued.

name: devnet-deploy

# ── Scope: chains-only ─────────────────────────────────────────────────────────
#   This workflow deploys ONLY the blockchain infrastructure — anvil/EVM,
#   solana-test-validator, the multichain faucet, the nginx→Mina proxy, and
#   nginx+TLS in front of the public RPC endpoints. It is single-responsibility.
#
#   The payment-proxy / connector edge and the oblivious relay deploy SEPARATELY
#   (the deploy/relay-edge/ + deploy/pay-edge/ bundles on their own box) — this
#   workflow no longer co-deploys an "app edge".
#
# ── Safety (issue #222) ───────────────────────────────────────────────────────
#   • `action: destroy` deletes the Linode by label (linode-cli linodes delete) —
#     an idle VM bills forever, so always destroy when done.
#   • The deploy job is gated behind the `devnet` GitHub Environment: configure it
#     with REQUIRED REVIEWERS so a human approves before the run spends money /
#     exposes infra. (Settings → Environments → devnet → Required reviewers.)
#
# WORKFLOW_DISPATCH ONLY — there is no push/PR/schedule trigger. Nothing here runs
# automatically; a human triggers + approves every run.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy (provision/redeploy) or destroy (delete the Linode by label — an idle VM bills forever, so tear down when done)'
        type: choice
        options:
          - deploy
          - destroy
        default: deploy
      domain:
        description: 'Base domain. Leave BLANK to auto-use sslip.io (<vm-ip>.sslip.io) — no domain/DNS needed.'
        required: false
        default: ''
      letsencrypt_email:
        description: "Email for Let's Encrypt expiry notices"
        required: false
        default: ''
      region:
        description: 'Linode region'
        default: 'us-east'
      plan:
        description: 'Linode plan (2GB ok — bootstrap adds swap for the one-time Rust builds)'
        default: 'g6-standard-1'
      label:
        description: 'Linode label (persistent — updated in place on re-run)'
        default: 'toon-devnet'
      reset:
        description: "Clean-slate REBUILD: don't restore the saved cert — issue a brand-new one (burns a Let's Encrypt cert; use sparingly). Default re-uses the saved cert."
        type: boolean
        default: false
      obj_bucket:
        description: 'Linode Object Storage bucket for the cert-volume backup (so a rebuild restores certs instead of re-issuing). Blank = disabled.'
        default: 'toon-devnet-certs'
      obj_region:
        description: 'Linode Object Storage region for the cert-backup bucket'
        default: 'us-east-1'
      ref:
        description: 'connector git ref to deploy'
        default: 'main'
      letsencrypt_staging:
        description: "Use Let's Encrypt staging certs (1) until DNS verifies, else 0"
        default: '1'
      manage_dns:
        description: 'Create/refresh DNS A-records for the chain subdomains (evm-rpc/solana-rpc/solana-ws/faucet/mina)'
        type: boolean
        default: false
      dns_provider:
        description: 'Where <domain> is hosted, so manage_dns hits the right API. linode = Linode Domains (default); porkbun = Porkbun (e.g. devnet.toonprotocol.dev) — needs PORKBUN_API_KEY/PORKBUN_SECRET.'
        type: choice
        options:
          - linode
          - porkbun
        default: linode
      ssh_pubkey:
        description: 'Optional extra SSH public key to authorize (manual debugging)'
        default: ''

permissions:
  contents: read

concurrency: devnet-deploy # never two deploys racing the same box

jobs:
  # ── DESTROY ────────────────────────────────────────────────────────────────
  # Tear the box down (an idle Linode bills forever — issue #222 safety). Gated
  # behind the `devnet` Environment so a human approves the delete too.
  destroy:
    if: ${{ inputs.action == 'destroy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: devnet
    env:
      LINODE_CLI_TOKEN: ${{ secrets.LINODE_CLI_TOKEN }}
      LABEL: ${{ inputs.label }}
    steps:
      - name: Install linode-cli + jq
        run: |
          pip install --quiet linode-cli
          sudo apt-get update -y && sudo apt-get install -y jq
      - name: Delete the Linode by label
        run: |
          set -euo pipefail
          ID=$(linode-cli linodes list --label "$LABEL" --json 2>/dev/null | jq -r '.[0].id // empty')
          if [ -z "$ID" ]; then
            echo "::notice::No Linode labelled '$LABEL' — nothing to destroy."
            echo "### TOON devnet destroy — \`$LABEL\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No Linode with that label existed — nothing to delete." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Deleting Linode '$LABEL' (id=$ID)…"
          linode-cli linodes delete "$ID" >/dev/null
          {
            echo "### TOON devnet destroy — \`$LABEL\`"
            echo ""
            echo "Deleted Linode id=\`$ID\`. Billing for the VM stops now."
            echo ""
            echo "ℹ️ DNS A-records and any Object-Storage cert backup are left intact (cheap/free); delete them manually if you want a truly clean slate."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── DEPLOY ─────────────────────────────────────────────────────────────────
  deploy:
    if: ${{ inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60 # bootstrap installs Docker + builds the Solana program + issues TLS
    # issue #222 safety: gate behind a GitHub Environment with REQUIRED REVIEWERS
    # so a human approves before this run spends money / exposes infra.
    environment: devnet
    env:
      LINODE_CLI_TOKEN: ${{ secrets.LINODE_CLI_TOKEN }}
      LABEL: ${{ inputs.label }}
      # Object Storage holds the cert-volume backup so a rebuild (which wipes the
      # disk) can RESTORE the /etc/letsencrypt volume instead of re-issuing — which
      # is what burned Let's Encrypt's duplicate-cert rate limit. Optional: if these
      # are unset the cert simply gets re-issued as before (back to old behavior).
      LINODE_OBJ_ACCESS_KEY: ${{ secrets.LINODE_OBJ_ACCESS_KEY }}
      LINODE_OBJ_SECRET_KEY: ${{ secrets.LINODE_OBJ_SECRET_KEY }}
      OBJ_REGION: ${{ inputs.obj_region }}
      OBJ_BUCKET: ${{ inputs.obj_bucket }}
      # DOMAIN is computed at runtime (see Provision): the given domain, or
      # <vm-ip>.sslip.io when blank — so subdomains like evm-rpc.<DOMAIN> resolve
      # to the box with no registration or DNS management.
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.letsencrypt_email }}" ]; then
            echo "::error::letsencrypt_email is required for action=deploy (Let's Encrypt needs it for expiry notices)."
            exit 1
          fi

      - name: Install linode-cli + jq + s3cmd
        run: |
          pip install --quiet linode-cli s3cmd
          sudo apt-get update -y && sudo apt-get install -y jq netcat-openbsd openssh-client

      - name: Configure s3cmd for Linode Object Storage (cert backup)
        # Cert backup/restore is BEST-EFFORT and must never fail the deploy (issue
        # #239). It is enabled only when (a) a bucket is configured, (b) both
        # LINODE_OBJ_* secrets are non-empty, AND (c) those creds actually
        # authenticate. If any check fails we set OBJ_ENABLED=false, emit a
        # ::warning:: (so the cert simply won't persist across the next rebuild and
        # gets re-issued — old behavior), and exit 0 so the job keeps going. This
        # `continue-on-error` belt-and-suspenders covers the case where even the
        # auth probe itself errors unexpectedly.
        if: ${{ env.OBJ_BUCKET != '' }}
        continue-on-error: true
        run: |
          if [ -z "${LINODE_OBJ_ACCESS_KEY:-}" ] || [ -z "${LINODE_OBJ_SECRET_KEY:-}" ]; then
            echo "OBJ_ENABLED=false" >> "$GITHUB_ENV"
            echo "::warning::OBJ_BUCKET set but LINODE_OBJ_ACCESS_KEY/SECRET_KEY missing — cert backup/restore DISABLED; the LE cert will NOT persist across rebuilds (it will be re-issued)."
            exit 0
          fi
          HOST="${OBJ_REGION}.linodeobjects.com"
          cat > ~/.s3cfg <<CFG
          [default]
          access_key = ${LINODE_OBJ_ACCESS_KEY}
          secret_key = ${LINODE_OBJ_SECRET_KEY}
          host_base = ${HOST}
          host_bucket = %(bucket)s.${HOST}
          use_https = True
          CFG
          chmod 600 ~/.s3cfg
          # Probe the credentials up front (issue #239): if the keys are invalid or
          # expired, Linode returns 403 InvalidAccessKeyId here — disable backup
          # rather than letting a later `s3cmd put` 403 fail the whole deploy. A
          # successful `ls` proves the creds authenticate against this region.
          if ! s3cmd ls "s3://" >/dev/null 2>s3probe.err; then
            echo "OBJ_ENABLED=false" >> "$GITHUB_ENV"
            echo "::warning::LINODE_OBJ_ACCESS_KEY/SECRET_KEY did not authenticate against ${HOST} ($(tr -d '\n' < s3probe.err | tail -c 200)) — cert backup/restore DISABLED. ROTATE the keys (see job summary). The LE cert will be re-issued on the next rebuild until fixed."
            exit 0
          fi
          # Ensure the bucket exists (idempotent). `mb` is harmless if it already does.
          s3cmd mb "s3://${OBJ_BUCKET}" 2>/dev/null || true
          # Confirm the target bucket is reachable with these creds.
          if ! s3cmd info "s3://${OBJ_BUCKET}" >/dev/null 2>s3bucket.err; then
            echo "OBJ_ENABLED=false" >> "$GITHUB_ENV"
            echo "::warning::Bucket s3://${OBJ_BUCKET} not reachable on ${HOST} ($(tr -d '\n' < s3bucket.err | tail -c 200)) — confirm the bucket exists in region '${OBJ_REGION}'. Cert backup/restore DISABLED."
            exit 0
          fi
          echo "OBJ_ENABLED=true" >> "$GITHUB_ENV"
          echo "Object Storage cert backup enabled → s3://${OBJ_BUCKET} (${HOST})"

      - name: Generate ephemeral SSH key for this run
        run: |
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/devnet -q
          cp ~/.ssh/devnet.pub ~/.ssh/authorized.txt
          if [ -n "${{ inputs.ssh_pubkey }}" ]; then echo "${{ inputs.ssh_pubkey }}" >> ~/.ssh/authorized.txt; fi

      - name: Resolve COMPOSE_PROFILES
        # Chains-only: anvil/EVM + solana-test-validator (plus the faucet, the
        # nginx→Mina proxy, and nginx+TLS, which are not profile-gated).
        run: echo "COMPOSE_PROFILES=evm,solana" >> "$GITHUB_ENV"

      - name: Provision (create, recreate, or rebuild)
        run: |
          set -euo pipefail
          mapfile -t KEYARGS < <(while IFS= read -r k; do [ -n "$k" ] && printf -- '--authorized_keys\n%s\n' "$k"; done < ~/.ssh/authorized.txt)
          ID=$(linode-cli linodes list --label "$LABEL" --json 2>/dev/null | jq -r '.[0].id // empty')
          # Decide the deploy MODE:
          #   create   — no existing box: create it, then bootstrap (issues cert once).
          #   recreate — existing box but plan changed: delete + create (IP changes); cert re-issued for the new IP/domain.
          #   rebuild  — existing box, same plan: re-image in place for fresh deterministic chains. The cert volume is
          #              wiped by the rebuild, so we BACK IT UP to Object Storage first and RESTORE it after (below) —
          #              UNLESS reset=true, which deliberately starts clean (fresh cert).
          MODE="create"
          if [ -n "$ID" ]; then
            CURTYPE=$(linode-cli linodes view "$ID" --json | jq -r '.[0].type')
            if [ "$CURTYPE" != "${{ inputs.plan }}" ]; then
              echo "Plan changed ($CURTYPE → ${{ inputs.plan }}) — deleting to recreate (devnet is disposable; IP will change)"
              linode-cli linodes delete "$ID" >/dev/null
              ID=""
              MODE="create"
            else
              MODE="rebuild"
            fi
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "Deploy mode: $MODE (reset=${{ inputs.reset }})"
          if [ "$MODE" = "rebuild" ]; then
            echo "Rebuilding existing Linode '$LABEL' (id=$ID) in place — preserves IP, wipes disk"
            echo "  (cert volume is restored after the rebuild from Object Storage unless reset=true)"
            linode-cli linodes rebuild "$ID" \
              --image linode/ubuntu24.04 \
              --root_pass "$(openssl rand -base64 24)" \
              "${KEYARGS[@]}" >/dev/null
          else
            echo "Creating Linode '$LABEL'…"
            linode-cli linodes create \
              --label "$LABEL" \
              --region "${{ inputs.region }}" \
              --type "${{ inputs.plan }}" \
              --image linode/ubuntu24.04 \
              --root_pass "$(openssl rand -base64 24)" \
              "${KEYARGS[@]}" \
              --booted true >/dev/null
            ID=$(linode-cli linodes list --label "$LABEL" --json | jq -r '.[0].id')
          fi
          STATUS=""; IP=""
          for i in $(seq 1 40); do
            STATUS=$(linode-cli linodes view "$ID" --json | jq -r '.[0].status')
            IP=$(linode-cli linodes view "$ID" --json | jq -r '.[0].ipv4[0]')
            [ "$STATUS" = "running" ] && [ -n "$IP" ] && break
            echo "  …waiting for VM (status=$STATUS) ($i)"; sleep 10
          done
          [ "$STATUS" = "running" ] && [ -n "$IP" ] || { echo "::error::VM not running"; exit 1; }
          echo "IP=$IP" >> "$GITHUB_ENV"
          # Domain: the given one, or <dashed-ip>.sslip.io (free wildcard DNS → IP,
          # no registration/DNS). Subdomains become evm-rpc.<DOMAIN> etc.
          if [ -n "${{ inputs.domain }}" ]; then DOMAIN="${{ inputs.domain }}"; else DOMAIN="${IP//./-}.sslip.io"; fi
          echo "DOMAIN=$DOMAIN" >> "$GITHUB_ENV"
          echo "Using domain: $DOMAIN"

      - name: Wait for SSH (retry real auth — handles rebuild + new host key)
        run: |
          SSH_OPTS="-i $HOME/.ssh/devnet -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o BatchMode=yes"
          echo "SSH_OPTS=$SSH_OPTS" >> "$GITHUB_ENV"
          # A rebuild keeps the IP but re-images (new host key, our new authorized
          # key applies only once it finishes), and port 22 can be up on the OLD
          # system mid-rebuild — so test ACTUAL key auth, not just the port.
          for i in $(seq 1 60); do
            if ssh $SSH_OPTS root@"$IP" true 2>/dev/null; then echo "SSH auth OK"; exit 0; fi
            echo "  …waiting for ssh key auth ($i)"; sleep 15
          done
          echo "::error::SSH key auth never succeeded on $IP"; exit 1

      - name: Restore cert volume from Object Storage (after rebuild, before bootstrap)
        # A rebuild wiped the disk → the linode_certbot_conf volume is empty. If we
        # have a saved cert for THIS domain, restore it into the volume now so that
        # init-letsencrypt.sh (run by bootstrap) finds a valid cert and SKIPS
        # issuance — no Let's Encrypt duplicate-cert burn. Skipped on `reset:true`
        # (clean slate → fresh cert) and on create/recreate (no prior box/cert).
        if: ${{ env.MODE == 'rebuild' && env.OBJ_ENABLED == 'true' && inputs.reset != true }}
        run: |
          set -euo pipefail
          KEY="s3://${OBJ_BUCKET}/${DOMAIN}/letsencrypt.tar.gz"
          if ! s3cmd info "$KEY" >/dev/null 2>&1; then
            echo "::notice::No saved cert at $KEY — bootstrap will issue one (first trusted cert for this domain)."
            exit 0
          fi
          echo "Restoring saved cert volume from $KEY"
          # Stream the tarball to the box and unpack it INTO the named Docker volume
          # (create the volume first so the helper container mounts the real one the
          # compose stack will use). Docker Compose names it <project>_linode_certbot_conf;
          # the project dir is ~/connector, so the project name is "connector".
          s3cmd get --force "$KEY" /tmp/le.tar.gz
          scp $SSH_OPTS /tmp/le.tar.gz root@"$IP":/tmp/le.tar.gz
          ssh $SSH_OPTS root@"$IP" bash -s <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # This runs BEFORE bootstrap.sh, so Docker isn't installed yet on a fresh
          # rebuild — install it now (idempotent; bootstrap.sh then no-ops the step).
          command -v docker >/dev/null 2>&1 || curl -fsSL https://get.docker.com | sh
          docker volume create connector_linode_certbot_conf >/dev/null
          docker run --rm -i -v connector_linode_certbot_conf:/etc/letsencrypt alpine \
            sh -c "cd /etc/letsencrypt && tar xzf - " < /tmp/le.tar.gz
          rm -f /tmp/le.tar.gz
          echo "  cert volume restored"
          REMOTE

      - name: Create DNS A-records (Linode Domains)
        # sslip.io needs no DNS; only when the domain is hosted on Linode Domains.
        if: ${{ inputs.manage_dns && inputs.domain != '' && inputs.dns_provider == 'linode' }}
        run: |
          set -euo pipefail
          DID=$(linode-cli domains list --json | jq -r --arg d "$DOMAIN" '.[] | select(.domain==$d) | .id' | head -1)
          if [ -z "$DID" ]; then
            DID=$(linode-cli domains create --type master --domain "$DOMAIN" --soa_email "${{ inputs.letsencrypt_email }}" --json | jq -r '.[0].id')
          fi
          SUBS="evm-rpc solana-rpc solana-ws faucet mina"
          for sub in $SUBS; do
            EID=$(linode-cli domains records-list "$DID" --json | jq -r --arg n "$sub" '.[] | select(.type=="A" and .name==$n) | .id' | head -1)
            if [ -n "$EID" ]; then
              linode-cli domains records-update "$DID" "$EID" --target "$IP" >/dev/null
            else
              linode-cli domains records-create "$DID" --type A --name "$sub" --target "$IP" --ttl_sec 300 >/dev/null
            fi
            echo "  A $sub.$DOMAIN -> $IP"
          done

      - name: Create DNS A-records (Porkbun)
        # Same subdomain list as the Linode path, but for a Porkbun-hosted domain
        # (e.g. devnet.toonprotocol.dev). sslip.io needs no DNS; only runs when the
        # domain is hosted on Porkbun. Idempotent per subdomain: editByNameType when
        # an A-record already exists, else create. Porkbun's API v3 auth is a JSON
        # body on EVERY call ({"apikey","secretapikey"}) — both come from secrets and
        # are masked so they never leak into logs.
        if: ${{ inputs.manage_dns && inputs.domain != '' && inputs.dns_provider == 'porkbun' }}
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET: ${{ secrets.PORKBUN_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PORKBUN_API_KEY:-}" ] || [ -z "${PORKBUN_SECRET:-}" ]; then
            echo "::warning::dns_provider=porkbun but PORKBUN_API_KEY/PORKBUN_SECRET are not set — skipping DNS. Set them (gh secret set PORKBUN_API_KEY/PORKBUN_SECRET) or create the A-records yourself; the IP is printed in the summary."
            exit 0
          fi
          # Mask the creds defensively (they should be masked as secrets already, but
          # this guards against any value that slipped in via a different path).
          echo "::add-mask::$PORKBUN_API_KEY"
          echo "::add-mask::$PORKBUN_SECRET"
          API="https://api.porkbun.com/api/json/v3"
          # Auth blob reused as the prefix of every JSON body. -n keeps it on one line.
          AUTH=$(jq -cn --arg k "$PORKBUN_API_KEY" --arg s "$PORKBUN_SECRET" '{apikey:$k,secretapikey:$s}')
          # Porkbun addresses the REGISTERED domain (the root in your account) in the URL,
          # with the record `name` being the prefix relative to it — unlike Linode, which
          # treats $DOMAIN as its own delegated zone. $DOMAIN here may be a subdomain (e.g.
          # devnet.toonprotocol.dev), so split it: ROOT = last two labels (toonprotocol.dev),
          # PREFIX = the leading labels (devnet). An `evm-rpc` record under $DOMAIN is then
          # the Porkbun name `evm-rpc.devnet` on domain `toonprotocol.dev`. (Assumes a
          # two-label root: fine for .dev/.com/.io; multi-part TLDs like .co.uk are not
          # handled — create those records manually.)
          ROOT=$(echo "$DOMAIN" | awk -F. '{ if (NF>=2) print $(NF-1)"."$NF; else print $0 }')
          PREFIX=""
          case "$DOMAIN" in
            "$ROOT") PREFIX="" ;;
            *."$ROOT") PREFIX=".${DOMAIN%."$ROOT"}" ;;
          esac
          # Sanity/auth check (also echoes the caller IP). Soft-fail: a flaky ping
          # shouldn't necessarily block, but a clear auth error should surface.
          PING=$(curl -fsS -X POST "$API/ping" -H 'Content-Type: application/json' -d "$AUTH" 2>/dev/null || true)
          if [ "$(echo "$PING" | jq -r '.status // "ERROR"')" != "SUCCESS" ]; then
            echo "::warning::Porkbun /ping did not return SUCCESS ($(echo "$PING" | jq -r '.message // "no response"')) — check PORKBUN_API_KEY/PORKBUN_SECRET and that API access is enabled for $ROOT. Attempting record upserts anyway."
          fi
          SUBS="evm-rpc solana-rpc solana-ws faucet mina"
          for sub in $SUBS; do
            NAME="$sub$PREFIX"   # name relative to ROOT, e.g. evm-rpc.devnet
            # Does an A-record already exist for this name? retrieveByNameType
            # returns {"status":"SUCCESS","records":[...]} (empty array when none).
            EXISTING=$(curl -fsS -X POST "$API/dns/retrieveByNameType/$ROOT/A/$NAME" \
              -H 'Content-Type: application/json' -d "$AUTH" 2>/dev/null || true)
            HAVE=$(echo "$EXISTING" | jq -r '(.records // []) | length')
            if [ "${HAVE:-0}" -gt 0 ]; then
              BODY=$(echo "$AUTH" | jq -c --arg ip "$IP" '. + {content:$ip, ttl:"300"}')
              RESP=$(curl -fsS -X POST "$API/dns/editByNameType/$ROOT/A/$NAME" \
                -H 'Content-Type: application/json' -d "$BODY" 2>/dev/null || true)
            else
              BODY=$(echo "$AUTH" | jq -c --arg n "$NAME" --arg ip "$IP" '. + {name:$n, type:"A", content:$ip, ttl:"300"}')
              RESP=$(curl -fsS -X POST "$API/dns/create/$ROOT" \
                -H 'Content-Type: application/json' -d "$BODY" 2>/dev/null || true)
            fi
            if [ "$(echo "$RESP" | jq -r '.status // "ERROR"')" = "SUCCESS" ]; then
              echo "  A $sub.$DOMAIN -> $IP"
            else
              echo "::warning::Porkbun upsert for $sub.$DOMAIN failed ($(echo "$RESP" | jq -r '.message // "no response"')) — create it manually: A $sub.$DOMAIN -> $IP"
            fi
          done

      - name: Bootstrap the devnet on the VM
        run: |
          ssh $SSH_OPTS root@"$IP" bash -s <<REMOTE
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          command -v git >/dev/null || { apt-get update -y && apt-get install -y git; }
          if [ -d connector/.git ]; then
          cd connector && git fetch --all -q && git checkout "${{ inputs.ref }}" -q && git pull -q
          else
          git clone --branch "${{ inputs.ref }}" https://github.com/toon-protocol/connector.git
          cd connector
          fi
          cat > infra/linode/.env <<ENV
          DOMAIN=$DOMAIN
          LETSENCRYPT_EMAIL=${{ inputs.letsencrypt_email }}
          LETSENCRYPT_STAGING=${{ inputs.letsencrypt_staging }}
          COMPOSE_PROFILES=$COMPOSE_PROFILES
          PUBLIC_IFACE=eth0
          # Mina treasury private key (base58, HD index 2) for the faucet's
          # native-MINA drip. SECRET — set it with:
          #   gh secret set MINA_FAUCET_KEY --repo toon-protocol/connector
          # When the secret is unset this is empty and the faucet's Mina route
          # gracefully 503s with a public-faucet link (EVM/Solana unaffected).
          # devnet.sh/bootstrap.sh `set -a; . .env` exports it so docker compose
          # substitutes it into the faucet container's MINA_FAUCET_KEY.
          MINA_FAUCET_KEY=${{ secrets.MINA_FAUCET_KEY }}
          # Mina USDC mint AUTHORITY private key (base58) — lets the faucet
          # admin-mint USDC (native + USDC, matching EVM/Solana) on every Mina
          # drip. SECRET — set it with:
          #   gh secret set MINA_USDC_ADMIN_KEY --repo toon-protocol/connector
          # MUST be a FUNDED account (it pays each recipient's token-account
          # creation fee). When unset the faucet drips native MINA only. The token
          # + admin-contract ADDRESSES are PUBLIC (pinned in endpoints.json) and
          # resolved by devnet.sh, so only the key is a secret.
          MINA_USDC_ADMIN_KEY=${{ secrets.MINA_USDC_ADMIN_KEY }}
          ENV
          bash infra/linode/bootstrap.sh
          REMOTE

      - name: Back up cert volume to Object Storage (for the next rebuild)
        # After a successful bootstrap the volume holds the current cert. Save it so
        # the NEXT rebuild can restore it instead of re-issuing. We tar the whole
        # /etc/letsencrypt tree as-is; correctness is enforced on RESTORE, where
        # init-letsencrypt.sh's guard rejects a self-signed/expired/wrong-SAN cert
        # and issues a fresh one — so even a dummy in the backup is harmless.
        #
        # continue-on-error (issue #239): the deploy itself (provisioning + chains)
        # is already done and healthy by this point — a failed cert backup must NOT
        # flip the whole run to `failure`. The Configure step above already probes
        # the creds and disables OBJ_ENABLED on a 403, so reaching here means the
        # creds authenticated; this is the backstop for a transient S3 error (or a
        # key that gets revoked mid-run). We turn off `set -e` around the put so an
        # S3 error is reported as a ::warning:: instead of a hard non-zero exit.
        if: ${{ env.OBJ_ENABLED == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # Tar the cert volume off the box (quoted heredoc → no CI-side expansion).
          ssh $SSH_OPTS root@"$IP" bash -s <<'REMOTE' > /tmp/le.tar.gz
          set -euo pipefail
          docker run --rm -v connector_linode_certbot_conf:/etc/letsencrypt alpine \
            sh -c 'cd /etc/letsencrypt && tar czf - .'
          REMOTE
          if [ -s /tmp/le.tar.gz ]; then
            set +e
            s3cmd put /tmp/le.tar.gz "s3://${OBJ_BUCKET}/${DOMAIN}/letsencrypt.tar.gz" 2>s3put.err
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "Backed up cert volume → s3://${OBJ_BUCKET}/${DOMAIN}/letsencrypt.tar.gz"
            else
              echo "::warning::Cert-volume backup to s3://${OBJ_BUCKET}/${DOMAIN}/letsencrypt.tar.gz FAILED ($(tr -d '\n' < s3put.err | tail -c 200)). Deploy is otherwise healthy; the cert just won't persist to the NEXT rebuild (it will be re-issued). ROTATE the LINODE_OBJ_* keys to fix — see job summary."
            fi
          else
            echo "::notice::Cert volume empty — nothing to back up."
          fi

      - name: Summary
        if: ${{ always() && env.IP != '' }}
        run: |
          {
            echo "### TOON devnet — \`$LABEL\` @ \`$IP\`"
            echo ""
            echo "| endpoint | url |"
            echo "|---|---|"
            echo "| EVM RPC | https://evm-rpc.$DOMAIN |"
            echo "| Solana RPC | https://solana-rpc.$DOMAIN |"
            echo "| Solana WS | wss://solana-ws.$DOMAIN |"
            echo "| Faucet | https://faucet.$DOMAIN (EVM + Solana + native-MINA drip) |"
            echo "| Mina (proxy) | https://mina.$DOMAIN/graphql |"
            echo ""
            if [ -z "${{ inputs.domain }}" ]; then
              echo "ℹ️ Using **sslip.io** (\`$DOMAIN\`) — resolves to \`$IP\` automatically, no DNS to set up. For trusted (non-staging) certs, re-run with \`letsencrypt_staging=0\`; if Let's Encrypt's shared sslip.io rate limit blocks it, staging certs still work (or switch to your own domain)."
            elif [ "${{ inputs.manage_dns }}" != "true" ]; then
              echo "⚠️ Create A-records (evm-rpc/solana-rpc/solana-ws/faucet/mina).$DOMAIN → \`$IP\`, then re-run with \`letsencrypt_staging=0\` for trusted certs."
            fi
            echo ""
            echo "🧹 When you're done, re-run this workflow with **action: destroy** to delete the VM (an idle Linode bills forever)."
          } >> "$GITHUB_STEP_SUMMARY"
