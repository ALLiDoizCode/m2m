name: Release

on:
  # Trigger on push to main with conventional commit messages
  push:
    branches:
      - main
  # Manual trigger for releases
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean

# Prevent concurrent releases
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Only run after CI passes (on push)
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run semantic-release (dry run)
        if: github.event.inputs.dry_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --dry-run

      - name: Run semantic-release
        if: github.event.inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # Build and push versioned Docker image on release
  docker-release:
    name: Build Versioned Docker Image
    runs-on: ubuntu-latest
    needs: [release]
    # Only run if release job succeeded and not a dry run
    if: github.event.inputs.dry_run != 'true'
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # Check out main's tip, NOT the workflow trigger SHA. semantic-release in
      # the `release` job pushes a `chore(release): X.Y.Z [skip ci]` commit that
      # creates the new vX.Y.Z tag on a child of the trigger SHA. Without
      # `ref: main`, `git describe --tags --abbrev=0` walks ancestors of the
      # trigger SHA and returns the *previous* tag — silently overwriting that
      # tag's image on GHCR with the new release's content. Mirrors the fix
      # already applied to `npm-release` below.
      - name: Checkout code (main's tip — post semantic-release commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Get latest tag
        id: tag
        run: |
          # Get the latest semver tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "Found tag: $LATEST_TAG"
          else
            echo "No tags found, skipping Docker release"
            echo "tag=" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.tag.outputs.tag != ''
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        if: steps.tag.outputs.tag != ''
        uses: sigstore/cosign-installer@v3

      - name: Log in to GitHub Container Registry
        if: steps.tag.outputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        if: steps.tag.outputs.tag != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/connector
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.tag }}

      - name: Build and push versioned Docker image
        if: steps.tag.outputs.tag != ''
        id: push-release
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Sign released connector image with cosign (keyless OIDC)
        if: steps.tag.outputs.tag != ''
        env:
          DIGEST: ${{ steps.push-release.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/connector
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Post-publish assertion (issue #61): verify the image we just pushed
      # carries the correct `org.opencontainers.image.version` label. Catches
      # the entire class of "tag says X but content says Y" bugs — e.g. the
      # trigger-SHA `git describe` corruption fixed in #60. Without this,
      # silent tag-pointer overwrites can ship undetected.
      - name: Verify pushed image version label matches tag
        if: steps.tag.outputs.tag != ''
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.tag.outputs.tag }}"
          EXPECTED="${EXPECTED#v}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/connector:${EXPECTED}"
          IMAGE_REPO="${IMAGE%%:*}"
          # Multi-platform images return a manifest index where .Image is nil;
          # resolve the linux/amd64 sub-manifest by digest and inspect that.
          AMD64_DIGEST=$(docker buildx imagetools inspect "$IMAGE" --raw \
            | jq -r '.manifests[] | select(.platform.architecture == "amd64" and .platform.os == "linux") | .digest')
          ACTUAL=$(docker buildx imagetools inspect "${IMAGE_REPO}@${AMD64_DIGEST}" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.version" }}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Image label mismatch on $IMAGE (amd64)"
            echo "  expected org.opencontainers.image.version: $EXPECTED"
            echo "  actual   org.opencontainers.image.version: $ACTUAL"
            exit 1
          fi
          echo "✓ Verified $IMAGE (amd64) carries org.opencontainers.image.version=$EXPECTED"

      - name: Release summary
        if: steps.tag.outputs.tag != ''
        run: |
          echo "=========================================="
          echo "Release Complete!"
          echo "=========================================="
          echo "Version: ${{ steps.tag.outputs.tag }}"
          echo "Docker tags: ${{ steps.meta.outputs.tags }}"
          echo "=========================================="

  # Publish npm package on release
  npm-release:
    name: Publish npm Package
    runs-on: ubuntu-latest
    needs: [release]
    # Only run if release job succeeded and not a dry run
    if: github.event.inputs.dry_run != 'true'
    permissions:
      contents: read

    steps:
      # Check out main's tip, NOT the workflow trigger SHA. semantic-release in
      # the `release` job pushes a `chore(release): X.Y.Z [skip ci]` commit that
      # bumps packages/connector/package.json. Without `ref: main`, this job
      # would read the pre-release package.json and try to publish the stale
      # version — which 403s when that version is already on npm.
      - name: Checkout code (main's tip — post semantic-release commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Get latest tag
        id: tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "Found tag: $LATEST_TAG"
          else
            echo "No tags found, skipping npm publish"
            echo "tag=" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.tag.outputs.tag != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@toon-protocol'

      - name: Install dependencies
        if: steps.tag.outputs.tag != ''
        run: npm ci

      - name: Build packages
        if: steps.tag.outputs.tag != ''
        run: npm run build

      - name: Publish to npm
        if: steps.tag.outputs.tag != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/connector
          # Extract version from tag (strip v prefix)
          VERSION=$(echo "${{ steps.tag.outputs.tag }}" | sed 's/^v//')
          # Verify package.json version matches tag
          NPM_VERSION=$(node -p "require('./package.json').version")
          if [ "$NPM_VERSION" != "$VERSION" ]; then
            echo "ERROR: Version mismatch! package.json=$NPM_VERSION, tag=$VERSION"
            exit 1
          fi
          # Idempotency: skip publish if this version is already on npm.
          # release.yml runs on every push to main — including chore/docs/test
          # commits where semantic-release decides not to bump. Without this
          # guard, those runs would attempt to re-publish the prior version
          # and fail with E403.
          if npm view "@toon-protocol/connector@$VERSION" version 2>/dev/null | grep -q "$VERSION"; then
            echo "@toon-protocol/connector@$VERSION already published — skipping (no-op)"
            exit 0
          fi
          echo "Publishing @toon-protocol/connector@$VERSION to npm..."
          npm publish --access public
          echo "✓ Published @toon-protocol/connector@$VERSION"

      - name: npm publish summary
        if: steps.tag.outputs.tag != ''
        run: |
          echo "## npm Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`@toon-protocol/connector\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** npmjs.com" >> $GITHUB_STEP_SUMMARY
