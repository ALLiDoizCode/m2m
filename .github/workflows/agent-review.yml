# agent:review runner — the sandcastle label→runner for reviewing one PR.
#
# WHAT THIS DOES (and does NOT do):
#   Fires when a human applies the `agent:review` label to a PULL REQUEST. It
#   runs the single-pass reviewer (`npm run sandcastle:review`) against the PR's
#   head branch, pushing any clarity/standards refinements back onto the PR. It
#   NEVER merges the PR and NEVER closes anything — a human still merges. This is
#   the single-pass replacement for the old 4-round `review-round:*` loop
#   (pr-reviewer.yml).
#
#   Committing this file triggers nothing: pull_request-`labeled` workflows fire
#   only from the default branch and only when someone applies the label.
#
# FIRST-LIVE-RUN OUTCOME (2026-07-30, connector#634): the standalone path works
#   only when this job does NOT check out the PR head — sandcastle checks the
#   existing head branch out in its own worktree, and git refuses the same
#   branch in two worktrees ("already checked out" WorktreeError). Hence the
#   checkout below pins `ref: main`. Still confirm on the next run that
#   review-prompt.md's {{TARGET_BRANCH}} resolves to `main` (non-empty diff).
#
# Note: label events on PRs opened from FORKS run without secrets (GitHub
# security), so this runner only works on same-repo PRs. That is expected for
# the internal factory flow.
#
# The old pr-reviewer loop (fired on `pull_request` opened/synchronize +
# `review-round:*` labels) has been retired now that this factory has a merged
# agent:implement proof (connector#394). This is the only PR-review automation.

name: agent:review

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    if: github.event.label.name == 'agent:review'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Evaluate guards
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          proceed=true

          # The labeler must have write access — refuses drive-by review
          # requests from outsiders.
          perm=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          echo "Actor ${ACTOR} permission: ${perm}"
          case "$perm" in
            admin|maintain|write) ;;
            *)
              echo "::warning::Actor ${ACTOR} lacks write permission (${perm}) — skipping."
              proceed=false ;;
          esac

          echo "proceed=${proceed}" >> "$GITHUB_OUTPUT"

  review:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: agent-review-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out MAIN, not the PR head: sandcastle's branch strategy checks
          # the PR head out in its own worktree under .sandcastle/worktrees/, and
          # git refuses to check out one branch in two worktrees at once. Holding
          # the PR head here made the first live run fail with WorktreeError
          # ("already checked out") — the main tree must hold any OTHER ref.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      # npm-workspaces (NOT pnpm) — no corepack step; `npm ci` on the host just
      # provides tsx + @ai-hero/sandcastle to launch the orchestrator.
      - name: Install dependencies
        run: npm ci

      # Prebuilt on GHCR (Rust/Foundry/Solana layers are slow to build per-run);
      # built with AGENT_UID/GID=1001 for the runner user and retagged to the
      # name sandcastle derives from the checkout dir. Rebuild instructions in
      # agent-implement.yml's matching step. Falls back to building in place.
      - name: "Pull prebuilt sandcastle agent image (fallback: build)"
        run: |
          if docker pull ghcr.io/toon-protocol/sandcastle-connector:latest; then
            docker tag ghcr.io/toon-protocol/sandcastle-connector:latest sandcastle:connector
          else
            echo "::warning::Prebuilt image pull failed — building on the runner."
            npx --yes @ai-hero/sandcastle@0.12.0 docker build-image
          fi

      # App token so review commits pushed back to the PR re-trigger ci.yml.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run sandcastle review runner
        env:
          SANDCASTLE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npm run sandcastle:review
