# promote-to-fleet — move `:rust-release` to a validated build, on purpose.
#
# ── THE CONTRADICTION THIS FILE RESOLVES ────────────────────────────────────
# Two records disagreed about what `ghcr.io/toon-protocol/connector:rust-release`
# is, and the disagreement was live on the devnet.
#
#   * toon-meta#403 (2026-08-16 13:41Z) and connector#989's own closing comment,
#     both recorded as owner-approved, say:
#
#       "for the connector image (fronts the LIVE relay), `:rust-release` is a
#        deliberate PROMOTION tag, NOT auto-on-green like swap/store/relay. It
#        moves only when a validated build is promoted (a `workflow_dispatch`
#        `promote-to-fleet` that retags a chosen `rust-sha-*` to
#        `:rust-release`), preserving ADR-0034 / connector#972's 'validated
#        before it hits production' gate while automating the *deploy* step."
#
#     [sic — "ADR-0034" is a mis-citation in the source and is quoted here
#     verbatim rather than corrected in place. ADR 0034 is "A runtime
#     peer/route table never shadows the config file" and has nothing to do
#     with release gating. The record for THIS rule is ADR 0041, written
#     alongside this file. connector#972, the other half of that citation, was
#     closed as superseded: the supervised regime it asked for is what this
#     workflow implements, and its own mechanism — a `rust-sha-*` literal in
#     the four fleet overlays — is now refused by
#     `every_fleet_overlay_pins_the_connector_repos_pin_of_record`.]
#
#   * connector#990, merged eleven hours EARLIER, shipped
#     `type=raw,value=rust-release,enable={{is_default_branch}}` in
#     publish-connector-rust-image.yml — a tag that moves on every green merge
#     to `main`.
#
# No `promote-to-fleet` workflow was ever written, #989 was closed anyway, and
# both boxes were then repointed to `:rust-release` with the Watchtower enable
# label. Net effect: every green merge to `main` reached both live devnet
# boxes within ~60s, unvalidated, while connector#972 — an OPEN pull request
# pinning the fleet to `rust-sha-1204220` "after a verified deploy, not before
# one" — still described a supervised immutable-pin regime, and
# `EXPECTED_CONNECTOR_TAG` still asserted it.
#
# ── THE RESOLUTION: the epic is right, the workflow was wrong ───────────────
# This file implements the promotion dispatch the record describes, and
# publish-connector-rust-image.yml no longer moves `rust-release` on green
# main. Code and docs now agree, and they agree on the SUPERVISED reading, for
# reasons that are specific to this image rather than a general taste for
# gates:
#
#   1. **Blast radius.** `connector-rust` is the client edge on BOTH boxes —
#      every paid write on the devnet enters through it — and `announce` is
#      the same image. A bad `swap:release` takes down one maker sidecar; a
#      bad `:rust-release` takes the whole devnet's money path dark on two
#      machines at once. toon-meta#403's owner-accepted "a bad-but-green merge
#      can reach production" trade-off was written about the opted-in
#      services; the connector was explicitly HELD out of it in that same
#      epic's comments 1 and 2, twice.
#   2. **The config is bind-mounted and the binary is not.** `RawConfig` and
#      `RawAnnounceConfig` are `deny_unknown_fields`, so the box's hand-tuned
#      `connector-rust.toml` and the image are a MATCHED PAIR — a field added
#      on one side is a refuse-to-start on the other. fleet-ops.yml already
#      encodes the only safe ordering for that pair (deploy the pin first,
#      apply the config second). An unattended pull has no ordering at all.
#   3. **It costs almost nothing.** The deploy is still automatic: Watchtower
#      recreates both boxes within ~60s of the retag. What promotion adds is a
#      human choosing WHICH build, and a machine checking that the build can
#      still read the fleet's committed configs before it moves.
#
# `swap`, `store` and `relay` keep auto-on-green. This is not a reversal of
# toon-meta#403 — it is the split that epic's own comments describe
# ("Connector = supervised promotion tag; swap/store/relay = auto-on-green").
#
# ── WHAT PROMOTION CHECKS BEFORE IT MOVES THE TAG ───────────────────────────
#   1. The tag exists in GHCR and names an immutable `rust-sha-` build.
#   2. Its commit is on `main` and is a DESCENDANT of the currently promoted
#      build, so promotion cannot silently roll the fleet backwards. (A
#      deliberate rollback is what `allow_rollback` is for, and it says so in
#      the summary.)
#   3. **Config compatibility**: the candidate image is booted against each
#      box's own committed `connector-rust.toml`. This is the connector-side
#      half of the rule in ADR 0041 — the same failure that took the relay's
#      swap maker down on 2026-08-16, checked before it can happen here.
#   4. **Deploy ordering, when a release says one is needed** (ADR 0055). A
#      release cut by release-connector.yml carries a machine-readable
#      `config-change-required: true|false` line in its GitHub Release body.
#      Where any release being crossed says `true`, this workflow refuses
#      unless (a) the committed box configs actually changed across that same
#      range, and (b) the operator names the `fleet-ops.yml config-apply` run
#      that put them on the boxes. That is ADR 0041 rule 2 — "the committed
#      box config is updated and applied FIRST, and the tag moves after" —
#      turned from advice into a check. swap#134 happened precisely because
#      that ordering lived only in a PR body, where nothing read it.
#
#      This does not duplicate check 3. Check 3 boots the candidate against
#      the configs COMMITTED HERE and so proves image-fits-committed-config;
#      it cannot see the bytes on the box, and the bytes on the box are what
#      Watchtower will recreate against. Check 4 is the only one covering
#      that gap.
#
#      The named run is VERIFIED, not believed. Five conditions, all of them
#      refusals: the run exists and is a run of fleet-ops.yml; it concluded
#      `success`; it was `operation=config-apply` and NOT a dry run
#      (`apply=true`); it covers every box whose committed config changed
#      across the crossed range; and it STARTED AFTER that config's commit,
#      because an apply predating the commit applied the previous file. Where
#      both boxes changed, one run covering one box is a refusal -- name
#      both. ADR 0055 records what this does and does not prove.
#   5. After the retag, fleet-health.yml probes both boxes and this run goes
#      red if they did not come back. A promotion that breaks the fleet
#      reports as a failure, with the alert issue already open.
#
# ── ROLLBACK ────────────────────────────────────────────────────────────────
# Dispatch this workflow again naming the previous `rust-sha-` tag, with
# `allow_rollback: true`. Every build ever published keeps its immutable tag,
# so there is always something to name.
#
# Check 4 runs on a rollback too, over the range being UNDONE rather than the
# range being carried. Rolling back across a release that needed a config
# change means the config has to move back with it, in the mirror-image order
# — the same trap fleet-ops.yml documents and docs/operators/fleet-release-
# and-health.md restates ("if the rollback target predates a field the box's
# committed config now sets, the config must be rolled back too").
#
# ── THIS WORKFLOW IS THE ONLY THING THAT MOVES `:rust-release` ──────────────
# release-connector.yml (ADR 0055) automates build → handle → GitHub Release
# and then CALLS this workflow rather than retagging itself. That is
# deliberate and it is asserted by
# `the_release_workflow_never_moves_the_fleet_tag_itself` in
# crates/connector-bin/tests/fleet_release_gate.rs: a second mover would mean
# a second copy of every check above, and the copy that is not exercised on
# the ordinary path is the one that rots.

name: promote-to-fleet

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Immutable tag to promote, e.g. rust-sha-1204220.'
        type: string
        required: true
      reason:
        description: 'Why this build is being promoted (recorded in the summary).'
        type: string
        required: false
        default: ''
      allow_rollback:
        description: 'Permit promoting a build that is NOT a descendant of the current one.'
        type: boolean
        required: false
        default: false
      skip_health_check:
        description: 'Skip the post-promotion fleet probe. Use only when the boxes are already known-down.'
        type: boolean
        required: false
        default: false
      config_applied_run:
        description: >-
          URL or run id of the fleet-ops.yml `config-apply` that put the
          committed box configs on the boxes. Required only when a release
          being crossed says `config-change-required: true`; recorded in the
          summary either way.
        type: string
        required: false
        default: ''

  # Called by release-connector.yml (ADR 0055). A release automates the
  # labour around the promotion; it does not get its own copy of the
  # promotion, so every check above runs identically whether a human
  # dispatched this workflow directly or a release did.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      reason:
        type: string
        required: false
        default: ''
      allow_rollback:
        type: boolean
        required: false
        default: false
      skip_health_check:
        type: boolean
        required: false
        default: false
      config_applied_run:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  # The deploy-ordering gate reads the LOGS of the fleet-ops `config-apply`
  # run it is given, because that is the only place a `workflow_dispatch`
  # run's inputs survive -- the run object has no `inputs` key and
  # fleet-ops.yml sets no `run-name:`, so `display_title` is the bare string
  # "fleet-ops". Without this scope the gate cannot read them, and it refuses
  # the promotion rather than assuming the best.
  actions: read
  # The `verify` job calls fleet-health.yml, which opens/closes the rolling
  # alert issue. A called workflow cannot hold more permission than its
  # caller grants, so this must be declared here too or the health job
  # startup-fails (the same subset-capped-caller trap connector#965 hit).
  issues: write

concurrency:
  # Never two promotions at once, and never cancel one mid-retag.
  group: promote-to-fleet
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/connector
  MOVING_TAG: rust-release

jobs:
  promote:
    name: Promote ${{ inputs.tag }} to :rust-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The ancestry check below needs history, not a shallow tip.
          fetch-depth: 0

      - name: Validate the requested tag's shape
        run: |
          set -euo pipefail
          TAG='${{ inputs.tag }}'
          # Only an immutable content-pinned build may be promoted. Promoting
          # `rust-main` would reintroduce exactly the auto-on-green behaviour
          # this workflow exists to replace, one indirection further away.
          if ! echo "$TAG" | grep -Eq '^rust-sha-[0-9a-f]{7}$'; then
            # The release handle alias (`rust-2026.08.21.1`, applied by
            # release-connector.yml) IS immutable and would be safe to
            # promote, but it is refused anyway: one accepted shape means one
            # thing for the ancestry check to parse a commit out of, and the
            # handle carries no commit. The GitHub Release for a handle names
            # its `rust-sha-` tag in the body, so the answer is one click away
            # rather than a puzzle -- say so instead of just failing.
            if echo "$TAG" | grep -Eq '^rust-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'; then
              echo "::error::'$TAG' is a release-handle alias, not a build tag."
              echo "::error::Open the GitHub Release ${TAG#rust-} and promote the 'rust-sha-' tag its body names."
              exit 1
            fi
            echo "::error::'$TAG' is not an immutable build tag. Promote a 'rust-sha-<7 hex>' tag."
            echo "::error::Floating tags (rust-main, rust-release) must never be promoted — that is auto-on-green by another name."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the candidate and the incumbent
        id: resolve
        run: |
          set -euo pipefail
          TAG='${{ inputs.tag }}'

          if ! docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$TAG does not exist in GHCR. Check the tag, or re-run publish-connector-rust-image.yml on that commit."
            exit 1
          fi
          echo "candidate=$TAG" >> "$GITHUB_OUTPUT"

          # The incumbent is whatever `:rust-release` points at today. On the
          # very first promotion there may be none; that is not an error.
          if docker buildx imagetools inspect "$IMAGE:$MOVING_TAG" >/dev/null 2>&1; then
            docker pull -q "$IMAGE:$MOVING_TAG"
            INCUMBENT=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE:$MOVING_TAG" 2>/dev/null || echo '')
            echo "incumbent_sha=$INCUMBENT" >> "$GITHUB_OUTPUT"
            echo "Currently promoted revision: ${INCUMBENT:-<unlabelled>}"
          else
            echo "incumbent_sha=" >> "$GITHUB_OUTPUT"
            echo "No :$MOVING_TAG yet — this is the first promotion."
          fi

      - name: The candidate must be on main, and must not roll the fleet back
        env:
          CANDIDATE: ${{ steps.resolve.outputs.candidate }}
          INCUMBENT_SHA: ${{ steps.resolve.outputs.incumbent_sha }}
        run: |
          set -euo pipefail
          # `rust-sha-<short>` is a commit prefix by construction (the publish
          # workflow cuts it from github.sha), so the tag itself is the
          # provenance -- the same property devnet_configs_load.rs's pin
          # assertions rely on.
          SHORT="${CANDIDATE#rust-sha-}"
          if ! git cat-file -e "$SHORT^{commit}" 2>/dev/null; then
            echo "::error::commit $SHORT is not in this repository — the tag does not name a build of this codebase."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHORT" origin/main; then
            echo "::error::commit $SHORT is not an ancestor of origin/main. Only a build of main may front the live fleet."
            exit 1
          fi
          echo "✓ $SHORT is on main."

          if [ -z "$INCUMBENT_SHA" ]; then
            echo "No incumbent to compare against."
            exit 0
          fi
          if ! git cat-file -e "$INCUMBENT_SHA^{commit}" 2>/dev/null; then
            echo "::warning::the currently promoted revision $INCUMBENT_SHA is not in this repo — skipping the ancestry comparison."
            exit 0
          fi
          if git merge-base --is-ancestor "$INCUMBENT_SHA" "$SHORT"; then
            echo "✓ forward move: $INCUMBENT_SHA -> $SHORT"
          elif [ '${{ inputs.allow_rollback }}' = 'true' ]; then
            echo "::warning::ROLLBACK — $SHORT is not a descendant of the promoted $INCUMBENT_SHA, allowed by allow_rollback."
            echo "ROLLBACK=1" >> "$GITHUB_ENV"
          else
            echo "::error::$SHORT is not a descendant of the currently promoted $INCUMBENT_SHA."
            echo "::error::That would roll the live fleet backwards. Re-dispatch with allow_rollback: true if that is what you mean."
            exit 1
          fi

      # ── The deploy-ordering gate (ADR 0041 rule 2, ADR 0055) ──────────────
      # ADR 0041 rule 2 says a config key with no safe default makes its
      # release a BREAKING DEPLOY: "the committed box config is updated and
      # applied first, and the tag moves after". Until now that sentence was
      # advice. swap#134's own PR body carried the identical sentence about
      # its own key — "needs one added key BEFORE the new image boots" — and
      # the relay's maker crash-looped anyway, because a PR body is not a
      # check and nobody was reading it at the moment the tag moved.
      #
      # release-connector.yml makes the claim machine-readable instead: every
      # GitHub Release it cuts carries a `config-change-required: true|false`
      # line. This step reads every release BEING CROSSED by this promotion
      # and, if any of them says `true`, demands two things the claim implies:
      #
      #   (a) the committed box configs actually changed across the same
      #       range. A release that says it needs a config change while
      #       infra/linode-*/connector-rust.toml sat untouched is swap#134
      #       exactly — the fix applied to the box and never committed. This
      #       half is machine truth and needs no human.
      #   (b) a `fleet-ops.yml config-apply` run is named. Nothing here can
      #       see the bytes on the box: the boot gate below proves the image
      #       fits the config committed HERE, and Watchtower will recreate
      #       against whatever is on the box. A named run URL is the weakest
      #       honest evidence for that gap, and it is deliberately a string
      #       rather than a tickbox — it lands in the run summary as a trail
      #       somebody can follow later.
      #
      # Direction matters. A forward promotion crosses (incumbent, candidate];
      # a rollback UNDOES (candidate, incumbent] and needs the config moved
      # back with it, so the same range logic runs with the endpoints swapped.
      #
      # A promotion with no incumbent, or of a build with no release, is not
      # refused: rollback targets and hand-published `rust-sha-` builds predate
      # this field and must stay promotable. That is a real hole and it is the
      # bounded one — the boot gate below still runs on every promotion.
      - name: A crossed release that requires a config change must have had it landed and applied
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.resolve.outputs.candidate }}
          INCUMBENT_SHA: ${{ steps.resolve.outputs.incumbent_sha }}
          CONFIG_APPLIED_RUN: ${{ inputs.config_applied_run }}
        run: |
          set -euo pipefail
          SHORT="${CANDIDATE#rust-sha-}"

          if [ -z "$INCUMBENT_SHA" ] || ! git cat-file -e "$INCUMBENT_SHA^{commit}" 2>/dev/null; then
            echo "::warning::No comparable incumbent revision — no release range to read. Skipping the ordering gate."
            exit 0
          fi

          if [ "${ROLLBACK:-0}" = "1" ]; then
            FROM="$SHORT"; TO="$INCUMBENT_SHA"
            echo "Rollback: reading the releases being UNDONE, ($FROM, $TO]."
          else
            FROM="$INCUMBENT_SHA"; TO="$SHORT"
            echo "Forward: reading the releases being CARRIED, ($FROM, $TO]."
          fi

          RANGE=$(git rev-list "$FROM..$TO")
          if [ -z "$RANGE" ]; then
            echo "✓ No commits between the two builds — nothing to cross."
            exit 0
          fi

          # `gh api`, not `gh release list`: that command's `--json` cannot
          # return `targetCommitish` or `body` (only createdAt, isDraft,
          # isLatest, isPrerelease, name, publishedAt, tagName), and both are
          # needed here -- the commit to place the release in the range, and
          # the body to read the declaration out of. One paginated call gets
          # both for every release, instead of one `gh release view` per.
          #
          # The line test is exact after trimming CR and trailing blanks,
          # matching what release-connector.yml writes verbatim. The two
          # literals are held together by
          # `the_release_body_and_the_promotion_gate_agree_on_the_ordering_field`
          # in crates/connector-bin/tests/fleet_release_gate.rs, because a
          # silent disagreement here reads as a PASS: the grep finds nothing
          # and every promotion is waved through looking checked.
          DECLARED=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            .[]
            | select(.draft | not)
            | select(
                ((.body // "")
                 | split("\n")
                 | map(sub("\r$"; "") | sub("[ \t]+$"; ""))
                 | any(. == "config-change-required: true"))
              )
            | [.tag_name, .target_commitish] | @tsv')

          DEMANDING=""
          while IFS=$'\t' read -r RTAG RTARGET; do
            [ -n "${RTAG:-}" ] || continue
            # A release cut against a BRANCH name carries no commit we can
            # place in the range. release-connector.yml always passes
            # `--target <full sha>`; anything else is not one of ours.
            case "$RTARGET" in
              [0-9a-f]*) ;;
              *) continue ;;
            esac
            [ "${#RTARGET}" -eq 40 ] || continue
            printf '%s\n' "$RANGE" | grep -qx "$RTARGET" || continue

            echo "  $RTAG ($RTARGET) — config-change-required: true, and inside the range"
            DEMANDING="$DEMANDING $RTAG"
          done <<EOF
          $DECLARED
          EOF

          if [ -z "$DEMANDING" ]; then
            echo "✓ No crossed release requires a config change."
            exit 0
          fi

          echo "Releases demanding a config change:$DEMANDING"

          CHANGED=$(git diff --name-only "$FROM" "$TO" -- \
            infra/linode-relay/connector-rust.toml \
            infra/linode-store/connector-rust.toml)
          if [ -z "$CHANGED" ]; then
            echo "::error::Release(s)$DEMANDING declare config-change-required: true, but neither box's"
            echo "::error::committed connector-rust.toml changed between $FROM and $TO."
            echo "::error::That is the 2026-08-16 shape: the config fix exists only on the box, or not at all."
            echo "::error::Land it in infra/linode-relay/ and/or infra/linode-store/ first. See ADR 0041 rule 2."
            exit 1
          fi
          echo "✓ Committed box config changed across the range:"
          printf '    %s\n' $CHANGED

          # Which BOXES must have been applied, and the moment each one's
          # config last moved. `ario` is the store box's Linode label, which
          # is what fleet-ops.yml's `box` input takes -- not "store".
          REQUIRED=""
          for F in $CHANGED; do
            case "$F" in
              infra/linode-relay/connector-rust.toml) B=relay ;;
              infra/linode-store/connector-rust.toml) B=ario ;;
              *) echo "::error::unexpected path $F"; exit 1 ;;
            esac
            # Committer date, not author date: a rebase moves the committer
            # date FORWARD, which is the safe direction for an
            # "applied-after" test.
            WHEN=$(git log -1 --format=%ct "$FROM..$TO" -- "$F")
            echo "  $B must have been applied after $(date -u -d "@$WHEN" +%Y-%m-%dT%H:%M:%SZ) ($F)"
            REQUIRED="$REQUIRED $B:$WHEN"
          done

          if [ -z "$CONFIG_APPLIED_RUN" ]; then
            echo "::error::Release(s)$DEMANDING declare config-change-required: true and the committed"
            echo "::error::box config did change — but no config_applied_run was given, so nothing says the"
            echo "::error::BOXES have it. Watchtower recreates against the file on the box, not this repo."
            echo "::error::Apply it, then re-dispatch naming the run URL(s) — one per box that changed:"
            echo "::error::  gh workflow run fleet-ops.yml -f box=relay -f operation=config-apply -f apply=true"
            echo "::error::  gh workflow run fleet-ops.yml -f box=ario  -f operation=config-apply -f apply=true"
            exit 1
          fi

          # ── Verify the named run(s) rather than believing them ─────────────
          # This used to be an attestation: a non-empty string, recorded and
          # trusted. ADR 0041's own thesis refuses that -- "the enforceable
          # half has to be a check on the config the fleet actually has" --
          # so an unverifiable string is precisely the unenforceable half it
          # says is not sufficient. It cost every release some friction and
          # bought an audit line nobody could rely on.
          #
          # `workflow_dispatch` inputs are NOT on the run object: it has no
          # `inputs` key, and fleet-ops.yml sets no `run-name:`, so
          # `display_title` is the bare string "fleet-ops" (verified against
          # 12 real runs). What IS recorded is fleet-ops.yml's job-level
          # `env:` block -- BOX, OPERATION, SERVICE, APPLY -- which the runner
          # echoes into the log before every step. That is a consequence of
          # how that file is written, not a GitHub contract, so
          # `the_apply_verification_reads_what_fleet_ops_actually_records` in
          # crates/connector-bin/tests/fleet_release_gate.rs fails the build
          # if fleet-ops.yml stops declaring them there. Every branch below
          # fails CLOSED: an unreadable log refuses the promotion, it never
          # waves it through.
          COVERED=""
          for TOKEN in $(echo "$CONFIG_APPLIED_RUN" | tr ',' ' '); do
            RID=$(echo "$TOKEN" | grep -oE '[0-9]{6,}' | tail -1 || true)
            if [ -z "$RID" ]; then
              echo "::error::'$TOKEN' contains no run id. Give the run URL or its numeric id."
              exit 1
            fi
            echo "::group::fleet-ops run $RID"

            # `if !`, not `|| true`: on a 404 `gh api` exits 1 but still
            # prints the error BODY to stdout, so a swallowed exit code turns
            # "no such run" into a refusal whose message quotes a JSON blob at
            # the operator. Verified against a bogus run id.
            if ! META=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RID" \
              --jq '[.path, .conclusion, .run_started_at, .event] | @tsv' 2>/dev/null); then
              echo "::error::no run $RID in $GITHUB_REPOSITORY, or it is not readable."
              echo "::error::Name the fleet-ops config-apply run by its URL or its numeric id."
              exit 1
            fi
            IFS=$'\t' read -r RPATH RCONC RSTART REVENT <<EOF2
          $META
          EOF2
            echo "path=$RPATH conclusion=$RCONC started=$RSTART event=$REVENT"

            if [ "$RPATH" != '.github/workflows/fleet-ops.yml' ]; then
              echo "::error::run $RID is '$RPATH', not fleet-ops.yml. Only a fleet-ops run applies a box config."
              exit 1
            fi
            if [ "$RCONC" != 'success' ]; then
              echo "::error::fleet-ops run $RID concluded '$RCONC'. A config-apply that did not succeed did not apply anything."
              exit 1
            fi

            # The logs are the only place the inputs survive. 410 Gone once
            # they age out (90 days by default) -- which refuses the
            # promotion rather than passing it, because an apply nobody can
            # read is an apply nobody can check.
            if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RID/logs" > "$RUNNER_TEMP/$RID.zip" 2>/dev/null; then
              echo "::error::cannot read logs for fleet-ops run $RID (expired, or actions:read is missing)."
              echo "::error::Without them nothing can confirm the run was a config-apply for the right box."
              echo "::error::Re-run the apply and name the new run."
              exit 1
            fi
            # python3, not `unzip | sed`: both are on ubuntu-latest, but
            # this one can be run outside a runner, which is how the truth
            # table below was actually exercised against real fleet-ops runs
            # rather than reasoned about. A gate nobody has run is a gate.
            python3 - "$RUNNER_TEMP/$RID.zip" > "$RUNNER_TEMP/$RID.log" <<'PY'
          import re, sys, zipfile

          z = zipfile.ZipFile(sys.argv[1])
          ansi = re.compile(r"\x1b\[[0-9;]*m")
          stamp = re.compile(r"^\S+Z ")
          for name in z.namelist():
              for raw in z.read(name).decode("utf-8", "replace").splitlines():
                  print(ansi.sub("", stamp.sub("", raw)).rstrip())
          PY

            field() {
              grep -E "^  $1: " "$RUNNER_TEMP/$RID.log" | sed -E "s/^  $1: //" | sort -u
            }
            R_OP=$(field OPERATION)
            R_BOX=$(field BOX)
            R_APPLY=$(field APPLY)
            echo "recorded: OPERATION='$R_OP' BOX='$R_BOX' APPLY='$R_APPLY'"
            echo "::endgroup::"

            # One value each, or the log is not telling us one story.
            for PAIR in "OPERATION:$R_OP" "BOX:$R_BOX" "APPLY:$R_APPLY"; do
              K=${PAIR%%:*}; V=${PAIR#*:}
              if [ -z "$V" ] || [ "$(printf '%s' "$V" | wc -l)" -gt 0 ]; then
                echo "::error::could not read a single $K from fleet-ops run $RID's log (got '$V')."
                echo "::error::fleet-ops.yml records these as job-level env; if that changed, this gate must be updated, not bypassed."
                exit 1
              fi
            done

            if [ "$R_OP" != 'config-apply' ]; then
              echo "::error::fleet-ops run $RID was operation '$R_OP', not config-apply. It did not write a config file."
              exit 1
            fi
            if [ "$R_APPLY" != 'true' ]; then
              echo "::error::fleet-ops run $RID ran with apply=false. That is a DRY RUN: it read the box, printed a diff, and wrote nothing."
              exit 1
            fi

            RSTART_EPOCH=$(date -u -d "$RSTART" +%s)
            COVERED="$COVERED $R_BOX:$RSTART_EPOCH"
            echo "✓ run $RID: config-apply, apply=true, success, box=$R_BOX"
          done

          # Every box whose committed config moved must be covered by a run
          # that STARTED AFTER that move. An apply that predates the config
          # commit applied the previous file, which is the same outage with a
          # receipt attached.
          rc=0
          for REQ in $REQUIRED; do
            RB=${REQ%%:*}; RWHEN=${REQ#*:}
            BEST=""
            for COV in $COVERED; do
              CB=${COV%%:*}; CWHEN=${COV#*:}
              if [ "$CB" = "$RB" ] && [ "$CWHEN" -gt "$RWHEN" ]; then BEST="$CWHEN"; fi
            done
            if [ -z "$BEST" ]; then
              echo "::error::box '$RB' had its committed connector-rust.toml changed in this range, and no"
              echo "::error::named fleet-ops config-apply run for '$RB' started after $(date -u -d "@$RWHEN" +%Y-%m-%dT%H:%M:%SZ)."
              echo "::error::Apply it and name that run:"
              echo "::error::  gh workflow run fleet-ops.yml -f box=$RB -f operation=config-apply -f apply=true"
              rc=1
            else
              echo "✓ box '$RB' applied at $(date -u -d "@$BEST" +%Y-%m-%dT%H:%M:%SZ), after its config commit."
            fi
          done
          exit $rc

      # ── The config-compatibility gate (ADR 0041) ──────────────────────────
      # The box's `connector-rust.toml` is BIND-MOUNTED: it is not in the
      # image, no image build ever sees it, and a Watchtower recreate swaps
      # the binary underneath it without anyone consulting it. `RawConfig` is
      # `deny_unknown_fields` and refuses unknown and missing fields alike, so
      # binary and config are a matched pair — and this is the one moment in
      # the whole pipeline where both halves are in the same place at the same
      # time. Check them here or nowhere.
      #
      # Both boxes' files are checked, not one: they are different files with
      # different routes, prefixes and settlement blocks, and #948's own
      # finding was two overlays pinning two different stale tags.
      - name: Candidate image must boot both boxes' committed configs
        run: |
          set -uo pipefail
          TAG='${{ inputs.tag }}'
          docker pull -q "$IMAGE:$TAG"
          rc=0

          for CONF in infra/linode-relay/connector-rust.toml infra/linode-store/connector-rust.toml; do
            echo "::group::$CONF"
            WORK=$(mktemp -d)
            # Key material is never committed (`.gitignore`), and config load
            # refuses a `key_file` that is not there — so stand in placeholder
            # scalars at exactly the paths the committed file names. This is
            # the same substitution crates/connector-bin/tests/devnet_configs_load.rs
            # makes for the same reason, and it touches nothing semantic: no
            # prefix, no route, no peer, no price, no field name. The SHAPE of
            # the config -- which is what a schema change breaks -- is verbatim.
            mkdir -p "$WORK/data" "$WORK/state"
            for k in signer settlement settlement-solana announce; do
              openssl rand -hex 32 > "$WORK/data/$k.key"
            done
            chmod -R a+rX "$WORK"

            set +e
            OUTPUT=$(timeout 60 docker run --rm \
              -v "$PWD/$CONF":/app/config/connector.toml:ro \
              -v "$WORK/data":/app/data:ro \
              -v "$WORK/state":/app/state \
              --user 0 \
              "$IMAGE:$TAG" 2>&1)
            STATUS=$?
            set -e
            echo "$OUTPUT" | tail -40
            echo "exit: $STATUS"
            echo "::endgroup::"

            # 124 = still running when `timeout` killed it = it loaded this
            # config and got as far as serving. That is the pass.
            if [ "$STATUS" -eq 124 ]; then
              echo "✓ $CONF loads and serves on $TAG"
              continue
            fi

            # Distinguish "this config does not fit this binary" from "a
            # settlement RPC was unreachable from a GitHub runner". Only the
            # first is a reason to refuse a promotion; the second is noise
            # this gate must not turn into a false red.
            if echo "$OUTPUT" | grep -Eq 'is not valid TOML|unknown field|missing field|failed to read config file'; then
              echo "::error::$TAG REFUSES $CONF — a config-schema break. This build must not front the fleet."
              echo "::error::Fix the committed config first (fleet-ops.yml config-apply), or make the new field optional. See ADR 0041."
              rc=1
            else
              echo "::warning::$CONF did not reach a serving state on $TAG (exit $STATUS), but not with a config-schema error."
              echo "::warning::Most likely an unreachable settlement RPC from this runner (ADR 0009 refuses to start on one). Output above."
            fi
          done
          exit $rc

      - name: Move :rust-release
        run: |
          set -euo pipefail
          TAG='${{ inputs.tag }}'
          # A retag, not a rebuild: `imagetools create` re-points the tag at
          # the EXACT manifest already validated above. Rebuilding could
          # produce a different image from the same commit and would make the
          # checks above vouch for something else.
          docker buildx imagetools create -t "$IMAGE:$MOVING_TAG" "$IMAGE:$TAG"
          echo "Moved $IMAGE:$MOVING_TAG -> $TAG"

      - name: Summary
        if: always()
        run: |
          {
            echo "## promote-to-fleet"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Promoted | \`$IMAGE:${{ inputs.tag }}\` |"
            echo "| Moving tag | \`:$MOVING_TAG\` |"
            echo "| Previous | \`${{ steps.resolve.outputs.incumbent_sha }}\` |"
            echo "| Rollback | \`${ROLLBACK:-0}\` |"
            echo "| Config applied by | ${{ inputs.config_applied_run }} |"
            echo "| Reason | ${{ inputs.reason }} |"
            echo ""
            echo "Both boxes' label-scoped Watchtower recreates \`connector-rust\` and \`announce\` within ~60s."
            echo "The health job below probes them once they have had time to land."
            echo ""
            echo "To undo: re-dispatch with \`tag: ${{ steps.resolve.outputs.incumbent_sha }}\` (as a \`rust-sha-\` tag) and \`allow_rollback: true\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # The deploy is not done when the tag moves — it is done when the boxes are
  # serving again. Watchtower will not tell us that, so this does.
  verify:
    name: Verify the fleet came back
    needs: promote
    if: needs.promote.result == 'success' && !inputs.skip_health_check
    uses: ./.github/workflows/fleet-health.yml
    with:
      box: all
      # 60s Watchtower poll + pull + boot, with margin. Probing sooner just
      # measures the old container.
      settle_seconds: '180'
    secrets: inherit
