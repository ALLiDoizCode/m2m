name: Build and Publish

on:
  # Manual trigger for explicit builds
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for Docker image (e.g., v2.6.0) - leave empty for latest'
        required: false
        type: string
      publish_docker:
        description: 'Build and push Docker image to GHCR'
        required: false
        default: 'true'
        type: boolean
      publish_npm:
        description: 'Publish npm package to npmjs.com'
        required: false
        default: 'true'
        type: boolean
      docker_tags:
        description: 'Additional Docker tags (comma-separated)'
        required: false
        type: string

  # Automatic builds on version tags
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/connector
  NODE_VERSION: '22.20.0'

jobs:
  # Build stage - shared across all publish jobs
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ -n '${{ github.event.inputs.version }}' ]; then
            VERSION='${{ github.event.inputs.version }}'
          elif [[ '${{ github.ref }}' =~ ^refs/tags/v(.+)$ ]]; then
            VERSION='v'${BASH_REMATCH[1]}
          else
            VERSION='latest'
          fi
          echo $VERSION
          echo 'version='$VERSION >> $GITHUB_OUTPUT

      - name: Verify npm version matches Docker image tag
        run: |
          NPM_VERSION=$(node -p "require('./packages/connector/package.json').version")
          echo "npm version: $NPM_VERSION"
          echo "Docker tag: ${{ steps.version.outputs.version }}"
          # For tagged releases, the Docker tag (v3.2.0) should match npm version (3.2.0)
          if [ "${{ steps.version.outputs.version }}" != "latest" ]; then
            DOCKER_TAG="${{ steps.version.outputs.version }}"
            # Strip 'v' prefix for comparison
            NORMALIZED_DOCKER_TAG="${DOCKER_TAG#v}"
            if [ "$NPM_VERSION" != "$NORMALIZED_DOCKER_TAG" ]; then
              echo "ERROR: Version mismatch! npm=$NPM_VERSION, docker=$NORMALIZED_DOCKER_TAG"
              exit 1
            fi
            echo "✓ Version sync validated: $NPM_VERSION"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install libsql native module for Linux
        run: |
          # Force install the Linux x64 glibc native module for libsql.
          # package-lock.json may have been generated on macOS, so npm ci does
          # not pull the linux binary that the connector tests load.
          npm install @libsql/linux-x64-gnu --no-save --ignore-scripts || true

      - name: Build packages
        run: npm run build

      - name: Run tests
        run: npm test --if-present || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            packages/connector/dist/
            packages/connector/package.json
          retention-days: 1

  # Build and publish Docker image
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event.inputs.publish_docker != 'false'
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages/connector

      # Register an up-to-date QEMU/binfmt for the emulated linux/arm64 build.
      # Without this, arm64 `npm install` runs under the runner's stale QEMU and
      # intermittently crashes with SIGILL (exit 132). Mirrors ci.yml.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=semver,pattern={{version}},value=${{ needs.build.outputs.version }}
            type=sha,prefix=
            type=ref,event=branch

      - name: Add additional tags
        if: github.event.inputs.docker_tags
        run: |
          ADDITIONAL_TAGS='${{ github.event.inputs.docker_tags }}'
          for tag in $(echo $ADDITIONAL_TAGS | tr ',' '\n'); do
            echo $tag >> tags.txt
          done

      # Build the image into the local Docker daemon first so the smoke test
      # can exercise it before we publish. issue #54: 3.3.3 shipped without
      # the SQLite native binding, silently degrading payment channels — the
      # smoke test below is the regression gate. (issue #79: the local DB binding
      # is now libsql, an N-API prebuild; better-sqlite3 was removed.)
      - name: Build Docker image (load locally)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: connector:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64 # load: true requires single-platform; smoke-test arch is amd64 only

      - name: Smoke-test native bindings in built image
        run: |
          docker run --rm --entrypoint node connector:smoke-test \
            -e "require('libsql'); console.log('native bindings OK')"

      # Regression gate for the Mina claim-verification ESM-require bug: the
      # connector loads @toon-protocol/mina-zkapp via a dynamic import that tsc
      # (module: commonjs) lowers to require(); that package statically imports
      # the ESM-only mina-fungible-token, so a Node runtime without require(esm)
      # support (< 22.12) throws ERR_REQUIRE_ESM and every Mina claim F06-rejects.
      # This exercises the exact require() boundary in the shipped image and fails
      # the build if the base image ever regresses below the require(esm) floor.
      - name: Smoke-test Mina claim-verification ESM load in built image
        run: |
          docker run --rm --entrypoint node connector:smoke-test \
            -e "require('@toon-protocol/mina-zkapp'); require('mina-fungible-token'); console.log('Mina ESM require OK')"

      - name: Push Docker image
        id: push-connector
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Connector
            org.opencontainers.image.description=Multi-chain ILP connector
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Sign connector image with cosign (keyless OIDC)
        env:
          DIGEST: ${{ steps.push-connector.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Docker build summary
        run: |
          echo '## Docker Build Summary' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '**Image:** `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}`' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '**Tags:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.tags }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '**Registry:** GHCR' >> $GITHUB_STEP_SUMMARY

  # Publish npm package to npmjs.com
  npm:
    name: Publish npm Package
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event.inputs.publish_npm != 'false'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages/connector

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          scope: '@toon-protocol'

      - name: Install dependencies
        run: npm install --prefer-offline
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/connector
          # Artifacts already contain built dist/; skip prepublishOnly rebuild
          npm publish --access public --ignore-scripts

      - name: npm publish summary
        run: |
          echo '## npm Publish Summary' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '**Package:** `@toon-protocol/connector`' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '**Registry:** npmjs.com' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '**Version:** `${{ needs.build.outputs.version }}`' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '### Install Package' >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'npm install @toon-protocol/connector@${{ needs.build.outputs.version }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # Create GitHub Release for version tags
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker, npm]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=$(git log --oneline ${{ github.ref_name }}...$(git describe --tags --abbrev=0 HEAD^))
          echo 'changelog' >> $GITHUB_OUTPUT
          echo 'changelog='$CHANGELOG >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            connector-*.tar
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changelog }}

            ## Docker Image

            Pull the latest image:
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

            ## npm Package

            Install the latest version:
            ```
            npm install @toon-protocol/connector@${{ github.ref_name }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Summary job - always runs last
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [docker, npm, release]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo '## Build and Publish Complete' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '| Job | Status |' >> $GITHUB_STEP_SUMMARY
          echo '|-----|--------|' >> $GITHUB_STEP_SUMMARY
          echo '| Docker Image | ${{ needs.docker.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| npm Package | ${{ needs.npm.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| GitHub Release | ${{ needs.release.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '**Version:** `${{ needs.build.outputs.version }}`' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '### Docker Usage' >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
