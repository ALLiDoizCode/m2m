name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Detect which areas changed so heavy, chain-specific Docker integration jobs
  # run on PRs only when relevant, without path-gating the whole workflow
  # (which would drop required checks on unrelated PRs).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      solana: ${{ steps.filter.outputs.solana }}
      mina: ${{ steps.filter.outputs.mina }}
      evm: ${{ steps.filter.outputs.evm }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            solana:
              - 'packages/solana-program/**'
              - 'packages/connector/src/settlement/solana-**'
              - 'packages/connector/test/integration/solana-**'
              - 'infra/solana/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            mina:
              - 'packages/connector/src/settlement/mina-**'
              - 'packages/connector/src/settlement/provider/mina-**'
              - 'packages/connector/test/integration/mina-**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            evm:
              - 'packages/connector/src/settlement/payment-channel-sdk.ts'
              - 'packages/connector/src/settlement/provider/evm-**'
              - 'packages/connector/test/integration/standalone-**'
              - 'packages/faucet/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Verify Node and npm versions
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Current directory: $(pwd)"

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm ci --ignore-scripts --verbose
          echo "Installation complete. Verifying..."
          npm list --depth=0 || true

      - name: Verify workspace setup
        run: |
          echo "Checking workspace configuration..."
          npm query ".workspace" | head -20 || true
          echo "Checking for binaries..."
          ls -la node_modules/.bin/ | head -20 || true

      - name: Run ESLint
        run: |
          echo "Running ESLint across all workspaces..."
          npm run lint --verbose

      - name: Check Prettier formatting
        run: |
          echo "Checking Prettier formatting..."
          npm run format:check

  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.12.0', '22.x']
      fail-fast: false # Continue testing other versions even if one fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Verify environment
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "PATH: $PATH"

      - name: Install dependencies with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci --ignore-scripts --verbose

      - name: Install libsql native module for Linux
        run: |
          # Force install the Linux x64 glibc native module for libsql
          # This is needed because package-lock.json may have been generated on macOS
          npm install @libsql/linux-x64-gnu --no-save --ignore-scripts || true

      - name: Verify installation
        run: |
          echo "Verifying workspace dependencies..."
          npm list --depth=0 || true
          echo ""
          echo "Checking for Jest binary..."
          which jest || echo "jest not in PATH - will use npx"
          echo ""
          echo "Checking workspace binaries..."
          ls -la node_modules/.bin/ | grep -E 'jest|ts-jest' || echo "Jest binaries not found in root"

      - name: Build shared and mina-zkapp packages (required for tests)
        run: |
          echo "Building shared package..."
          npm run build --workspace=packages/shared
          test -d packages/shared/dist && echo "✓ Shared package built successfully" || (echo "✗ Shared package build failed" && exit 1)

          echo "Building mina-zkapp package (connector imports via dynamic import)..."
          npm run build --workspace=packages/mina-zkapp
          test -d packages/mina-zkapp/dist && echo "✓ Mina zkApp package ready" || exit 1

      - name: Run unit tests with coverage (excluding mina-zkapp)
        run: |
          echo "Running unit tests across all workspaces..."
          echo "Using npx to ensure jest is found..."
          npm run test:unit --workspace=packages/connector -- --coverage --ci --verbose
          npm test --workspace=packages/shared -- --ci --verbose
          npm test --workspace=tools/send-packet -- --ci --verbose
        env:
          CI: true
          NODE_ENV: test

      - name: Run mina-zkapp tests in serial isolation (WASM memory)
        run: |
          echo "Running mina-zkapp tests with reduced parallelism to avoid WASM OOM..."
          NODE_OPTIONS='--max-old-space-size=8192' npm test --workspace=packages/mina-zkapp -- --runInBand --ci --verbose
        env:
          CI: true
          NODE_ENV: test

      - name: Verify coverage output
        if: matrix.node-version == '22.12.0'
        run: |
          echo "Checking for coverage files..."
          find . -name "lcov.info" -type f || echo "No lcov.info files found"
          test -f coverage/lcov.info && echo "✓ Coverage file exists" || echo "⚠ Coverage file not found"

      - name: Upload coverage to Codecov (Node 22.12.0 only)
        if: matrix.node-version == '22.12.0'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

  # contracts-coverage moved to .github/workflows/contracts.yml — that workflow
  # is path-filtered to `packages/contracts/**` and authenticates foundryup
  # against api.github.com so it doesn't 403 on rate-limited runner IPs.

  build:
    name: Build All Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Verify environment
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"

      - name: Install dependencies with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci --ignore-scripts --verbose

      - name: Verify installation
        run: |
          echo "Verifying dependencies..."
          npm list --depth=0 || true

      - name: Build all packages
        run: |
          echo "Building all packages (shared first, then others)..."
          npm run build
        env:
          NODE_ENV: production

      - name: Verify dist artifacts
        run: |
          echo "Verifying build artifacts..."

          if [ -d packages/connector/dist ]; then
            echo "✓ connector built successfully"
            ls -lh packages/connector/dist | head -10
          else
            echo "✗ connector build failed"
            exit 1
          fi

          if [ -d packages/shared/dist ]; then
            echo "✓ shared built successfully"
            ls -lh packages/shared/dist | head -10
          else
            echo "✗ shared build failed"
            exit 1
          fi

          echo ""
          echo "All packages built successfully! ✓"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            packages/*/dist
          retention-days: 7
        if: always()

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies (including optional deps)
        # `npm ci` installs optionalDependencies by default on supported
        # platforms; we pass --include=optional explicitly so the audit below
        # is guaranteed to see optional packages regardless of any future
        # default change.
        run: npm ci --ignore-scripts --include=optional

      # Security hardening: Check for high/critical vulnerabilities (Story 16.2)
      # Currently advisory due to transitive dependency issues requiring major updates
      # Known issues: express (body-parser), aws-sdk (fast-xml-parser)
      #
      # Epic 35 retro action item #2: ensure optional deps are in-scope. We
      # run audit twice: once over the full tree (default), and once
      # explicitly including optional deps via --include=optional. The second
      # pass is defensive — `npm audit` should already cover installed
      # optional deps, but being explicit documents intent and survives any
      # npm behavior change.
      - name: Run npm audit (full tree including optional deps)
        run: npm audit --audit-level=high --include=optional
        continue-on-error: true

      - name: Run npm audit (baseline, all installed packages)
        run: npm audit --audit-level=high
        continue-on-error: true

      # Security hardening: Check for Snyk high/critical findings (Story 16.2)
      # Advisory - fails gracefully if SNYK_TOKEN not configured
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: snyk.sarif

  # Container security scanning with Trivy
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    # Only run after Docker image is pushed (main branch only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/connector:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci --ignore-scripts --verbose

      - name: Build shared and mina-zkapp packages (required for type checking connector)
        run: |
          echo "Building shared package for type definitions..."
          npm run build --workspace=packages/shared
          test -d packages/shared/dist && echo "✓ Shared package ready" || exit 1

          echo "Building mina-zkapp package (connector imports via dynamic import)..."
          npm run build --workspace=packages/mina-zkapp
          test -d packages/mina-zkapp/dist && echo "✓ Mina zkApp package ready" || exit 1

      - name: Type check all packages
        run: |
          echo "Type checking all packages..."
          echo "Checking shared..."
          npx tsc --noEmit --composite false --skipLibCheck true -p packages/shared/tsconfig.json
          echo "✓ shared type check passed"

          echo "Checking connector..."
          npx tsc --noEmit --composite false --skipLibCheck true -p packages/connector/tsconfig.json
          echo "✓ connector type check passed"

          echo ""
          echo "All type checks passed! ✓"

  # No-false-PASS guard (issue #398 / ADR-0001): fails only on lint/typecheck
  # violations that exceed the frozen per-workspace allowlist in
  # .sandcastle/gate-baseline.json, not on the live thresholds this job
  # happens to run with. See packages/gate.
  gate-correctness:
    name: Gate Correctness Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci --ignore-scripts --verbose

      - name: Build shared and mina-zkapp packages (required for typecheck)
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=packages/mina-zkapp

      - name: Build gate-check tool
        run: npm run build --workspace=packages/gate

      - name: Run correctness guard against frozen baseline
        run: node packages/gate/dist/cli.js correctness

  rfc-links:
    name: Verify RFC Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci --ignore-scripts --verbose

      - name: Verify RFC Links
        env:
          RFC_LINKS_TEST: 'true'
        run: |
          echo "Verifying RFC links in documentation..."
          npm run test:rfc-links
          echo "✓ RFC links verified"

  # Solana integration tests (Docker-gated)
  # Runs T-33.7-05 and T-33.7-10 which require solana-test-validator
  # Uses docker-compose --profile solana for consistency with local dev (Story 33.9)
  solana-integration:
    name: Solana Integration Tests (Docker)
    runs-on: ubuntu-latest
    needs: [test, changes]
    # Run on main branch pushes, and on PRs that touch Solana code/infra so
    # on-chain regressions are caught before merge (not just post-merge on main).
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.solana == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.12/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # Cache the downloaded platform-tools (keyed on the tools-version) so
      # cargo build-sbf doesn't re-resolve/re-download it from the network each
      # run. Network resolution is the source of the flaky "unexpected character
      # 'l' while parsing major version" panic (issue #105); a warm cache skips
      # it entirely. The retry loop below still covers the cold-cache first run.
      - name: Cache Solana platform-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: solana-platform-tools-${{ runner.os }}-v1.52

      - name: Build Solana program
        working-directory: packages/solana-program
        # --tools-version v1.52 matches the solana-program job: the default
        # platform-tools (cargo 1.84) cannot parse the edition2024 lockfile deps.
        # Retry: platform-tools version resolution is occasionally flaky and
        # panics ("unexpected character 'l' while parsing major version") — a
        # transient that succeeds on retry.
        run: |
          n=0
          until cargo build-sbf --tools-version v1.52; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "cargo build-sbf failed after $n attempts"
              exit 1
            fi
            echo "cargo build-sbf attempt $n failed (likely flaky tools-version resolution) — retrying in 5s..."
            sleep 5
          done

      - name: Start Solana validator via docker-compose
        run: docker compose --profile solana up -d

      - name: Wait for Solana validator health check
        run: |
          echo "Waiting for Solana validator to be ready..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:8899/health | grep -q 'ok'; then
              echo "Solana validator is healthy."
              exit 0
            fi
            echo "Attempt $i/60 -- waiting..."
            sleep 2
          done
          echo "Solana validator failed to become healthy within 120s"
          docker compose --profile solana logs || true
          exit 1

      - name: Run Solana integration tests
        run: |
          echo "Running Docker-gated Solana integration tests (T-33.7-05, T-33.7-10)..."
          npx jest test/integration/solana-subscription.test.ts --ci --verbose
        working-directory: packages/connector
        env:
          CI: true
          NODE_ENV: test
          SOLANA_INTEGRATION: 'true'
          SOLANA_RPC_URL: http://localhost:8899
          SOLANA_WS_URL: ws://localhost:8900

      - name: Tear down Solana validator
        if: always()
        run: docker compose --profile solana down

      - name: Report results
        if: always()
        run: |
          echo "Solana integration tests completed"
          echo "Tests T-33.7-05 and T-33.7-10 executed with SOLANA_INTEGRATION=true"

  # Mina integration tests (Docker-gated)
  # Runs T-34.8-18 which requires Mina lightnet
  # Uses docker-compose --profile mina for consistency with local dev (Story 34.10)
  mina-integration:
    name: Mina Integration Tests (Docker)
    runs-on: ubuntu-latest
    needs: [test, changes]
    # Run on main branch pushes, and on PRs that touch Mina code. Readiness
    # waits only for the lightnet endpoints (accounts-manager + GraphQL) to be
    # responsive, NOT a full chain sync, and is bounded by timeout-minutes.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.mina == 'true')
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Start Mina lightnet via docker-compose
        run: docker compose --profile mina up -d

      - name: Wait for Mina lightnet health check
        run: |
          echo "Waiting for Mina lightnet to be ready (may take 1-3 minutes)..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8181/list-acquired-accounts > /dev/null 2>&1; then
              echo "Mina accounts manager is healthy."
              # Also check GraphQL endpoint
              if curl -sf -X POST http://localhost:3085/graphql -H 'Content-Type: application/json' -d '{"query":"{ __schema { queryType { name } } }"}' > /dev/null 2>&1; then
                echo "Mina GraphQL endpoint is healthy."
                exit 0
              fi
            fi
            echo "Attempt $i/90 -- waiting..."
            sleep 2
          done
          echo "Mina lightnet failed to become healthy within 180s"
          docker compose --profile mina logs || true
          exit 1

      - name: Run Mina integration tests
        run: |
          echo "Running Docker-gated Mina integration tests (T-34.8-18)..."
          npx jest test/integration/mina-lightnet.test.ts --ci --verbose
        working-directory: packages/connector
        env:
          CI: true
          NODE_ENV: test
          MINA_INTEGRATION: 'true'

      - name: Tear down Mina lightnet
        if: always()
        run: docker compose --profile mina down

      - name: Report results
        if: always()
        run: |
          echo "Mina integration tests completed"
          echo "Test T-34.8-18 executed with MINA_INTEGRATION=true"

  # Standalone mode E2E (smoke + settlement) — proves deploymentMode: 'standalone'
  # has parity with embedded mode for HTTP admin API + BTP + local delivery + settlement.
  standalone-e2e:
    name: Standalone Mode E2E (Docker)
    runs-on: ubuntu-latest
    needs: [test, changes]
    # Run on main branch pushes, and on PRs that touch EVM settlement code/infra
    # so on-chain regressions are caught before merge (not just post-merge on
    # main). Fixed in #104: the anvil compose service now deterministically
    # deploys the USDC token + TokenNetworkRegistry (the forge submodules are
    # fetched via `submodules: recursive` below), and the faucet `tokenReady`
    # flag now verifies on-chain code instead of being a false signal.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.evm == 'true')
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The anvil compose service runs `forge script DeployLocal.s.sol`,
          # which imports forge-std + openzeppelin-contracts from
          # packages/contracts/lib (git submodules). Without these the deploy
          # silently fails and no USDC token / TokenNetworkRegistry exists at
          # the deterministic addresses the standalone-settlement-e2e harness
          # depends on. Fetch them so the on-chain deploy succeeds (#104).
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install libsql native module for Linux
        run: |
          # The connector aborts startup without libsql (per-packet claims
          # persistence). package-lock.json may be generated on macOS, so force
          # the Linux x64 glibc native module here (mirrors the `test` job).
          npm install @libsql/linux-x64-gnu --no-save --ignore-scripts || true

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      # The standalone settlement e2e imports the connector, which dynamically
      # imports @toon-protocol/mina-zkapp (mina-payment-channel-sdk.ts) — build
      # it so ts-jest can resolve the module/types (matches the build order in
      # other jobs that build shared then mina-zkapp).
      - name: Build mina-zkapp package
        run: npm run build --workspace=packages/mina-zkapp

      - name: Start Anvil + Faucet via docker-compose
        run: docker compose --profile evm up -d

      - name: Wait for Anvil + Faucet health
        run: |
          echo "Waiting for Anvil RPC..."
          for i in $(seq 1 60); do
            if curl -s -X POST http://localhost:8545 \
                -H "Content-Type: application/json" \
                -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
                | grep -q 'result'; then
              echo "Anvil is healthy."
              break
            fi
            echo "Attempt $i/60 -- waiting for Anvil..."
            sleep 2
          done
          echo "Waiting for USDC token to be deployed on-chain..."
          # The faucet's tokenReady now verifies eth_getCode, but gate explicitly
          # on-chain here too so a deploy failure surfaces as a clear timeout on
          # the token rather than a downstream BigInt('0x') crash in the suite.
          for i in $(seq 1 60); do
            CODE=$(curl -s -X POST http://localhost:8545 \
                -H "Content-Type: application/json" \
                -d '{"jsonrpc":"2.0","method":"eth_getCode","params":["0x5FbDB2315678afecb367f032d93F642f64180aa3","latest"],"id":1}' \
                | grep -o '"result":"0x[0-9a-fA-F]*"' || true)
            if [ -n "$CODE" ] && [ "$CODE" != '"result":"0x"' ]; then
              echo "USDC token is deployed (code present)."
              break
            fi
            echo "Attempt $i/60 -- waiting for token deploy..."
            sleep 2
          done
          echo "Waiting for Faucet..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3500/health | grep -q '"tokenReady":true'; then
              echo "Faucet is healthy."
              exit 0
            fi
            echo "Attempt $i/60 -- waiting for Faucet..."
            sleep 2
          done
          echo "Faucet failed to become healthy"
          docker compose --profile evm logs || true
          exit 1

      - name: Run standalone mode E2E tests
        run: npm run test:standalone --workspace=packages/connector
        env:
          CI: true
          NODE_ENV: test
          EVM_INTEGRATION: 'true'

      - name: Tear down Anvil + Faucet
        if: always()
        run: docker compose --profile evm down

      - name: Report results
        if: always()
        run: |
          echo "Standalone mode E2E tests completed"
          echo "Exercised: deploymentMode='standalone', admin API, BTP, local delivery HTTP, chainProviders→ChannelManager settlement"

  # Container-based standalone E2E — builds the connector image and runs two
  # connector containers + two app containers, asserting the admin API + BTP +
  # local delivery HTTP work across real container boundaries.
  standalone-container-e2e:
    name: Standalone Container E2E (Docker)
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build connector image for standalone-e2e profile
        run: docker compose --profile standalone-e2e build

      - name: Smoke test /metrics endpoint in Docker image (AG3 stop-the-line)
        run: |
          docker compose --profile standalone-e2e up -d --wait
          sleep 5
          curl -sf http://127.0.0.1:18080/metrics | grep -q 'toon_packets_forwarded_total' || (echo "ERROR: /metrics missing toon_packets_forwarded_total" && exit 1)
          curl -sf http://127.0.0.1:18080/metrics | grep -q '# HELP' || (echo "ERROR: /metrics missing HELP lines" && exit 1)
          echo "✓ /metrics endpoint returns valid Prometheus data"
          docker compose --profile standalone-e2e down --volumes

      - name: Run container-based standalone E2E
        run: npm run test:standalone-docker --workspace=packages/connector
        env:
          CI: true
          NODE_ENV: test
          STANDALONE_DOCKER: 'true'

      - name: Capture container logs on failure
        if: failure()
        run: |
          docker compose --profile standalone-e2e logs --no-color || true

      - name: Tear down standalone-e2e stack
        if: always()
        run: docker compose --profile standalone-e2e down --volumes || true

      - name: Report results
        if: always()
        run: |
          echo "Standalone container E2E completed"
          echo "Exercised: Dockerfile build, YAML config, compose DNS, admin API + BTP + local delivery HTTP across containers"

  # Solana program tests (Rust/BPF)
  solana-program:
    name: Solana Program Tests (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.12/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # See the solana-integration job: caching the platform-tools dir keyed on
      # the tools-version avoids the flaky network resolution panic (issue #105).
      - name: Cache Solana platform-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: solana-platform-tools-${{ runner.os }}-v1.52

      - name: Cache Solana program build
        uses: actions/cache@v4
        with:
          path: |
            packages/solana-program/target
          key: solana-program-${{ runner.os }}-${{ hashFiles('packages/solana-program/Cargo.lock') }}
          restore-keys: |
            solana-program-${{ runner.os }}-

      - name: Run Solana program tests
        working-directory: packages/solana-program
        # Retry on the flaky platform-tools version-resolution panic (issue #105):
        # the first run on a cold platform-tools cache still hits the network and
        # can panic ("unexpected character 'l' while parsing major version").
        run: |
          n=0
          until cargo test-sbf --tools-version v1.52; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "cargo test-sbf failed after $n attempts"
              exit 1
            fi
            echo "cargo test-sbf attempt $n failed (likely flaky tools-version resolution) — retrying in 5s..."
            sleep 5
          done

  # Build and push Docker image to GitHub Container Registry
  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, build]
    # Only build and push on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/connector
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            # Full 40-char commit SHA: the Container Security Scan job scans
            # connector:${{ github.sha }} (full SHA), which the default
            # type=sha (short SHA) tag does not satisfy -> MANIFEST_UNKNOWN.
            type=sha,prefix=,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Verify image pushed
        run: |
          echo "✓ Docker image pushed to GHCR"
          echo "  Tags: ${{ steps.meta.outputs.tags }}"

      # Make the package public so operators can `docker pull` the image
      # referenced in docker-compose.prod.yml without authenticating to GHCR.
      # GHCR defaults new container packages to PRIVATE regardless of the
      # linked repository's visibility, so this PATCH is required on first
      # publish. Idempotent on subsequent runs.
      #
      # Fails soft (continue-on-error) — if the visibility patch fails (e.g.
      # first run creating the package races with the API), the image is
      # still published and the next run will set it. Surfacing the failure
      # as a non-blocking warning avoids holding up the CI pipeline.
      - name: Set container package visibility to public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "/orgs/${{ github.repository_owner }}/packages/container/connector" \
            -f visibility=public \
            && echo "✓ Package visibility set to public" \
            || echo "::warning::Could not set package visibility — may need manual fix in GHCR UI"

  # Performance benchmark job (main branch only)
  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: [build]
    # Only run on push to main (not on PRs) - benchmarks need consistent environment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build packages
        run: npm run build

      - name: Run performance benchmark
        id: benchmark
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          echo "Running performance benchmark..."
          # Threshold is a runner-appropriate floor, not an absolute target (#107).
          # The benchmark is single-core-bound (~1.05ms serial busy-wait per
          # simulated packet), so it caps at ~950 TPS regardless of core count
          # — the original 5000 bar was never reachable on any hardware. 750 TPS
          # sits ~20% below the consistently observed ~950 (CI 953 / local 945,
          # near-zero variance) so it catches a real regression (e.g. per-packet
          # work doubling -> ~475 TPS) while tolerating runner noise. Override
          # for stricter local/dedicated runs via --threshold or
          # BENCHMARK_TPS_THRESHOLD.
          npm run benchmark -- --duration 10 --target-tps 10000 --threshold 750

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          # `npm run benchmark` runs in the connector workspace, so the script
          # writes the results there, not at the repo root.
          path: packages/connector/benchmark-results.json
          retention-days: 30

      - name: Check benchmark results
        run: |
          RESULTS=packages/connector/benchmark-results.json
          if [ -f "$RESULTS" ]; then
            TPS=$(jq -r '.tps' "$RESULTS")
            PASSED=$(jq -r '.passed' "$RESULTS")
            echo "Benchmark TPS: $TPS"
            echo "Threshold passed: $PASSED"

            if [ "$PASSED" = "false" ]; then
              echo "⚠️ Performance regression detected - TPS below threshold"
              # Note: Not failing the job, just warning
              # Uncomment the next line to make it a hard failure:
              # exit 1
            else
              echo "✓ Performance benchmark passed"
            fi
          else
            echo "Benchmark results file not found at $RESULTS"
            exit 1
          fi

  # Summary job to provide clear CI status
  ci-status:
    name: CI Status Summary
    runs-on: ubuntu-latest
    needs:
      [
        lint-and-format,
        test,
        build,
        type-check,
        gate-correctness,
        security,
        rfc-links,
        solana-program,
        solana-integration,
        mina-integration,
        standalone-e2e,
        standalone-container-e2e,
        docker-build-push,
        container-scan,
        performance-benchmark,
      ]
    if: always()

    steps:
      - name: Check CI Results
        run: |
          echo "=========================================="
          echo "CI/CD Pipeline Summary"
          echo "=========================================="
          echo ""
          echo "Job Results:"
          echo "  Lint & Format: ${{ needs.lint-and-format.result }}"
          echo "  Tests: ${{ needs.test.result }}"
          echo "  Build: ${{ needs.build.result }}"
          echo "  Type Check: ${{ needs.type-check.result }}"
          echo "  Gate Correctness Guard: ${{ needs.gate-correctness.result }}"
          echo "  EVM Contracts: see Contracts workflow (.github/workflows/contracts.yml)"
          echo "  Solana Program: ${{ needs.solana-program.result }}"
          echo "  Solana Integration: ${{ needs.solana-integration.result }}"
          echo "  Mina Integration: ${{ needs.mina-integration.result }}"
          echo "  Standalone E2E: ${{ needs.standalone-e2e.result }}"
          echo "  Standalone Container E2E: ${{ needs.standalone-container-e2e.result }}"
          echo "  Security: ${{ needs.security.result }}"
          echo "  RFC Links: ${{ needs.rfc-links.result }}"
          echo "  Docker Build: ${{ needs.docker-build-push.result }}"
          echo "  Container Scan: ${{ needs.container-scan.result }}"
          echo "  Performance: ${{ needs.performance-benchmark.result }}"
          echo ""

          # Check if any required job failed
          # Security job is advisory due to transitive dependency vulnerabilities
          if [[ "${{ needs.lint-and-format.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]] || \
             [[ "${{ needs.type-check.result }}" == "failure" ]] || \
             [[ "${{ needs.gate-correctness.result }}" == "failure" ]] || \
             [[ "${{ needs.solana-program.result }}" == "failure" ]]; then
            echo "❌ CI Pipeline FAILED"
            echo ""
            echo "Please check the failed jobs above for details."
            exit 1
          else
            echo "✅ CI Pipeline PASSED"
            echo ""
            echo "All critical checks completed successfully!"
          fi

  # Non-gating bake-in job: validates the devbox environment on every CI run.
  # Intentionally NOT listed in ci-status `needs:` so it does not block merges.
  devbox-validate:
    name: Devbox Environment Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      # Cache the Solana CLI binary installed by the devbox init_hook
      # (written to ~/.local/share/solana by release.anza.xyz/v3.1.12/install).
      # Without this, every cold devbox-validate run re-downloads the CLI.
      # Note: platform-tools (~/.cache/solana) are not cached here because this
      # job never runs cargo build-sbf and therefore never downloads them.
      - name: Cache Solana CLI
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana
          key: solana-cli-${{ runner.os }}-v3.1.12

      - name: Assert tool versions
        run: |
          # Write the assertion script to a file and run it via `devbox run -- bash
          # <file>`. Passing a multi-line script as a single `bash -c "..."` argument
          # through `devbox run --` re-tokenizes the embedded newlines (it mangled
          # `--version`\n`npm` into `grep --versionn`), so feed it as a real script
          # instead. The single-quoted heredoc keeps the regex backslashes literal.
          cat > "${RUNNER_TEMP:-/tmp}/assert-versions.sh" <<'ASSERT'
          set -euo pipefail
          node --version | grep -E '^v22\.11\.'
          npm --version | grep -E '^10\.'
          cargo --version
          rustc --version
          # foundry (forge/cast/anvil): assert they run, not a version string. The
          # devbox package `foundry@1.7.1` is the nixpkgs package version, which is
          # NOT what `forge --version` prints, so a `^forge 1\.7\.` regex is wrong.
          # devbox.lock already pins the exact foundry build.
          forge --version
          cast --version
          anvil --version
          jq --version | grep -E '^jq-1\.7\.'
          solana --version | grep -E '^solana-cli 3\.1\.12'
          ASSERT
          devbox run -- bash "${RUNNER_TEMP:-/tmp}/assert-versions.sh"
          echo "✅ All devbox tools resolved at expected versions"

      - name: Smoke build (npm ci + npm run build)
        # --ignore-scripts: skip dependency lifecycle scripts (none are required
        # for the build). Matches every other `npm ci` in this workflow; the
        # build itself is an explicit script, unaffected.
        run: devbox run -- bash -c "npm ci --ignore-scripts && npm run build"
