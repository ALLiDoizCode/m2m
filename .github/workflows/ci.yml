name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # The connector itself is Rust (ADR 0017) — `rust-gate` below is this repo's
  # real gate. The npm surface that remains is devnet tooling only (the faucet,
  # its Mina zkApp, the faucet dApp, and tools/fund-peers), so this job just
  # keeps it lint-clean and formatted.
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Verify Node and npm versions
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Current directory: $(pwd)"

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm ci --ignore-scripts --verbose
          echo "Installation complete. Verifying..."
          npm list --depth=0 || true

      - name: Verify workspace setup
        run: |
          echo "Checking workspace configuration..."
          npm query ".workspace" | head -20 || true
          echo "Checking for binaries..."
          ls -la node_modules/.bin/ | head -20 || true

      - name: Run ESLint
        run: |
          echo "Running ESLint across all workspaces..."
          npm run lint --verbose

      - name: Check Prettier formatting
        run: |
          echo "Checking Prettier formatting..."
          npm run format:check

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies (including optional deps)
        # `npm ci` installs optionalDependencies by default on supported
        # platforms; we pass --include=optional explicitly so the audit below
        # is guaranteed to see optional packages regardless of any future
        # default change.
        run: npm ci --ignore-scripts --include=optional

      # Security hardening: Check for high/critical vulnerabilities (Story 16.2)
      # Currently advisory due to transitive dependency issues requiring major updates
      # Known issues: express (body-parser), aws-sdk (fast-xml-parser)
      #
      # Epic 35 retro action item #2: ensure optional deps are in-scope. We
      # run audit twice: once over the full tree (default), and once
      # explicitly including optional deps via --include=optional. The second
      # pass is defensive — `npm audit` should already cover installed
      # optional deps, but being explicit documents intent and survives any
      # npm behavior change.
      - name: Run npm audit (full tree including optional deps)
        run: npm audit --audit-level=high --include=optional
        continue-on-error: true

      - name: Run npm audit (baseline, all installed packages)
        run: npm audit --audit-level=high
        continue-on-error: true

      # Security hardening: Check for Snyk high/critical findings (Story 16.2)
      # Advisory - fails gracefully if SNYK_TOKEN not configured
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: snyk.sarif

  # Gate for the Cargo workspace (crates/*, packages/solana-program) — the
  # connector itself. Runs unconditionally, so a newly added crate is covered by
  # build/test/clippy/fmt without editing this job. payment-channel
  # (packages/solana-program) is excluded from test/clippy: it needs the Solana
  # SBF toolchain to test meaningfully (covered by the solana-program job below)
  # and pre-dates this gate's warnings-denied clippy policy.
  rust-gate:
    name: Rust Workspace Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and workspace target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-gate-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-gate-${{ runner.os }}-

      # anvil (and cast, used by chain-integration tests to talk to it) on PATH for any
      # crate's tests -- connector-settlement-evm's are the first, connector-settlement-solana
      # and future settlement crates will need the equivalent Solana tooling separately.
      # Without this, an anvil-gated test silently skips and reports `passed` (issue #471).
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned, not `nightly`. The EVM settlement tests were verified green
          # against anvil 1.7.1 (contract suite 1.01s, gas/nonce 0.60s), so the
          # gate installs that exact version rather than whatever nightly is on
          # the day. A gate that exists to prove chain code works should not be
          # able to break from an upstream build we never ran against.
          # NOTE: contracts.yml still uses `nightly` in two places -- same
          # exposure, separate change.
          version: v1.7.1
        env:
          # foundryup curls api.github.com unauthenticated and gets 403 when the runner IP is
          # rate-limited (same fix as contracts.yml). Exporting the workflow's
          # auto-provisioned GITHUB_TOKEN bumps the limit from 60 -> 5000 req/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # solana-test-validator (and solana-keygen, used to resolve the checked-in program
      # keypair's pubkey) on PATH for connector-settlement-solana's tests (issue #428), the
      # Solana twin of the Foundry install above. Without this, a solana-test-validator-gated
      # test would silently skip and report `passed` -- exactly the defect #471 closed for
      # anvil, see crates/connector-settlement-solana/tests/support/mod.rs.
      #
      # Pinned to v2.1.21, not the newer v3.x line the pre-existing `solana-integration` job
      # below installs: v3's solana-test-validator hard-requires io_uring, which is unavailable
      # under this repo's agent-sandbox container's seccomp profile (verified: it panics with
      # `assertion failed: io_uring_supported()` there). v2.1.21 needs no io_uring and matches
      # the `=2.1.0` solana-program/solana-client/solana-sdk pin in
      # crates/connector-settlement-solana{,-program}/Cargo.toml, so the CLI that deploys and
      # drives the program is the same release line the program itself is built against.
      # `.sandcastle/Dockerfile` installs this exact version for the same reason Foundry is
      # pinned identically in both places: an agent that passes locally on a different
      # toolchain than the gate has learned nothing.
      - name: Install Solana CLI tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        # CI=true is already set by GitHub Actions for every job; anvil-gated and
        # solana-test-validator-gated tests both key off it (rather than a bespoke
        # REQUIRE_ANVIL/REQUIRE_SOLANA_TEST_VALIDATOR nobody remembers to set) to hard-fail here
        # instead of silently skipping when the chain binary isn't on PATH -- see
        # crates/connector-settlement-evm/tests/support/mod.rs and
        # crates/connector-settlement-solana/tests/support/mod.rs.
        run: cargo test --workspace --exclude payment-channel 2>&1 | tee /tmp/cargo-test.log

      - name: Assert no integration-test harness executed zero tests
        # A `tests/*.rs` integration binary exists specifically to hold tests. Unlike a crate's
        # `unittests`/doctests target -- which legitimately reports "running 0 tests" when the
        # crate simply has none -- a dedicated harness reporting zero is always a bug: a feature/
        # cfg mismatch left it compiling with nothing inside, and cargo still reports the target
        # `ok`. Issue #471 ("a target that executes zero tests does not report success").
        run: |
          awk '
            /^ *Running tests\// { harness = $0; next }
            /^running 0 tests$/ && harness { print "EMPTY TEST HARNESS (reports success despite running nothing): " harness; found = 1; harness = "" }
            /^running [0-9]/ { harness = "" }
            END { if (found) exit 1 }
          ' /tmp/cargo-test.log

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --exclude payment-channel --all-targets -- -D warnings

  # Solana program tests (Rust/BPF) — packages/solana-program is the Cargo
  # crate `payment-channel`, a Cargo workspace member, not a TypeScript package.
  solana-program:
    name: Solana Program Tests (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.12/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # Caching the platform-tools dir keyed on the tools-version avoids the
      # flaky network resolution panic (issue #105).
      - name: Cache Solana platform-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: solana-platform-tools-${{ runner.os }}-v1.52

      - name: Cache Solana program build
        uses: actions/cache@v4
        with:
          path: |
            target
          key: solana-program-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            solana-program-${{ runner.os }}-

      - name: Run Solana program tests
        working-directory: packages/solana-program
        # Retry on the flaky platform-tools version-resolution panic (issue #105):
        # the first run on a cold platform-tools cache still hits the network and
        # can panic ("unexpected character 'l' while parsing major version").
        run: |
          n=0
          until cargo test-sbf --tools-version v1.52; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "cargo test-sbf failed after $n attempts"
              exit 1
            fi
            echo "cargo test-sbf attempt $n failed (likely flaky tools-version resolution) — retrying in 5s..."
            sleep 5
          done

  # Summary job to provide clear CI status
  ci-status:
    name: CI Status Summary
    runs-on: ubuntu-latest
    needs: [lint-and-format, rust-gate, security, solana-program]
    if: always()

    steps:
      - name: Check CI Results
        run: |
          echo "=========================================="
          echo "CI/CD Pipeline Summary"
          echo "=========================================="
          echo ""
          echo "Job Results:"
          echo "  Lint & Format: ${{ needs.lint-and-format.result }}"
          echo "  Rust Workspace Gate: ${{ needs.rust-gate.result }}"
          echo "  EVM Contracts: see Contracts workflow (.github/workflows/contracts.yml)"
          echo "  Solana Program: ${{ needs.solana-program.result }}"
          echo "  Security: ${{ needs.security.result }}"
          echo ""

          # Security is advisory (transitive dependency vulnerabilities), so it
          # does not gate. Everything else does.
          if [[ "${{ needs.lint-and-format.result }}" == "failure" ]] || \
             [[ "${{ needs.rust-gate.result }}" == "failure" ]] || \
             [[ "${{ needs.solana-program.result }}" == "failure" ]]; then
            echo "❌ CI Pipeline FAILED"
            echo ""
            echo "Please check the failed jobs above for details."
            exit 1
          else
            echo "✅ CI Pipeline PASSED"
            echo ""
            echo "All critical checks completed successfully!"
          fi

  devbox-validate:
    name: Devbox Environment Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      # Cache the Solana CLI binary installed by the devbox init_hook
      # (written to ~/.local/share/solana by release.anza.xyz/v3.1.12/install).
      # Without this, every cold devbox-validate run re-downloads the CLI.
      # Note: platform-tools (~/.cache/solana) are not cached here because this
      # job never runs cargo build-sbf and therefore never downloads them.
      - name: Cache Solana CLI
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana
          key: solana-cli-${{ runner.os }}-v3.1.12

      - name: Assert tool versions
        run: |
          # Write the assertion script to a file and run it via `devbox run -- bash
          # <file>`. Passing a multi-line script as a single `bash -c "..."` argument
          # through `devbox run --` re-tokenizes the embedded newlines (it mangled
          # `--version`\n`npm` into `grep --versionn`), so feed it as a real script
          # instead. The single-quoted heredoc keeps the regex backslashes literal.
          cat > "${RUNNER_TEMP:-/tmp}/assert-versions.sh" <<'ASSERT'
          set -euo pipefail
          node --version | grep -E '^v22\.11\.'
          npm --version | grep -E '^10\.'
          cargo --version
          rustc --version
          # foundry (forge/cast/anvil): assert they run, not a version string. The
          # devbox package `foundry@1.7.1` is the nixpkgs package version, which is
          # NOT what `forge --version` prints, so a `^forge 1\.7\.` regex is wrong.
          # devbox.lock already pins the exact foundry build.
          forge --version
          cast --version
          anvil --version
          jq --version | grep -E '^jq-1\.7\.'
          solana --version | grep -E '^solana-cli 3\.1\.12'
          ASSERT
          devbox run -- bash "${RUNNER_TEMP:-/tmp}/assert-versions.sh"
          echo "✅ All devbox tools resolved at expected versions"

      - name: Smoke build (npm ci + npm run build)
        # --ignore-scripts: skip dependency lifecycle scripts (none are required
        # for the build). Matches every other `npm ci` in this workflow; the
        # build itself is an explicit script, unaffected.
        run: devbox run -- bash -c "npm ci --ignore-scripts && npm run build"
