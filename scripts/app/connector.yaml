# =============================================================================
# Connector paid reverse proxy — "app behind the connector" local compose config
# =============================================================================
# Bind-mounted into the `connector` service at /app/config/connector.yaml
# (issue #221). This is the standalone connector that fronts ONE oblivious app
# (the `app` service) for PAID writes.
#
# Topology:
#
#   host ─curl/h402Fetch─▶ POST /ilp (3000) ─▶ connector ─▶ HttpProxyHandler
#                                                            │
#                                            upstream: http://app:3100
#                                                            ▼
#                                                       app (relay)
#
# - The connector's edge is `POST /ilp` (ILP-over-HTTP, RFC-0035) served on
#   `btpServerPort`. That is the ONLY port published to the host (127.0.0.1).
# - The admin API (8081) binds inside the container but is NOT published.
# - Free reads do NOT come through here at all — clients hit the app's Nostr
#   WS read port directly (published by the compose `app` service).
#
# The single `routes:` entry below carries the issue #218 termination fields
# (`upstream`, `price`, `chains`, `ilpAddress`, `settlementAddresses`). Because
# the route registry is non-empty AND no global `localDelivery.handlerUrl` is
# configured, ConnectorNode installs the #216 HttpProxyHandler as the
# local-delivery handler: a paid PREPARE addressed to `g.connector.relay.*`
# terminates here and is reverse-proxied to `upstream`.
# =============================================================================

nodeId: connector
btpServerPort: 3000
healthCheckPort: 8080
environment: development
deploymentMode: standalone
logLevel: info

# ── Admin REST API ──────────────────────────────────────────────────────────
# Binds inside the container only; the compose service does NOT publish 8081.
adminApi:
  enabled: true
  host: 0.0.0.0
  port: 8081
  allowedIPs:
    - 172.16.0.0/12 # docker user-defined-bridge default pool
    - 192.168.0.0/16 # fallback when 172.16/12 is occupied

# NOTE: deliberately NO `localDelivery:` block. A global localDelivery handler
# would short-circuit the per-route HttpProxyHandler (see ConnectorNode wiring,
# issue #216/#218). Leaving it unset lets the terminated route below drive the
# HTTP reverse-proxy to the app.

# ── Settlement / chain providers ─────────────────────────────────────────────
# A single EVM entry pointing at the compose `anvil` service. The deterministic
# registry + token + funded account come from anvil's DeployLocal script and the
# faucet. Account index 0 (deployer) keypair is used as the settlement key.
settlement:
  connectorFeePercentage: 0.1
  enableSettlement: true
  tigerBeetleClusterId: 0
  tigerBeetleReplicas: []
  thresholds:
    defaultThreshold: '5000'
    pollingInterval: 100

chainProviders:
  - chainType: evm
    chainId: evm:31337
    rpcUrl: http://anvil:8545
    registryAddress: '0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512'
    tokenAddress: '0x5FbDB2315678afecb367f032d93F642f64180aa3'
    keyId: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
    settlementOptions:
      threshold: '5000'
      pollingIntervalMs: 100
      settlementTimeoutSecs: 3600
      initialDepositMultiplier: 2
      ledgerSnapshotPath: ./data/ledger-connector.json

peers: []

# ── Routes ──────────────────────────────────────────────────────────────────
# ONE terminated route (issue #218 fields). `upstream` points at the app's
# oblivious-mode HTTP store port (3100, per relay#24) over the compose network by
# service name — the host can never reach `app:3100` directly (that port is NOT
# published), which is what enforces AC2: paid writes MUST flow through the
# connector. The store endpoint (`POST /write`, body `{event}`) is carried in the
# forwarded HTTP envelope; this only needs the base host:port.
routes:
  - prefix: g.connector.relay
    nextHop: connector
    upstream: http://app:3100
    price: '1000'
    chains:
      - evm
    ilpAddress: g.connector.relay
    settlementAddresses:
      evm: '0x70997970C51812dc3A010C7d01b50e0d17dc79C8'
