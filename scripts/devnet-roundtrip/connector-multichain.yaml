# Connector-as-terminator, settling on the LIVE Linode devnet — EVM + SOLANA.
# Both per-chain settlement keys are derived from TOON_MNEMONIC (mnemonic mode).
nodeId: terminator
btpServerPort: 3000
healthCheckPort: 8080
environment: development
deploymentMode: standalone
logLevel: info

adminApi:
  enabled: true
  host: 0.0.0.0
  port: 8081
  allowedIPs:
    - 0.0.0.0/0

settlement:
  connectorFeePercentage: 0.1
  enableSettlement: true
  tigerBeetleClusterId: 0
  tigerBeetleReplicas: []
  thresholds:
    defaultThreshold: '5000'
    pollingInterval: 100

chainProviders:
  - chainType: evm
    chainId: evm:31337
    rpcUrl: https://evm-rpc.97-107-135-110.sslip.io
    registryAddress: '0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512'
    tokenAddress: '0x5FbDB2315678afecb367f032d93F642f64180aa3'
    keyId: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
    settlementOptions:
      threshold: '5000'
      pollingIntervalMs: 100
      settlementTimeoutSecs: 3600
      initialDepositMultiplier: 2
      ledgerSnapshotPath: ./data/ledger-evm.json
  - chainType: solana
    chainId: solana:devnet
    rpcUrl: https://solana-rpc.97-107-135-110.sslip.io
    programId: '7CLmNaK9z6QgUWQpCFdeUTqfwXeZH5ssohAKtyXKY4Hp'
    keyId: 'placeholder-overwritten-by-mnemonic'
    cluster: devnet
    tokenMint: 'H8HSreUF2s8r8hem4qMttE3bWYCpFuh71jbuos5bA77H'
  - chainType: mina
    chainId: mina:devnet
    network: devnet
    graphqlUrl: https://api.minascan.io/node/devnet/v1/graphql
    zkAppAddress: 'B62qigQwEwBAsSZad4GhSun8CAwkh3GUbx2YN2TbUHU8tzVFcFTE95x'
    tokenAddress: 'B62qqwnm9NZs7MPFRSK4AjAw4kHJ7F5ttfbb4pFSqZvCHqpZWpx6yYk'
    tokenId: '13770394610291091689442727083129874284486561081541786615444915557572882540748'
    keyId: 'placeholder-overwritten-by-mnemonic'
    txFeeNanomina: '100000000'

peers: []

routes:
  - prefix: g.terminator.relay
    nextHop: terminator
    upstream: http://e2e-relay:3100
    price: '1000'
    chains:
      - evm
      - solana
      - mina
    ilpAddress: g.terminator.relay
    settlementAddresses:
      evm: '0x51D35a8A80377D0E70c226Dc7abb97e200C68f04'
      solana: '4hb7gurrpDCTdvACxxeB6dNJGC4Ybnk26jH7BUmU8x9c'
      mina: 'B62qkugigqhhKaRVvaRzp2VWiYAu4dgmobegfvSXCjWDBxXjvaz6KYW'
