# Bootstrap config for two-home-local-connector-b. See peer-two-home-a.yaml.
nodeId: home-b
btpServerPort: 3000
healthCheckPort: 8080
environment: development
deploymentMode: standalone
logLevel: warn

adminApi:
  enabled: true
  port: 8081
  host: 0.0.0.0

localDelivery:
  enabled: true
  handlerUrl: http://127.0.0.1:3100
  timeout: 30000

transport:
  type: socks5
  managed: false
  socksProxy: socks5h://127.0.0.1:9050
  externalUrl: ws://home-b.invalid/btp

peers: []

routes:
  - prefix: test.home-b
    nextHop: home-b
  - prefix: test.home-a
    nextHop: home-a
