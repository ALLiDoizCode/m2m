nodeId: peer-allowlist
btpServerPort: 3000
healthCheckPort: 8080
environment: development
deploymentMode: standalone
logLevel: warn

# Tier-3 topology (see docs): connector binds admin API on all interfaces
# inside the container but ONLY accepts calls from docker bridge subnets.
# The admin port is NOT published to the host. The BLS, on the same compose
# network, reaches the admin API at http://<service-name>:8081 and its source
# IP falls in the bridge CIDR so the allowlist accepts it. External traffic
# (internet, other docker networks) has no source IP in these ranges.
adminApi:
  enabled: true
  host: 0.0.0.0
  port: 8081
  allowedIPs:
    - 172.16.0.0/12     # docker's default user-defined-bridge pool
    - 192.168.0.0/16    # fallback when 172.16-172.31 is occupied

localDelivery:
  enabled: true
  handlerUrl: http://standalone-allowlist-bls:3100
  timeout: 30000

peers: []

routes:
  - prefix: test.peer-allowlist
    nextHop: peer-allowlist
