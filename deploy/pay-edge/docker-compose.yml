# =============================================================================
# pay-edge — drop-in "put a TOON payment proxy in front of your app"
# =============================================================================
# A self-contained deploy of the TOON connector as a PAYMENT PROXY (the
# "nginx-for-payments" edge) in front of a GENERIC, payment-oblivious HTTP app.
#
#   payer ──POST /ilp──▶ connector ──proxies the paid request──▶ app (echo)
#
# Two profiles:
#   (default — `up -d`)        connector + app, settling on the SHARED LIVE DEVNET
#                              (rpcUrl in connector.yaml → evm-rpc.<devnet>).
#   `--profile local-devnet`   ALSO brings up a local anvil + faucet so you can
#                              prove the round-trip with ZERO external deps. To use
#                              it, point connector.yaml's rpcUrl at http://anvil:8545.
#
# Only the connector's `POST /ilp` edge is published to the host. The app's port
# is deliberately NEVER published — the only way to reach the app is THROUGH a
# paid request to the connector. That is the whole point.
# =============================================================================

services:
  # ── The payment proxy ───────────────────────────────────────────────────────
  # Image: the published connector. Override with CONNECTOR_IMAGE to pin a tag or
  # use a locally-built `connector:standalone-e2e`.
  connector:
    # NOTE (#457): this YAML config is the TypeScript connector's contract, and
    # that runtime was deleted from this repo. Pinned to the last image built from
    # it (3.44.0) instead of the floating `:latest`, which #431 will repoint at the
    # Rust connector (TOML config, ADR 0001). Do not un-pin before #431 rewires
    # this stack.
    image: ${CONNECTOR_IMAGE:-ghcr.io/toon-protocol/connector:3.44.0}
    environment:
      CONFIG_FILE: /app/config/connector.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # "Drop in your seedphrase": the connector's on-chain settlement key is
      # derived from this BIP-39 mnemonic at boot (overwrites connector.yaml's
      # keyId). Leave empty to use the keyless anvil-account-0 devnet fallback.
      TOON_MNEMONIC: ${TOON_MNEMONIC:-}
      # Devnet serves a Let's Encrypt *staging* (untrusted) cert — devnet-only
      # shortcut so the connector's RPC/faucet calls don't fail TLS verification.
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-0}
    volumes:
      - ./connector.yaml:/app/config/connector.yaml:ro
    ports:
      - '127.0.0.1:3000:3000' # POST /ilp edge — paid requests enter here
      - '127.0.0.1:8080:8080' # health
    # NOTE: devnet.toonprotocol.dev DNS now points at the live box, so no host
    # pinning is needed. If the box moves and DNS lags again, set DEVNET_IP in
    # .env and add:
    #   extra_hosts:
    #     - 'evm-rpc.devnet.toonprotocol.dev:${DEVNET_IP}'
    #     - 'faucet.devnet.toonprotocol.dev:${DEVNET_IP}'
    restart: unless-stopped

  # ── The oblivious app (GENERIC echo backend) ────────────────────────────────
  # A stock HTTP echo server: it returns the request it received (method, path,
  # headers, body) as JSON. It knows NOTHING about payment, ILP, or settlement —
  # proving the app is payment-oblivious. Replace this service with YOUR app
  # (listening on :8080) and update connector.yaml's `upstream`.
  #
  # Port 8080 is NOT published: reachable only as `app:8080` over the compose net.
  app:
    image: mendhak/http-https-echo:31
    environment:
      HTTP_PORT: '8080'
    expose:
      - '8080'
    restart: unless-stopped

  # ── OPTIONAL local devnet (profile: local-devnet) ───────────────────────────
  # Bundled anvil + faucet so the round-trip can be proven with no external box.
  # Mirrors the repo's root compose `anvil`/`faucet` services. Point
  # connector.yaml's rpcUrl at http://anvil:8545 to use these.
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    profiles: [local-devnet]
    entrypoint: ['anvil']
    command: ['--host', '0.0.0.0', '--chain-id', '31337', '--block-time', '1']
    ports:
      - '127.0.0.1:8545:8545'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "cast block-number --rpc-url http://localhost:8545 >/dev/null 2>&1 || exit 1",
        ]
      interval: 3s
      timeout: 5s
      retries: 20

networks:
  default:
    name: pay_edge_net
