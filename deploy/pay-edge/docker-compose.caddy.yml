# =============================================================================
# pay-edge — Caddy auto-TLS public-edge override
# =============================================================================
# Layered on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
#
# Adds a `caddy:2` service as the ONLY public surface (80/443). Caddy auto-
# provisions a TRUSTED Let's Encrypt cert for connector.pay.toonprotocol.dev
# (the domain resolves to this box; ports 80/443 are open) and reverse-proxies
# to the connector's POST /ilp edge over the compose network.
#
# It also UN-publishes the connector's host ports: the connector is reachable
# ONLY as `connector:3000` on the compose network (via Caddy). The echo app
# stays internal (`app:8080`, never published) as in the base compose.
# =============================================================================

services:
  caddy:
    image: caddy:2
    depends_on:
      - connector
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # persists issued certs across restarts
      - caddy_config:/config
    restart: unless-stopped

  # Override: do NOT publish the connector's ports at all. Caddy is the only
  # public surface; the connector is reachable only as connector:3000 on the
  # compose network. `!reset []` REPLACES the base `ports` list (a plain `[]`
  # would merge/append and leave the base bindings in place).
  connector:
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
