# =============================================================================
# pay-edge — TOON connector as a PAYMENT PROXY in front of a generic HTTP app
# =============================================================================
# Bind-mounted into the `connector` service at /app/config/connector.yaml.
#
# Topology (nginx-for-payments):
#
#   payer ──POST /ilp (3000)──▶ connector ──HttpProxyHandler──▶ http://app:8080
#                                  (terminates the payment)        (oblivious app)
#
# - The connector's edge is `POST /ilp` (ILP-over-HTTP, RFC-0035), the ONLY port
#   published to the host. A paid PREPARE addressed to `g.connector.echo.*`
#   terminates here; the literal HTTP request carried in the PREPARE `data` is
#   reverse-proxied to `upstream`, and the upstream's HTTP response is returned
#   in the ILP FULFILL `data`. The app never sees ILP / payment / settlement.
# - An UNPAID PREPARE (no claim header) is REJECTED — never reaches the app.
#
# SETTLEMENT IDENTITY: this file ships with the anvil account-0 deterministic key
# as a working DEVNET FALLBACK (account 0 is pre-funded on the shared devnet).
# To run under YOUR OWN identity, set TOON_MNEMONIC in .env — it is derived at
# boot and OVERWRITES the `keyId` below. The mnemonic is read from the env ONLY;
# the config loader does NOT interpolate ${...}, so every value here is literal.
# (If you switch to a mnemonic, also update routes[].settlementAddresses.evm to
#  the derived EVM address the connector prints at boot — see README.)
# =============================================================================

nodeId: connector
btpServerPort: 3000
healthCheckPort: 8080
environment: development
deploymentMode: standalone
logLevel: info

# ── Admin REST API ──────────────────────────────────────────────────────────
# Binds inside the container only; the compose service does NOT publish 8081.
adminApi:
  enabled: true
  host: 0.0.0.0
  port: 8081
  allowedIPs:
    - 172.16.0.0/12 # docker user-defined-bridge default pool
    - 192.168.0.0/16 # fallback when 172.16/12 is occupied

settlement:
  connectorFeePercentage: 0.1
  enableSettlement: true
  tigerBeetleClusterId: 0
  tigerBeetleReplicas: []
  thresholds:
    defaultThreshold: '5000'
    pollingInterval: 100

# ── Settlement / chain providers ─────────────────────────────────────────────
# A single EVM entry pointing at the SHARED LIVE DEVNET (chainId 31337, the same
# deterministic anvil chain). The registry + Mock USDC (6-dp) are deployed
# deterministically, so these DeployLocal addresses are identical on the devnet.
#
# rpcUrl is LITERAL (no ${} interpolation). For a LOCAL proof run against the
# bundled anvil (see docker-compose `local-devnet` profile + README) change this
# to http://anvil:8545.
chainProviders:
  - chainType: evm
    chainId: evm:31337
    rpcUrl: https://evm-rpc.devnet.toonprotocol.dev
    registryAddress: '0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512'
    tokenAddress: '0x5FbDB2315678afecb367f032d93F642f64180aa3'
    keyId: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
    settlementOptions:
      threshold: '5000'
      pollingIntervalMs: 100
      settlementTimeoutSecs: 3600
      initialDepositMultiplier: 2
      ledgerSnapshotPath: ./data/ledger-connector.json

peers: []

# ── Routes ──────────────────────────────────────────────────────────────────
# ONE terminated route. `upstream` points at the GENERIC echo app over the
# compose network by service name (`app:8080`). The app port is NOT published —
# the host can only reach the app THROUGH the connector's paid edge.
#
# `price` is the per-request charge (USDC base units, 6-dp). `settlementAddresses.evm`
# is the address the connector tells payers to open their channel toward. With the
# keyless fallback it is anvil account-0's address (matches the keyId above). With
# TOON_MNEMONIC set, change it to the mnemonic-derived EVM address (boot log).
routes:
  - prefix: g.connector.echo
    nextHop: connector
    upstream: http://app:8080
    price: '1000'
    chains:
      - evm
    ilpAddress: g.connector.echo
    settlementAddresses:
      evm: '0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
