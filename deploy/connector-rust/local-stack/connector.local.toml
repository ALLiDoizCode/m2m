# =============================================================================
# connector.local.toml -- the Rust connector's config for the LOCAL deployment
# rehearsal stack (deploy/connector-rust/local-stack/docker-compose.local.yml).
#
# LOCAL / DEV ONLY. This is not a devnet file: infra/linode-* owns those, and
# nothing here should be copied to a box without re-reading every value.
# =============================================================================

# Published to 127.0.0.1:3000 on the host by the compose file, so `curl` on the
# host reaches POST /ilp, GET /ilp/identity and GET /ilp/routes/price.
client_edge_addr = "0.0.0.0:3000"

# ── Durable claim state (issue #605) ─────────────────────────────────────────
# The claim journals whose replay makes a replay watermark survive a restart.
# A named volume in docker-compose.local.yml, not a bind mount of ./: the
# container runs as uid 10001 and a named volume is chowned for it. Without
# this a `docker compose restart` hands the payer every claim it already spent
# back as free service.
state_dir = "/app/state"

[signer]
# 32 raw bytes or 64 hex characters; written by prepare.sh, never committed.
key_file = "/app/secrets/signer.key"

# ── The one locally-terminated, priced route ─────────────────────────────────
# `price` is what issue #520 made mandatory on a terminated route and what
# issue #526's x402 greeting quotes back to an unpaid caller. 1000 matches what
# devnet's own terminated routes charge (infra/linode-node/connector-rust.toml).
#
# `/write`, not the bare origin -- the same value devnet's `g.rust.relay` route
# carries, and for the same reason: the relay serves only `POST /write` and
# `GET /health`, so a bare `http://relay:3100` comes back F99 "app declined the
# delivery with HTTP 404" (#492).
#
# But the path is NOT settled by this line alone. `HttpAppClient::deliver` does
# `handler_url.join(&request.target)`, and RFC 3986 says an absolute-path
# reference REPLACES the base's path -- so a packet whose envelope target is
# "/" resolves back to `http://relay:3100/` and 404s even with the `/write`
# written here. The sender's envelope target is the other half; see
# `crates/connector-bin/tests/local_stack_rehearsal.rs`, which proves both
# halves, including that failure.
[[routes]]
prefix = "g.local.relay"
handler_url = "http://relay:3100/write"
price = 1000

# ── Settlement (issue #542, ADR 0009) ────────────────────────────────────────
# The committed devnet TOMLs keep this block commented out because no contract
# is deployed there. Here one is, on the local anvil, so it is turned on --
# which also means a present-but-unsatisfiable block is now a hard startup
# failure rather than a silent degrade to `settlement: None`.
#
# `contract_address` is the TokenNetworkRegistry, NOT a TokenNetwork:
# `EvmSettlementBackend::connect` (issue #576) resolves
# `getTokenNetwork(token_address)` through the registry itself and refuses to
# start if that comes back zero. `token_address` is therefore the key into the
# registry as well as the asset this node settles in. Naming a TokenNetwork
# here instead makes the node refuse to start -- it has no `getTokenNetwork`.
[settlement]
chain = "evm"
rpc_url = "http://host.docker.internal:8546"
contract_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
token_address = "0x5FbDB2315678afecb367f032d93F642f64180aa3"
# The scale the deployed token itself reports. Nothing scales by it -- claims
# are already in the token's base units -- but `connect` reads the token's own
# `decimals()` and refuses to start if the two disagree (issue #564), so this
# must match the mock USDC the local stack deploys, not a guess.
decimals = 6

[settlement.key]
key_file = "/app/secrets/settlement.key"
