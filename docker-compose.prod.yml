# =============================================================================
# Connector — Production Deployment
# =============================================================================
# Tier-3 security posture: connector admin API is NOT published on the host,
# gated by IP allowlist in config/connector.prod.yaml. See README → "Production
# Deployment".
#
# This file ships the connector alone. Add your own app service on `app_net`
# to pair with it — see README → "Writing Your Own App" for the HTTP contract
# and drop-in examples; there is no bundled sample app (issue #561: the one
# this file used to bind-mount, scripts/standalone-e2e/app.js, was deleted
# with the TypeScript connector prototype it demonstrated, ADR 0017).
#
# Usage:
#   # 1. Customize config/connector.prod.yaml (peers, routes).
#   # 2. Add your app service (see README), then start the stack:
#   docker compose -f docker-compose.prod.yml up -d
#
#   # 3. Verify health:
#   docker compose -f docker-compose.prod.yml ps
#
#   # 4. Tear down (preserves the connector data volume):
#   docker compose -f docker-compose.prod.yml down
#
# =============================================================================

services:
  # ── Connector ──────────────────────────────────────────────────────────────
  # Pulls the published image by default. To build locally from source,
  # comment `image:` and uncomment `build:`.
  connector:
    # NOTE (#457): this YAML config is the TypeScript connector's contract, and
    # that runtime was deleted from this repo. Pinned to the last image built from
    # it (3.44.0) instead of the floating `:latest`, which #431 will repoint at the
    # Rust connector (TOML config, ADR 0001). Do not un-pin before #431 rewires
    # this stack.
    image: ghcr.io/toon-protocol/connector:3.44.0
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CONFIG_FILE: /app/config/connector.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./config/connector.prod.yaml:/app/config/connector.yaml:ro
      - connector_data:/app/data
    # Admin API port (8081) is intentionally NOT published. The app reaches
    # it via compose DNS; external callers cannot. If you need to expose it,
    # also set `adminApi.apiKey` in the config and restrict `allowedIPs`.
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app_net

  # ── App ─────────────────────────────────────────────────────────────────
  # No bundled sample (issue #561). Add your app service here — see README →
  # "Writing Your Own App" for the HTTP contract, a minimal Node.js example,
  # and how to wire it into this file (image/command/volumes, `app_net`
  # network, `depends_on: connector` with `condition: service_healthy`, and a
  # host-published port for your own health checks).

networks:
  app_net:
    driver: bridge

volumes:
  connector_data:
