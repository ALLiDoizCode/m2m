# =============================================================================
# local/mixed-chain -- connector C. Settles on Solana, and knows nothing else.
#
# LOCAL / DEV ONLY. `infra/linode-*` owns devnet; nothing here is deployed,
# published or SSH'd anywhere, and every chain this file names is disposable.
#
# The far end of the boundary, and the mirror of A: one chain, one peering, no
# idea that the hop before B was on a different one. A packet arriving here has
# crossed anvil and then the Solana validator, and this node can tell only
# because its own peering's claims are ed25519.
#
# The rehearsal's payload is sealed to THIS node's `[signer]` identity (ADR
# 0018) -- neither A nor B can open it, and `connector send --seal-to` naming
# either of them is reported as "FULFILL WITH THE WRONG FULFILMENT" rather than
# quietly passing.
# =============================================================================

client_edge_addr = "0.0.0.0:3000"

# Where the Solana peering's inbound claim watermarks are written, and the file
# the rehearsal reads to prove the Solana leg was actually paid rather than
# merely traversed (`peer-claims.log`).
state_dir = "/app/state"

# CF-17: the peer carriage rides this node's own listener. C dials nobody, so
# there is no `peer_allow_plaintext_endpoints` here -- the opt-in widens which
# schemes this node may DIAL, and C never does.
peer_expose = "http"

[signer]
key_file = "/app/data/signer.key"

# ── The terminated route ─────────────────────────────────────────────────────
# `stub-app` is the connector image's second binary: it answers `POST /`, holds
# no secret and performs no cryptography, so it contributes nothing to the
# packet's fulfilment -- this connector derives that itself from the sealed
# request (ADR 0019). The trailing slash is load-bearing (`handler_url.join`
# and RFC 3986).
#
# `price = 0`, AND THAT IS A PROPERTY OF THE b-c PEERING RATHER THAN A RULE.
# A route a node both TERMINATES and PRICES refuses a peer PREPARE that arrives
# without a claim covering that price (`F06`, issue #880). The b-c peering is
# POSTPAY: value moves on fulfilment (ADR 0004), so B owes this node nothing
# until a crossing has fulfilled, the first crossing therefore carries no claim,
# is refused, never fulfils, leaves nothing owed, and the second carries none
# either. A price here deadlocks the peering instead of charging for it.
#
# WHAT WOULD CHANGE THAT IS A ROW ON B, NOT A FIGURE HERE. `local/two-hop` does
# exactly that and its payee IS priced: a `[[pay_channels]]` row on the payer
# (ADR 0042 item 2) covers each PREPARE *before* it is sent, so crossing 1
# arrives already paid for. `local/two-hop/connector-a.toml` and
# `connector-b.toml` are the two halves of that arrangement. Nothing forbids
# the same on this leg; it is simply not what this topology is about, which is
# one node holding a settlement backend on each of two chains.
#
# So what B owes this node is the forwarded amount, and `[[peer_channels]]`
# below is what that claim is written against.
[[routes]]
prefix = "g.local.mixed.b.c.app"
handler_url = "http://stub-app:3100/"
price = 0

# ── The Solana peering ───────────────────────────────────────────────────────
# No `endpoint`: B dials us, which on ILP-over-HTTP makes this node the payee
# (§6.4).
[[peers]]
id = "b-c"

[peers.credential]
secret_file = "/app/data/peer-b-c-secret"

# The other half of B's Solana row. `counterparty_key` is B's Solana
# SETTLEMENT public key -- the identity a claim on this channel must be signed
# by, and the one thing this node checks a signature against (CF-23).
#
# The settlement program is bound into the signed message since ADR 0053, so a
# claim rendered against another deployment of the same program does not verify
# here even though every other field matches. The row does not name it: it is
# read from `[settlement.solana] program_id` below, the only program this node
# could redeem such a claim through (issue #1128). A `program_id` key here is
# refused at boot by name rather than allowed to disagree with it.
[[peer_channels]]
peer_id = "b-c"
channel_account = "G5mXQzfZb4tXWX7cQvXP9ZJnDBcUo6irWTmGGtX3xpzL"
counterparty_key = "BCXtFg3PtZwxVDBDGmknPzxHUtweYxb4YygrchiQKk7y"

# No `[operator]` section, deliberately (CF-31): an absent table means the
# surface is not started at all, rather than started unauthenticated. The
# rehearsal hands its packet to A.

# ── Settlement: Solana only ──────────────────────────────────────────────────
# No `[settlement.evm]`, and that is the assertion this node makes: it holds no
# EVM identity, cannot sign an EIP-712 balance proof, and could not verify one
# -- so a packet reaching it has genuinely been handed across a chain boundary
# rather than carried on one chain the whole way with a differently-shaped
# config in the middle.
[settlement.solana]
rpc_url = "http://solana-validator:8899"
program_id = "HY4AYFNe5Vg5BkEwAURNsGY3uFAvGMNpAQPRtgoasJiR"
token_address = "H8HSreUF2s8r8hem4qMttE3bWYCpFuh71jbuos5bA77H"
decimals = 6

[settlement.solana.key]
key_file = "/app/data/settlement-solana.key"
