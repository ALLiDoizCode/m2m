# Local Blockchain Development Infrastructure
# Docker Compose with profiles for selective chain startup.
#
# Usage:
#   make anvil-up      Start Anvil + Faucet (EVM)
#   make anvil-down    Stop EVM services
#   make anvil-logs    Follow EVM logs
#   make solana-up     Start Solana test validator
#   make solana-down   Stop Solana services
#   make solana-logs   Follow Solana logs
#   make mina-up       Start Mina lightnet
#   make mina-down     Stop Mina services
#   make mina-logs     Follow Mina logs
#   make ator-up       Start local ATOR network (3 DirAuth + 3 relay + 1 HS)
#   make ator-down     Stop + volume-purge ATOR network
#   make ator-logs     Follow ATOR docker compose logs
#   make ator-test     Run real-binary ATOR integration suite (36.3/36.4 land tests)
#   make infra-up      Start all chains (EVM + Solana + Mina + ATOR)
#   make infra-down    Stop all chains (EVM + Solana + Mina + ATOR; preserves volumes)

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Anvil - Local Ethereum Node with Auto-Deployed Contracts
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    profiles:
      - evm
    entrypoint: []
    command:
      - sh
      - -c
      - |
        echo "Starting Anvil..."
        anvil --host 0.0.0.0 --port 8545 --chain-id 31337 --accounts 10 --balance 10000 &
        ANVIL_PID=$$!

        echo "Waiting for Anvil to be ready..."
        until cast client --rpc-url http://localhost:8545 2>/dev/null | grep -q 'anvil'; do
          sleep 1
        done

        echo "Deploying contracts..."
        cd /contracts
        forge script script/DeployLocal.s.sol:DeployLocalScript --rpc-url http://localhost:8545 --broadcast --skip-simulation || echo "Deployment failed (non-fatal)"

        echo "Anvil ready with contracts deployed!"
        wait $$ANVIL_PID
    volumes:
      - ./packages/contracts:/contracts
    ports:
      - '8545:8545'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "cast client --rpc-url http://localhost:8545 2>&1 | grep -q 'anvil' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Token Faucet - Provides ETH and USDC tokens for testing
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  faucet:
    build:
      context: ./packages/faucet
      dockerfile: Dockerfile
    profiles:
      - evm
    environment:
      PORT: 3500
      RPC_URL: http://anvil:8545

      # Account 1 for ETH (has 10k ETH from Anvil)
      ETH_PRIVATE_KEY: '0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d'

      # Account 0 (deployer) for USDC tokens
      TOKEN_PRIVATE_KEY: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'

      # Token address (deterministic from Anvil deployment)
      TOKEN_ADDRESS: '0x5FbDB2315678afecb367f032d93F642f64180aa3'

      # Amounts to send per request
      ETH_AMOUNT: '100'
      TOKEN_AMOUNT: '10000'

    ports:
      - '3500:3500'
    depends_on:
      anvil:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3500/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Solana Test Validator - Local Solana with Auto-Deployed Programs
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  solana-validator:
    image: ghcr.io/beeman/solana-test-validator:latest
    profiles:
      - solana
    entrypoint: []
    command:
      - sh
      - /entrypoint.sh
    volumes:
      - ./infra/solana/entrypoint.sh:/entrypoint.sh:ro
      - ./packages/solana-program/target/deploy:/programs:ro
    tmpfs:
      - /tmp/test-ledger
    ports:
      - '8899:8899'
      - '8900:8900'
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8899/health | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Mina Lightnet - Local Mina Network with Accounts Manager & Archive
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # NOTE: Mina lightnet requires 4-8 GB RAM. Ensure Docker Desktop has
  # sufficient memory allocated (at least 8 GB recommended).
  mina-lightnet:
    image: o1labs/mina-local-network:compatible-latest-lightnet
    profiles:
      - mina
    ports:
      - '3085:3085'   # GraphQL
      - '8181:8181'   # Accounts manager
      - '8282:8282'   # Explorer
      - '5433:5432'   # Archive PostgreSQL (remapped to avoid conflicts with local Postgres on 5432)
    deploy:
      resources:
        limits:
          memory: 8g
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8181/list-acquired-accounts || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ATOR Testnet — 3 DirAuth + 3 relay + 1 HS (Epic 36, Story 36.1)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Pinned anon v0.4.10.0-beta installed from the official Debian .deb.
  # Network is internal:true — relays cannot egress to the public internet;
  # the only host-visible port is hs1's SOCKS5 listener (default 127.0.0.1:9150).
  # Shared DirAuthority lines (identical across every anon service so each sees
  # the same 3-of-3 quorum). The 40-char fingerprints below are placeholders;
  # the entrypoint does NOT pin a specific identity — anon mints identities on
  # first start inside the named volume, and NoFingerprint mode is used for the
  # DirAuthority lines via the "bridge"-free form: "<addr>:<dirport> <orport> <fp>".
  # For a test network with TestingTorNetwork=1 the fingerprint check is relaxed
  # on first-vote so the placeholder fingerprint works until identities stabilise.
  dirauth1:
    image: ator-testnet:v0.4.10.0-beta
    build:
      context: ./docker/ator
      dockerfile: Dockerfile
    profiles: [ator]
    environment: &anon-dirauth-env
      ANON_ROLE: dirauth
      NICKNAME: dirauth1
      ORPORT: '9001'
      DIRPORT: '9030'
      CONTROL_PORT: '9051'
      IDENTITY_SEED: dirauth1-seed-do-not-use-in-production
      DIRAUTH1_LINE: 'DirAuthority dirauth1 orport=9001 no-v2 v3ident=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA dirauth1:9030 0000000000000000000000000000000000000000'
      DIRAUTH2_LINE: 'DirAuthority dirauth2 orport=9001 no-v2 v3ident=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB dirauth2:9030 1111111111111111111111111111111111111111'
      DIRAUTH3_LINE: 'DirAuthority dirauth3 orport=9001 no-v2 v3ident=CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC dirauth3:9030 2222222222222222222222222222222222222222'
    volumes:
      - ator_dirauth1:/var/lib/anon
    networks:
      - ator_net
    restart: unless-stopped
    healthcheck:
      # Healthy = dirauth's control port is accepting TCP (process is up and
      # listening). A stronger readiness signal (cached-consensus present) is
      # left to test-layer polling; start_period gives anon time to boot.
      test: ['CMD-SHELL', 'nc -z localhost 9051 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  dirauth2:
    image: ator-testnet:v0.4.10.0-beta
    build:
      context: ./docker/ator
      dockerfile: Dockerfile
    profiles: [ator]
    environment:
      <<: *anon-dirauth-env
      NICKNAME: dirauth2
      IDENTITY_SEED: dirauth2-seed-do-not-use-in-production
    volumes:
      - ator_dirauth2:/var/lib/anon
    networks:
      - ator_net
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9051 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  dirauth3:
    image: ator-testnet:v0.4.10.0-beta
    build:
      context: ./docker/ator
      dockerfile: Dockerfile
    profiles: [ator]
    environment:
      <<: *anon-dirauth-env
      NICKNAME: dirauth3
      IDENTITY_SEED: dirauth3-seed-do-not-use-in-production
    volumes:
      - ator_dirauth3:/var/lib/anon
    networks:
      - ator_net
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9051 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  relay1:
    image: ator-testnet:v0.4.10.0-beta
    build:
      context: ./docker/ator
      dockerfile: Dockerfile
    profiles: [ator]
    environment: &anon-relay-env
      ANON_ROLE: relay
      NICKNAME: relay1
      ORPORT: '9001'
      DIRPORT: '9030'
      CONTROL_PORT: '9051'
      DIRAUTH1_LINE: 'DirAuthority dirauth1 orport=9001 no-v2 v3ident=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA dirauth1:9030 0000000000000000000000000000000000000000'
      DIRAUTH2_LINE: 'DirAuthority dirauth2 orport=9001 no-v2 v3ident=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB dirauth2:9030 1111111111111111111111111111111111111111'
      DIRAUTH3_LINE: 'DirAuthority dirauth3 orport=9001 no-v2 v3ident=CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC dirauth3:9030 2222222222222222222222222222222222222222'
    volumes:
      - ator_relay1:/var/lib/anon
    networks:
      - ator_net
    depends_on:
      dirauth1: { condition: service_healthy }
      dirauth2: { condition: service_healthy }
      dirauth3: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9051 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  relay2:
    image: ator-testnet:v0.4.10.0-beta
    build:
      context: ./docker/ator
      dockerfile: Dockerfile
    profiles: [ator]
    environment:
      <<: *anon-relay-env
      NICKNAME: relay2
    volumes:
      - ator_relay2:/var/lib/anon
    networks:
      - ator_net
    depends_on:
      dirauth1: { condition: service_healthy }
      dirauth2: { condition: service_healthy }
      dirauth3: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9051 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  relay3:
    image: ator-testnet:v0.4.10.0-beta
    build:
      context: ./docker/ator
      dockerfile: Dockerfile
    profiles: [ator]
    environment:
      <<: *anon-relay-env
      NICKNAME: relay3
    volumes:
      - ator_relay3:/var/lib/anon
    networks:
      - ator_net
    depends_on:
      dirauth1: { condition: service_healthy }
      dirauth2: { condition: service_healthy }
      dirauth3: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9051 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  hs1:
    image: ator-testnet:v0.4.10.0-beta
    build:
      context: ./docker/ator
      dockerfile: Dockerfile
    profiles: [ator]
    environment:
      ANON_ROLE: hs
      NICKNAME: hs1
      ORPORT: '9001'
      DIRPORT: '9030'
      CONTROL_PORT: '9051'
      SOCKS_PORT: '9050'
      HIDDEN_SERVICE_PORT: '5000'
      DIRAUTH1_LINE: 'DirAuthority dirauth1 orport=9001 no-v2 v3ident=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA dirauth1:9030 0000000000000000000000000000000000000000'
      DIRAUTH2_LINE: 'DirAuthority dirauth2 orport=9001 no-v2 v3ident=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB dirauth2:9030 1111111111111111111111111111111111111111'
      DIRAUTH3_LINE: 'DirAuthority dirauth3 orport=9001 no-v2 v3ident=CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC dirauth3:9030 2222222222222222222222222222222222222222'
    volumes:
      - ator_hs1:/var/lib/anon
    ports:
      # SOCKS5 — default 9150 to avoid collision with system-tor 9050 (R-008).
      # Override with ATOR_HS_SOCKS_PORT env var at compose time.
      - '127.0.0.1:${ATOR_HS_SOCKS_PORT:-9150}:9050'
    networks:
      - ator_net
    depends_on:
      relay1: { condition: service_healthy }
      relay2: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9050 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  ator_net:
    driver: bridge
    # internal:true — relays and HS cannot reach the public internet.
    # The only host-visible exposure is hs1's SOCKS port mapping above.
    internal: true

volumes:
  ator_dirauth1:
  ator_dirauth2:
  ator_dirauth3:
  ator_relay1:
  ator_relay2:
  ator_relay3:
  ator_hs1:
