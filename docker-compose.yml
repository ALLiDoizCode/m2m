# Local Blockchain Development Infrastructure
# Docker Compose with profiles for selective chain startup.
#
# Usage:
#   make anvil-up      Start Anvil + Faucet (EVM)
#   make anvil-down    Stop EVM services
#   make anvil-logs    Follow EVM logs
#   make solana-up     Start Solana test validator
#   make solana-down   Stop Solana services
#   make solana-logs   Follow Solana logs
#   make mina-up       Start Mina lightnet
#   make mina-down     Stop Mina services
#   make mina-logs     Follow Mina logs
#   make ator-up       Start local ATOR network (3 DirAuth + 3 relay + 1 HS)
#   make ator-down     Stop + volume-purge ATOR network
#   make ator-logs     Follow ATOR docker compose logs
#   make ator-test     Run real-binary ATOR integration suite (36.3/36.4 land tests)
#   make infra-up      Start all chains (EVM + Solana + Mina + ATOR)
#   make infra-down    Stop all chains (EVM + Solana + Mina + ATOR; preserves volumes)

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Anvil - Local Ethereum Node with Auto-Deployed Contracts
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    # Run as root: the foundry image's default non-root user cannot write
    # forge's out/cache/broadcast dirs into the bind-mounted ./packages/contracts
    # when the host dir is owned by a different UID (e.g. the CI runner) —
    # `forge script` then fails with `"/contracts/out": Permission denied`. See #104.
    user: root
    profiles:
      - evm
    entrypoint: []
    command:
      - sh
      - -c
      - |
        echo "Starting Anvil..."
        anvil --host 0.0.0.0 --port 8545 --chain-id 31337 --accounts 10 --balance 10000 &
        ANVIL_PID=$$!

        echo "Waiting for Anvil to be ready..."
        until cast client --rpc-url http://localhost:8545 2>/dev/null | grep -q 'anvil'; do
          sleep 1
        done

        echo "Deploying contracts..."
        cd /contracts

        # DeployLocal.s.sol imports forge-std + openzeppelin-contracts from
        # lib/ (git submodules). In CI the checkout fetches them via
        # `submodules: recursive`; for local dev / git worktrees where the
        # submodules may not be initialized, fall back to `forge install` so the
        # deploy is self-healing and the stack never comes up without the USDC
        # token + TokenNetworkRegistry. See issue #104.
        if [ ! -f lib/forge-std/src/Script.sol ] || [ ! -f lib/openzeppelin-contracts/contracts/access/Ownable.sol ]; then
          echo "Foundry libs missing — running 'forge install'..."
          forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts --no-git || forge install
        fi

        # Deploy must succeed: the standalone-settlement-e2e harness depends on
        # the USDC token + TokenNetworkRegistry existing at deterministic
        # addresses. A silent failure here (the old `|| echo non-fatal`) is what
        # left the faucet reporting tokenReady:true with no token on-chain (#104).
        forge script script/DeployLocal.s.sol:DeployLocalScript --rpc-url http://localhost:8545 --broadcast --skip-simulation

        echo "Anvil ready with contracts deployed!"
        wait $$ANVIL_PID
    volumes:
      - ./packages/contracts:/contracts
    ports:
      - '8545:8545'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "cast client --rpc-url http://localhost:8545 2>&1 | grep -q 'anvil' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Token Faucet - Provides ETH and USDC tokens for testing
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  faucet:
    build:
      context: ./packages/faucet
      dockerfile: Dockerfile
    profiles:
      - evm
    environment:
      PORT: 3500
      RPC_URL: http://anvil:8545

      # Account 1 for ETH (has 10k ETH from Anvil)
      ETH_PRIVATE_KEY: '0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d'

      # Account 0 (deployer) for USDC tokens
      TOKEN_PRIVATE_KEY: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'

      # Token address (deterministic from Anvil deployment)
      TOKEN_ADDRESS: '0x5FbDB2315678afecb367f032d93F642f64180aa3'

      # Amounts to send per request
      ETH_AMOUNT: '100'
      TOKEN_AMOUNT: '10000'

    ports:
      - '3500:3500'
    depends_on:
      anvil:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3500/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Solana Test Validator - Local Solana with Auto-Deployed Programs
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  solana-validator:
    image: ghcr.io/beeman/solana-test-validator:latest
    profiles:
      - solana
    entrypoint: []
    command:
      - sh
      - /entrypoint.sh
    volumes:
      - ./infra/solana/entrypoint.sh:/entrypoint.sh:ro
      # No committed fee-payer keypair: the entrypoint reuses the genesis-funded
      # validator-identity keypair the validator writes into its ledger dir as the
      # deploy fee-payer (the beeman image has no solana-keygen). The program id
      # stays deterministic via the mounted program keypair in /programs.
      # See infra/solana/entrypoint.sh.
      - ./packages/solana-program/target/deploy:/programs:ro
    tmpfs:
      # Validator ledger (genesis keypairs + state) lives here; cleared on restart.
      - /workspace/test-ledger
    ports:
      - '8899:8899'
      - '8900:8900'
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8899/health | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Mina Lightnet - Local Mina Network with Accounts Manager & Archive
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # NOTE: Mina lightnet requires 4-8 GB RAM. Ensure Docker Desktop has
  # sufficient memory allocated (at least 8 GB recommended).
  mina-lightnet:
    image: o1labs/mina-local-network:compatible-latest-lightnet
    profiles:
      - mina
    ports:
      - '3085:3085'   # GraphQL
      - '8181:8181'   # Accounts manager
      - '8282:8282'   # Explorer
      - '5433:5432'   # Archive PostgreSQL (remapped to avoid conflicts with local Postgres on 5432)
    deploy:
      resources:
        limits:
          memory: 8g
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8181/list-acquired-accounts || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ATOR Testnet — 3 DirAuth + 3 relay + 1 HS (Epic 36, Story 36.1)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Pinned anon v0.4.10.0-beta installed from the official Debian .deb.
  # Network is internal:true — relays cannot egress to the public internet;
  # the only host-visible port is hs1's SOCKS5 listener (default 127.0.0.1:9150).
  # DirAuthority lines are built dynamically by the entrypoint via a shared
  # volume — each DirAuth generates its keys on first start, writes its
  # fingerprint to /shared/fingerprints/<nickname>.fp, and all nodes wait
  # until all 3 are present before constructing the real DirAuthority lines.
  dirauth1:
    image: ator-testnet:v0.4.10.0-beta
    build:
      context: ./docker/ator
      dockerfile: Dockerfile
    profiles: [ator]
    environment: &anon-dirauth-env
      ANON_ROLE: dirauth
      NICKNAME: dirauth1
      ORPORT: '9001'
      DIRPORT: '9030'
      CONTROL_PORT: '9051'
      IDENTITY_SEED: dirauth1-seed-do-not-use-in-production
    volumes:
      - ator_dirauth1:/var/lib/anon
      - ator_shared:/shared
    ports:
      - '127.0.0.1:${ATOR_DA1_ORPORT:-19001}:9001'
      - '127.0.0.1:${ATOR_DA1_DIRPORT:-19030}:9030'
    networks:
      - ator_net
      - ator_host
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9051 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  dirauth2:
    image: ator-testnet:v0.4.10.0-beta
    build:
      context: ./docker/ator
      dockerfile: Dockerfile
    profiles: [ator]
    environment:
      <<: *anon-dirauth-env
      NICKNAME: dirauth2
      IDENTITY_SEED: dirauth2-seed-do-not-use-in-production
    volumes:
      - ator_dirauth2:/var/lib/anon
      - ator_shared:/shared
    ports:
      - '127.0.0.1:${ATOR_DA2_ORPORT:-19002}:9001'
      - '127.0.0.1:${ATOR_DA2_DIRPORT:-19031}:9030'
    networks:
      - ator_net
      - ator_host
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9051 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  dirauth3:
    image: ator-testnet:v0.4.10.0-beta
    build:
      context: ./docker/ator
      dockerfile: Dockerfile
    profiles: [ator]
    environment:
      <<: *anon-dirauth-env
      NICKNAME: dirauth3
      IDENTITY_SEED: dirauth3-seed-do-not-use-in-production
    volumes:
      - ator_dirauth3:/var/lib/anon
      - ator_shared:/shared
    ports:
      - '127.0.0.1:${ATOR_DA3_ORPORT:-19003}:9001'
      - '127.0.0.1:${ATOR_DA3_DIRPORT:-19032}:9030'
    networks:
      - ator_net
      - ator_host
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9051 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  relay1:
    image: ator-testnet:v0.4.10.0-beta
    build:
      context: ./docker/ator
      dockerfile: Dockerfile
    profiles: [ator]
    environment: &anon-relay-env
      ANON_ROLE: relay
      NICKNAME: relay1
      ORPORT: '9001'
      DIRPORT: '9030'
      CONTROL_PORT: '9051'
    volumes:
      - ator_relay1:/var/lib/anon
      - ator_shared:/shared
    ports:
      - '127.0.0.1:${ATOR_R1_ORPORT:-19011}:9001'
    networks:
      - ator_net
      - ator_host
    depends_on:
      dirauth1: { condition: service_healthy }
      dirauth2: { condition: service_healthy }
      dirauth3: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9051 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  relay2:
    image: ator-testnet:v0.4.10.0-beta
    build:
      context: ./docker/ator
      dockerfile: Dockerfile
    profiles: [ator]
    environment:
      <<: *anon-relay-env
      NICKNAME: relay2
    volumes:
      - ator_relay2:/var/lib/anon
      - ator_shared:/shared
    ports:
      - '127.0.0.1:${ATOR_R2_ORPORT:-19012}:9001'
    networks:
      - ator_net
      - ator_host
    depends_on:
      dirauth1: { condition: service_healthy }
      dirauth2: { condition: service_healthy }
      dirauth3: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9051 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  relay3:
    image: ator-testnet:v0.4.10.0-beta
    build:
      context: ./docker/ator
      dockerfile: Dockerfile
    profiles: [ator]
    environment:
      <<: *anon-relay-env
      NICKNAME: relay3
    volumes:
      - ator_relay3:/var/lib/anon
      - ator_shared:/shared
    ports:
      - '127.0.0.1:${ATOR_R3_ORPORT:-19013}:9001'
    networks:
      - ator_net
      - ator_host
    depends_on:
      dirauth1: { condition: service_healthy }
      dirauth2: { condition: service_healthy }
      dirauth3: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9051 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  relay4:
    image: ator-testnet:v0.4.10.0-beta
    build:
      context: ./docker/ator
      dockerfile: Dockerfile
    profiles: [ator]
    environment:
      <<: *anon-relay-env
      NICKNAME: relay4
    volumes:
      - ator_relay4:/var/lib/anon
      - ator_shared:/shared
    ports:
      - '127.0.0.1:${ATOR_R4_ORPORT:-19014}:9001'
    networks:
      - ator_net
      - ator_host
    depends_on:
      dirauth1: { condition: service_healthy }
      dirauth2: { condition: service_healthy }
      dirauth3: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9051 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  hs1:
    image: ator-testnet:v0.4.10.0-beta
    build:
      context: ./docker/ator
      dockerfile: Dockerfile
    profiles: [ator]
    environment:
      ANON_ROLE: hs
      NICKNAME: hs1
      ORPORT: '9001'
      DIRPORT: '9030'
      CONTROL_PORT: '9051'
      SOCKS_PORT: '9050'
      HIDDEN_SERVICE_PORT: '5000'
    cap_add:
      - NET_RAW
    volumes:
      - ator_hs1:/var/lib/anon
      - ator_shared:/shared
    ports:
      # SOCKS5 — default 9150 to avoid collision with system-tor 9050 (R-008).
      # Override with ATOR_HS_SOCKS_PORT env var at compose time.
      - '127.0.0.1:${ATOR_HS_SOCKS_PORT:-9150}:9050'
    networks:
      - ator_net
      - ator_host
    depends_on:
      relay1: { condition: service_healthy }
      relay2: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9050 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Standalone Mode E2E — 2 connector containers + 2 BLS containers
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Proves the connector Docker image boots with deploymentMode: standalone,
  # peers over BTP across the compose network, forwards packets via
  # /admin/ilp/send, and delivers to a BLS over HTTP /handle-packet.
  # Only the admin API ports are published to the host so the test harness
  # can drive assertions.
  standalone-bls1:
    image: node:22-alpine
    profiles: [standalone-e2e]
    command: ['node', '/app/bls.js']
    environment:
      PORT: '3100'
    volumes:
      - ./scripts/standalone-e2e/bls.js:/app/bls.js:ro
    ports:
      - '127.0.0.1:13101:3100'
    networks:
      - standalone_net
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3100/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  standalone-bls2:
    image: node:22-alpine
    profiles: [standalone-e2e]
    command: ['node', '/app/bls.js']
    environment:
      PORT: '3100'
    volumes:
      - ./scripts/standalone-e2e/bls.js:/app/bls.js:ro
    ports:
      - '127.0.0.1:13102:3100'
    networks:
      - standalone_net
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3100/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  standalone-peer1:
    build:
      context: .
      dockerfile: Dockerfile
    image: connector:standalone-e2e
    profiles: [standalone-e2e]
    environment:
      CONFIG_FILE: /app/config/peer1.yaml
      LOG_LEVEL: warn
    volumes:
      - ./scripts/standalone-e2e/peer1.yaml:/app/config/peer1.yaml:ro
    ports:
      - '127.0.0.1:18081:8081' # admin API
      - '127.0.0.1:18080:8080' # health
    depends_on:
      standalone-bls1:
        condition: service_healthy
    networks:
      - standalone_net

  standalone-peer2:
    build:
      context: .
      dockerfile: Dockerfile
    image: connector:standalone-e2e
    profiles: [standalone-e2e]
    environment:
      CONFIG_FILE: /app/config/peer2.yaml
      LOG_LEVEL: warn
    volumes:
      - ./scripts/standalone-e2e/peer2.yaml:/app/config/peer2.yaml:ro
    ports:
      - '127.0.0.1:28081:8081' # admin API
      - '127.0.0.1:28080:8080' # health
    depends_on:
      standalone-bls2:
        condition: service_healthy
    networks:
      - standalone_net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Standalone + Public ATOR E2E — single connector container + BLS,
  # transport pointed at a real public Anyone proxy URL.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Proves the connector Docker image boots with `deploymentMode: standalone`
  # AND `transport.type: socks5` against real public infrastructure. We do NOT
  # attempt peer-to-peer routing through the public network (would require
  # hidden services, out of scope for this test). Instead we assert the
  # transport probe succeeds at startup, admin API is reachable, and local
  # delivery still works with the SOCKS5 transport configured.
  #
  # ${ATOR_CONFIG_DIR} is set by the Jest harness after it probes and picks a
  # reachable public proxy, then writes the peer config into that tmp dir.
  standalone-ator-bls:
    image: node:22-alpine
    profiles: [standalone-ator-public]
    command: ['node', '/app/bls.js']
    environment:
      PORT: '3100'
    volumes:
      - ./scripts/standalone-e2e/bls.js:/app/bls.js:ro
    ports:
      - '127.0.0.1:13103:3100'
    networks:
      - standalone_ator_net
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3100/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  standalone-ator-peer:
    build:
      context: .
      dockerfile: Dockerfile
    image: connector:standalone-e2e
    profiles: [standalone-ator-public]
    environment:
      CONFIG_FILE: /app/config/peer.yaml
      LOG_LEVEL: warn
    volumes:
      - ${ATOR_CONFIG_DIR:-./scripts/standalone-e2e}/peer-ator.yaml:/app/config/peer.yaml:ro
    ports:
      - '127.0.0.1:18083:8081' # admin API
      - '127.0.0.1:18082:8080' # health
    depends_on:
      standalone-ator-bls:
        condition: service_healthy
    networks:
      - standalone_ator_net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Standalone + Public ATOR Peer-to-Peer — full production topology
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Two anon sidecars on the public Anyone network, each hosting a hidden
  # service that forwards to an adjacent standalone connector container's
  # BTP port. Connectors dial each other over the public ATOR network via
  # `.anon` rendezvous — this is the real deal, not SOCKS5 egress.
  #
  # The test harness starts the sidecars first (`docker compose up -d
  # standalone-p2p-sidecar-a standalone-p2p-sidecar-b`), waits for each
  # hostname file on the shared volume, renders connector configs with the
  # peer `.anon` URLs into ${ATOR_P2P_CONFIG_DIR}, then starts the rest.
  # Each peer cluster (sidecar + connector + bls) shares a single network
  # namespace via `network_mode: service:<sidecar>`. This makes the anon HS
  # target `127.0.0.1:3000` — no compose-DNS chicken-and-egg between sidecar
  # startup and connector startup. The sidecar service OWNS the namespace and
  # declares the `ports` + `networks` blocks; its cluster-mates inherit them.
  standalone-p2p-sidecar-a:
    image: ator-public-sidecar:v0.4.10.0-beta
    build:
      context: ./docker/ator-public-sidecar
      dockerfile: Dockerfile
    profiles: [standalone-ator-p2p]
    environment:
      NICKNAME: peer-a
      TARGET_PORT: '3000'
    volumes:
      - standalone_p2p_shared:/shared
      - standalone_p2p_sidecar_a_data:/var/lib/anon
    networks:
      - standalone_p2p_net
    # Ports published on the sidecar's namespace — connector and bls bind
    # inside the SAME namespace so these forward to them directly.
    ports:
      - '127.0.0.1:18091:8081' # connector-a admin API
      - '127.0.0.1:18090:8080' # connector-a health
      - '127.0.0.1:13301:3100' # bls-a (for /received introspection from test)
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 9050 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 180s

  standalone-p2p-sidecar-b:
    image: ator-public-sidecar:v0.4.10.0-beta
    build:
      context: ./docker/ator-public-sidecar
      dockerfile: Dockerfile
    profiles: [standalone-ator-p2p]
    environment:
      NICKNAME: peer-b
      TARGET_PORT: '3000'
    volumes:
      - standalone_p2p_shared:/shared
      - standalone_p2p_sidecar_b_data:/var/lib/anon
    networks:
      - standalone_p2p_net
    ports:
      - '127.0.0.1:28091:8081' # connector-b admin API
      - '127.0.0.1:28090:8080' # connector-b health
      - '127.0.0.1:13302:3100' # bls-b
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 9050 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 180s

  standalone-p2p-bls-a:
    image: node:22-alpine
    profiles: [standalone-ator-p2p]
    command: ['node', '/app/bls.js']
    environment:
      PORT: '3100'
    volumes:
      - ./scripts/standalone-e2e/bls.js:/app/bls.js:ro
    network_mode: service:standalone-p2p-sidecar-a
    depends_on:
      standalone-p2p-sidecar-a:
        condition: service_started

  standalone-p2p-bls-b:
    image: node:22-alpine
    profiles: [standalone-ator-p2p]
    command: ['node', '/app/bls.js']
    environment:
      PORT: '3100'
    volumes:
      - ./scripts/standalone-e2e/bls.js:/app/bls.js:ro
    network_mode: service:standalone-p2p-sidecar-b
    depends_on:
      standalone-p2p-sidecar-b:
        condition: service_started

  standalone-p2p-connector-a:
    build:
      context: .
      dockerfile: Dockerfile
    image: connector:standalone-e2e
    profiles: [standalone-ator-p2p]
    environment:
      CONFIG_FILE: /app/config/peer.yaml
      LOG_LEVEL: warn
    volumes:
      - ${ATOR_P2P_CONFIG_DIR:-./scripts/standalone-e2e}/peer-p2p-a.yaml:/app/config/peer.yaml:ro
    network_mode: service:standalone-p2p-sidecar-a
    depends_on:
      standalone-p2p-sidecar-a:
        condition: service_healthy

  standalone-p2p-connector-b:
    build:
      context: .
      dockerfile: Dockerfile
    image: connector:standalone-e2e
    profiles: [standalone-ator-p2p]
    environment:
      CONFIG_FILE: /app/config/peer.yaml
      LOG_LEVEL: warn
    volumes:
      - ${ATOR_P2P_CONFIG_DIR:-./scripts/standalone-e2e}/peer-p2p-b.yaml:/app/config/peer.yaml:ro
    network_mode: service:standalone-p2p-sidecar-b
    depends_on:
      standalone-p2p-sidecar-b:
        condition: service_healthy

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Tier-3 admin-API allowlist demo — BLS + connector in separate
  # containers on one compose network. Admin port is NOT published to
  # the host. BLS reaches admin API via compose DNS; the connector
  # accepts the call because the BLS's source IP falls in the docker
  # bridge CIDR allowlist.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  standalone-allowlist-bls:
    image: node:22-alpine
    profiles: [standalone-allowlist]
    command: ['node', '/app/bls.js']
    environment:
      PORT: '3100'
      CONNECTOR_ADMIN_URL: http://standalone-allowlist-connector:8081
    volumes:
      - ./scripts/standalone-e2e/bls.js:/app/bls.js:ro
    ports:
      # Only the BLS is reachable from the host (test harness drives it).
      # The connector's admin port is intentionally NOT published.
      - '127.0.0.1:13401:3100'
    networks:
      - standalone_allowlist_net
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3100/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  standalone-allowlist-connector:
    build:
      context: .
      dockerfile: Dockerfile
    image: connector:standalone-e2e
    profiles: [standalone-allowlist]
    environment:
      CONFIG_FILE: /app/config/peer.yaml
      LOG_LEVEL: warn
    volumes:
      - ./scripts/standalone-e2e/peer-allowlist.yaml:/app/config/peer.yaml:ro
    # Admin API port (8081) is intentionally NOT in `ports:` — the allowlist
    # is a defense-in-depth layer on TOP of not publishing, not a replacement.
    depends_on:
      standalone-allowlist-bls:
        condition: service_healthy
    networks:
      - standalone_allowlist_net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Two-Home ATOR over LOCAL testnet — peer-to-peer over `make ator-up`
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Mirrors `standalone-ator-p2p` but joins the LOCAL ATOR testnet instead
  # of the public Anyone network. Sidesteps the Phase 3b host-side blocker
  # (relay descriptors advertise internal bridge IPs unreachable from the
  # host) by running the sidecars + connectors INSIDE `ator_net` where the
  # internal IPs are the right ones — see the annotation in
  # packages/connector/test/integration/standalone-ator-hs-local-e2e.test.ts:69-71.
  #
  # Prereq: `make ator-up` must already be running (provides DirAuths +
  # relays + the shared fingerprint volume that the sidecars consume).
  #
  # Usage: `make two-home-ator-local-up && make two-home-ator-local-verify`
  two-home-local-sidecar-a:
    image: ator-public-sidecar:v0.4.10.0-beta
    build:
      context: ./docker/ator-public-sidecar
      dockerfile: Dockerfile
    profiles: [two-home-ator-local]
    environment:
      NICKNAME: home-a
      TARGET_PORT: '3000'
      ANON_NETWORK: testnet-local
    volumes:
      - ator_shared:/shared            # DirAuth fingerprints from `ator` profile
      - two_home_local_a_data:/var/lib/anon
    networks:
      # Both networks: DirAuths/relays advertise their ator_host IPs in
      # fingerprints (172.20.0.x); ator_net is the secondary bridge they
      # also share. Joining only one would leave DirAuth IPs unreachable.
      - ator_net
      - ator_host
    ports:
      - '127.0.0.1:18190:8080'         # connector-a health
      - '127.0.0.1:18191:8081'         # connector-a admin
      - '127.0.0.1:13311:3100'         # bls-a /received
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 9050 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s

  two-home-local-sidecar-b:
    image: ator-public-sidecar:v0.4.10.0-beta
    build:
      context: ./docker/ator-public-sidecar
      dockerfile: Dockerfile
    profiles: [two-home-ator-local]
    environment:
      NICKNAME: home-b
      TARGET_PORT: '3000'
      ANON_NETWORK: testnet-local
    volumes:
      - ator_shared:/shared
      - two_home_local_b_data:/var/lib/anon
    networks:
      - ator_net
      - ator_host
    ports:
      - '127.0.0.1:18290:8080'
      - '127.0.0.1:18291:8081'
      - '127.0.0.1:13312:3100'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 9050 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s

  two-home-local-bls-a:
    image: node:22-alpine
    profiles: [two-home-ator-local]
    command: ['node', '/app/bls.js']
    environment:
      PORT: '3100'
    volumes:
      - ./scripts/standalone-e2e/bls.js:/app/bls.js:ro
    network_mode: service:two-home-local-sidecar-a
    depends_on:
      two-home-local-sidecar-a:
        condition: service_started

  two-home-local-bls-b:
    image: node:22-alpine
    profiles: [two-home-ator-local]
    command: ['node', '/app/bls.js']
    environment:
      PORT: '3100'
    volumes:
      - ./scripts/standalone-e2e/bls.js:/app/bls.js:ro
    network_mode: service:two-home-local-sidecar-b
    depends_on:
      two-home-local-sidecar-b:
        condition: service_started

  two-home-local-connector-a:
    build:
      context: .
      dockerfile: Dockerfile
    image: connector:standalone-e2e
    profiles: [two-home-ator-local]
    environment:
      CONFIG_FILE: /app/config/peer.yaml
      LOG_LEVEL: warn
    volumes:
      - ${TWO_HOME_LOCAL_CONFIG_DIR:-./scripts/standalone-e2e}/peer-two-home-a.yaml:/app/config/peer.yaml:ro
    network_mode: service:two-home-local-sidecar-a
    depends_on:
      two-home-local-sidecar-a:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8081 || exit 1']
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 15s

  two-home-local-connector-b:
    build:
      context: .
      dockerfile: Dockerfile
    image: connector:standalone-e2e
    profiles: [two-home-ator-local]
    environment:
      CONFIG_FILE: /app/config/peer.yaml
      LOG_LEVEL: warn
    volumes:
      - ${TWO_HOME_LOCAL_CONFIG_DIR:-./scripts/standalone-e2e}/peer-two-home-b.yaml:/app/config/peer.yaml:ro
    network_mode: service:two-home-local-sidecar-b
    depends_on:
      two-home-local-sidecar-b:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8081 || exit 1']
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 15s

  # Per-peer-transport selection (Story 46.4 unblock): direct-only sibling
  # peer on the shared `ator_net` Docker network. The two-home apex
  # connectors register this service via POST /admin/peers with
  # `transport: 'direct'` to prove that a SOCKS5-global apex can still host
  # plain-WS sibling peers without forcing every dial through `anon`.
  #
  # NOTE: explicit `networks: [ator_net]` — do NOT use `network_mode:
  # service:two-home-local-sidecar-*`. That pattern is used by the apex
  # connectors because they share a namespace with their sidecars; this
  # peer has no sidecar of its own and joins `ator_net` directly. Other
  # services on `ator_net` reach this peer via Docker DNS at the service
  # name (`ws://two-home-local-direct-peer:3000`).
  two-home-local-direct-peer:
    build:
      context: .
      dockerfile: Dockerfile
    image: connector:standalone-e2e
    profiles: [two-home-ator-local]
    environment:
      CONFIG_FILE: /app/config/peer.yaml
      LOG_LEVEL: warn
    volumes:
      - ${TWO_HOME_LOCAL_CONFIG_DIR:-./scripts/standalone-e2e}/peer-two-home-direct.yaml:/app/config/peer.yaml:ro
    networks:
      - ator_net
    ports:
      - '127.0.0.1:18390:8081'         # admin
      - '127.0.0.1:18391:8080'         # health
    # Healthcheck on the admin API port so dependents can `depends_on:
    # condition: service_healthy` instead of racing the BTP server bind.
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8081 || exit 1']
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 15s

networks:
  ator_net:
    driver: bridge
  ator_host:
    driver: bridge
  standalone_net:
    driver: bridge
  standalone_ator_net:
    driver: bridge
  standalone_p2p_net:
    driver: bridge
  standalone_allowlist_net:
    driver: bridge

volumes:
  ator_dirauth1:
  ator_dirauth2:
  ator_dirauth3:
  ator_relay1:
  ator_relay2:
  ator_relay3:
  ator_relay4:
  ator_shared:
  ator_hs1:
  standalone_p2p_shared:
  standalone_p2p_sidecar_a_data:
  standalone_p2p_sidecar_b_data:
  two_home_local_a_data:
  two_home_local_b_data:
