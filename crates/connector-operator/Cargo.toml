[package]
name = "connector-operator"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
connector-domain = { path = "../connector-domain" }
connector-runtime = { path = "../connector-runtime" }
connector-signer = { path = "../connector-signer" }
axum = "0.6"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "1"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
connector-config = { path = "../connector-config" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.4", features = ["util"] }
hyper = { version = "0.14", features = ["full"] }
rand = "0.7"
