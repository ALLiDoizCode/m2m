[package]
name = "connector-operator"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
test-util = []

[dependencies]
connector-domain = { path = "../connector-domain" }
connector-runtime = { path = "../connector-runtime" }
connector-settlement = { path = "../connector-settlement" }
connector-signer = { path = "../connector-signer" }
axum = "0.6"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "1"
sha2 = "0.10"
base64 = "0.22"
# `POST /peers` takes the counterparty's URL as a field (ADR 0058) and
# parses it here, so a request that names something that is not a URL is a
# `400` from this crate rather than a refusal deeper in.
url = "2"

[dev-dependencies]
connector-config = { path = "../connector-config" }
connector-settlement-evm = { path = "../connector-settlement-evm", features = ["test-util"] }
ethers = { version = "2", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.4", features = ["util"] }
hyper = { version = "0.14", features = ["full"] }
rand = "0.7"
