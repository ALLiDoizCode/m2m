[package]
name = "connector-operator"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
test-util = []

[dependencies]
connector-domain = { path = "../connector-domain" }
connector-runtime = { path = "../connector-runtime" }
connector-settlement = { path = "../connector-settlement" }
connector-signer = { path = "../connector-signer" }
axum = "0.6"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "1"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
connector-config = { path = "../connector-config" }
connector-settlement-evm = { path = "../connector-settlement-evm" }
ethers = { version = "2", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.4", features = ["util"] }
hyper = { version = "0.14", features = ["full"] }
rand = "0.7"
# `FakeOriginator` (issue #1020's `router_with_originator` test): only a
# test double needs to *implement* `PacketOriginator`, since calling one
# through the trait needs no macro at all -- production code here never
# implements it.
async-trait = "0.1"
