[package]
name = "connector-signer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
libsecp256k1 = "0.6"
sha2 = "0.10"
sha3 = "0.10"
ed25519-dalek = "1"
rand = "0.7"
thiserror = "2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
