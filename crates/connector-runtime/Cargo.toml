[package]
name = "connector-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
connector-domain = { path = "../connector-domain" }
connector-config = { path = "../connector-config" }
connector-settlement = { path = "../connector-settlement" }
connector-signer = { path = "../connector-signer" }
arc-swap = "1.9.2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
prometheus = "0.13"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "net", "io-util"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
hyper = { version = "0.14", features = ["server", "http1", "tcp", "runtime"] }
tempfile = "3"
proptest = "1"
