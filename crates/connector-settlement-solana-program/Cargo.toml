[package]
name = "connector-settlement-solana-program"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
# Pinned to the version already proven to build in this workspace's SBF
# toolchain (packages/solana-program, `cargo build-sbf --tools-version
# v1.52`) -- matching it rather than picking a newer one keeps this crate on
# the one combination already exercised by CI's `solana-integration` job.
solana-program = "=2.1.0"
