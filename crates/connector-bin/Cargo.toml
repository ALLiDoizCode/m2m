[package]
name = "connector"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "connector"
path = "src/main.rs"

[[bin]]
name = "stub-app"
path = "src/bin/stub_app.rs"

[dependencies]
connector-cli = { path = "../connector-cli" }
axum = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
connector-domain = { path = "../connector-domain" }
chrono = "0.4"
tempfile = "3"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
