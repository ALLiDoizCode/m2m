[package]
name = "connector"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "connector"
path = "src/main.rs"

[[bin]]
name = "stub-app"
path = "src/bin/stub_app.rs"

[dependencies]
connector-cli = { path = "../connector-cli" }
axum = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"
connector-domain = { path = "../connector-domain" }
connector-signer = { path = "../connector-signer" }
connector-settlement = { path = "../connector-settlement" }
connector-settlement-evm = { path = "../connector-settlement-evm", features = ["test-util"] }
chrono = "0.4"
ethers = { version = "2", default-features = false, features = ["rustls"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
libsecp256k1 = "0.6"
base64 = "0.22"
# `local_stack_rehearsal.rs` only. A Nostr event is signed BIP-340 Schnorr over
# its own SHA-256 id, which neither `libsecp256k1` 0.6 nor `connector-signer`
# does -- and the relay verifies that signature (TOON_DEV_MODE=false), so a
# probe cannot make an event up. `tokio-tungstenite` is the free-read side: a
# plain NIP-01 `REQ` over the relay's public WS.
k256 = { version = "0.13", features = ["schnorr"] }
sha2 = "0.10"
tokio-tungstenite = "0.20"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
