[package]
name = "connector-btp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# `sync` for the session's reply channel and the outbound correlation table's
# oneshots; `time` for the outbound answer timeout. Nothing here starts a
# runtime -- whoever owns the socket owns the runtime.
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
